    title: The Resurrection, and the Splendour of Angels
    navLabel: Resurrection
    tone: faithful
    display: list
    intro:
      - The fullest argument for bodily resurrection to survive from ancient Judaism — and the reason this book matters here.
      - "Read the order carefully: recognition first, then glory. That sequence is the whole argument."
    entries:
      - name: The same bodies, so they may be known
        refs:
          - 2 Baruch 49–50
          - 1 Corinthians 15.35–44
          - Daniel 12.2
        body:
          - "Baruch asks the practical question: in what shape will those who live in the resurrection live? The answer begins by refusing to change anything. The earth restores the dead exactly as it received them, unaltered — the same bodies, so that they may be recognised."
          - "The reason is given explicitly: that the living may know that the dead are alive again, and that those who departed have returned. Identity must be established before glory is given, or a resurrection would be a replacement rather than a raising."
          - It is the same instinct that drives Paul's argument about the body that is sown and the body that is raised, and the same question the risen Christ answers by being recognised. The logic is unusually careful for this literature.
      - name: Changed into the splendour of angels
        refs:
          - 2 Baruch 51
          - Daniel 12.3
          - Matthew 22.30
          - Luke 20.36
          - 1 Corinthians 15.41–44
        body:
          - Only after recognition comes transformation. The appearance of those condemned is made worse; the glory of the righteous is changed into the splendour of angels, and they are made like the stars, and are able to behold the world now invisible to them, and time no longer ages them.
          - The scriptural relatives are exact — the wise shining as the brightness of the firmament and as the stars for ever in Daniel 12.3; as the angels of God in Matthew 22.30; equal unto the angels and children of the resurrection in Luke 20.36; and the differing glories of 1 Corinthians 15.
          - One thing must be said precisely, because it is the most misquoted point in the book. Being made like the angels is not becoming an angel. What is described is human beings transformed into a glory comparable to the angels' — a likeness of splendour, not a change of nature — and the same persons rise, which is exactly what the first stage of the argument establishes.
          - The resonance with what Orthodox theology calls glorification and incorruption is real, and it is a resonance. That doctrine is drawn from Scripture and the Fathers, not from this book.
        lists:
          - label: Orthodox status
            items:
              - The bodily resurrection of the same persons, and their glorification, is Orthodox faith
              - Likeness to the angels is likeness of glory; human beings do not become angels
              - This book is an early Jewish witness to the conception, not a source of the doctrine
      - name: Adam, and each man his own Adam
        refs:
          - 2 Baruch 54.19
          - 2 Baruch 23.4
          - 2 Baruch 48.42–43
          - Romans 5.12–21
          - 4 Ezra 3.21–22
        relatedHref: saint/OS-2524
        relatedLabel: Righteous Forefather Adam →
        body:
          - Adam sinned and death came upon all — the book grants that, and refuses the conclusion usually drawn from it. Adam is not the cause except for his own soul; each of us has become his own Adam. What Adam brought was mortality and the conditions of this age; what each person does with them is his own.
          - "The contrast with 4 Ezra is sharp and deliberate to notice: there, a grain of evil seed sown in Adam's heart and grown in all his descendants, and Ezra's cry that the fall was not Adam's alone but ours also. Two Jewish authors of one generation, on the same chapters of Genesis, striking different balances."
          - Romans 5 and 1 Corinthians 15 work the same material, and the parallels reflect shared Jewish inheritance rather than borrowing. Neither apocalypse should be read through later Western debates over original sin — this book is not a witness for a side in a controversy it never heard of.
  - key: chaos
    title: Leviathan, Behemoth, and the Age to Come
    navLabel: Leviathan
    tone: neutral
    display: list
    intro:
      - The chaos monsters of Job and the Psalms, served as food when the Messiah comes.
      - Not angels and not demons. This catalogue classifies them as chaos creatures, which is what the imagery actually supports.
    entries:
      - name: Leviathan and Behemoth
        refs:
          - 2 Baruch 29.4
          - Job 40–41
          - Psalm 74.13–14
          - Isaiah 27.1
          - Isaiah 25.6–8
        body:
          - Behemoth shall be revealed from his place and Leviathan shall ascend from the sea — the two great monsters created on the fifth day and kept until that time — and they shall be food for all who are left.
          - Both are biblical. Behemoth and Leviathan are described at length in Job 40 and 41; Psalm 74 has God breaking the heads of Leviathan and giving him as food; Isaiah 27 has the Lord punishing Leviathan the fleeing serpent with His great and strong sword. Behind them lies the older Near Eastern imagery of the chaos monster subdued at creation.
          - That is why the meal is not merely a feast. To serve the chaos monsters as food is to declare that the powers which threatened creation from the beginning are finally and comprehensively defeated — so thoroughly that they end on the table. Isaiah 25, where the Lord makes a feast for all peoples on the mountain and swallows up death for ever, is the nearest scriptural neighbour.
          - Fr Stephen De Young and Fr Andrew Damick discuss this verse in The Lord of Spirits within a wider biblical and Second Temple tradition of the eschatological defeat of chaos and of tyrannical powers, reading the two as spiritual and cosmic forces rather than as zoology. That is a theological interpretation of ancient imagery, offered as such — distinct both from the text's own narrative picture and from any claim about the author's intent.
        lists:
          - label: Classification
            items:
              - Chaos creatures — not angels, and not demons
              - "Biblical in origin: Job 40–41, Psalm 74, Isaiah 27"
              - The eschatological banquet is this book's development of that imagery
              - Fr Stephen De Young's spiritual-powers reading is interpretation, not the text's own statement
      - name: The abundance of the messianic age
        refs:
          - 2 Baruch 29.5–8
          - Isaiah 25.6
          - Exodus 16
        body:
          - "The same chapter piles up agricultural excess: the earth yielding ten thousandfold, a single vine with a thousand branches, each branch a thousand clusters, each cluster a thousand grapes, each grape a cor of wine — and the manna coming down again from on high."
          - The exaggeration is the point. Apocalyptic abundance says that the curse on the ground is reversed and the wilderness provision returns, in a register no one was meant to take as agronomy.
          - New Testament banquet imagery belongs to the same world of expectation without requiring any dependence on this book.
      - name: The cedar, the vine, and the cloud
        refs:
          - 2 Baruch 36–40
          - 2 Baruch 53–74
          - Daniel 7
        body:
          - Two visions carry the book's philosophy of history. In the first, a forest surrounded by mountains is levelled by a torrent from a fountain beneath a vine, until one cedar remains — and it is cast down before the vine, reproached and burned. The forest is the kingdoms; the last cedar their final ruler; the vine the Messiah who convicts and destroys him.
          - "In the second, a great cloud rises from the sea and pours out alternating black and bright waters twelve times over — ending with waters blacker than all before, and then with lightning. Ramiel interprets it as the whole course of the world: the black waters the ages of transgression, from Adam's sin through the flood and Egypt and the wicked kings to the destruction of Zion; the bright the ages of righteousness, Abraham and Moses and David and Hezekiah and Josiah. The last black waters are the final tribulation, and the lightning is the Messiah."
          - "It is a theology of history compressed into a weather system: no age is uniform, good and evil alternate, and the pattern is neither random nor endless. Whether each water answers to exactly the figure a given commentator assigns is a matter for the primary text, and identifications should be checked rather than taken from summaries — including this one."
  - key: figures
    title: Baruch and Jeremiah
    navLabel: The Figures
    tone: neutral
    display: cards
    intro:
      - The scribe promoted to prophet, and the master who was sent away.
      - Both are commemorated by the Church and have their own pages here. Scripture gives Baruch far less than this book does.
    entries:
      - name: Baruch
        relatedHref: saint/OS-1918
        relatedLabel: Prophet Baruch →
        blurb: Jeremiah's scribe in Scripture, who wrote the prophet's words and rewrote them when the scroll was burned. Here he stays behind in the ruins, receives the visions, teaches the people, and is told he will be preserved until the consummation of the times.
      - name: Jeremiah
        relatedHref: saint/OS-1086
        relatedLabel: Prophet Jeremiah →
        blurb: Sent away to Babylon with the captives at the start of the book, so that the revelations may come to Baruch instead — the device by which the scribe becomes the successor.
      - name: Adam
        relatedHref: saint/OS-2524
        relatedLabel: Righteous Forefather Adam →
        blurb: Whose transgression brought mortality, and who in this book is not the cause except for his own soul — since each of us has become his own Adam.
      - name: The nine and a half tribes
        blurb: The exiles to whom the closing Letter, chapters 78–87, is addressed. That Letter circulated separately, was copied far more widely than the apocalypse, and was read in Syriac churches.
