slug: 2-baruch
title: 2 Baruch (The Syriac Apocalypse of Baruch)
aka:
  - Second Baruch
  - The Syriac Apocalypse of Baruch
  - The Apocalypse of Baruch
era: Late 1st or early 2nd century AD, after the destruction of Jerusalem
canonicalStatus: Apocryphal · Jewish, Syriac transmission
blurb: "The companion of 4 Ezra: a Jewish apocalypse written after Jerusalem fell, in which the angel Ramiel interprets Baruch's visions of history, resurrection, and the age to come — and Leviathan and Behemoth are served at the messianic feast."
order: 15
