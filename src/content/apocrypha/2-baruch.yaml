  - key: ramiel
    title: Ramiel, and the Angels of the Fall of Zion
    navLabel: Ramiel
    tone: faithful
    display: list
    intro:
      - The angel who presides over true visions — and the angels who threw down the walls before Babylon could.
      - The text calls Ramiel an angel, not an archangel. Names related to his appear in other books with other offices, and this page does not merge them.
    entries:
      - name: Ramiel
        meaning: Ramael; related to Remiel and Jeremiel, not demonstrably identical
        refs:
          - 2 Baruch 55.3
          - 2 Baruch 63.6
          - 1 Enoch 20
          - 4 Ezra 4.36
          - 2 Kings 19.35
          - Isaiah 37.36
        hostId: HH-0017
        relatedLabel: Archangel Jeremiel →
        body:
          - The angel sent to interpret for Baruch, described as presiding over true visions — a title implying that not every vision is trustworthy and that reliable revelation is mediated by a particular heavenly authority. His presence guarantees the vision, not merely explains it.
          - "His main work is the cloud of black and bright waters, which he unfolds as the whole course of history from Adam to the Messiah. He also appears within that interpretation: 2 Baruch attributes to Ramiel the destruction of Sennacherib's army, which 2 Kings 19.35 and Isaiah 37.36 ascribe to the angel of the Lord without naming him. The book supplies a name where Scripture gives none — a real fact about this literature's habits, and not a warrant for identifying Ramiel with the Angel of the Lord."
          - "The related record linked here is this catalogue's Archangel Jeremiel, whose alternate names include Jerahmeel and Jeremeel and whose extra-biblical source is 4 Ezra. The connection is natural and the qualification is the point: Ramiel here, Remiel in 1 Enoch 20 and Jeremiel in 4 Ezra are probably related names with different functions in each text — Remiel set over those who rise, Jeremiel answering about the souls of the righteous, Ramiel presiding over visions. They should not be collapsed into one being on a shared root."
          - As with Uriel, Jeremiel's standing in Orthodox tradition rests on the Church's liturgical tradition — canonical status Traditional, primary source Liturgical Tradition — not on an appearance in a Jewish apocalypse.
        lists:
          - label: Source register
            items:
              - Not named in Scripture; 2 Kings 19.35 gives the angel of the Lord without a name
              - Called an angel in 2 Baruch, and described as presiding over true visions — not called an archangel
              - Related to Remiel and Jeremiel by name; identity with them is not established
              - Jeremiel's Orthodox commemoration rests on liturgical tradition, on its own authority
      - name: The angel who emptied the sanctuary
        refs:
          - 2 Baruch 6.7–10
          - 2 Baruch 8.1–2
        body:
          - Baruch is lifted above the walls and sees an angel descend into the Holy of Holies and take out the veil, the holy ark, the mercy seat, the two tables, the priestly vestments, the altar of incense and the vessels of the sanctuary — and the earth opens its mouth and swallows them, to keep them until the last times, when Jerusalem shall be restored.
          - The holy things are not captured. They are withdrawn, and preserved, and the tradition of hidden Temple vessels had a long life afterwards. It belongs to this book and its kin, and should not be read back into Scripture.
      - name: The angels who threw down the walls
        refs:
          - 2 Baruch 7–8
          - 2 Kings 25
          - Lamentations 2
        body:
          - Angels are then commanded to overthrow the walls and cast them down, so that the enemy may not boast and say that they overthrew the wall of Zion. Only afterwards do the Chaldeans enter, and take a city already broken.
          - The move answers the book's central question. If Babylon — or Rome — destroyed the city, the gods of the nations are stronger than the God of Israel. If God's own angels threw down the walls, the destruction is judgment, the covenant holds, and Zion was never conquered.
          - Scripture ascribes the destruction to Babylon as God's instrument, in Kings, Jeremiah, Lamentations and Ezekiel. This book carries that instrumentality further than any canonical text does.
        lists:
          - label: Orthodox status
            items:
              - That Jerusalem fell under God's judgment is Scripture's own account
              - The angelic demolition and the swallowed vessels belong to this book
              - A theological claim in narrative form — not a historical report
