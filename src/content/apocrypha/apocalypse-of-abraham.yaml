  - key: yahoel
    title: Yahoel, the Angel of the Name
    navLabel: Yahoel
    tone: faithful
    display: list
    intro:
      - The angel sent to Abraham — guide, priest, choirmaster, and bearer of the ineffable Name.
      - Yahoel is the central heavenly figure of the book and the one most often misclassified. He is not an archangel the Church names, and he is not an ordinary angel either; the text is deliberate about both.
    entries:
      - name: Yahoel
        meaning: Iaoel · Jaoel · Jahoel · Yaoel — the divine name YHWH joined to El
        refs:
          - Apocalypse of Abraham 10–11
          - Apocalypse of Abraham 17
          - Exodus 23.20–21
          - Genesis 22
          - Judges 13
        hostId: HH-0019
        relatedLabel: The Angel of the Lord →
        body:
          - "God sends him to Abraham, and identifies him as the one in whom His ineffable Name dwells. The name itself carries the claim: YHWH joined to El, in the ordinary angelic form."
          - "He is described with unusual care — a body like sapphire, a face like chrysolite, hair like snow, a turban like a rainbow, purple garments, and a golden staff in his right hand. Orlov reads these as priestly vestments, and Yahoel acts throughout as a heavenly high priest: preparing Abraham, teaching him the sacrificial procedure, instructing him in the praise of heaven, confronting Azazel, and leading him up towards the sanctuary above. He also teaches Abraham the hymn with which to approach the throne, which is why Orlov calls him heavenly choirmaster as well."
          - The scriptural anchor is Exodus 23.20–21, where God sends an angel before Israel and warns them not to rebel against him, "for my name is in him". The Angel of the Lord elsewhere in Scripture behaves in the same unusual way — speaking with divine authority to Hagar, to Abraham on the mountain, from the burning bush, to Gideon, and to Manoah, who afterwards is sure he has seen God.
          - Fr Stephen De Young reads Yahoel within that tradition, and within what Alan Segal's study called Two Powers in Heaven — a visible figure who bears God's Name and authority while God Himself remains transcendent. For a Christian reader the resonance with John 1 is immediate, and the Church has long read such Old Testament appearances as appearances of the pre-incarnate Logos. The book itself is Jewish and says none of this. The identification is interpretation, and this page links to the Angel of the Lord as a related record without asserting it.
        lists:
          - label: Orthodox status
            items:
              - The biblical Angel of the Lord is Scripture's own, and the Church has read it christologically
              - Yahoel — the name, the vestments and the role — belongs to this book
              - No Orthodox liturgical tradition recognises an Archangel Yahoel; he must never be listed beside Michael and Gabriel
              - He is not simply identified with Michael either; older scholarship compared their functions, but the text gives him his own identity
              - That Yahoel is Christ is Christian interpretation of a Jewish text, and is not asserted here
      - name: The living creatures and the hosts of the throne
        refs:
          - Apocalypse of Abraham 18
          - Ezekiel 1
          - Isaiah 6
          - Daniel 7
          - Revelation 4–5
        body:
          - At the height of the ascent Abraham sees fire, and beneath the throne four living creatures, each with four faces, singing — imagery drawn from Ezekiel and standing in the same tradition as the seraphim of Isaiah 6 and the ceaseless worship of Revelation.
          - Around them are innumerable worshippers, prostration, the divine voice, and light. The book is less interested in cataloguing ranks than in conveying the weight of the place; there is no systematic inventory of orders here, and none should be extracted from it.
          - Through all of it the transcendent God is not made visible. That restraint is deliberate, and it is what gives Yahoel his significance in the narrative.
  - key: azazel
    title: Azazel and the Assault on the Sacrifice
    navLabel: Azazel
    tone: fallen
    display: list
    intro:
      - The adversary of this book — the bird at the covenant sacrifice, and the goat driven into the wilderness.
      - "Azazel arrives carrying two earlier traditions: the scapegoat rite of Leviticus 16 and the chief rebel of 1 Enoch. Scripture supplies the name and the rite. The biography is extra-biblical."
    entries:
      - name: Azazel
        refs:
          - Apocalypse of Abraham 13–14
          - Apocalypse of Abraham 23
          - Leviticus 16.8–10, 20–22
          - 1 Enoch 8–10
          - Genesis 15.11
        hostId: HH-0050
        relatedLabel: Satan / the Devil →
        body:
          - The principal adversary of the apocalypse — not Satanail as in 2 Enoch, nor Mastema as in Jubilees, but Azazel, and the choice of name brings its whole history with it.
          - In Leviticus 16 one goat of the Day of Atonement is for the Lord and the other for Azazel, and the second is sent into the wilderness bearing the iniquities of Israel. Scripture gives the designation and the rite and nothing more. In 1 Enoch he becomes a chief rebel — teacher of forbidden arts, corrupter of humanity, bound in a desolate place until the judgment. This book draws on that Enochic Azazel, which is chiefly why Fr Stephen De Young files the work within the Enochic tradition despite Abraham being its hero.
          - Yahoel tells him that Abraham's portion is in heaven and his own is on the earth, and sends him to its untrodden places — the wilderness of the scapegoat and the desolation of 1 Enoch at once. Later in the vision he appears again, bound up with the serpent, the temptation and the corruption of humanity, as Second Temple literature regularly fuses Genesis 3 with the fallen-angel traditions.
          - Two things follow. Genesis does not identify its serpent as Azazel, and Leviticus does not make him a fallen angel; both identifications belong to this interpretive stream. And Azazel here is not a second demon standing beside Satan — he is this book's principal literary identity for the adversary, which is why he is linked to that record rather than catalogued as a separate being.
        lists:
          - label: Orthodox status
            items:
              - Azazel is a scriptural designation in Leviticus 16, tied to the scapegoat of the Day of Atonement
              - The developed portrait of a fallen angel comes from extra-biblical literature, principally 1 Enoch and this book
              - '"Leviticus says Azazel is a fallen angel" is false, and is the most common error about him'
              - He should not be catalogued as an independent demon standing alongside Satan
        fate: Cursed and expelled to the untrodden parts of the earth; bound and held, in the wider Enochic tradition, until the judgment.
      - name: The unclean bird at the sacrifice
        refs:
          - Apocalypse of Abraham 13
          - Genesis 15.9–11
        body:
          - 'Genesis 15.11 says one thing: "when the birds of prey came down on the carcasses, Abram drove them away". It is a line most readers pass over.'
          - This book stops there. The bird is Azazel; it speaks to Abraham and urges him to leave the holy place; Yahoel names it and teaches Abraham the words that drive it off. The covenant sacrifice is thereby revealed as a battle, and Abraham's ordinary gesture of shooing birds becomes the visible surface of a spiritual conflict.
          - It is the clearest example in this section of how ancient Jewish interpreters read Scripture — taking a small narrative detail and asking what unseen reality stood behind it. The movement from earthly event to lifted veil to heavenly conflict is the same one Revelation makes.
          - Genesis says the first thing. This book supplies the second, as interpretation. The page keeps them in that order.
      - name: The garment of Azazel
        refs:
          - Apocalypse of Abraham 13.14
          - 1 Corinthians 6.3
          - Revelation 3.5
        body:
          - Yahoel tells Azazel that the heavenly garment which was once his has been set aside for Abraham. The fallen angel has forfeited his glory, and it is given to a righteous human being.
          - Orlov has studied the motif at length as part of the book's priestly and transformation imagery, and reads Azazel more broadly as a demonic mirror — carrying distorted counterparts of heavenly glory and priestly symbolism, an anti-priest to Yahoel's priest. That is a useful observation for Orthodox demonology, which has always held that evil originates nothing and can only parody, corrupt and appropriate what belongs to God.
          - The pattern of a fallen power losing what a faithful human then receives has obvious Christian resonances — the white robes of the redeemed, glorification, Paul's remark that the saints will judge angels. They are comparisons. Christian theology is not derived from this book.
    outro:
      - Catalogued for study, never venerated. Where the book supplies an adversary that Scripture does not name in the same passage, this page marks the difference rather than harmonising it.
  - key: mirror
    title: Yahoel and Azazel — the Mirror
    navLabel: The Mirror
    tone: neutral
    display: table
    intro:
      - The two figures are drawn as deliberate opposites, point for point.
      - "Orlov's reading of the book turns on this: Azazel is not merely evil but a distorted counterpart of heavenly glory — an anti-priest, holding the ruined mirror image of what Yahoel holds. Evil in this book originates nothing."
    table:
      columns:
        - Yahoel
        - Azazel
      rows:
        - - Heavenly
          - Exiled to the earth and the wilderness
        - - Holy
          - Defiled
        - - Priest
          - Anti-priest, and scapegoat
        - - Bears the divine Name
          - Bears rebellion
        - - Leads the worship of heaven
          - Works corruption
        - - Guides Abraham upward
          - Argues Abraham away from the holy place
        - - Clothed in glory
          - Stripped of the garment, which passes to Abraham
        - - Abraham's portion is in heaven
          - Azazel's portion is the untrodden earth
    entries: []
  - key: figures
    title: The Figures of the Vision
    navLabel: Figures Seen
    tone: neutral
    display: cards
    intro:
      - The human figures of the narrative and of the history Abraham is shown.
      - Most are commemorated by the Church and have their own pages here. Cain has no such record, and the man at the end of the age is not identified by the text — the two exceptions are deliberate.
    entries:
      - name: Abraham
        relatedHref: saint/OS-1984
        relatedLabel: Righteous Forefather Abraham →
        blurb: The seer of the book — iconoclast, then celebrant of the covenant sacrifice, then a man carried up to the sanctuary above and clothed in a garment an angel forfeited.
      - name: Terah
        relatedHref: saint/OS-2544
        relatedLabel: Righteous Forefather Terah →
        blurb: Abraham's father, keeper of the idol sanctuary of the first eight chapters — the false house of worship the book sets against the true one.
      - name: Adam
        relatedHref: saint/OS-2524
        relatedLabel: Righteous Forefather Adam →
        blurb: Shown to Abraham in the vision of human history, with Azazel present at the beginning of it.
      - name: Eve
        relatedHref: saint/OS-2525
        relatedLabel: Righteous Foremother Eve →
        blurb: Seen with Adam in the same vision, in the book's fusion of Genesis 3 with the fallen-angel traditions.
      - name: Abel
        relatedHref: saint/OS-2526
        relatedLabel: Righteous Abel →
        blurb: His murder is among the scenes Abraham is shown — the first death, presented as a spiritual allegiance chosen.
      - name: Cain
        blurb: Shown choosing which power he will embody, in what Fr Stephen De Young reads as the spiritual counterpart of sin crouching at the door. Not commemorated by the Church, and so unlinked here.
      - name: The man at the end of the age
        blurb: An enigmatic figure worshipped by some and struck by others, bound up with deliverance. Christian readers find the resemblance to Christ immediate; the text does not identify him, and neither does this page.
