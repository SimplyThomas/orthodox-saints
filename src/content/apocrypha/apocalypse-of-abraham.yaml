slug: apocalypse-of-abraham
title: The Apocalypse of Abraham
aka:
  - Revelation of Abraham
  - The Slavonic Apocalypse of Abraham
era: Late 1st to early 2nd century AD
canonicalStatus: Apocryphal · Early Jewish apocalypse
blurb: An early Jewish apocalypse in which the birds of prey at Abraham's covenant sacrifice turn out to be Azazel — and the angel Yahoel, who bears the divine Name, stands beside Abraham as heavenly priest to drive him off.
order: 5
status: reviewed
humanReviewed: false
sources:
  - G. H. Box, with J. I. Landsman, trans., The Apocalypse of Abraham (London — SPCK, 1918) — public domain; the translation cited on this page
  - Alexander Kulik, Retroverting Slavonic Pseudepigrapha — Toward the Original of the Apocalypse of Abraham (Society of Biblical Literature, 2004) — the modern critical reconstruction and translation; cited for scholarship, not reproduced
  - Andrei A. Orlov, Divine Scapegoats — Demonic Mimesis in Early Jewish Mysticism (SUNY Press, 2015), and the studies "The Eschatological Yom Kippur in the Apocalypse of Abraham", "High Priest Yahoel and Azazel", "The Garment of Azazel" and "The Likeness of Heaven — Kavod of Azazel"
  - Alan F. Segal, Two Powers in Heaven (Brill, 1977), for the scholarly category invoked below
  - The Sylvester Codex and the witnesses of the Explanatory Palaea (the Slavonic manuscript tradition)
  - Genesis 15.9–11; Genesis 22; Exodus 3; Exodus 23.20–21; Leviticus 16; Judges 6 and 13; Isaiah 6; Daniel 7; Hebrews 4–10; Revelation 4–5 and 20 (Holy Scripture)
  - Epiphanius, Panarion 39.5, on apocalypses of Abraham used by a Gnostic group — probably not this work
  - V. Rev. Dr Stephen De Young, "Who Is Azazel?", The Whole Counsel of God (Ancient Faith, 3 November 2020), and The Lord of Spirits podcast — "Apocalypse of Abraham and Atonement Revisited" (28 March 2025), with "Torah 2 — Back in the Habit" and "The Priest Shall Make Atonement"
  - Catalogued for study; requires clergy/source review before any devotional use
