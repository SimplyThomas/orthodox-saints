  - heading: Relationship to the New Testament
    body:
      - The work is probably contemporary with part of the New Testament period, so its usefulness lies in showing which religious concepts were already circulating rather than in establishing who read whom. Direct literary dependence cannot be demonstrated in any of the cases below, and this page does not assert it.
    table:
      columns:
        - Theme
        - New Testament
        - Best assessment
      rows:
        - - A visible figure bearing the divine Name
          - John 1.1–18; Philippians 2; 1 Corinthians 10.4
          - A Jewish parallel to concepts later central to Christology; not dependence
        - - A high priest in the true heavenly sanctuary
          - Hebrews 4–10
          - Conceptually significant — the idea was already in Jewish discourse
        - - The throne, the living creatures, ceaseless worship
          - Revelation 4–5
          - Shared Jewish apocalyptic world
        - - The adversary bound, loosed, and finally judged
          - Revelation 20
          - Both may draw on older traditions of the adversary's imprisonment
        - - Christ appeared to destroy the works of the devil
          - 1 John 3.8
          - Fr Stephen De Young sets the book's atonement model beside this; his interpretation
        - - The saints receiving what fallen powers forfeited
          - 1 Corinthians 6.3; Revelation 3.5
          - Comparison only — the garment motif is suggestive, not a source
  - heading: Modern Orthodox Discussion
    body:
      - This book has become one of the extra-biblical works Fr Stephen De Young treats most directly. The Lord of Spirits devoted a full episode to reading it in March 2025, and his 2020 essay "Who Is Azazel?" covers much of the same ground from the other end.
      - "His readings, gathered: the work belongs to the broader Enochic tradition, chiefly because of Azazel's role in it. Yahoel is an expression of the biblical Angel of the Lord, his name deliberately encoding Exodus 23.21, and evidence for the ancient Jewish framework of a transcendent God alongside a visible figure sharing the divine identity. Yahoel's vestments and functions make him a heavenly priest. Abraham's sacrifice is the earthly surface of a cosmic conflict, and — following Orlov — an eschatological Day of Atonement in which the adversary is expelled rather than a penalty paid. The clarity of the Temple's destruction dates the book after AD 70. And the man at the end has obvious Christian resonance without being identified by the text as Christ."
      - That these readings recur across an essay, two podcast episodes and his Torah series indicates a settled framework rather than an isolated observation. They are recorded here as his interpretation of ancient material — which is how he offers them — and not as Orthodox doctrine.
  - heading: What It Can and Cannot Establish
    body:
      - "It can illuminate a great deal: Jewish interpretation of Genesis 15; the ancient Angel-of-the-Lord traditions and the divine Name; heavenly priesthood and the heavenly sanctuary; Azazel and Enochic demonology; Day of Atonement symbolism; spiritual warfare; Jewish responses to the destruction of the Temple; apocalyptic heavenly ascent; and the conceptual background against which early Christianity took shape."
      - It cannot on its own establish Orthodox dogma; Yahoel as an officially recognised archangel; Yahoel as an Orthodox name for Christ; the appearance of heaven; a canonical biography of Azazel; that the birds of Genesis 15 were literally demons; that its Day of Atonement reading is historical fact; that Hebrews or Revelation used it; or a doctrine of the atonement drawn from an extra-biblical apocalypse.
      - Two classifications follow from that, and they matter for anything built out of this page. Yahoel is an extra-biblical heavenly figure, interpreted by some scholars and Orthodox writers as a literary development of the biblical Angel of the Lord — he must never be listed beside Michael and Gabriel as though the Church knew an Archangel Yahoel. Azazel is a scriptural designation in Leviticus 16 whose developed portrait as a fallen angel comes from extra-biblical literature, principally 1 Enoch and this book. Keeping the biblical evidence and the later interpretation apart is the whole discipline here, and the table below applies it to the claims most often repeated.
    table:
      columns:
        - Commonly said
        - Status
        - What can be said
      rows:
        - - Yahoel is another Orthodox archangel
          - Incorrect
          - No Orthodox liturgical tradition recognises an Archangel Yahoel; he is a named figure in this book
        - - Yahoel is Michael
          - Unsupported as a simple identification
          - Older scholarship compared their functions; the apocalypse presents Yahoel under his own identity
        - - Yahoel is Jesus
          - Too strong for the text
          - A Jewish work that never says so. Fr Stephen De Young reads him within the Angel-of-the-Lord tradition, which Christians identify with the pre-incarnate Logos
        - - Yahoel is just an ordinary angel
          - Also misleading
          - The text deliberately gives him the divine Name and extraordinary priestly functions
        - - Azazel is simply another name for Satan
          - Needs qualification
          - He is this book's principal adversary and absorbs traditions elsewhere attached to Satan; the development of these identities across Second Temple literature is complex
        - - Leviticus says Azazel is a fallen angel
          - "False"
          - Leviticus 16 names Azazel in connection with the scapegoat and gives no biography
        - - Genesis says the birds at the sacrifice were demons
          - "False"
          - Genesis reports birds of prey; this book interprets them as Azazel
        - - Abraham celebrated the Day of Atonement
          - Not in Genesis
          - The apocalypse reinterprets his Genesis 15 sacrifice through priestly and Yom Kippur symbolism
        - - The book teaches penal substitution
          - Misrepresents it
          - Its atonement imagery is purification, transfer, expulsion of evil and restoration
        - - It is a Christian work, because it seems to describe Jesus
          - Not established
          - There may be Christian interpolations, but the underlying work is regarded as Jewish
        - - It was written in medieval Russia, since the manuscripts are Slavonic
          - Incorrect
          - Linguistic evidence points to a much earlier Semitic composition, probably carried through Greek
        - - It proves the Trinity was already explicit Jewish doctrine
          - Too strong
          - It evidences a framework of the transcendent God alongside a visible Name-bearing figure — valuable background, not Nicene doctrine
