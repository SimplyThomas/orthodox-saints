slug: shepherd-of-hermas
title: The Shepherd of Hermas
aka:
  - Pastor of Hermas
  - The Shepherd
  - Poimen
era: c. early–mid 2nd century AD (Rome)
canonicalStatus: Apocryphal · Apostolic Fathers
blurb: An early Christian book of visions, commandments, and parables, revealed to Hermas by an angel of repentance in the form of a shepherd — once read almost as Scripture, and rich in its angelology.
order: 2
status: draft
humanReviewed: false
sources:
  - The Shepherd of Hermas, trans. F. Crombie, Ante-Nicene Fathers vol. 2 (public domain) — the text cited and quoted throughout this page
  - Codex Sinaiticus (which includes the Shepherd after the New Testament)
  - The Muratorian Fragment (on its date, and on the limit set to its public reading)
  - St. Irenaeus, Against Heresies; Clement of Alexandria, Stromata; Origen; St. Athanasius, Festal Letter 39; Eusebius, Ecclesiastical History III.3, III.25
  - Carolyn Osiek, The Shepherd of Hermas (Hermeneia); Michael Holmes, The Apostolic Fathers; J. B. Lightfoot, The Apostolic Fathers
  - Catalogued for study; requires clergy/source review before any devotional use

