  - heading: Relationship to the New Testament
    body:
      - The central point is not that the apostolic writers admired this book, but that many of the traditions it preserves belonged to the common Jewish interpretive world of the first century. Some correspondences may indicate direct literary influence; others reflect a shared inheritance. Because Jubilees often collects traditions older than itself, a parallel does not by itself show which way the borrowing ran — or that there was any borrowing at all.
    table:
      columns:
        - Theme
        - New Testament
        - Best assessment
      rows:
        - - The Law given through angels
          - Acts 7.53; Galatians 3.19
          - Widely attested Second Temple tradition
        - - Noah a preacher of righteousness
          - 2 Peter 2.5
          - Explicit in Jubilees and absent from Genesis — a strong parallel
        - - Angels imprisoned, awaiting judgment
          - 2 Peter 2.4; Jude 6
          - Shared Enochic tradition
        - - '"I will send them prophets… and some of them they shall slay"'
          - Luke 11.49, beside Jubilees 1.12
          - Fr Stephen De Young argues for a possible direct quotation; an interpretive claim, not settled scholarship
        - - '"I will be a Father to them, and they shall be my sons and daughters"'
          - 2 Corinthians 6.18, beside Jubilees 1.24
          - Close parallel; both may draw on 2 Samuel 7.14
        - - Unclean spirits afflicting and possessing
          - The Synoptic Gospels; Tobit
          - Jubilees supplies conceptual background, not doctrine
        - - Details in Stephen's speech beyond Genesis and Exodus
          - Acts 7
          - Shared interpretive traditions; to be judged case by case
        - - A kingdom and priests; heavenly books; angels over cosmic phenomena
          - Revelation 1.6; 20.12
          - Shared Jewish apocalyptic world
  - heading: Modern Orthodox Discussion
    body:
      - Among contemporary Orthodox writers Jubilees is treated most extensively by V. Rev. Dr Stephen De Young, in a 2019 essay devoted to the book and in a full episode of The Lord of Spirits in May 2024. He regards it as a genuine Second Temple Jewish text, influential in first-century Judaism, valuable for New Testament interpretation regardless of its canonical standing, and unusually informative about angels and demons.
      - His most useful methodological point concerns what a parallel proves. Jubilees appears to collect and organise traditions already circulating before its own composition, so a tradition surviving first in Jubilees did not necessarily begin there. When the same material later appears in the New Testament, it may come from Jubilees — or both may inherit something older. That distinction is applied throughout this page.
      - 'One liturgical observation of his deserves separate mention, and equal care. Noah''s prayer in Jubilees 10.3 opens by addressing the "God of the spirits of all flesh", which is strikingly close to the Orthodox prayer for the departed, "O God of spirits and of all flesh". The parallel is real and worth knowing. It does not show that the Orthodox prayer was drawn from Jubilees: the phrase belongs to a wider biblical vocabulary, and Numbers 16.22 and 27.16 address God in almost the same words. Jubilees is best read here as a witness to the antiquity and continuity of the phrase.'
  - heading: What Jubilees Can and Cannot Establish
    body:
      - It is exceptionally useful for understanding Second Temple Jewish interpretation of Genesis and Exodus; ancient angelology and demonology; the Watcher traditions; the origin of evil spirits; Mastema; the heavenly tablets; the angelic administration of creation; the Jewish calendar disputes; sacred time and covenant theology; Qumran; the traditions circulating in the world of the New Testament; and early Christian familiarity with Jewish extra-biblical material. Because Hebrew manuscripts survive from Qumran, its value as evidence for pre-Christian Jewish belief is on far firmer ground than that of most works in this section.
      - It cannot on its own establish Orthodox doctrine; official names or a complete classification of the heavenly beings; the biography of Satan; that Mastema is a distinct Orthodox demon; that exactly a tenth of the spirits of the giants are presently at work; that every demon originates from a dead giant; the canonical interpretation of Genesis 6; an Orthodox liturgical calendar; or any obligation on Christians to keep its 364-day year.
      - Historical importance and doctrinal authority are different questions, and this book is a good place to keep them apart — it is among the most valuable extra-biblical sources for reconstructing the religious world around the New Testament, and it is not a rule of faith. The table below applies that distinction to the claims most often repeated about it.
    table:
      columns:
        - Commonly said
        - Status
        - What can be said
      rows:
        - - Jubilees is just Jewish fan fiction about Genesis
          - Misleading
          - It is a serious Second Temple interpretive work, widely copied at Qumran, preserving traditions important for reconstructing ancient Judaism
        - - Jubilees was written after Christianity
          - "False"
          - Hebrew manuscripts from Qumran prove pre-Christian circulation
        - - We only have an Ethiopian copy
          - "False"
          - The only complete text is the Ge'ez, but Hebrew, Latin, Greek and Syriac evidence also survives
        - - Jubilees is Orthodox Scripture
          - Needs qualification
          - Not in the Byzantine Orthodox canon; it holds a distinctive scriptural position in the Ethiopian Orthodox Tewahedo tradition
        - - Mastema is another Orthodox name for Satan
          - Too strong
          - A Second Temple adversarial figure functioning in ways analogous to Satan; the name is not Orthodox nomenclature for the devil
        - - The Orthodox Church teaches that demons are the ghosts of dead Nephilim
          - Too strong
          - Jubilees and 1 Enoch preserve that ancient explanation; it is background for Second Temple demonology, not a dogmatic definition
        - - Exactly ten percent of the demons were allowed to remain
          - Extra-biblical tradition
          - This is specifically the explanation offered in Jubilees 10
        - - The Watchers are an Orthodox angelic order
          - Incorrect
          - Watcher is an ancient designation with biblical parallels, but the rebellious Watchers belong to a Genesis 6 interpretive tradition, not to the received hierarchy
        - - Jubilees invented these traditions
          - Cannot be assumed
          - It often collects material older than itself; where the New Testament shares a tradition, either may depend on a common inheritance
        - - Jubilees is irrelevant because it is not canonical
          - Historically indefensible
          - Its Qumran manuscripts alone establish its importance in Second Temple Judaism
collections:
  - key: principal-angels
    title: The Principal Angelic Figures
    navLabel: Principal Angels
    tone: faithful
    display: list
    intro:
      - The angels who act in the narrative, and the two exalted classes nearest to God.
      - Jubilees is markedly uninterested in personal angel names — unlike 1 Enoch, it names almost none. Its angelology is about office, function, holiness and administration, so the figures below are known by what they do rather than by what they are called.
    entries:
      - name: The Angel of the Presence
        refs:
          - Jubilees 1.27
          - Jubilees 2.1
          - Exodus 23.20–23
          - Exodus 33
          - Isaiah 63.9
        hostId: HH-0019
        relatedLabel: The Angel of the Lord →
        body:
          - The narrator of the book. God commands him to dictate to Moses the history written on the heavenly tablets, and from Jubilees 2 onward the account is his voice. Almost everything in the work reaches the reader through him.
          - The title echoes the biblical language of the angel who goes before Israel — the angel in whom God's Name is, of Exodus 23; the presence that goes with Moses in Exodus 33; the angel of His presence who saved them, in Isaiah 63.9.
          - The echo is worth hearing and worth handling carefully. That this figure is one and the same as every appearance of the Angel of the Lord in Scripture is a theological and historical interpretation, not something the text states. This page links to the Angel of the Lord as a related record without asserting the identification.
        lists:
          - label: Orthodox status
            items:
              - The biblical Angel of the Lord is Scripture's own; the Fathers have read it in more than one way
              - The title Angel of the Presence, and this figure's role as narrator, belong to Jubilees
              - The identification of the two is interpretation, and is not asserted here
      - name: The Angels of the Presence
        refs:
          - Jubilees 2.2
          - Jubilees 2.18
        body:
          - The highest company of angels, created on the first day and standing before God. The narrator of the book is one of them.
          - "With the Angels of Sanctification they are given a striking role: they keep the Sabbath in heaven with God, before Israel is ever commanded to keep it on earth. Sabbath in this book is not an Israelite institution added later but part of the structure of creation, observed above before it is enjoined below."
        lists:
          - label: Orthodox status
            items:
              - An ancient Jewish angelic category, not a rank of the hierarchy the Church received
              - The conviction that earthly worship joins an order already kept in heaven is thoroughly Orthodox — but it rests on Isaiah, Daniel, Hebrews and Revelation, not on this book
      - name: The Angels of Sanctification
        refs:
          - Jubilees 2.2
          - Jubilees 2.18
        body:
          - The second of the two exalted classes created on the first day, associated with holiness and with the worship of heaven, and keeping the Sabbath with the Angels of the Presence.
          - "Their existence is the clearest expression of the book's governing idea: that the earthly liturgy corresponds to a heavenly one that precedes it. Israel is commanded to enter an order already in progress."
        lists:
          - label: Orthodox status
            items:
              - An ancient Jewish angelic category; no such order is named in the received hierarchy
      - name: Michael
        refs:
          - Daniel 10.13, 21
          - Daniel 12.1
          - Deuteronomy 32.8–9
        hostId: HH-0010
        relatedLabel: Archangel Michael →
        body:
          - Jubilees shares the conviction, stated openly in Daniel, that spiritual beings hold appointed roles over the nations, and that Israel stands in a different relation from the rest — belonging directly to God rather than to any subordinate ruler.
          - Michael is the biblical anchor of that idea, set over Israel in Daniel 10 and 12, and the Church names and honours him. He is included here for that connection rather than because Jubilees develops him as a character.
      - name: The angels set over the parts of creation
        refs:
          - Jubilees 2.2
          - Psalm 103.4
          - Revelation 7.1
          - Revelation 14.18
          - Revelation 16.5
        body:
          - Created on the first day and assigned to fire, the winds, the clouds and the weathers, the thunder and lightning, the seasons, the abysses and the divisions of the day. The full list is set out in the next directory.
          - Scripture knows the conception — God makes His angels winds and His ministers a flame of fire; Revelation has angels of the four winds, of the fire and of the waters. What Scripture does not give is the classification, and Jubilees' classification is its own.
        lists:
          - label: Orthodox status
            items:
              - The underlying idea that creation is governed through heavenly servants is biblical
              - The scheme of classes is this book's elaboration and is not a canonical list of angelic offices
  - key: first-day
    title: The Angels Created on the First Day
    navLabel: Angels of Creation
    tone: faithful
    display: table
    intro:
      - The classes of angels Jubilees 2.2 says were made before anything else.
      - This is the passage that makes Jubilees so useful to a catalogue of the heavenly hosts — and the one most often misused. It is an ancient Jewish elaboration of Genesis 1, not a canonical roster of angelic offices, and none of these classes belongs among the nine orders the Church received.
    table:
      columns:
        - Class of angels
        - Sphere of service
      rows:
        - - The Angels of the Presence
          - Standing before God; the narrator of the book is one of them, and they keep the Sabbath in heaven
        - - The Angels of Sanctification
          - Holiness and the worship of heaven; they too keep the Sabbath with God
        - - The angels of the spirit of fire
          - Fire
        - - The angels of the spirit of the winds
          - The winds
        - - The angels of the clouds, darkness, snow, hail and hoar-frost
          - The weathers
        - - The angels of the voices, the thunder and the lightning
          - The storm
        - - The angels of cold and heat, of winter, spring, autumn and summer
          - The turning of the seasons
        - - The angels of the abysses, of evening and night, of light, dawn and day
          - The first divisions of time
        - - The spirits of all His creatures in the heavens and on the earth
          - The whole ordering of creation, visible and invisible
    entries: []
    outro:
      - Jubilees presents creation as a single cosmos in which the invisible is made on the same day as the visible and set to govern it. That conviction is shared with Scripture. The inventory is not.
  - key: watchers
    title: The Watchers and the Giants
    navLabel: The Watchers
    tone: fallen
    display: list
    intro:
      - The angelic rebellion of Genesis 6 as Jubilees tells it — and where the demons come from.
      - "Jubilees inherits the Watcher tradition from the Enochic literature and puts it to a purpose of its own: it is the book's explanation for the existence of unclean spirits."
    entries:
      - name: The Watchers
        refs:
          - Jubilees 4–5
          - Jubilees 7
          - Genesis 6.1–4
          - Jude 6
          - 2 Peter 2.4
        hostId: HH-0051
        relatedLabel: The Watchers →
        body:
          - Angels sent to earth in connection with humanity who transgress their appointed bounds, take human wives and father the giants. The earth is filled with violence, and the Flood follows.
          - Genesis 6.1–4 supplies the underlying episode — the sons of God, the daughters of men, the Nephilim — without the narrative of rebellion that Jubilees and 1 Enoch build around it. Jude 6 and 2 Peter 2.4 speak of angels who left their proper habitation and are kept in bonds for judgment, which resonates strongly with this tradition without canonising its details.
          - Jubilees plainly belongs to the same interpretive world as 1 Enoch here, but it reworks the material for its own ends. Where 1 Enoch dwells on the forbidden knowledge the Watchers taught, Jubilees moves quickly to the consequence that interests it — what became of their offspring.
        lists:
          - label: Orthodox status
            items:
              - The Watcher tradition has genuine scriptural footholds in Genesis 6, Jude and 2 Peter
              - The detailed narrative of the descent is extra-biblical
              - Watcher is not a rank of the Church's angelic hierarchy and must not be listed as a tenth order
        fate: Bound and confined; their offspring destroyed, but not their consequences.
      - name: The giants
        meaning: the Nephilim of Genesis 6.4
        refs:
          - Jubilees 5
          - Jubilees 7.21–25
          - Genesis 6.4
        body:
          - "The offspring of the Watchers and human women, who fill the earth with violence and whose corruption brings on the Flood. Jubilees treats their destruction as complete: the giants themselves do not survive."
          - What survives is the problem. Their bodily destruction does not end the rebellion, and the next entry is the reason.
      - name: The spirits of the giants
        refs:
          - Jubilees 10.1–14
          - Jubilees 7.27
        body:
          - Jubilees preserves the tradition, shared with 1 Enoch, that the spirits of the dead giants continue as evil spirits — leading the descendants of Noah astray, afflicting and destroying them.
          - This is the book's most consequential demonological claim, and the reason it matters for reading the New Testament. It supplies an ancient explanation for what unclean spirits are and where they came from, and it stands behind a good deal of the conceptual world in which the Gospels and Tobit speak of them.
          - It is background, not doctrine. That every demon originates from a dead giant is not an Orthodox definition, and the Church has never taught the origin of the demons in these terms.
        lists:
          - label: Orthodox status
            items:
              - That unclean spirits exist, afflict and are subject to Christ is Orthodox teaching
              - That they are the spirits of dead giants is a Second Temple explanation preserved in Jubilees and 1 Enoch
              - Useful for reconstructing the background of New Testament language; not a dogmatic definition
    outro:
      - Recorded for study. Where this book's account goes beyond what Scripture says, the page says so rather than letting the two blur together.
  - key: mastema
    title: Mastema and the Hostile Spirits
    navLabel: Mastema
    tone: fallen
    display: list
    intro:
      - The adversary of Jubilees — who he is, what he is permitted, and what he is not.
      - Mastema is the book's most distinctive contribution to ancient demonology and the feature most often misreported. He is an extra-biblical adversarial figure, not an Orthodox name for the devil.
    entries:
      - name: Mastema
        meaning: from a Hebrew root of hostility or enmity
        refs:
          - Jubilees 10.8–11
          - Jubilees 17.16
          - Jubilees 18
          - Jubilees 48
          - Job 1–2
        hostId: HH-0050
        relatedLabel: Satan / the Devil →
        body:
          - The chief of the hostile spirits in Jubilees — adversary, accuser, tempter, and the organiser of demonic activity in the world. He appears at the hinges of the biblical story rather than continuously.
          - "In the binding of Isaac, where Genesis says only that God tested Abraham, Jubilees brings Mastema into the scene, giving the episode the shape later found in Job: an adversary proposes the testing and remains wholly subject to God. In the Exodus he appears as an opponent bound up with Egyptian resistance and with attempts against Moses."
          - The pattern is consistent, and it is the book's worldview in miniature. Earthly conflict and unseen conflict are one conflict; human tyrants and hostile powers belong to a single rebellion; and the adversary acts only inside limits that God has set.
          - Fr Stephen De Young has cautioned that Second Temple literature uses Satan, Mastema, Belial and Azazel in overlapping ways across different traditions, rather than intending a separate supreme demon behind each name. That caution governs this entry. Mastema functions in many respects as Satan does — which is not the same as being an Orthodox name for him.
        lists:
          - label: Orthodox status
            items:
              - That an adversary tempts, accuses and is permitted to test — within limits God sets — is scriptural and Orthodox
              - The name Mastema belongs to Jubilees and related Second Temple literature, not to Orthodox nomenclature
              - His insertion into the binding of Isaac and into the Exodus is this book's own, and is not the Church's reading of those passages
              - He should not be catalogued as a distinct demon whose existence the Church attests
      - name: The tenth part of the spirits
        refs:
          - Jubilees 10.1–14
        body:
          - In Jubilees 10 Noah prays because the evil spirits are leading his descendants astray, and God orders them bound. Mastema protests, asking that some be left under his authority, since without them he cannot exercise his office among men. God permits a tenth to remain and confines the other nine tenths.
          - The sequence is worth setting out plainly, because it is the book's answer to a real question — why unclean spirits are still at work after the Flood destroyed the giants. The Watchers transgress; the giants are born; the giants die; their spirits remain; Noah petitions; God commands confinement; Mastema petitions in turn; nine tenths are bound and a tenth remains.
          - What is theologically striking is not the arithmetic but the frame. Demonic activity here is real and dangerous, and it is bounded, permitted and numbered by God. VanderKam calls this divine decision one of the genuine puzzles of the book's demonology.
          - The tenth is an extra-biblical tradition specific to Jubilees 10. It is not a proportion the Church teaches, and nothing follows from it about the present number of the demons.
        lists:
          - label: Orthodox status
            items:
              - That the demons act only by God's permission is Orthodox teaching
              - The tenth part, and the negotiation that produces it, belong to Jubilees alone
    outro:
      - Catalogued for study, never venerated. Where the book supplies a spiritual agent that Scripture does not name in the same passage, this page marks the difference rather than harmonising it.
  - key: human-figures
    title: The Human Figures of the Narrative
    navLabel: Human Figures
    tone: neutral
    display: cards
    intro:
      - The patriarchs through whom Jubilees retells the biblical history.
      - All are commemorated by the Church and have their own pages here. In every case what Scripture says and what Jubilees adds are different things, and the link goes to the saint the Church actually honours.
    entries:
      - name: Moses
        relatedHref: saint/OS-0057
        relatedLabel: Holy Prophet Moses →
        blurb: The frame of the whole book — on Sinai, receiving the history of the world from an Angel of the Presence.
      - name: Adam
        relatedHref: saint/OS-2524
        relatedLabel: Righteous Forefather Adam →
        blurb: His creation and the garden are retold with the angelic world made explicit alongside them.
      - name: Enoch
        relatedHref: saint/OS-2532
        relatedLabel: Righteous Forefather Enoch →
        blurb: An important patriarch here, and the link to the wider Enochic tradition — but not, as in 1 and 2 Enoch, the one who narrates.
      - name: Noah
        relatedHref: saint/OS-2354
        relatedLabel: Righteous Noah →
        blurb: "Given a far larger religious role than in Genesis: he teaches righteousness, prays against the demons, and hands on angelically given knowledge. Compare 2 Peter 2.5."
      - name: Abraham
        relatedHref: saint/OS-1984
        relatedLabel: Righteous Forefather Abraham →
        blurb: His testing is retold with Mastema present in the scene, on the pattern of Job.
      - name: Isaac
        relatedHref: saint/OS-2348
        relatedLabel: Righteous Patriarch Isaac →
        blurb: The son bound on the mountain in the episode Jubilees reworks most substantially.
      - name: Jacob
        relatedHref: saint/OS-2349
        relatedLabel: Righteous Patriarch Jacob →
        blurb: Keeps the festivals long before Sinai — the clearest instance of the book's conviction that Torah reflects an order built into creation.
      - name: Joseph
        relatedHref: saint/OS-2547
        relatedLabel: Righteous Joseph the All-Comely →
        blurb: His story carries the narrative down into Egypt, where the book's account of Moses and the Exodus begins.
