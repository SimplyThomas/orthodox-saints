  - heading: Uriel
    body:
      - Uriel is the angel sent to answer Ezra, and 4 Ezra is where he is best known — the record of him in this catalogue cites this book and 1 Enoch 20 as its extra-biblical sources.
      - "The text introduces him simply: the angel who was sent, whose name was Uriel. It is worth noticing what it does not say. 4 Ezra calls him an angel, not an archangel, and later titles should not be read back into it. The name means something like fire of God or light of God, and it is not found in the protocanonical Hebrew Bible or in the New Testament."
      - "His office is the ancient one of the interpreting angel — the angelus interpres who explains a vision rather than merely delivering a message. It is the role of the interpreting angel in Daniel, of the angel who speaks with Zechariah, of Enoch's guides, and of the angel who shows John the things that must come to pass. Uriel does that work with unusual sharpness: he questions Ezra as much as he answers him."
      - As to Orthodox recognition, the record in this catalogue gives Uriel canonical status Traditional and primary source Liturgical Tradition, commemorated with the bodiless powers on 8 November — which is the accurate position. Uriel is named in Orthodox tradition among the archangels honoured with Michael and Gabriel, and that standing rests on the Church's own liturgical tradition, not on his appearance in this book. Online lists asserting a universal sevenfold or eightfold archangel roster should be checked against actual service books rather than trusted, and the Western reception of Uriel was notably more restrictive than the Eastern.
  - heading: The Impossible Questions
    body:
      - "Uriel's most characteristic move is to answer a question with a task. Ezra demands to understand why God governs as He does, and Uriel replies: weigh me the weight of fire, or measure the blast of the wind, or call back for me the day that is past."
      - Ezra objects that no one born of a woman could do such things. That is the point. If the created things Ezra lives among are beyond him, the ways of the One who made them are further beyond him still.
      - It would be easy to read this as a brush-off, and the book does not let it be one. Ezra keeps pressing, and the argument continues for chapters; the impossible questions establish the limits of the exchange without ending it. What emerges is a book willing to leave a real question standing rather than resolve it falsely — which is much of why it has been read so seriously for so long.
  - heading: Adam and the Evil Heart
    body:
      - 4 Ezra's account of Adam is its most-discussed feature and the one most often mishandled.
      - "The book says that a grain of evil seed was sown in Adam's heart from the beginning, and that what it has produced has grown in every heart since. Ezra cries out: O Adam, what have you done? For though it was you who sinned, the fall was not yours alone, but ours also who are your descendants."
      - The parallels with Paul are close enough to have provoked a century of comparison — Romans 5 on sin and death entering by one man, and 1 Corinthians 15 on Adam and the resurrection. The parallels are real and are not evidence of borrowing in either direction; both are Jewish writers of the same period working the same passage of Genesis.
      - "The essential caution is against reading either text through later Western debates. 4 Ezra is not teaching Augustinian original sin, and it should not be described as doing so. It holds two things together without systematising them: that human beings inherit a condition they did not choose, and that each of them is nonetheless answerable for what they do with it. The Torah was given, and those who received it still transgressed — which is exactly what makes Ezra's protest so bitter and so hard to dismiss."
  - heading: The Souls, the Chambers, and the Seven Orders
    body:
      - The third vision contains the fullest ancient Jewish account of what happens between death and judgment, and it is worth setting out carefully.
      - "At death the soul returns to the One who gave it. The souls of the departed are kept in chambers or storehouses — the Latin promptuaria — awaiting the last day, and the number of the righteous who must be gathered there is fixed. Those chambers are an old image with real relatives: the places where souls are separated in 1 Enoch 22, and the souls under the altar in Revelation 6 who are told to rest a little longer until their number is complete."
      - Then the passage that was cut from the Latin manuscripts and recovered in 1875. Souls that have despised the Most High pass through seven orders of torment, and souls that have kept His ways through seven orders of joy — grieving in the first case over the reproof they earned and the reward they lost, and rejoicing in the second to see the glory that awaits them, and finally beholding with confidence the face of Him whom they served.
      - Two cautions on that passage. Its imagery is apocalyptic and should not be flattened into a map of the afterlife; and the fact that there are seven numbered stages does not make them toll houses. There are no demonic accusers here, no aerial checkpoints, no examination sin by sin, no angelic advocate. The seven orders are conditions of the soul, not gates it must pass, and calling them toll houses imports a later literature this book does not contain.
      - "Beyond the intermediate state the book is clear about what follows: the earth gives up those who sleep in it, the Most High appears on the seat of judgment, and recompense follows. That sequence — an intermediate state, then resurrection, then judgment — is broadly the shape Orthodox theology also holds, from Daniel 12, John 5 and 1 Corinthians 15. The correspondence is worth noticing and is not a derivation, and this book defines nothing."
  - heading: How Few Are Saved, and Whether Any May Intercede
    body:
      - "Ezra's most anguished question is how few will be saved, and he will not be comforted about it. Uriel's answer turns on scarcity being the mark of value: gold and precious stones are rare and common clay is plentiful, and the rare thing is not made worthless by being rare."
      - Ezra is not satisfied, and says so — it would have been better for the earth not to have produced Adam, or having produced him, to have restrained him from sinning. The book lets the protest stand.
      - Then comes the exchange that was in the excised fragment. Ezra asks whether the righteous will be able to intercede for the wicked on the day of judgment — Abraham for the men of Sodom, Moses for the fathers, and the other great intercessors of Scripture. Uriel's answer is that on that day no one shall pray for another, for then everyone shall bear his own righteousness or unrighteousness.
      - This must be handled with care, because it is easily misused in both directions. The statement concerns the day of final judgment specifically, not the Church's prayer for the departed in this age, and it is one Jewish apocalypse's position rather than a ruling. Orthodox prayer for the departed rests on the Church's own liturgical and patristic tradition and is not established or overturned by a book at the edge of the canon. Note, too, that it is precisely this page that vanished from the Latin manuscripts — which tells us something about how uncomfortable later readers found it.
  - heading: The Messiah, and the Four Hundred Years
    body:
      - 4 Ezra's messianism is Jewish and it is strange, and it should not be smoothed into Christian expectation.
      - In the third vision the Messiah is revealed with those who are with him, and those who remain rejoice for a set term of years. Then the Messiah dies, and all who draw human breath; the world returns to primeval silence for seven days as at the beginning; and after that comes the resurrection, and the judgment.
      - The length of the reign varies between the versions — the Latin has four hundred years, and other witnesses give different figures. Anyone citing the number should say which version they are citing.
      - That a messianic kingdom precedes the resurrection, and that the Messiah dies at its close without any suggestion of rising, is a genuinely Jewish apocalyptic conception and is not Christian eschatology. It was read christologically by later Christians, and reading it that way requires supplying what the text does not say. It is not Orthodox end-times doctrine, and this page does not present it as such or as a source for millennial schemes.
  - heading: The Eagle, the Lion, and the Man from the Sea
    body:
      - The fifth vision shows an eagle rising from the sea with twelve wings and three heads, and further small wings, reigning over the earth with terrible dominion — until a lion comes out of the forest and rebukes it with a human voice, and the eagle is burned.
      - "Uriel's interpretation names it: the eagle is the fourth kingdom that Daniel saw, and the book says openly that it is being interpreted differently now than it was explained to Daniel. The empire is Rome, and the wings and heads are its rulers. Which ruler answers to which wing is a question on which scholars do not agree, and confident identifications should be treated with suspicion. The lion is of the seed of David, and is the Messiah who will reprove and destroy them."
      - The sixth vision shows something stranger. A wind stirs the sea, and out of it comes something like the figure of a man, who flies with the clouds of heaven; and when the assembled nations gather to make war on him, he sends out from his mouth a stream of fire and consumes them, and then gathers to himself a peaceable multitude.
      - The Daniel 7 background is unmistakable — one like a son of man coming with the clouds — and Uriel's interpretation identifies him as the one whom the Most High has been keeping for many ages, who will deliver His creation. He is bound up with the Messiah in the book's own interpretation.
      - "For a Christian reader the resonances are strong, and the discipline is the same as everywhere in this section: these are Jewish apocalyptic images drawing on Daniel and on Son of Man traditions, not predictions to be claimed. Similar imagery appears in Revelation — the beast from the sea, the sword from the mouth, the Lion of the tribe of Judah — and the safest classification is shared Jewish apocalyptic vocabulary rather than borrowing in either direction."
  - heading: The Woman Who Becomes Zion, and the Ninety-Four Books
    body:
      - "The fourth vision is the book's turning point and its most affecting scene. Ezra meets a woman weeping in a field. She tells him her story: barren thirty years, then a son granted, raised and brought to manhood — and on the night of his wedding, he fell down and died. She has come out to mourn and will not go back."
      - "Ezra rebukes her, and the rebuke is fierce: what is one son beside Zion, the mother of us all, whose sanctuary is laid waste and whose children are dead? And as he speaks, her face begins to shine, and she cries out, and the woman is no longer there — in her place stands a city with vast foundations. Uriel explains that she is Zion herself. Ezra has been made to say his own comfort aloud to somebody else, and to mean it."
      - The seventh vision closes the book. The Law is burned, and no one knows what God has done or will do; Ezra asks that the Holy Spirit be sent to him so that he may write everything again. He is given a cup of something like fire to drink, and dictates for forty days to five scribes, and ninety-four books are written.
      - "Twenty-four of them are to be published, for the worthy and the unworthy alike to read. Seventy are to be kept back and given to the wise among the people, for in them are the spring of understanding, the fountain of wisdom and the river of knowledge. The twenty-four almost certainly correspond to the traditional Jewish count of the biblical books. The seventy are the origin of a great deal of later esoteric speculation, and the honest statement is that we do not know what the author meant by them: the passage should never be used to identify surviving pseudepigrapha as the secret books, still less to argue that seventy hidden books of Scripture exist."
  - heading: The Fathers, and Modern Orthodox Discussion
    body:
      - 4 Ezra was known to early Christians, and read by them, which is part of why its status is complicated. Clement of Alexandria quotes it and calls Ezra a prophet. St Ambrose makes substantial use of Ezra traditions, drawing on the book in his own treatment of death and the soul. St Jerome, characteristically, dismissed it.
      - "The graded categories used across this section apply: explicit citation in some cases, citation without any statement of status in others, and outright rejection in Jerome's. That a Father quotes a book does not establish it as Scripture, and this page does not infer canonical status from patristic use."
      - One point is worth drawing out. Greek Christian knowledge of the book existed early, and the Greek text itself was subsequently lost, and the work is absent from the surviving Greek Orthodox Old Testament tradition. Early knowledge and later canonical absence are not in contradiction; they are the ordinary shape of how a text can be read for a while and then not received.
      - Among modern Orthodox writers the reference point is Fr Stephen De Young's 2018 essay, which treats 4 Ezra as an example of the complexity of defining the outer boundary of the Orthodox Old Testament — absent from the Greek tradition, present in the Slavonic — and commends it as worth an Orthodox Christian's attention. That is his assessment, offered as such, and is not a dogmatic statement binding anyone.
      - A sourcing note, as on the other pages in this section written from research briefs. The naming and versional history, the sevenfold structure, the canonical positions described above, Uriel's role, and the substance of the visions are reliable. Precise chapter and verse references, the details of the manuscript traditions, patristic citations and bibliographic particulars have not been checked against the critical editions, and should be verified before this profile is promoted.
  - heading: What It Can and Cannot Establish
    body:
      - It can illuminate the Jewish response to AD 70; the problem of evil argued at full strength; angelic revelation and the office of the interpreting angel; the Uriel traditions; ancient beliefs about souls between death and judgment; resurrection and judgment; Jewish messianism and its strangeness; Roman imperial symbolism read through Daniel; the relationship between Adam's sin and human responsibility; the growth of Jewish apocalyptic thought; the conceptual background of early Christianity; and — uniquely among the works in this section — the genuine diversity of Orthodox Old Testament textual traditions.
      - It cannot establish a single universal Orthodox canon list; Uriel's universal recognition on its own authority; the mechanics of the soul after death; the proportion of humanity that will be saved; an Orthodox doctrine of original sin; the toll houses; a chronology of the end; a literal four-hundred-year messianic reign; the identity of every ruler in the eagle; or the existence of seventy identifiable secret books.
    table:
      columns:
        - Commonly said
        - Status
        - What can be said
      rows:
        - - 4 Ezra and 2 Esdras are the same book
          - Not quite
          - 4 Ezra is 2 Esdras 3–14; chapters 1–2 and 15–16 are later Christian works, 5 Ezra and 6 Ezra
        - - 4 Ezra is in the Orthodox Bible
          - Depends which
          - Absent from the Greek Old Testament; present in Slavonic Bibles as 3 Esdras and among the Russian Synodal non-canonical books
        - - Orthodox and Ethiopian canons are the same on this
          - "No"
          - The Ethiopian Tewahedo Church is a separate communion with its own canonical practice; it knows the book as Ezra Sutuel
        - - 4 Ezra calls Uriel an archangel
          - "No"
          - It calls him an angel and names him. His standing among the archangels rests on Orthodox liturgical tradition, not on this book
        - - 4 Ezra teaches original sin as Augustine did
          - "No"
          - It holds inherited condition and personal responsibility together without systematising them; reading it through later Western debates distorts it
        - - The seven orders of souls are the toll houses
          - "No"
          - No accusers, no checkpoints, no examination sin by sin, no advocate — numbered stages are not tollgates
        - - It proves the Messiah reigns 400 years
          - Version-dependent
          - The Latin has four hundred; other versions differ, and the passage is Jewish apocalyptic, not Orthodox eschatology
        - - Every eagle wing is a known emperor
          - Not agreed
          - Scholars differ on the identifications; confident rosters should be treated with suspicion
        - - The seventy secret books are known apocrypha
          - Unsupported
          - We do not know what the author meant; the passage cannot be used to identify surviving texts
        - - Revelation borrowed from 4 Ezra, or the reverse
          - Not established
          - Shared Jewish apocalyptic vocabulary is the safest classification for the parallels
        - - It settles whether we may pray for the dead
          - "No"
          - Uriel's statement concerns the day of final judgment; Orthodox prayer for the departed rests on the Church's own tradition
        - - Older English 2 Esdras gives the whole text
          - "No"
          - 7.36–105 was missing from most Latin manuscripts until Bensly recovered it in 1875
