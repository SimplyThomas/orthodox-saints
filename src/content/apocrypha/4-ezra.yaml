era: c. AD 100, after the destruction of Jerusalem
canonicalStatus: Canonical boundary text · in the Slavonic Bibles
blurb: A Jewish apocalypse written after Jerusalem burned, in which Ezra argues with the angel Uriel about the justice of God — and the one work in this section that is printed in some Orthodox Bibles and absent from others.
order: 14
