  - key: uriel
    title: Uriel, the Interpreting Angel
    navLabel: Uriel
    tone: faithful
    display: list
    intro:
      - The angel sent to answer Ezra — and the book in which he is best known.
      - 4 Ezra calls him an angel and names him. It does not call him an archangel, and later titles should not be read back into it.
    entries:
      - name: Uriel
        meaning: fire of God, or light of God
        refs:
          - 4 Ezra 4.1
          - 4 Ezra 5.20
          - 4 Ezra 10.28
          - 1 Enoch 20
        hostId: HH-0013
        relatedLabel: Archangel Uriel →
        body:
          - "Introduced with great economy: the angel who was sent to Ezra, whose name was Uriel. He is the interpreter of every vision in the book, and Ezra's interlocutor through all seven."
          - His office is the ancient one of the angelus interpres — the angel who explains a vision rather than merely delivering a message. It is the role of the interpreting angel in Daniel, of the angel who speaks with Zechariah, of Enoch's guides, and of the angel who shows John what must come to pass. Uriel performs it with unusual sharpness, questioning Ezra as often as he answers him.
          - "He is not named in the protocanonical Hebrew Bible or in the New Testament. His standing in Orthodox tradition — commemorated with the bodiless powers on 8 November — rests on the Church's liturgical tradition, which is exactly how this catalogue's own record of him is classified: canonical status Traditional, primary source Liturgical Tradition."
          - Two cautions. Uriel traditions from 1 Enoch should not be imported into this book, which gives him a different role. And online lists asserting a fixed sevenfold or eightfold archangel roster recognised everywhere should be checked against actual service books; Western reception of Uriel was notably more restrictive than Eastern.
        lists:
          - label: Source register
            items:
              - Not in the protocanonical Hebrew Bible or the New Testament
              - Named in 4 Ezra as an angel — not as an archangel
              - Honoured in Orthodox liturgical tradition among the bodiless powers, on its own authority rather than this book's
      - name: The impossible questions
        refs:
          - 4 Ezra 4.5–11
          - 4 Ezra 5.36–37
        body:
          - Uriel's characteristic move is to answer a question with a task. Ezra demands to know why God governs as He does; Uriel replies — weigh me the weight of fire, or measure the blast of the wind, or call back for me the day that is past.
          - Ezra objects that no one born of woman could do such a thing. That is the answer. If the created things among which Ezra lives are already beyond him, the ways of their Maker are further beyond him still.
          - It would be easy to read this as evasion, and the book does not permit that. Ezra keeps pressing and the argument runs on for chapters; the impossible questions set the limits of the exchange without ending it. The result is a work willing to leave a real question standing rather than answer it falsely.
      - name: Ezra, who argues back
        refs:
          - 4 Ezra 3.28–36
          - 4 Ezra 7.116–126
        relatedHref: saint/OS-2569
        relatedLabel: Righteous Ezra →
        body:
          - The literary shape of the book is a human being disputing with a heavenly messenger, and not deferentially. Ezra presses Uriel on Israel's suffering and Rome's prosperity, on Adam's sin and human mortality, on the number of the saved, and on whether God's justice is what it claims to be.
          - It would have been better, he says, if the earth had not produced Adam, or having produced him had restrained him from sinning. The book lets that stand, unretracted.
          - The choice of Ezra is deliberate. He is the restorer and interpreter of the Torah, the man who brought the Law back to a people who had lost it — the right speaker for a book that ends with the Scriptures rewritten after they were burned.
  - key: souls
    title: The Souls, and the Judgment
    navLabel: The Souls
    tone: neutral
    display: list
    intro:
      - The fullest ancient Jewish account of what lies between death and judgment — including a page that was cut from the Latin Bibles for centuries.
      - "Read carefully: numbered stages are not tollgates, and apocalyptic imagery is not a map."
    entries:
      - name: The chambers of souls
        refs:
          - 4 Ezra 4.35–37
          - 4 Ezra 7.32
          - 1 Enoch 22
          - Revelation 6.9–11
        body:
          - At death the soul returns to the One who gave it, and the souls of the departed are kept in chambers or storehouses — promptuaria in the Latin — until the last day. The number of the righteous who must be gathered there is fixed, and the end waits on it being complete.
          - The image is old and has real scriptural relatives. 1 Enoch 22 has hollow places where souls are separated according to their deeds; Revelation 6 has the souls under the altar told to rest yet a little season, until the number of their fellow servants should be fulfilled.
          - Whether the chambers are places of reward or of waiting is not sharply resolved in the text, and forcing them into later categories — Heaven, Hell, Purgatory — imports vocabulary the book does not use.
      - name: The seven orders
        meaning: 4 Ezra 7.78–99 — part of the fragment missing from the Latin until 1875
        refs:
          - 4 Ezra 7.78–99
        body:
          - Souls that have despised the Most High pass through seven orders of torment; souls that have kept His ways through seven orders of joy. The wicked grieve over the reproof they earned and the reward they lost and see the glory they will not enter; the righteous rejoice to see what awaits them, and at the last behold with confidence the face of Him whom they served.
          - This passage — 7.36–105 — was missing from most Latin manuscripts, cut at some point in transmission, and recovered by Robert Bensly in 1875 from a manuscript at Amiens. Any English 2 Esdras printed before that date lacks it.
          - "Two cautions. The imagery is apocalyptic and should not be flattened into a map of the afterlife. And seven numbered stages do not make toll houses: there are no demonic accusers here, no aerial checkpoints, no examination sin by sin, no angelic advocate. These are conditions of the soul, not gates it must pass."
        lists:
          - label: Orthodox status
            items:
              - That the departed await the resurrection in a conscious intermediate state is Orthodox teaching, grounded in Scripture
              - The sevenfold enumeration is this book's own apocalyptic imagery
              - Not toll-house literature; the characteristic elements of that tradition are absent
      - name: How few are saved, and whether any may intercede
        refs:
          - 4 Ezra 7.45–61
          - 4 Ezra 7.102–115
          - Matthew 7.13–14
          - Luke 13.23–24
        body:
          - Ezra will not be comforted about how few are saved. Uriel answers that scarcity is the mark of value — gold and precious stones are rare and common clay is plentiful, and the rare thing is not made worthless by being rare. Ezra is not satisfied, and says so.
          - Then the exchange that was in the excised fragment. Ezra asks whether the righteous may intercede for the wicked on the day of judgment — Abraham for Sodom, Moses for the fathers, the great intercessors of Scripture. Uriel answers that on that day no one shall pray for another, for then everyone shall bear his own righteousness or unrighteousness.
          - This is easily misused in both directions and needs care. The statement concerns the day of final judgment specifically, not the Church's prayer for the departed in this age; and it is one Jewish apocalypse's position, not a ruling. Orthodox prayer for the departed rests on the Church's own liturgical and patristic tradition, and is neither established nor overturned by a book at the edge of the canon.
          - It is worth noticing which page vanished from the Latin manuscripts. Later readers evidently found this one hard.
  - key: messiah
    title: The Messianic Visions
    navLabel: The Messiah
    tone: neutral
    display: list
    intro:
      - An eagle that is Rome, a lion of David's seed, and a man who rises out of the sea.
      - Jewish apocalyptic imagery drawing on Daniel — read christologically by later Christians, and not to be presented as prediction.
    entries:
      - name: The messianic kingdom, and the four hundred years
        refs:
          - 4 Ezra 7.26–44
        body:
          - The Messiah is revealed with those who are with him, and those who remain rejoice for a set term of years. Then the Messiah dies, and all who draw human breath; the world returns to primeval silence for seven days as at the beginning; and afterwards comes the resurrection and the judgment.
          - The length of the reign differs between the versions — the Latin has four hundred years, and other witnesses give other figures. Anyone citing the number should say which version they are citing.
          - A messianic kingdom preceding the resurrection, closing with the Messiah's death and no suggestion of his rising, is a genuinely Jewish apocalyptic conception. It is not Christian eschatology, it is not Orthodox end-times doctrine, and it should not be used as a source for millennial schemes.
      - name: The eagle and the lion
        refs:
          - 4 Ezra 11–12
          - Daniel 7
          - Genesis 49.9
          - Revelation 5.5
        body:
          - An eagle rises from the sea with twelve wings and three heads, and reigns over the earth with terrible dominion — until a lion comes out of the forest and rebukes it with a human voice, and the eagle is burned.
          - "Uriel names it: the eagle is the fourth kingdom Daniel saw, and the book says openly that it is now being interpreted differently than it was explained to Daniel. The empire is Rome; the wings and heads are its rulers. Which ruler answers to which wing is disputed, and confident rosters should be treated with suspicion."
          - The lion is of the seed of David — the Messiah who reproves and destroys them. The Lion of the tribe of Judah in Revelation 5 draws on the same scriptural stock in Genesis 49, and the resemblance is shared vocabulary rather than borrowing.
      - name: The man from the sea
        refs:
          - 4 Ezra 13
          - Daniel 7.13–14
          - Revelation 19.15
        body:
          - A wind stirs the sea, and out of it comes something like the figure of a man, flying with the clouds of heaven. The assembled nations gather to make war on him; he sends from his mouth a stream of fire and consumes them; and then he gathers to himself a peaceable multitude.
          - The Daniel 7 background is unmistakable — one like a son of man coming with the clouds — and Uriel interprets the figure as the one whom the Most High has kept for many ages, who will deliver His creation. The book's own interpretation binds him to the Messiah.
          - For a Christian reader the resonances are strong, and the discipline is the one used throughout this section. These are Jewish apocalyptic images drawn from Daniel and the Son of Man traditions, and the parallels with Revelation — the beast from the sea, the sword from the mouth — are best classified as shared apocalyptic vocabulary rather than dependence in either direction.
      - name: The woman who becomes Zion
        refs:
          - 4 Ezra 9.38–10.59
        body:
          - Ezra meets a woman weeping in a field. Barren thirty years, then a son granted, raised and brought to manhood — and on the night of his wedding he fell down and died. She has come out to mourn and will not go back.
          - "Ezra rebukes her fiercely: what is one son beside Zion, the mother of us all, whose sanctuary is laid waste and whose children are dead? And as he speaks her face begins to shine, and she cries out, and she is no longer there — in her place stands a city with vast foundations."
          - Uriel explains that she is Zion herself. The book's consolation arrives by making Ezra say it aloud to somebody else and mean it, and it is the turning point of the whole work.
