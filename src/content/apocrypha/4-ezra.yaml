  - heading: Written After Jerusalem Burned
    body:
      - The book is dated by what it is grieving. It presupposes the destruction of the Temple, and the eagle vision's account of Roman rule points to composition near the end of the first century — a generation after AD 70.
      - The literary device is exact and worth appreciating. The author writes as Ezra the scribe, in the thirtieth year after the fall of the city — meaning, on the surface, Babylon's destruction of the first Temple. Every reader knew that Ezra belonged to the restoration that followed. Setting the questions there lets the author ask, at one remove, whether a restoration will follow this time.
      - The crisis is not only political. If Israel is God's chosen people and the Torah is His covenant, and Israel nonetheless lies in ruins while an idolatrous empire flourishes, then either the covenant has failed or God's justice is not what it seemed. That is the problem 4 Ezra exists to face, and it does not flinch from it. Ezra's complaints are given their full force, and Uriel does not always answer them.
      - Ezra himself is chosen for a reason. He is the restorer and interpreter of the Torah, the man who brought the Law back to a people who had lost it — which makes him the right speaker for a book that ends with the Scriptures being restored after they were burned. Pseudonymity of this kind is not forgery in the modern sense; it is a recognised convention, claiming a tradition's authority rather than deceiving a reader about a signature.
  - heading: Language and the Versions
    body:
      - The original is lost. Modern scholarship generally posits a Hebrew composition translated into Greek, with all the surviving versions descending from that Greek — which is itself almost entirely lost, surviving only in fragments and quotations.
      - "What survives is a wide spread of daughter versions: Latin, Syriac, Ethiopic, Georgian, Arabic in more than one form, Armenian, and Coptic evidence. The Latin is the most familiar in the West and the basis of the English 2 Esdras; the Syriac and Ethiopic are independently valuable, and the versions differ in places that matter."
      - One such place is famous. A long passage of the Latin — 7.36–105, containing the seven orders of the righteous and the wicked and the exchange about intercession — was missing from most Latin manuscripts, cut at some point in transmission, and was recovered by Robert Bensly in 1875 from a manuscript at Amiens. Older English Bibles printed 2 Esdras without it. Anyone using a pre-1875 translation is reading a book with its most theologically loaded page removed.
  - heading: Is It Orthodox Scripture?
    body:
      - The answer is genuinely complicated, and giving a simple yes or no would misrepresent it in either direction. Several distinct questions have to be separated.
      - "**Is it in the Greek Orthodox Old Testament?** No. It is absent from the Greek biblical tradition, and an Orthodox Christian reading a Greek Bible will not meet it."
      - "**Is it in Slavonic Orthodox Bibles?** Yes. It was translated into Slavonic and printed in the Ostrog Bible of 1581 and the Elizabeth Bible of 1751, numbered there as 3 Esdras. The Russian Synodal Bible carries it among the books classed as non-canonical but edifying — printed in the Bible, read as profitable, not reckoned among the canonical Scriptures."
      - "**Is it in the Ethiopian tradition?** The Ethiopian Orthodox Tewahedo Church knows it as Ezra Sutuel and accords it a place in its broader canon. That is a separate communion with a distinct canonical practice, and it should not be folded into Eastern Orthodox usage."
      - "**Was it read liturgically?** No evidence supports Byzantine lectionary use."
      - "**Is it doctrinally authoritative?** No. Nothing in it establishes Orthodox teaching, and this page treats none of its distinctive claims as doctrine."
      - 'The categories worth keeping apart are: present in a biblical manuscript; reckoned canonical; classed as edifying or anagignoskomenon; printed in an appendix; read in the services; and binding as doctrine. 4 Ezra occupies different positions on that list in different traditions, and "the Orthodox canon" is not a single table of contents that has always been the same everywhere.'
      - Fr Stephen De Young's 2018 essay uses the book for exactly this purpose — as the clearest example of how the outer boundary of the Orthodox Old Testament varies by language and manuscript tradition, absent from the Greek and present in the Slavonic. That framing is why this site tags it as a canonical boundary text rather than grouping it with works that were simply never in any Orthodox Bible.
  - heading: The Seven Visions
    body:
      - The book divides into seven revelations, the first three dialogues with Uriel and the later ones increasingly visionary. The turn comes at the fourth, where argument gives way to sight.
