  - heading: 4 Ezra, 5 Ezra, and 6 Ezra
    body:
      - What English Bibles call 2 Esdras is three works bound together, of different origins and different centuries. Using the Christian chapters to reconstruct the theology of the Jewish apocalypse is one of the commonest errors made with this book.
    table:
      columns:
        - ""
        - Chapters in 2 Esdras
        - Origin
        - Character
      rows:
        - - 5 Ezra
          - 1–2
          - Christian, later than 4 Ezra
          - Israel rejected and the Church called in its place; explicitly Christian in outlook
        - - 4 Ezra
          - 3–14
          - Jewish, c. AD 100
          - "The apocalypse: seven visions, Uriel, the problem of divine justice, judgment, the Messiah, the restored books"
        - - 6 Ezra
