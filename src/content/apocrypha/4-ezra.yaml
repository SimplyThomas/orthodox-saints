    intro:
      - Three arguments with an angel, then four things seen.
      - The turn comes at the fourth vision, where Ezra stops debating and begins to see — and where the book's own consolation arrives by way of a woman weeping in a field.
    table:
      columns:
        - ""
        - Chapters
        - What happens
      rows:
        - - First
          - 3.1–5.20
          - Ezra mourns Zion and asks why Babylon prospers; Uriel replies with the impossible questions
        - - Second
          - 5.21–6.34
          - Why Israel is given to the nations; the signs of the end
        - - Third
          - 6.35–9.25
          - Adam's evil heart; the messianic kingdom and the Messiah's death; resurrection and judgment; the chambers of souls and the seven orders; how few are saved; whether any may intercede
        - - Fourth
          - 9.26–10.59
          - The woman mourning her only son, who is transfigured before Ezra into the city of Zion
        - - Fifth
          - 11.1–12.51
          - The eagle of twelve wings and three heads — Rome, Daniel's fourth kingdom — rebuked by a lion of David's seed
        - - Sixth
          - "13"
          - The man who rises from the sea, flies with the clouds, and consumes the assembled nations with fire from his mouth
        - - Seventh
          - "14"
          - "The burned Law restored: Ezra drinks a cup like fire and dictates ninety-four books in forty days"
