overview:
  - 4 Ezra is the most theologically serious book in this section, and the only one whose place in the Orthodox Bible is a real question rather than a settled no.
  - It was written after the Romans burned Jerusalem, most likely around the end of the first century, by a Jewish author in agony over what had happened. He sets his questions in the mouth of Ezra the scribe, thirty years after the destruction of the *first* Temple — a disguise that lets him ask about his own catastrophe at one remove. And the questions are not pious ones. Israel sinned, yes; but Babylon sinned worse, and prospers. Why does God let a more wicked nation destroy a less wicked one? If Adam's transgression left an evil heart in all his descendants, how are they to be blamed for what they cannot escape? Why are so few saved?
  - The angel Uriel is sent to answer him, and the book is largely their argument — seven visions in which Ezra presses and Uriel replies, sometimes with revelation and sometimes by asking Ezra to weigh fire or measure wind. Along the way it gives one of the fullest ancient accounts of what happens to souls between death and judgment, a messianic kingdom that ends in the Messiah's death, an eagle that is Rome, a mourning woman who turns into the city of Zion, a man who rises out of the sea, and Ezra dictating ninety-four books to restore the Scriptures that were burned.
  - The naming is a genuine tangle and this page begins by untangling it. 4 Ezra is the Jewish apocalypse; in most English Bibles it is 2 Esdras chapters 3–14, with chapters 1–2 and 15–16 being later Christian compositions that scholars call 5 Ezra and 6 Ezra. In Slavonic Bibles the same book is numbered 3 Esdras. A translation labelled 2 Esdras will usually contain more than 4 Ezra.
  - "Its canonical status is the reason it carries a different tag on this site from everything around it. It is absent from the Greek Orthodox Old Testament — and it stands in the Slavonic Bibles, in the Ostrog and Elizabeth editions and among the non-canonical books of the Russian Synodal Bible, and in the Ethiopian tradition as Ezra Sutuel. Fr Stephen De Young uses it precisely as an example of how the outer boundary of the Orthodox Old Testament differs by language and manuscript tradition. So the honest label is not apocryphal but something narrower: a text at the edge, which an Orthodox Christian with a Slavonic Bible may well have read and one with a Greek Bible will not have."
sections:
  - heading: Untangling Ezra and Esdras
    body:
      - More confusion attends the naming of these books than any other question about them, and it has to be cleared before anything else can be said.
      - The root of it is that Ezra and Nehemiah, the Greek 1 Esdras, and this apocalypse were numbered differently in different traditions, so that the same title means different books depending on which Bible is open. The table below is the one to keep.
      - "The essential point for this page: **4 Ezra is the Jewish apocalypse**, corresponding to chapters 3–14 of what most English Bibles print as 2 Esdras. A translation labelled 2 Esdras will usually contain more than 4 Ezra, and material quoted from its opening or closing chapters does not belong to the Jewish author at all."
