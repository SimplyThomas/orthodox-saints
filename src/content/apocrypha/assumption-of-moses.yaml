  - key: dispute
    title: The Dispute Over the Body of Moses
    navLabel: The Dispute
    tone: neutral
    display: list
    intro:
      - The scene this book is famous for — which the surviving manuscript does not contain.
      - Everything below comes from Jude 9, from the early Christian writers who tied that verse to a work of this name, and from modern reconstruction. The text itself breaks off before Moses dies. Read the registers, not a merged story.
    entries:
      - name: The Archangel Michael
        refs:
          - Jude 9
          - Daniel 10.13, 21
          - Daniel 12.1
          - Revelation 12.7
          - Zechariah 3.1–2
        hostId: HH-0010
        relatedLabel: Archangel Michael →
        body:
          - Jude says that Michael, contending with the devil in a dispute about the body of Moses, did not dare bring a reviling accusation against him, but said, "The Lord rebuke you."
          - The emphasis is easy to miss and is the most valuable thing this tradition adds to Michael's record. He does not pronounce judgment. Even the greatest of the angels does not act on his own authority, does not possess divine authority intrinsically, and exercises God's authority obediently — which is exactly what distinguishes Orthodox angelology from mythologies of competing divine powers. Michael prevails by obedience.
          - The formula itself echoes Zechariah 3, where Satan accuses Joshua the High Priest and the Lord rebukes him in nearly the same words. Ryan Stokes has argued that Jude's tradition should be read partly against that background — a heavenly accusation, a righteous man, an adversary challenging his standing, a heavenly defender, and God's rebuke.
          - "The episode fits Michael's canonical portrayal precisely: the prince who contends with hostile powers in Daniel 10, who stands for God's people in Daniel 12, who fights the dragon in Revelation 12. Defender of God's people against the hostile powers, in every case."
        lists:
          - label: Source register
            items:
              - Holy Scripture — Jude 9 names Michael, the devil, the body of Moses, and the rebuke
              - Extra-biblical — the narrative explaining the dispute is not preserved anywhere
              - "On Michael's own record this belongs under a heading found nowhere else: an extra-biblical tradition explicitly referenced in Scripture"
      - name: The devil
        refs:
          - Jude 9
          - Genesis 3.14
          - Zechariah 3.1–2
        hostId: HH-0050
        relatedLabel: Satan / the Devil →
        body:
          - Why he wanted the body is unknown, because the passage explaining it is lost. Three answers are current and should be kept labelled rather than blended.
          - The burial reconstruction, associated with Richard Bauckham, has Satan accuse Moses of being a murderer — he killed the Egyptian in Exodus 2 — and claim on that ground that Moses does not deserve honourable burial. Influential, drawn from later patristic references and Jude's wording, and unverifiable from the lost text.
          - "The bodily-assumption reconstruction, argued by Ryan Stokes, has the dispute turn on whether Moses' human body could enter God's presence at all: Michael defending the assumption, the devil challenging Moses' fitness for heaven."
          - Fr Stephen De Young reads it differently again. Genesis 3 curses the serpent to eat dust; humans are formed from dust and return to it; so dust-eating stands for death, corruption and the devil's dominion over the dead. When Moses dies the devil comes to claim the body for corruption, and Michael opposes him. The dispute is then between corruption and incorruption.
        lists:
          - label: Source register
            items:
              - Holy Scripture — that the devil disputed about the body, and was rebuked
              - Reconstruction — every account of his motive, without exception
              - Orthodox interpretation — Fr Stephen De Young's reading of the claim as a claim upon death itself
      - name: The body of Moses
        refs:
          - Jude 9
          - Deuteronomy 34.5–6
          - Matthew 17.1–8
          - Acts 13.35–37
        relatedHref: saint/OS-0057
        relatedLabel: Holy Prophet Moses →
        body:
          - Deuteronomy 34.5–6 is where the question starts. Moses dies in Moab; "he buried him" in a valley; and no one knows his grave. God is the only obvious antecedent of that verb, God appears to take responsibility for the body, and the grave stays unknown. Fr Stephen De Young notes that the Hebrew verb can carry the broader sense of caring for or disposing of a body rather than digging a grave — his interpretation, and the canonical text nowhere says the body was taken into heaven.
          - The Transfiguration sharpens it. Moses and Elijah both appear with Christ, yet Elijah was taken bodily and Moses had died. Fr Stephen argues that the assumption tradition explains how ancient readers could picture Moses visibly present beside him — again interpretation, since the Gospel does not explain it.
          - "The theological weight of Jude's wording is in the noun. Not Moses' soul: his body. If salvation were an immortal soul escaping the flesh, there would be nothing for an archangel and a devil to contest over a corpse. The body still belongs to the person, and the person is destined for resurrection — which is why this tradition connects, for Fr Stephen, with Christ's incorrupt body, with the incorrupt relics of the saints, and with the Orthodox refusal of a purely disembodied afterlife."
          - An assumption is not an ascension. An ascension takes a living person up — Enoch, Elijah. An assumption follows death, and is something like an anticipated bodily resurrection. Moses, in this tradition, belongs to the second.
    outro:
      - The Church has defined no dogma here. Deuteronomy is mysterious, the Transfiguration is suggestive, Jude is explicit about the dispute and silent about everything else, and the book that might have told the rest is broken. This page leaves it there.
