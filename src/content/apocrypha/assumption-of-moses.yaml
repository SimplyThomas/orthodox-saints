    intro:
      - Chapter 10, where God rises from His throne and the rulers of the nations lose their places.
      - The judgment here is not merely political. It falls on the spiritual powers standing behind the idols — and the righteous are exalted into what they forfeit.
    entries:
      - name: The gods of the nations
        refs:
          - Assumption of Moses 10
          - Psalm 81 (82)
          - Deuteronomy 32.8–9
          - Daniel 7
          - 1 Corinthians 6.3
        hostId: HH-0050
        relatedLabel: Satan / the Devil →
        body:
          - God rises from His throne to judge; the cosmos is shaken; the powers associated with the sun, the moon, the stars, the nations and their idols are defeated; the devil's power comes to an end and sorrow disappears.
          - Fr Stephen and Fr Andrew Damick read the passage through Psalm 81 (82), where God stands in the divine council and judges the gods for injustice, and which ends "Arise, O God, judge the earth". This book has God arising in exactly that way. Behind the idols of the nations stand rebellious spiritual powers, and it is they who are judged.
          - The related record linked here is the adversary's; this book names no individual demon, and none should be invented for it.
        lists:
          - label: Orthodox status
            items:
              - That spiritual powers stand behind the idols of the nations is scriptural — Deuteronomy 32, Psalm 81 (82), 1 Corinthians 10
              - The particular apocalyptic scene of chapter 10 belongs to this book
              - Its imagery is visionary and should not be read as a literal cosmology
      - name: The righteous raised like stars
        refs:
          - Assumption of Moses 10
          - Daniel 12.3
          - Daniel 8.10
          - Job 38.7
          - Revelation 12.1
          - 1 Corinthians 6.3
        body:
          - The text says the righteous will be raised to the heights and established like the stars — and in this literature stars regularly stand for heavenly beings.
          - 'Fr Stephen De Young reads it as the righteous taking their place among the heavenly host, which puts this book alongside the Ascension of Isaiah as a witness to the same tradition: faithful human beings finally occupying the places rebellious heavenly rulers gave up. It is the pattern of Daniel 7, where the beasts lose dominion and the saints receive the kingdom, and of "we shall judge angels".'
          - Salvation in this book therefore has a cosmic shape. The rebellious powers fall; glorified humanity rises; and the righteous do not escape creation but are given their intended place within it.
    outro:
      - Recorded for study. The book names no demons and supplies no hierarchy — what it supplies is a judgment scene, and this page does not extract a catalogue from it.
  - key: figures
    title: The Figures of the Book and the Tradition
    navLabel: The Figures
    tone: neutral
    display: cards
    intro:
      - The people of the surviving text, and those the tradition draws in.
      - "Taxo alone is unlinked, and deliberately: his identity is genuinely unknown, and the common identifications are guesses."
    entries:
      - name: Moses
        relatedHref: saint/OS-0057
        relatedLabel: Holy Prophet Moses →
        blurb: Speaker of the testament, and — in the lost ending and in Jude — the man whose body is contested. Here he also stands as a literary embodiment of the Torah itself.
      - name: Joshua
        relatedHref: saint/OS-0090
        relatedLabel: Righteous Joshua, Son of Nun →
        blurb: The successor Moses appoints and instructs; the whole surviving work is addressed to him.
      - name: Taxo
        blurb: An enigmatic righteous figure who, with his seven sons, chooses death rather than apostasy. His identity and even the sense of his name remain disputed — he is not Elijah, a known Maccabee, or the Messiah.
      - name: Jude
        relatedHref: saint/OS-1384
        relatedLabel: Apostle Jude the Brother of the Lord →
        blurb: The apostle who tells the Michael story in a single verse as though everyone already knew it — and so preserved it when the book that explained it was lost.
      - name: Elijah
        relatedHref: saint/OS-0056
        relatedLabel: Holy Prophet Elijah →
        blurb: Taken bodily into heaven without dying — an ascension rather than an assumption, and the contrast against which Moses' case is argued. Both appear at the Transfiguration.
      - name: Enoch
        relatedHref: saint/OS-2532
        relatedLabel: Righteous Forefather Enoch →
        blurb: The other man Scripture says was taken. With Elijah he sets the pattern this tradition works from, and he is the hero of two other books in this section.
