overview:
  - This is the one book in this section whose most famous scene is not in it.
  - What survives is an ancient Jewish work of about the beginning of the first century AD, presenting Moses' last instruction to Joshua before his death and running through Israel's future — its faithfulness and corruption, its persecution under foreign rulers, the judgment of God, and the exaltation of His people. It survives in a single incomplete Latin manuscript, and it breaks off before Moses dies.
  - "Its importance for a catalogue of the heavenly hosts comes from what is missing. An ancient tradition connected with a work of this name told how the Archangel Michael disputed with the devil over the body of Moses — and that tradition is in Scripture. Jude 9 tells it as though the readers already know it, and explains none of it: not why Michael is there, not why the devil wants the body, not why the body matters, not how it ends. Early Christian writers associated Jude's reference with an Assumption of Moses. The surviving manuscript ends too soon to contain it."
  - That gap has to be stated plainly, because a great deal written about this book confidently reconstructs a story nobody now possesses. The surviving text contains no dispute with Satan, no death of Moses, no burial, and no assumption. Those would have stood in the lost portion — if they belonged to this work at all. Scholars differ over how the surviving Testament of Moses, the lost Assumption of Moses, and the tradition Jude cites actually relate.
  - "What is not in doubt is the antiquity of the tradition itself, and this makes the book unlike anything else gathered here. Elsewhere in this section a work preserves material Scripture does not carry. Here the reverse is true: the book is broken and the tradition survives inside the New Testament. It is not canonical Orthodox Scripture. The Michael-and-Moses tradition it is associated with is canonically referenced by an apostle."
sections:
  - heading: Assumption, or Testament?
    body:
      - The surviving manuscript has no preserved title, and modern editors have called the work by both names.
      - Testament of Moses fits what actually survives. The text belongs unmistakably to the testament genre — a biblical hero approaching death gives final instruction and prophetic teaching to his successor, here Moses to Joshua, much as in the Testaments of the Twelve Patriarchs. Moses appoints Joshua, predicts and interprets Israel's coming history, exhorts him to faithfulness, and prepares for his own death. Many modern scholars therefore use this title, Charlesworth's edition among them.
      - Assumption of Moses is what ancient Christians called a work they knew. A quotation preserved by Gelasius of Cyzicus and attributed to the Assumption corresponds to material in the surviving Latin text, and Gelasius elsewhere associates the Michael-and-devil tradition with the Assumption as well. Origen likewise mentions an Ascension or Assumption of Moses when discussing that dispute. So the surviving text is related somehow to the literature ancient Christians called by that name.
      - This page uses both, and one detail of sourcing is worth recording. The Lord of Spirits transcript says the surviving text "labels itself the Assumption of Moses". Critical descriptions of the manuscript state that its title is lost. This page follows the manuscript evidence — untitled — while explaining why Fr Stephen De Young and others choose the title they do.
  - heading: Two Books, or One?
    body:
      - It gets harder, because ancient book lists sometimes name both. Fr Stephen De Young points to the Stichometry of St Nikephoros, Patriarch of Constantinople, which lists a Testament of Moses and an Assumption of Moses separately and assigns them different lengths — from which he argues that St Nikephoros knew two distinct Greek texts in Constantinople.
      - Three possibilities remain open. The surviving testament may have continued into an assumption narrative, its lost final portion carrying Moses' death, Michael, the devil and the bodily assumption. Or the surviving Latin manuscript may be the Testament of Moses, with a separate and wholly lost Assumption of Moses containing the dispute. Or the two may be related literary traditions, one expanded, rewritten or derived from the other.
      - Modern scholarship has not settled this. The site therefore uses Assumption of Moses / Testament of Moses, and explains the problem before making any use of the work — which is what this section of the page exists to do.
  - heading: Date, Origin, and Language
    body:
      - The dating is comparatively secure, and this is a Jewish rather than a Christian work. It is widely placed in the early first century AD, probably in Judaea; Johannes Tromp describes it as a first-century Jewish composition, and Fr Stephen De Young puts it at approximately the beginning of the first century — possibly within Christ's earthly lifetime, but before any distinctively Christian material.
      - The reason is internal. The narrated history runs through the monarchy, the exile, the restoration, Hellenistic rule, the Maccabean conflict, Hasmonean corruption and Roman domination, and appears to approach its author's own time. There is no clearly Christian material anywhere in the surviving text.
      - The sole manuscript is Latin, and the Latin appears to translate a Greek text; many scholars further reconstruct a Hebrew or Aramaic composition behind the Greek. Fr Stephen summarises the chain as Hebrew, then Greek, then Latin. The Semitic original cannot be demonstrated with certainty, so the form used here is a probable Semitic original, through Greek, to Latin.
  - heading: One Manuscript, and What Is Lost
    body:
      - "There is exactly one witness: a Latin palimpsest in the Biblioteca Ambrosiana in Milan, dating to about the fifth or sixth century, discovered and published by Antonio Maria Ceriani in 1861."
      - A palimpsest is a manuscript whose original writing was scraped away so the material could be reused, and this one was reused in antiquity or the early medieval period, so the underlying text had to be recovered. Work on the codex shows that it originally contained a Latin version of Jubilees as well as the work now called the Testament or Assumption of Moses — the two books in this section sharing a single ruined book.
      - The loss is not marginal. Estimates run from roughly a third to about a half of the original work; Fr Stephen describes the last third as missing. The surviving text breaks off abruptly, and what it breaks off before is the climax — Moses' death, and whatever happened to his body afterwards.
      - The episode for which this book is famous is precisely the part that does not survive. Everything on this page about Michael and the devil is therefore drawn from Jude, from the early Christian writers who associated the tradition with a work of this name, and from modern reconstruction — never from the surviving text, which says nothing about it.
  - heading: Moses to Joshua, and Moses as Torah
    body:
      - "The surviving work opens with Moses near death, giving his final instruction to Joshua, whom God has chosen to succeed him, and surveying what is to come: conquest, apostasy, kings, destruction, exile, restoration, a corrupt priesthood, Hellenistic persecution, Hasmonean rule, Roman domination, escalating wickedness, a final persecution, and then God's intervention and a cosmic judgment."
      - Calling this prophecy in the modern predictive sense misleads. It is apocalyptic interpretation of history spoken in Moses' voice, and it reads Israel's past through the covenantal pattern of Deuteronomy — faithfulness bringing blessing, apostasy bringing judgment, repentance bringing restoration.
      - "Fr Stephen De Young makes a useful point about why the book does this. Moses here is a literary embodiment of the Torah itself: the author is not trying to convince anyone that the historical Moses secretly foretold each later political development in detail, but placing Israel's history in Moses' mouth because the book judges that history by Torah. It is the same procedure as the Deuteronomistic History, where kings and catastrophes are weighed on the scale of covenant faithfulness. Worth saying plainly, since pseudepigraphal literature is so often mistaken for ancient forgery."
  - heading: Moses' Death in Deuteronomy
    body:
      - The canonical starting point is Deuteronomy 34.5–6. Moses dies in the land of Moab; "he buried him" in a valley there; and no one knows his grave to this day.
      - Three things about that passage are unusual, and they are what the later tradition grows in. God is the only obvious antecedent of "he buried him". God therefore appears to take responsibility for Moses' body. And the grave remains unknown.
      - Fr Stephen De Young notes that the Hebrew verb ordinarily rendered "buried" can carry the broader sense of caring for or disposing of a dead body, rather than personally digging a grave, and reads Deuteronomy as leaving room for the ancient tradition that God took charge of Moses' body. That is his interpretation, recorded as such.
      - What the canonical text does not say, and must not be made to say, is that Moses' body was taken into heaven.
  - heading: Jude 9 — the Tradition Inside Scripture
    body:
      - Jude 9 says that Michael the archangel, contending with the devil in a dispute about the body of Moses, did not dare bring a reviling accusation against him, but said, "The Lord rebuke you."
      - That last phrase is itself an echo. In Zechariah 3, Satan stands to accuse Joshua the High Priest before the Angel of the Lord, and the Lord rebukes him in almost the same words. Ryan Stokes has argued that Jude's tradition should be read partly against that background, so that several ancient motifs may be combined in it — a heavenly accusation, a righteous man, Satan challenging his standing, a heavenly defender, God's rebuke, and vindication.
      - The registers are worth laying out side by side, because almost every error made about this material comes from sliding between them.
    table:
      columns:
        - Register
        - Source
        - What it actually says
      rows:
        - - Holy Scripture
          - Jude 9
          - Michael, disputing with the devil about the body of Moses, brought no reviling accusation but said "The Lord rebuke you"
        - - Holy Scripture
          - Deuteronomy 34.5–6
          - Moses dies in Moab; "he buried him" in a valley; no one knows his grave to this day
        - - Holy Scripture
          - Zechariah 3.1–2
          - Satan accuses Joshua the High Priest, and the Lord rebukes him in nearly the same formula
        - - Extra-biblical tradition
          - An Assumption of Moses
          - Early Christian writers associate Jude's story with a work of that name. The surviving manuscript breaks off before Moses dies, so the scene is not in it
        - - Reconstruction
          - Bauckham; Stokes
          - Proposals that Satan accused Moses as a murderer, or that the dispute concerned whether Moses' body could enter God's presence. Neither is preserved
        - - Orthodox interpretation
          - Fr Stephen De Young
          - Reads the dispute as a conflict over death and corruption — the devil claiming the dead body, Michael opposing the claim
  - heading: Did Jude Quote This Book?
    body:
      - Possibly — and it cannot be proved.
      - "Early Christian writers connect Jude 9 with a work called the Assumption of Moses, which is real evidence. Against treating that as settled: the surviving manuscript lacks the scene, the relevant ending is lost, the tradition may well be older than any written work, and Jude may know it independently of any book at all."
      - Fr Stephen De Young is careful here, saying that we cannot know for certain that Jude refers to the written Assumption of Moses, and that he more likely refers to the broader tradition preserved in or associated with it. That is how this page presents it.
      - "The useful label for cases like this is a canonical reference to an extra-biblical tradition — a category that would also cover Jude's use of 1 Enoch a few verses later, and which keeps the honest shape of the evidence: the apostle vouches for the tradition, not for the book."
  - heading: Why the Devil Claimed the Body
    body:
      - Nobody knows, because the passage explaining it is lost. Three answers are current, and they should be labelled rather than merged.
      - The burial reconstruction, associated with Richard Bauckham among others, holds that Satan accused Moses of being a murderer — he killed the Egyptian in Exodus 2 — and claimed on that ground that Moses did not deserve honourable burial. Michael declines to answer the accusation on his own authority and says "The Lord rebuke you". It draws on later patristic references and on Jude's wording, and remains influential; it cannot be verified from the lost text.
      - The bodily-assumption reconstruction, argued by Ryan Stokes, holds that the dispute was over whether Moses' human body could enter God's heavenly presence at all — Michael defending the assumption, the devil challenging Moses' fitness for heaven. On this reading the quarrel is about glorification rather than burial.
      - Fr Stephen De Young offers a third and distinctly Orthodox reading. Genesis 3 curses the serpent to eat dust; human beings are formed from dust and return to it; so the serpent's dust-eating stands for death, corruption, decomposition, and the devil's dominion over the dead. When Moses dies the devil comes to claim his body for corruption, and Michael opposes the claim. The dispute is then between corruption and incorruption — and it is over Moses' body, not his soul, which Fr Stephen emphasises.
      - That last reading carries real anthropological weight, and it is his theological reading rather than a historical reconstruction of Jude. If salvation were an immortal soul escaping a body, there would be little for an archangel and a devil to contest over a corpse. Jude's wording assumes that the body still belongs to the person, and that the person is destined for resurrection — which is why Fr Stephen connects it with Christ's incorrupt body, with Acts 13, with the incorrupt relics of the saints, and with the Orthodox refusal of a purely disembodied afterlife.
  - heading: Michael, and the Refusal to Judge
    body:
      - Jude's emphasis falls somewhere easy to miss. Michael does not pronounce a reviling judgment on the devil. He says, "The Lord rebuke you."
      - This is an important point of Orthodox angelology, and the strongest thing this tradition contributes to Michael's profile. Even the greatest of the angels does not act independently, does not possess divine authority intrinsically, and exercises God's authority obediently. Michael prevails precisely by obedience — which is what distinguishes Orthodox angelology from mythologies of competing divine powers.
      - "The episode fits his canonical portrayal exactly: the heavenly prince who contends with hostile spiritual powers in Daniel 10, who stands for God's people in the eschatological conflict of Daniel 12, who fights the dragon in Revelation 12, and who here confronts the devil over the body of a servant of God. Defender of God's people against the hostile powers, in every case."
      - On Michael's own record this belongs under an unusual heading — an extra-biblical tradition explicitly referenced in Scripture. The narrative is extra-biblical; the reference is apostolic.
  - heading: Assumption, Ascension, and the Transfiguration
    body:
      - Fr Stephen De Young and Fr Andrew Damick draw a distinction worth keeping. An ascension is a living person taken bodily into heaven — Enoch, Elijah. An assumption is a person who dies and whose body is afterwards taken, which makes it something like an anticipated bodily resurrection. Moses, in this tradition, belongs to the second. The terminology is useful historically and should not be imposed on every ancient author.
      - The Transfiguration is where the question becomes pointed. Moses and Elijah both appear with Christ on Tabor — but Elijah was believed to have been taken bodily into heaven, while Moses had died. Fr Stephen argues that the assumption tradition explains how ancient readers could understand Moses as visibly present beside him.
      - That is Orthodox interpretation and not a statement of the Gospel text, which nowhere explains the metaphysics of Moses' appearance and nowhere says that he was bodily assumed.
  - heading: The Judgment of Chapter 10
    body:
      - The surviving text turns sharply apocalyptic at chapter 10. God rises from His throne to judge; the cosmos is shaken; the powers associated with the sun, the moon, the stars, the nations and their idols are defeated; and the righteous are exalted.
      - 'Fr Stephen and Fr Andrew read the passage through Psalm 81 (82), which ends "Arise, O God, judge the earth" — and where God stands in the divine council and judges the gods for injustice. The Assumption has God rising in the same way, and the judgment that follows is not merely political: it falls on the spiritual rulers of the nations. Behind the idols stand rebellious powers, and at the end they lose their positions, the heavenly lights are shaken, and the righteous are exalted into their places.'
      - The text says the righteous will be raised to the heights and established like the stars — and in this literature stars regularly stand for heavenly beings, as in Daniel 8 and 12.3, Job 38 and Revelation 12. Fr Stephen reads it as the righteous taking their place among the heavenly host.
      - "So this book joins the Ascension of Isaiah in witnessing to the tradition that faithful human beings finally replace rebellious heavenly rulers — the pattern of Daniel 7, where the beasts lose dominion and the saints receive the kingdom, of 1 Corinthians 6.3, and of the saints reigning with Christ. Salvation has a cosmic shape: the rebellious powers fall, and glorified humanity rises."
  - heading: Taxo and His Seven Sons
    body:
      - In a time of terrible persecution a figure called Taxo gathers his seven sons and tells them that rather than transgress the commandments they will die. They choose death over apostasy, and God's own intervention follows.
      - "The pattern resembles the martyrdom traditions of the persecution under Antiochus IV, and above all 2 Maccabees 7, where a mother and her seven sons die rather than abandon the Torah. It carries one of the book's central convictions: the righteous do not overcome cosmic evil by ordinary political power. God rises, and God judges."
      - Who Taxo is, and even what the name means, remain heavily disputed — Edna Israeli's study shows just how unsettled the question is. Proposals have connected him with priestly figures, with historical resistance movements, with eschatological messengers, and with coded or symbolic names.
      - He should therefore not be casually identified with Elijah, with a particular Maccabee, with the Messiah, or with any known priest. He is an enigmatic righteous figure who, with his seven sons, chooses covenant fidelity and death rather than apostasy, and his identity is unknown.
  - heading: Canonicity, the Fathers, and St Nikephoros
    body:
      - The work is not canonical Orthodox Scripture. What is canonical is Jude's reference to the tradition — which is a different and more interesting statement than can be made about anything else in this section.
      - Ancient Christian knowledge of the material is well attested. Clement of Alexandria associates the Jude 9 tradition with Moses' assumption; Origen refers explicitly to an Ascension of Moses when discussing the dispute between Michael and the devil; Gelasius of Cyzicus associates both material found in the surviving text and the Michael episode with an Assumption of Moses. These testimonies establish that early Christians connected Jude's unexplained reference with Moses apocrypha. They do not establish any modern reconstruction of the missing ending.
      - The Stichometry of St Nikephoros of Constantinople, in the ninth century, lists books by their ecclesiastical reading category, and on Fr Stephen's reading gives both a Testament and an Assumption of Moses with different lengths — evidence that Greek copies of two Moses pseudepigrapha were still known in Constantinople centuries after composition. Which is real evidence for Orthodox literary preservation, and no evidence at all for canonisation.
      - One liturgical resonance is worth recording with care. Fr Stephen finds the eschatology of chapter 10 — God arising, judging the spiritual rulers, crushing the hostile powers, exalting the righteous — close to the way Psalm 81 (82) is understood in Orthodox Holy Saturday tradition. That is a thematic connection. The Holy Saturday service was not copied from this book; the canonical Psalm is its foundation.
      - Where all this leaves the tradition about Moses' body is genuinely open, and the Church has not closed it. Deuteronomy treats his burial mysteriously; he appears bodily at the Transfiguration; Jude refers canonically to Michael and the devil contesting his body; the Fathers knew the assumption tradition. That is a good deal more than random apocryphal speculation, and it is still less explicit than the bodily ascension of Elijah. Orthodoxy has defined no dogma requiring the faithful to affirm the lost narrative.
  - heading: What It Can and Cannot Establish
    body:
      - It can help reconstruct Jewish eschatology around the time of Christ; the covenantal interpretation of history; belief in heavenly powers standing behind the nations; divine-council traditions and cosmic judgment; the glorification of the righteous; early traditions about Moses' death; the background of Jude 9; early Christian knowledge of Moses traditions; Michael's role as defender of God's people; and ancient understandings of bodily resurrection and incorruption.
      - It cannot establish the lost story of Moses' assumption; why exactly Satan claimed the body; that Moses underwent bodily assumption in the manner later reconstructed; that Jude quoted this surviving book; an Orthodox doctrine about Moses' bodily state; the identity of Taxo; or a literal reading of its eschatological imagery.
      - This is the book in this section where the discipline matters most, because the missing third invites exactly the kind of confident filling-in that the rest of the site exists to avoid. The table applies it to the claims most often repeated.
    table:
      columns:
        - Commonly said
        - Status
        - What can be said
      rows:
        - - We have the Assumption of Moses, and it tells how Michael fought Satan
          - Incorrect
          - The surviving manuscript does not contain that scene; it breaks off before Moses' death
        - - Jude quotes the Assumption of Moses
          - Too certain
          - Jude clearly knows the tradition; direct dependence on the surviving work cannot be established
        - - Michael fought Satan in physical combat over the corpse
          - Not stated by Jude
          - Jude says they disputed. Later art may show a confrontation; the text does not
        - - Satan wanted Moses because Moses murdered the Egyptian
          - A reconstruction
          - Associated especially with Bauckham; it is not preserved text
        - - We know why Satan claimed Moses
          - "False"
          - The narrative explaining the dispute is lost
        - - The Assumption proves Moses never died
          - Incorrect
          - An assumption tradition presupposes that he died and his body was afterwards taken
        - - Deuteronomy says Moses went bodily to heaven
          - "False"
          - Deuteronomy 34 describes his death and God's unusual involvement with his body, and no more
        - - Orthodoxy dogmatically teaches that Moses was bodily assumed
          - Too strong
          - An ancient tradition with real biblical and patristic connections, never defined as dogma
        - - The body does not matter after death, so Michael protected Moses' soul
          - Contradicted by Jude
          - Jude names the object of the dispute as Moses' body
        - - The Testament and the Assumption are certainly the same book
          - Not established
          - Ancient lists sometimes distinguish them; scholarship remains divided
        - - Fr Stephen's title identification is scholarly consensus
          - "No"
          - He and Fr Andrew deliberately choose Assumption; many scholars prefer Testament, and he acknowledges the uncertainty
