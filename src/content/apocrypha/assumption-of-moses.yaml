slug: assumption-of-moses
title: The Assumption of Moses (Testament of Moses)
aka:
  - Assumption of Moses
  - Testament of Moses
  - Ascension of Moses
  - Assumptio Mosis
  - Testamentum Mosis
era: Early 1st century AD
canonicalStatus: Apocryphal · Tradition cited in Jude
blurb: An incomplete Jewish testament of Moses to Joshua — and the lost book behind Jude 9, where the Archangel Michael disputes with the devil over the body of Moses. The manuscript breaks off before Moses dies, so the famous scene is precisely the part we no longer have.
order: 7
status: draft
humanReviewed: false
sources:
  - R. H. Charles, The Assumption of Moses (London — Adam and Charles Black, 1897) — public domain; the translation cited on this page
  - John Priest, "Testament of Moses", in James H. Charlesworth, ed., The Old Testament Pseudepigrapha, vol. 1 — the standard modern translation; cited for scholarship, not reproduced
  - Johannes Tromp, The Assumption of Moses — A Critical Edition with Commentary (Studia in Veteris Testamenti Pseudepigrapha 10; Brill, 1993)
  - John J. Collins and Marinus de Jonge, "The Testament (Assumption) of Moses", in Outside the Old Testament
  - Ryan E. Stokes, "Not over Moses' Dead Body — Jude 9, 22–24 and the Assumption of Moses in their Early Jewish Context", Journal for the Study of the New Testament 40 (2017)
  - Edna Israeli, "'Taxo' and the Origin of the 'Assumption of Moses'", Journal of Biblical Literature 128 (2009)
  - The sole surviving manuscript — an incomplete Latin palimpsest of the 5th or 6th century in the Biblioteca Ambrosiana, Milan, discovered and published by Antonio Maria Ceriani in 1861
  - Jude 9; Deuteronomy 34.5–6; Zechariah 3.1–2; Daniel 7, 10 and 12; Psalm 81 (82); 1 Corinthians 6.3; Revelation 12 (Holy Scripture)
  - Clement of Alexandria, Origen and Gelasius of Cyzicus, who associate the Jude 9 tradition with an Assumption of Moses; the Stichometry of St Nikephoros of Constantinople
  - V. Rev. Dr Stephen De Young and Fr Andrew Stephen Damick, "The Ascension of Isaiah and the Assumption of Moses", The Lord of Spirits (Ancient Faith, 14 June 2024)
  - Catalogued for study; requires clergy/source review before any devotional use
