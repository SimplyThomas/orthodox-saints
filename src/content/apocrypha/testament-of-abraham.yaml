              - Scripture — Daniel 10 and 12, Jude 9, Revelation 12; the archistrategos title is Orthodox usage
              - This book only — the reluctance, the tears, the chariot, the guiding of Abraham through the judgment
              - Not established — that he escorts every soul; here he escorts this soul, by command
      - name: Death
        meaning: Thanatos, personified
        refs:
          - Testament of Abraham 16–20
          - Exodus 12.23
          - Hebrews 2.14
          - Revelation 6.8
          - Revelation 20.14
        body:
          - Sent by God when Abraham will not yield, and obedient to God throughout — which is the frame the whole portrait sits in. He is not an independent power and not an adversary; he argues with Abraham rather than seizing him.
          - "He comes first in a beautiful and radiant form, and converses. When Abraham presses him to show what he truly is, the second form is monstrous — in the Long Recension a horror of many faces and fiery aspects — and servants of the household die at the sight of it. Abraham prays, and they are restored. The Long Recension also suggests the two appearances are fitted to their audiences, one for the righteous and another for the wicked: a moral idea, not a statement about how anyone actually dies."
          - In the end he takes Abraham by deception rather than force, persuading him to take his hand, and the soul departs.
          - Scripture has its own figures around death — the destroyer of Exodus 12, the one who holds the power of death in Hebrews 2.14, the rider of Revelation 6, Death and Hades cast into the lake of fire. This figure shares their imaginative world without being any of them.
        lists:
          - label: Orthodox status
            items:
              - That death is subject to God and defeated by Christ is Orthodox faith
              - Death as a conversational character with two appearances is this book's literary personification
              - He is not a demon here, and should not be catalogued as one
  - key: judgment
    title: The Judgment Scene
    navLabel: The Judgment
    tone: faithful
    display: list
    intro:
      - The throne, the books, the balance and the fire — and the four figures who work them.
      - Heavenly record-keeping is scriptural. The personnel this book assigns to it are not, and the difference is the whole discipline of this directory.
    entries:
      - name: Abel, the judge
        refs:
          - Testament of Abraham 12–13
          - Genesis 4.8–10
          - Hebrews 11.4
          - Hebrews 12.24
        relatedHref: saint/OS-2526
        relatedLabel: Righteous Abel →
        body:
          - "The judge seated on the throne is Abel, son of Adam. Michael explains it to Abraham: he judges because he was the first righteous man to die, the first to be murdered, and he will judge until the great judgment comes."
          - The Long Recension indicates a judgment in stages — this present judging, then a judging by the twelve tribes of Israel, and finally by God Himself. That structure is peculiar to this work.
          - Scripture gives Abel his blood crying from the ground, his testimony among the faithful, and his blood that speaks better things than that of Abel — and no judicial office anywhere. This is a motif of the Testament, and it is not a doctrine of the particular judgment.
        lists:
          - label: Source register
            items:
              - Scripture — Genesis 4; Hebrews 11.4 and 12.24
              - This book only — Abel enthroned as judge of souls, and the staged judgment
      - name: Enoch, the scribe
        refs:
          - Testament of Abraham 11–13
          - Genesis 5.24
          - 1 Enoch
          - 2 Enoch
          - Jubilees
        relatedHref: saint/OS-2532
        relatedLabel: Righteous Forefather Enoch →
        body:
          - Beside the judgment stands Enoch, identified as the scribe of righteousness, writing down the sins and the righteous deeds of each soul as they are read out.
          - The role connects this book to the wider Enochic world — Enoch is a heavenly scribe in 1 Enoch and 2 Enoch, and the heavenly tablets are fundamental to Jubilees — without making the Testament a work of that literature. It shares motifs with Enochic writing rather than belonging to it.
          - Genesis says only that Enoch walked with God and was taken. Everything else about him, here and elsewhere, is later development.
      - name: Dokiel, who holds the balance
        meaning: Long Recension only; spellings vary between manuscripts
        refs:
          - Testament of Abraham 13 (Long Recension)
          - Daniel 5.27
          - Revelation 20.12
        body:
          - The sun-like angel, described as the righteous weigher, who holds the balance in which a soul's righteous deeds are weighed against its sins.
          - He belongs to the Long Recension. He does not appear in the Short Recension, and the form of his name varies across manuscripts.
          - He is not a recognised angel of Orthodox tradition. No Orthodox liturgical text names him, and he belongs to no order of the received hierarchy. Modern lists circulating online that present him as an archangel beside Michael and Gabriel are resting on two words in one recension of one pseudepigraphon.
        lists:
          - label: Orthodox status
            items:
              - The motif of weighing deeds is ancient and widespread, and Scripture has its own weighing imagery
              - The name Dokiel belongs to the Long Recension of this book and to nothing in Orthodox tradition
              - Never to be listed as an Orthodox archangel
      - name: Puriel, who tests by fire
        meaning: from the Greek pyr, fire; Long Recension only
        refs:
          - Testament of Abraham 13 (Long Recension)
          - 1 Corinthians 3.13
        body:
          - The fiery angel, described as showing no mercy in the testing, who tries each person's works with fire.
          - Like Dokiel he belongs to the Long Recension alone, and like Dokiel he is not an angel Orthodox tradition names.
          - The underlying idea — that works are tested by fire — has a genuine scriptural relative in Paul's account of each man's work being revealed and tried by fire. The motif is worth knowing. The name is not an authority.
        lists:
          - label: Orthodox status
            items:
              - Testing of works by fire has a scriptural relative in 1 Corinthians 3.13
              - The name Puriel is confined to the Long Recension and to no Orthodox source
              - Never to be listed as an Orthodox archangel
      - name: The recording angels and the books
        refs:
          - Testament of Abraham 12–13
          - Daniel 7.10
          - Malachi 3.16
          - Luke 10.20
          - Revelation 20.12
        body:
          - Angels bring and read the records; deeds are written down; in the Long Recension cherubim are associated with the books.
          - This part is on firm scriptural ground. The books are opened before the Ancient of Days in Daniel 7.10; a book of remembrance is written in Malachi 3.16; names are written in heaven in Luke 10.20; the dead are judged from what is written in the books in Revelation 20.12. Heavenly record-keeping is ordinary in Second Temple Judaism and in Scripture alike.
          - What is distinctive here is not the books but the staffing — who holds them, who weighs, who applies the fire.
    outro:
      - The elements this book shares with Scripture and the elements peculiar to it are set out separately above on purpose. A judgment scene assembled from both, without saying which is which, is how a pseudepigraphon quietly becomes a doctrine.
  - key: recensions
    title: Long and Short
    navLabel: The Recensions
    tone: neutral
    display: table
    intro:
      - Two substantially different Greek recensions survive, and they are not two copies of one text.
      - Which stands closer to the earliest form has been argued for over a century and is not settled — neither can simply be called the original. Any claim made from this book should say which recension it rests on.
    table:
      columns:
        - Episode or teaching
        - Long Recension
        - Short Recension
      rows:
        - - Michael's difficulty delivering the message
          - Extended, with returns to heaven
          - Present, in briefer form
        - - Michael leading the worship of heaven
          - Not the emphasis
          - He ascends to lead the angelic praise
        - - Isaac's dream
          - Present and developed
          - Present, differently handled
        - - Abraham's journey above the earth
          - On a chariot of cherubim
          - Present, less elaborate
        - - Abraham condemning sinners, and God's rebuke
          - Present and central
          - Present
        - - Adam at the two gates
          - Fullest form — enthroned, weeping and rejoicing
          - Reduced
        - - Abel as judge
          - Present, with the staged judgment
          - Present
        - - Enoch as heavenly scribe
          - Present
          - Present in some form
        - - Dokiel and the balance
          - Named
          - Not named
        - - Puriel and the testing by fire
          - Named
          - Not named
        - - The soul with equal deeds
          - Present; Abraham prays and it is saved
          - Reduced or absent
        - - Abraham's intercession for those he destroyed
          - Present, with restoration
          - Reduced
        - - Death's two appearances
          - Fullest — the monstrous form kills servants
          - Present, briefer
        - - Abraham's death and the receiving of his soul
          - Present
          - Present
    entries: []
    outro:
      - The Dokiel and Puriel rows are the ones that matter most in practice. The two angel names most often quoted from this book exist in one of its two forms.
  - key: figures
    title: The Human Figures
    navLabel: The Household
    tone: neutral
    display: cards
    intro:
      - Abraham's household, and the two men he meets beyond the world.
      - All are commemorated by the Church and carry their own pages here.
    entries:
      - name: Abraham
        relatedHref: saint/OS-1984
        relatedLabel: Righteous Forefather Abraham →
        blurb: Who will not die, who condemns sinners from the sky and is rebuked for it, and who ends by praying for the very people he destroyed. The book is about his learning mercy.
      - name: Sarah
        relatedHref: saint/OS-2356
        relatedLabel: Righteous Sarah →
        blurb: In the household when Michael arrives, and among those who recognise something of what the visitor is before Abraham does.
      - name: Isaac
        relatedHref: saint/OS-2348
        relatedLabel: Righteous Patriarch Isaac →
        blurb: Whose dream frightens the household and first signals to them what is coming.
      - name: Adam
        relatedHref: saint/OS-2524
        relatedLabel: Righteous Forefather Adam →
        blurb: Enthroned between the broad gate and the narrow, weeping over the many and rejoicing over the few — watching what becomes of his own race.
      - name: Abel
        relatedHref: saint/OS-2526
        relatedLabel: Righteous Abel →
        blurb: The first righteous man to die, and in this book the judge of souls until the great judgment. Scripture gives him no such office.
      - name: Enoch
        relatedHref: saint/OS-2532
        relatedLabel: Righteous Forefather Enoch →
        blurb: The scribe of righteousness, writing down each soul's sins and righteous deeds beside the judgment seat.
