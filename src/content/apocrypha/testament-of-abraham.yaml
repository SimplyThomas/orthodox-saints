slug: testament-of-abraham
title: The Testament of Abraham
aka:
  - Testamentum Abrahae
era: Probably late 1st or early 2nd century AD
canonicalStatus: Apocryphal · Jewish, probably Egyptian
blurb: Abraham will not die, so God sends the Archangel Michael to persuade him — and before the end Abraham is carried above the earth to see the two gates, the weighing of souls, and Death himself. Not to be confused with the Apocalypse of Abraham.
order: 10
status: draft
humanReviewed: false
sources:
  - M. R. James, The Testament of Abraham — the Greek text now first edited, with an introduction and notes (Texts and Studies 2.2; Cambridge University Press, 1892) — public domain; the historically important edition
  - E. P. Sanders, "Testament of Abraham", in James H. Charlesworth, ed., The Old Testament Pseudepigrapha, vol. 1 (Doubleday, 1983) — standard modern English translation of both recensions; cited for scholarship, not reproduced
  - Francis Schmidt, Le Testament grec d'Abraham — introduction, édition critique des deux recensions grecques, traduction (Mohr Siebeck, 1986)
  - Dale C. Allison Jr., Testament of Abraham (Commentaries on Early Jewish Literature; de Gruyter, 2003) — the major modern commentary
  - Jared W. Ludlow, Abraham Meets Death — Narrative Humor in the Testament of Abraham (Sheffield, 2002), for the comic reading
  - Genesis 18 and 22–25; Matthew 7.13–14; Luke 16.19–31; Daniel 7.10; Malachi 3.16; Revelation 20.12; Hebrews 11.4 and 12.24; Jude 9 (Holy Scripture)
  - V. Rev. Dr Stephen De Young, "Extra-Biblical Literature in the Orthodox Church", The Whole Counsel of God (Ancient Faith, 2018), where the Testament is described as a first-century Greek work preserved across the Orthodox world
  - Catalogued for study; requires clergy/source review before any devotional use. Several bibliographic details on this page still await verification against the primary sources — see the note in Canonicity & Orthodox Reception
