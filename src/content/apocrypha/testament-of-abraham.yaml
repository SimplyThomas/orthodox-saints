  - key: michael-death
    title: Michael and Death
    navLabel: Michael & Death
    tone: neutral
    display: list
    intro:
      - The two beings the story turns on — the archangel who cannot deliver his message, and the servant who finally does.
      - Both are sent by God and both obey. Neither behaves quite as a reader expects, which is much of the book's point.
    entries:
      - name: The Archangel Michael
        meaning: archistrategos — commander-in-chief of the heavenly host
        refs:
          - Testament of Abraham 1–20
          - Daniel 10.13, 21
          - Daniel 12.1
          - Jude 9
          - Revelation 12.7
        hostId: HH-0010
        relatedLabel: Archangel Michael →
        body:
          - Sent to tell Abraham to set his house in order, and titled here with the term Orthodox tradition itself uses of him — commander-in-chief of the heavenly host.
          - He is characterised with unusual tenderness. He cannot bring himself to deliver the message, weeps, and returns to heaven more than once for further instruction. In the Short Recension he also ascends to lead the worship of heaven, setting his obedience beside his liturgical office.
          - "He is then Abraham's guide — taking him above the earth on a chariot of cherubim, restraining him when he begins destroying sinners, bringing him to the two gates and to the judgment, and explaining what he sees: who Abel is, what Enoch is writing, what the balance and the fire are for. At the end he is present at Abraham's death and among those who receive his soul."
          - This fits his canonical portrait rather than stretching it — the prince who contends with hostile powers, who stands for God's people, who disputes with the devil over the body of Moses, who fights the dragon. What belongs to this book alone is the reluctance, the hospitality scene, the chariot, and the role of interpreter.
        lists:
          - label: Source register
