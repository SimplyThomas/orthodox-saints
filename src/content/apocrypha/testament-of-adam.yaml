slug: testament-of-adam
title: The Testament of Adam
aka:
  - Testamentum Adae
era: Composite — Syriac Christian, roughly 3rd century onward
canonicalStatus: Apocryphal · Syriac Christian
blurb: A Syriac Christian work in three parts, attributed to Adam and addressed to Seth — an hour-by-hour account of the whole creation at prayer, a prophecy of Christ, and one of the earliest Christian attempts to set the angelic orders in rank.
order: 12
status: reviewed
humanReviewed: false
sources:
  - Stephen Edward Robinson, The Testament of Adam — An Examination of the Syriac and Greek Traditions (SBL Dissertation Series 52; Scholars Press, 1982) — the standard critical study and the basis for any serious use of this text
  - Stephen E. Robinson, "Testament of Adam", in James H. Charlesworth, ed., The Old Testament Pseudepigrapha, vol. 1 (Doubleday, 1983) — standard English translation; cited for scholarship, not reproduced
  - Michael E. Stone, on Adam literature and its Armenian and Georgian transmission
  - Genesis 1–5; Isaiah 6; Ezekiel 1 and 10; Daniel 4.13–17; Romans 8.38–39; Ephesians 1.21; Ephesians 3.10; Ephesians 6.12; Colossians 1.16; Colossians 2.15; Revelation 5.8; Revelation 8.3–4; Psalm 148; the Song of the Three Holy Children (Holy Scripture and the Greek Old Testament)
  - St Dionysius the Areopagite, The Celestial Hierarchy — for the comparison in the Hierarchy section below
  - Catalogued for study; requires clergy/source review before any devotional use. This page was written from a research brief rather than a completed source dossier — see the sourcing note in Canonicity & Reception
