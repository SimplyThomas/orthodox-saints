  - key: hours
    title: The Hours of Creation
    navLabel: The Hours
    tone: faithful
    display: list
    intro:
      - The cosmos as one choir, keeping watch in shifts, so that no hour passes unpraised.
      - The scheme is secure and is the reason to read this book. The hour-by-hour assignments differ between witnesses and are not printed here — see the note below.
    entries:
      - name: The pattern of the Hours
        refs:
          - Testament of Adam 1–2 (the Horarium)
          - Psalm 148
          - Psalm 19.1–4
          - Psalm 103.4
          - Song of the Three Holy Children
        body:
          - Twelve hours of the night and twelve of the day, and for each one the text names who is praising God at that hour.
          - "The worshippers are the parts of creation rather than congregations: the depths and the waters, fire and the winds, the fish and the birds and the beasts, and the ranks of angels before the throne — each with an appointed hour, the cycle closing with the prayer and petition of human beings. At no hour is God unpraised."
          - Hostile spirits appear within the scheme as well, their activity placed inside the allotment rather than outside it. The night is not surrendered to them; it is apportioned, hour by hour, like everything else.
          - This page describes the scheme and deliberately does not print a twenty-four-row table. The specific assignment of each hour differs between the Syriac and Greek witnesses and between manuscripts, and the list has not been checked here against Robinson's critical edition. A reader wanting the hours themselves should go there.
        lists:
          - label: Source register
            items:
              - "Holy Scripture — that creation praises its Maker: Psalm 148, Psalm 19, the Song of the Three Holy Children"
              - This book — the schedule; what Psalm 148 lists, the Horarium puts on a clock
              - Not established — any dependence between this scheme and the Christian hours of prayer
      - name: The praising cosmos in Scripture
        refs:
          - Psalm 148
          - Psalm 19.1–4
          - Psalm 103.4
          - Song of the Three Holy Children
          - Revelation 5.8
          - Revelation 8.3–4
        body:
          - The idea is not this book's invention. Psalm 148 summons sun and moon, stars, the waters above the heavens, sea creatures and deeps, fire and hail, snow and vapour, mountains, trees, beasts and birds, and last of all human beings — a sweep through creation ordered much as the Hours are ordered.
          - "The Song of the Three Holy Children, sung in the furnace and read in the services of Great Saturday, does the same: every part of creation called in turn to bless the Lord. Psalm 19 has the heavens declaring the glory of God without speech; Psalm 103 sets the angels who do His word beside the winds and the flames."
          - Revelation adds the other half of the picture — the prayers of the saints as incense in golden bowls, and an angel offering them at the altar before the throne. Human prayer rising and angelic worship receiving it is a scriptural conception, and the Testament works within it.
      - name: The hours, and the Church's hours
        refs:
          - Acts 3.1
          - Acts 10.9
          - Orthodox Horologion
        body:
          - "The resonance with Orthodox liturgical theology is immediate: the Church prays at appointed hours because heaven is already praying, and earthly worship joins something unceasing."
          - It is a resonance and not a derivation. The Orthodox Hours have their own history in early Christian and monastic practice — the apostles going up at the hour of prayer, Peter praying at the sixth hour — and the Divine Liturgy's joining of earthly worship to angels and archangels rests on Isaiah 6 and Revelation.
          - The most that should be said is that the Testament of Adam probably reflects an existing way of thinking about prayer and time rather than causing one. Similar structure is not evidence of dependence, and no scholarship has demonstrated a link.
        lists:
          - label: Orthodox status
            items:
              - That the Church's worship joins the unceasing worship of heaven is Orthodox teaching, grounded in Isaiah 6 and Revelation
              - The Horologion has its own documented sources in early Christian and monastic practice
              - No dependence on this book has been shown, and none is claimed here
  - key: hierarchy
    title: The Orders of the Heavenly Host
    navLabel: The Hierarchy
    tone: faithful
    display: cards
    intro:
      - One of the earliest Christian attempts to set the angelic vocabulary of Scripture into rank.
      - The vocabulary is biblical throughout. The arrangement and the functions are the Testament's own, differ between witnesses, and should be checked against Robinson before being quoted.
    entries:
      - name: Seraphim
        hostId: HH-0001
        relatedLabel: The Seraphim →
        blurb: Nearest the throne. The name and the imagery come from Isaiah 6, where they cover themselves with their wings and cry the Trisagion — the passage the Church's own worship takes up.
      - name: Cherubim
        hostId: HH-0002
        relatedLabel: The Cherubim →
        blurb: Set at the gate of Paradise in Genesis 3 and beneath the divine chariot in Ezekiel 1 and 10. The Testament places them among the highest, as Scripture does.
      - name: Thrones
        hostId: HH-0003
        relatedLabel: The Thrones →
        blurb: Named by Paul in Colossians 1.16 among the things created in Christ, visible and invisible. Paul names them without ranking them; this is one of the first texts to try.
      - name: Dominions
        hostId: HH-0004
        relatedLabel: The Dominions →
        blurb: Colossians 1.16 and Ephesians 1.21. In the Testament, as in the later hierarchy, an order of governance rather than of direct service to humanity.
      - name: Powers
        hostId: HH-0006
        relatedLabel: The Powers →
        blurb: Ephesians 1.21, 3.10 and 6.12, and Romans 8.38. Paul's language for the powers is used in the Testament for holy orders — the same words Scripture also uses of hostile ones.
      - name: Principalities
        hostId: HH-0007
        relatedLabel: The Principalities →
        blurb: The archai of Romans 8.38, Ephesians 3.10 and Colossians 1.16 — rulers, in the plain sense of the word, over parts of the created order.
      - name: Archangels
        hostId: HH-0008
        relatedLabel: The Archangels →
        blurb: The chief messengers, distinguished from the angels by rank and by mission. Whether the Testament names any individually is one of the details needing verification.
      - name: Angels
        hostId: HH-0009
        relatedLabel: The Angels →
        blurb: The order nearest to human affairs — the messengers of Scripture, and in the Testament the rank most directly concerned with people.
      - name: Watchers
        blurb: A Syriac term for angels, following Daniel 4 where a watcher and a holy one comes down from heaven. In Syriac usage these are ordinarily the HOLY angels — not the fallen Watchers of 1 Enoch. Check the context before assuming otherwise.
    outro:
      - Nine records are linked above because the Church's own nine orders are the natural comparison. That is not a claim that this text contains them — the vocabulary overlaps because both draw on Isaiah, Ezekiel and Paul, while the arrangement and functions differ. See the Beside the Nine Orders section.
  - key: figures
    title: Adam, Seth, and What Adam Foretells
    navLabel: Adam & Seth
    tone: neutral
    display: cards
    intro:
      - The testamentary frame, and the prophecy that settles the book's character.
      - Christian prophecy placed on Adam's lips is a device of the author's own age, and this page never presents it as a pre-Christian prediction.
    entries:
      - name: Adam
        relatedHref: saint/OS-2524
        relatedLabel: Righteous Forefather Adam →
        blurb: The first man, here knowing how the whole creation praises its Maker and handing that knowledge on at the end of his life. Also the recipient of the promise that God will yet make him a god — not now, but after many years.
      - name: Seth
        relatedHref: saint/OS-2527
        relatedLabel: Righteous Forefather Seth →
        blurb: The son who receives the testament. His prominence here does not make the work Sethian in the Gnostic sense; Adam instructing Seth is ordinary in Jewish and Christian Adam literature.
      - name: Christ, foretold
        relatedHref: saint/OS-0000
        relatedLabel: Jesus Christ →
        blurb: The Prophecy names the Son of God born of a virgin, becoming man, suffering and rising. Whatever the age of the Hours, this section settles that the surviving work is Christian.
      - name: The promise of deification
        blurb: God's word that Adam will yet be made a god, after the passing of many years — a line often quoted in modern discussions of theosis. The Orthodox doctrine is drawn from Scripture and the Fathers, not from a Syriac pseudepigraphon; what this shows is the idea's antiquity and reach.
