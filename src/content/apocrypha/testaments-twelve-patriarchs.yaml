slug: testaments-twelve-patriarchs
title: The Testaments of the Twelve Patriarchs
aka:
  - Testaments of the Twelve Sons of Jacob
  - Testamenta XII Patriarcharum
era: Second Temple traditions; the Greek collection shaped in Christian transmission
canonicalStatus: Apocryphal · Jewish-Christian
blurb: Twelve farewell discourses in the mouths of Jacob's sons — and the section's fullest ancient account of the passions as spiritual warfare, in which envy, anger and lust are the ground Beliar actually fights on.
order: 9
status: reviewed
humanReviewed: false
sources:
  - R. H. Charles, ed., The Greek Versions of the Testaments of the Twelve Patriarchs (Oxford — Clarendon Press, 1908), and his English translation — public domain; the translation cited on this page
  - H. C. Kee, "Testaments of the Twelve Patriarchs", in James H. Charlesworth, ed., The Old Testament Pseudepigrapha, vol. 1 — the modern English edition; cited for scholarship, not reproduced
  - Marinus de Jonge, The Testaments of the Twelve Patriarchs — A Study of Their Text, Composition and Origin; and M. de Jonge et al., eds., The Testaments of the Twelve Patriarchs — A Critical Edition of the Greek Text (Leiden, 1978)
  - Harm W. Hollander and Marinus de Jonge, "The Testaments of the Twelve Patriarchs", in Outside the Old Testament
  - Michael E. Stone, on the Armenian transmission, the Levi literature and Semitic testamentary traditions
  - The Aramaic Levi Document (Qumran and the Cairo Geniza), and Hebrew Testament of Naphtali traditions — the attested Semitic antecedents
  - Genesis 49; Deuteronomy 32–33; Psalm 1; Matthew 7.13–14; 2 Corinthians 6.15; 1 John 2–4; Hebrews 7 (Holy Scripture)
  - V. Rev. Dr Stephen De Young, "Extra-Biblical Literature in the Orthodox Church" (Ancient Faith, 2018) and "The Testament of Jacob" (2019); with Fr Andrew Stephen Damick, "Testaments of the Twelve Patriarchs", The Lord of Spirits (Ancient Faith, 10 May 2024)
  - Catalogued for study; requires clergy/source review before any devotional use
