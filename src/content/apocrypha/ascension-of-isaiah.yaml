  - heading: Relationship to the New Testament
    body:
      - "The parallels are extensive enough that the safest general statement has to be made first: this work and the New Testament participate in the same early Jewish-Christian religious world, and some resemblances will be shared tradition rather than literary borrowing. None of the cases below is asserted here as dependence."
