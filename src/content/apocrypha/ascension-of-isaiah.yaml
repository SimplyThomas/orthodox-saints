overview:
  - The Ascension of Isaiah is an early Jewish-Christian apocalypse in two very different halves. The first tells how the prophet Isaiah was persecuted under King Manasseh and put to death by being sawn in two. The second takes him up through seven heavens to the throne of God, and shows him the Beloved — Christ — descending from the highest heaven through each realm in disguise, entering human life, dying, going down to the realm of death, and rising to ascend again in open glory.
  - That makes it different in kind from the other books gathered here. 1 Enoch is preoccupied with the Watchers, Jubilees with the origin of demons and the ordering of sacred time, 2 Enoch with the map of the heavens, the Apocalypse of Abraham with the divine Name and the Day of Atonement. This book carries a good deal of that same furniture — seven heavens, an angelic guide, hostile powers, heavenly garments and thrones — directly into an explicitly Christian setting.
  - It is composite, and the layers matter. A Jewish martyrdom tradition stands in chapters 1–5; an unmistakably Christian apocalypse is embedded at 3.13–4.22, long known as the Testament of Hezekiah; and the heavenly vision occupies chapters 6–11. Scholars differ over whether these were ever three independent works or one Christian composition drawing on older material, and over how early each layer is. Fr Stephen De Young places all three components in the second half of the first century with the composite reaching its form early in the second — an early reconstruction, offered as his.
  - "Its interest for a catalogue of the heavenly hosts is unusual density: Sammael and Beliar; the rulers of the firmament and the powers of the air; angels on the right and on the left; rebellious powers who became the gods of the nations; glorified human saints occupying what those powers forfeited; the Great Glory, the Beloved and the Angel of the Holy Spirit worshipped together in the highest heavens. It is not canonical Scripture in the Orthodox Church, and none of its distinctive descriptions is Orthodox doctrine. It is catalogued here for study, as an early witness to how some Christians pictured the unseen world while the New Testament was still being written."
sections:
  - heading: Date, Authorship, and the Three Parts
    body:
      - The prophet did not write it. Isaiah serves as the visionary through whom the book interprets Scripture and Christian revelation, in the ordinary manner of this literature.
      - The dating is complicated by the layers. The traditional analysis divides the work into the Martyrdom of Isaiah (chapters 1–5), the Testament of Hezekiah (roughly 3.13–4.22, an explicitly Christian apocalypse interrupting the martyrdom narrative), and the Vision of Isaiah (chapters 6–11). The division remains useful, though contemporary scholarship does not universally hold that these were ever three fully independent compositions; the work is now often described as an early Christian apocalypse in two major units, a martyrdom and a heavenly vision.
      - "Fr Stephen De Young gives a comparatively early reconstruction: all three components originating in the second half of the first century, with the composite form reached in the first half of the second. His point in doing so is that the Christian portions are not late imagination but belong to the earliest Christian generations. Mainstream scholarship is more cautious about assigning exact dates and sources while generally agreeing the work reached its present form by the second century."
      - The form used on this page is therefore first to early second century AD, with the note that individual components may differ in date and that the final composite probably emerged by the second century. That avoids presenting the chronology as more settled than it is.
  - heading: Language, Manuscripts, and the Titles
    body:
      - Unlike the Apocalypse of Abraham, this work has a broad multilingual history. The complete text survives in Ge'ez; further witnesses survive in Greek, Latin, Coptic and Church Slavonic. It circulated originally in Greek, and whether parts of the martyrdom tradition go back to Hebrew or Aramaic remains debated.
      - "One detail of the Ethiopian transmission is worth knowing: at least one Ethiopian manuscript places the Ascension directly after the canonical Book of Isaiah, among the prophets. That is real evidence for how the work circulated in Ethiopian manuscript culture, and it is not evidence of canonical status — proximity in a codex is not a canon list."
      - The work and its parts circulated under several titles, which is why references to it can be confusing.
    table:
      columns:
        - Title
        - What it designates
      rows:
        - - Ascension of Isaiah
          - The standard modern title for the composite work
        - - Vision of Isaiah
          - Chapters 6–11, the heavenly ascent
        - - Martyrdom of Isaiah
          - The death narrative of chapters 1–5
        - - Testament of Hezekiah
          - The Christian apocalyptic material embedded in chapters 3–4
        - - Apocryphon of Isaiah
          - An ancient designation associated with Origen
  - heading: The Martyrdom of Isaiah
    body:
      - The Old Testament does not record how Isaiah died. This book preserves the famous tradition that he was martyred under Manasseh by being sawn in two.
      - Hebrews 11.37, listing what the faithful of old endured, says that some "were sawn in two". It names nobody. The association of that phrase with Isaiah nevertheless became widespread in Jewish and Christian tradition.
      - "The relationship has to be stated carefully, and Fr Stephen De Young is careful about it: we should not say that Hebrews quotes this book. Both appear to witness to a tradition about Isaiah's death that was already circulating independently, and which also surfaces in later Jewish material."
      - "The registers, kept apart: Scripture says that some of the faithful were sawn in two, without naming them. This book identifies Isaiah as a prophet killed in that manner. Later Jewish and Christian tradition took the identification up and made it standard. Each of those is a different kind of statement."
  - heading: Beliar, Sammael, and the Overlapping Names
    body:
      - The persecution of Isaiah is not presented as merely political. Behind Manasseh stands Beliar, and the restoration of idolatry under that king is what lets demonic influence flourish; Beliar works through a hostile false prophet who brings about Isaiah's death. Human evil and demonic evil operate together, and the human persecutors remain fully responsible — the pattern of Pharaoh and the gods of Egypt, of Daniel's kingdoms and their princes, of Judas and Satan, of the beasts and the dragon.
      - "Beliar, a form of Belial, belongs to a wide Second Temple tradition — the Dead Sea Scroll literature, the Testaments of the Twelve Patriarchs, and other Jewish pseudepigrapha. It is also in the New Testament: Paul asks what accord Christ has with Belial, in 2 Corinthians 6.15. In this book Beliar is effectively a Satan figure, tied to lawlessness, idolatry, persecution, false prophecy, corrupt rulers and the hostile powers of the heavens."
      - Sammael also appears, spelled variously Sammael, Samael or Samail, and Isaiah meets him and his powers in the lower spiritual realm. Fr Stephen De Young identifies him as a fallen archangel and connects the titles associated with him to the powers working through Isaiah's persecutors.
      - The most important caution on this page concerns these names together. Scholarly analysis finds substantial overlap between Beliar, Satan, Sammael, and titles of the Malkira or Melkiresha type; at least some of them function as overlapping identities for the one principal adversary rather than as a catalogue of separate supreme demons. Beliar, Sammael, Satan and Malkira must not be treated as four distinct devils on the strength of this work.
  - heading: Beliar, Nero, and the Antichrist
    body:
      - The Christian section embedded in chapters 3–4 contains an unusually early Antichrist tradition. Beliar manifests through an earthly ruler who claims divine status, performs deceptive signs, demands worship, persecutes the faithful, and wields enormous power for a time — until Christ returns and destroys him.
      - The ruler is drawn with details that point unmistakably at Nero, and Fr Stephen De Young reads him that way, comparing the use of Nero-shaped imagery in Revelation. This belongs to the same first-century interpretive world as the beast.
      - The right description is an early Christian Antichrist tradition in which Beliar's final earthly manifestation is portrayed with imagery strongly associated with Nero. It should not be flattened into a claim that the book says Nero literally returns from the dead; the relationship between Nero, Beliar and Antichrist imagery in this literature is more layered than that.
      - "The point for a catalogue of the unseen world is the structure rather than the identification: Antichrist here is the earthly embodiment and agent of a pre-existing demonic power. Earthly politics and spiritual warfare are again the same event seen from two sides."
  - heading: The Guide Who Withheld His Name
    body:
      - When the great vision begins, an angelic figure comes to guide Isaiah, and Isaiah recognises at once that this being is not like the angels he is used to. He is a prophet; angels are not new to him; this one is of a different order — and at first he will not give his name.
      - Fr Stephen De Young reads this guide as an Angel of the Lord figure and interprets the narrative christologically, holding that the Christian identification of the Angel of the Lord with Christ is already present in this very early Christian source.
      - "That reading has to be handled with the same care the Apocalypse of Abraham's Yahoel requires, and for a sharper reason: this book contains several related heavenly identities close together — Isaiah's guide, the Beloved, the Angel of the Holy Spirit, and the Great Glory. Textual and scholarly interpretations of how those figures relate differ, and collapsing them into one another without saying so would misrepresent the text. This page keeps them distinct and links the guide to the Angel of the Lord as a related record without asserting the identification."
  - heading: The Seven Heavens
    body:
      - "Isaiah is carried up through seven heavens, which places the work in the same broad ascent tradition as 2 Enoch and the later Jewish mystical literature. Its seven heavens are not those of 2 Enoch, and the difference is the useful fact: there was no standardised ancient map, and the schemes in these books disagree because they were never one system."
      - What organises this ascent is not an inventory but glory. Each realm is more glorious than the one below it, and the movement of the whole vision is from conflict, through increasing order, to unified worship, and finally to divine glory.
      - "Below the first heaven lies the firmament, and it is the disordered floor of the building: Sammael and his powers are there, in conflict and envy, and the disorder of earth reflects the disorder among them. The first through fifth heavens each hold angels, worship, a throne, and greater glory than the last, with beings ranged on the right and on the left. At the sixth something changes — there is no left-hand company and no subordinate throne, and the beings worship together in unity. The seventh holds the righteous, the thrones and crowns and garments prepared for them, the Beloved, the Angel of the Holy Spirit and the Great Glory."
  - heading: The Powers of the Air, and the Right and the Left
    body:
      - Placing the hostile powers in the firmament — the air, below the heavens proper — is one of this book's most useful features for reading the New Testament. Fr Stephen De Young connects it directly with Paul's prince of the power of the air and with the rulers, authorities and cosmic powers of Ephesians 6.
      - The cosmos here is not divided simply into earth and one place called heaven. "The heavens" are layered, some lower regions hold rebellious powers, and only the highest belongs wholly to divine glory. Once that is in view, the ancient Christian vocabulary of heavenly places, powers of the air, rulers, authorities, principalities and powers stops sounding like loose synonyms and starts sounding like a description of somewhere.
      - The right-and-left imagery works the same way. In the lower heavens Isaiah sees beings on the right and on the left; as he ascends the division disappears, and by the sixth heaven there is no left at all. Fr Stephen and Fr Andrew Damick read this through the ancient symbolism of God's right and left hands — the right for the faithful powers, the left for those who have departed from obedience — comparing St Gregory the Dialogist's reading of the heavenly council in Job.
      - This is symbolic cosmic geography, not an Orthodox teaching that angels stand permanently on one side of God or the other, and it should never be presented as one.
  - heading: Angels Who Became the Gods of the Nations
    body:
      - "The rebellion in this book is not told through the Watchers. On Fr Stephen De Young's reading its rebellious powers sin by wanting to be worshipped: they take the honour due to God and become the gods of the nations."
      - That connects the work to the divine-council material of Deuteronomy 32, Psalm 81 (82), Daniel 10, 1 Corinthians 10 and Ephesians 6, rather than to Genesis 6.
      - So the section now holds two distinct ancient accounts of what heavenly rebellion consisted of, and it is worth keeping them distinct rather than blending them. In the Enochic pattern the Watchers descend, transgress a boundary, corrupt humanity, and father the giants. In the divine-council pattern heavenly rulers rebel by accepting or demanding worship, and become the false gods of the nations. 1 Enoch and Jubilees emphasise the first. This book emphasises the second.
  - heading: Saints in the Places the Angels Forfeited
    body:
      - "Isaiah sees glorified human beings in the highest heaven, and Fr Stephen De Young reads the work as teaching that faithful humans come to occupy the positions rebellious powers gave up. One of them is named: Enoch, among the righteous — not as protagonist here, but as the archetypal righteous man already associated with heavenly ascent. Other saints are present with him though only he is named in the scene."
      - 'The pattern is thoroughly biblical: the saints receive the kingdom in Daniel 7; the apostles sit on thrones in Matthew 19.28; "do you not know that we shall judge angels?" in 1 Corinthians 6.3; the victor sits with Christ on His throne in Revelation 3.21; the thrones and the judgment of Revelation 20.'
      - What Isaiah sees prepared for them are crowns, thrones and garments, and these are not decoration. Crowns are victory and royal authority; thrones are participation in heavenly rule and judgment; the garments are transformation from a mortal and corruptible existence into a glorified one. Fr Stephen puts particular weight on the garments as an early Christian parallel to Paul's language of being clothed with immortality — the old garment mortality and corruption, the new one life and incorruption — and contrasts that reading with later interpretations which reduce clothing imagery to the imputation of righteousness.
      - "As Isaiah rises he himself becomes progressively able to share in the worship of each heaven, and the righteous are described as becoming like the angels. Fr Stephen stresses that this does not mean ceasing to be human or becoming disembodied; their existence is transformed, as in Paul's resurrection theology in 1 Corinthians 15. The resulting anthropology is striking: salvation is not escape from punishment but restoration, glorification, enthronement and incorporation into God's heavenly government. The resonance with what Orthodox theology later articulates as theosis and incorruption is real, and the later vocabulary should not simply be imposed backwards on an apocalypse that does not use it."
  - heading: The Great Glory, the Beloved, and the Angel of the Holy Spirit
    body:
      - Three figures stand at the summit of the vision, and each needs stating precisely.
      - The Great Glory is God the Father — transcendent, and not simply to be looked upon. The distinction between Him and the visible heavenly figures Isaiah meets is deliberate and is part of the work's theology.
      - "The Beloved is the book's central title for Christ, and the Christology is remarkably explicit. He exists in heaven before the Incarnation; He is worshipped by the heavenly beings; He receives a mission from the Father; He descends, enters human life, is crucified, goes down to the realm of death, rises, ascends and returns to glory. This is not the story of an exalted human being. Modern scholarship treats it as important evidence for early angelomorphic or heavenly Christology — Jonathan Knight reads the Beloved as a distinctive early Christian synthesis of Jewish apocalyptic heavenly traditions with Christian belief in pre-existence, descent and enthronement. Angelomorphic language does not make Christ an angel here: He is the pre-existent Beloved who receives worship and conquers the powers."
      - "The Angel of the Holy Spirit is the book's strangest expression and the easiest to misread. It does not mean that the Holy Spirit is a created angel, and Fr Stephen De Young explicitly rejects that reading, taking the angelic figure as a visible representation of the Spirit within a vision — the Spirit not being bodily visible — comparable to how visionary literature elsewhere renders invisible divine realities in visible form. Any entry drawn from this must carry that warning with it: the phrase is a feature of the vision, not a doctrine that the Spirit is an angel."
  - heading: The Worship of the Three, Before Nicaea
    body:
      - In the sixth and seventh heavens Isaiah sees worship offered to the Father, to the Beloved, and to the Holy Spirit, and hears the heavenly beings name and praise them together.
      - Fr Stephen De Young places great weight on this, arguing that it is evidence of recognisably Trinitarian Christian worship in the apostolic era, long before Nicaea, and comparing the later principle of St Basil the Great that honour given to the image passes to the prototype. Recent academic work likewise describes the text as containing proto-trinitarian thinking, and Darrell Hannah has argued that its vision of Father, Beloved and Spirit is bound up with early Christian Trinitarian readings of Isaiah 6.
      - The formulation has to stop short of what it cannot carry, and Fr Stephen himself stops short of it. This book does not contain the Nicene doctrine of the Trinity already articulated, and saying so would be false. What it does provide is exceptionally early evidence for Christian worship involving the Father, Christ and the Holy Spirit together — which makes the claim that Trinitarian Christianity was invented in the fourth century very hard to sustain, and which is a historical observation rather than a dogmatic one.
  - heading: The Secret Descent
    body:
      - The most distinctive narrative in the book is the descent of the Beloved. He comes down from the highest heaven towards earth — and He does not reveal Himself. At each realm He takes on an appearance answering to the beings of that realm, and its rulers do not recognise Him. Seventh heaven, sixth, fifth, fourth, third, second, first, the firmament, and then earth, with His glory concealed the whole way.
      - The reason is that the hostile rulers must not know Him, and the New Testament sentence this illuminates is 1 Corinthians 2.8 — none of the rulers of this age understood, "for had they known it, they would not have crucified the Lord of glory". Read against this book, those rulers are not merely human politicians; they include the hostile spiritual powers, and Christ's identity stays hidden until the victory is decided. That does not show that Paul used this book. It may equally preserve a shared early Christian reading of Christ's triumph over the powers.
      - The Incarnation here is therefore a concealed mission into occupied territory. Christ does not merely arrive to teach; He enters a world under hostile domination, His descent hidden and His purpose strategic, and the Crucifixion which looks like defeat is the point at which the powers destroy themselves. It corresponds closely to Colossians 2.15, where Christ disarms the principalities and powers; to Hebrews 2.14, where through death He destroys the one who holds the power of death; and to 1 John 3.8. This is among the earliest surviving Christian attempts to say what the cosmic victory looked like behind the visible events of the Gospel.
  - heading: To Sheol, and Back in Glory
    body:
      - The mission does not end at the Cross. The Beloved descends further, to the realm of death, and the work thereby joins the early Christian tradition of the descent into Hades — the world of 1 Peter 3, Ephesians 4, Acts 2, and of the Church's Paschal theology. It is not the source of Orthodox Holy Saturday theology; it is evidence of how early Christians read Christ's death as an invasion and defeat of death's own territory.
      - Then the movement reverses, and the symmetry is the book's finest structural stroke. On the way down His identity was concealed at every level; on the way up it is disclosed at every level. The powers who let Him pass unnoticed now see who went through them, and the whole hierarchy acknowledges His authority.
      - "Glory, hidden descent, Incarnation, death, the realm of death — and then Resurrection, ascent, recognition, enthronement in glory. The apocalypse then runs on to Christ's return, the destruction of Beliar, the resurrection and the judgment, and the same conviction holds at the end as at the beginning: salvation is cosmic restoration. The righteous are not souls leaving the earth. They are transformed, clothed, crowned, enthroned, and given the place in creation that the rebellious powers forfeited."
  - heading: Canonicity, and the Fathers
    body:
      - The Ascension of Isaiah is not part of the biblical canon of the Eastern Orthodox Church, and it should be classified as early Christian extra-biblical literature rather than Scripture. Its preservation in Ethiopian and other Eastern Christian traditions shows historical interest and wide transmission, not canonical authority.
      - Its early circulation is not hypothetical. Origen knew an apocryphal work associated with Isaiah; Epiphanius refers to an Ascension of Isaiah; Jerome knew an Ascensio Isaiae. Darrell Hannah has argued for a relationship between the book's heavenly vision and early Christian Trinitarian interpretation of Isaiah 6 — offered here as scholarship, not as demonstrated patristic dependence.
      - "Several of its themes have striking Orthodox parallels: Christ as victor over the demonic powers, the descent into Hades, heavenly worship, angels and saints worshipping together, the glorification of human beings, incorruption, and the saints enthroned with Christ. None of those doctrines depends on this book. Its value is that it shows a religious world in which such things were already being said, very early."
  - heading: Beside the Other Works in this Section
    body:
      - "Set against its neighbours here, the Ascension is the one that carries the shared apocalyptic furniture across into explicit Christianity. Read with the Apocalypse of Abraham in particular, the two show something a single book cannot: the passage from Jewish Angel-of-the-Lord traditions into an explicitly Christian Christology."
