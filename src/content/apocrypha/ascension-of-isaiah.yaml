  - heading: Modern Orthodox Discussion
    body:
      - The principal modern Orthodox treatment is the June 2024 Lord of Spirits episode in which Fr Stephen De Young and Fr Andrew Stephen Damick walk through the work at length. They do not merely mention it; they take its structure apart and set it against Scripture, and roughly half of a three-hour episode goes to this book.
      - "Fr Stephen's positions, gathered: the work is composite, with a Jewish martyrdom tradition, an explicitly Christian heavenly vision, and the Testament of Hezekiah inserted into the earlier material. Its components are second-half-of-the-first-century, combined early in the second. Hebrews and the martyrdom tradition draw on the same circulating story rather than one quoting the other. Beliar operates through human persecutors, so the martyrdom has a visible and an invisible dimension at once. Isaiah's guide is an Angel-of-the-Lord figure, and the Christian identification of that figure with Christ is already present here. The seven heavens are a spiritual hierarchy and not seven atmospheric layers. The fallen powers rebel by receiving worship and become the gods of the nations. Human saints take the places they forfeited, receiving crowns, garments and thrones. The garments are resurrection and incorruption, read with 1 Corinthians 15. The Father, Christ and the Spirit are named and worshipped together, which he takes as strong evidence that what Nicaea articulated belongs to apostolic-era Christianity. And the Angel of the Holy Spirit is a visionary representation of the Spirit, not a created Spirit."
      - These are recorded here as his readings of an ancient text, which is how he offers them, and not as Orthodox doctrine.
  - heading: What It Can and Cannot Establish
    body:
      - It can illuminate early Christian angelology; the seven-heaven traditions; Sammael and Beliar; the powers of the air; divine-council traditions and the gods of the nations; Christ's cosmic victory; Angel-of-the-Lord Christology; early Trinitarian worship; resurrection imagery and the heavenly garments; the glorification of the saints; Antichrist traditions; the martyrdom tradition of Isaiah; and early Christian interpretation of Isaiah.
      - It cannot on its own establish Orthodox dogma; a literal map of seven physical heavens; an Orthodox hierarchy containing Sammael; that every adversarial name denotes a different demon; that the Holy Spirit is an angel; that the saints replace some specified number of angels; that Hebrews quotes it or that Paul read it; or that every detail of its Christology is normative Orthodox teaching.
      - The table below applies that distinction to the claims most often made about this book.
    table:
      columns:
        - Commonly said
        - Status
        - What can be said
      rows:
        - - The Ascension of Isaiah is a Jewish book
          - Only partly
          - It preserves older Jewish traditions, especially the martyrdom, but major portions are unmistakably Christian
        - - The whole book was written before Jesus
          - "False"
          - The Christian sections discuss Christ, the apostles and the Church
        - - It is a late medieval Christian fantasy
          - "False"
          - Its traditions and components are ancient, and it was known in early Christianity
        - - Hebrews quotes the Ascension of Isaiah
          - Not established
          - Both likely witness to a circulating tradition about Isaiah's death
        - - Sammael, Satan, Beliar and Belial are four different devils
          - Not established
          - Ancient texts use adversarial names and titles in overlapping ways
        - - The Holy Spirit is an angel
          - Incorrect as a reading of the text
          - The Angel of the Holy Spirit is better understood as a visionary representation of the Spirit
        - - The seven heavens are planets or atmospheric layers
          - Too simplistic
          - The work describes a hierarchical spiritual cosmos
        - - It shows what heaven physically looks like
          - "No"
          - It is apocalyptic literature using visionary and symbolic geography
        - - Christ is just another angel in it
          - "False"
          - Angelomorphic imagery is used, but the Beloved is pre-existent, receives worship, conquers the powers and returns to glory
        - - Trinitarian Christianity was invented at Nicaea in AD 325
          - Hard to sustain
          - This very early Christian text has the Father, Christ and the Spirit named and worshipped together
collections:
  - key: heavenly
    title: The Figures of the Highest Heavens
    navLabel: Heavenly Figures
    tone: faithful
    display: list
    intro:
      - The Great Glory, the Beloved, the Angel of the Holy Spirit — and the guide who would not give his name.
      - Four related identities stand close together at the summit of this vision, and the text distinguishes them. Collapsing them into one another is the commonest error made with this book, so each is set out separately here.
    entries:
      - name: The Great Glory
        refs:
          - Ascension of Isaiah 9
          - Ascension of Isaiah 10
          - Isaiah 6
          - Daniel 7
        body:
          - God the Father, encountered at the summit of the ascent — transcendent, and not simply to be looked upon.
          - The distinction between the Great Glory and the visible heavenly figures Isaiah meets is deliberate, and it is what gives the rest of the vision its shape. The Father is not made visible; the Beloved and the Spirit are seen and worshipped.
      - name: The Beloved
        refs:
          - Ascension of Isaiah 9
          - Ascension of Isaiah 10–11
          - 1 Corinthians 2.8
          - Colossians 2.15
          - Hebrews 2.14
        relatedHref: saint/OS-0000
        relatedLabel: Jesus Christ →
        body:
          - The book's central title for Christ, and its Christology is remarkably explicit for so early a text. The Beloved exists in heaven before the Incarnation, is worshipped by the heavenly beings, receives a mission from the Father, descends in disguise through every realm, enters human life, is crucified, goes down to the realm of death, rises, ascends, and returns to glory.
          - This is not the story of an exalted human being. Modern scholarship treats it as major evidence for early angelomorphic or heavenly Christology; Jonathan Knight reads the Beloved as a distinctive early Christian synthesis of Jewish apocalyptic heavenly traditions with Christian belief in pre-existence, descent and enthronement.
          - "Angelomorphic does not mean angelic. The claim sometimes made — that Christ is just another angel in this book — is false: He is the pre-existent Beloved who receives worship, defeats the hostile powers, and is enthroned in glory."
        lists:
          - label: Orthodox status
            items:
              - That Christ is pre-existent, descends, dies, harrows death and is enthroned is Orthodox faith, grounded in Scripture
              - The title "the Beloved", the disguised descent, and the realm-by-realm concealment belong to this book
              - Its imagery is early Christian witness, not a dogmatic definition
      - name: The Angel of the Holy Spirit
        refs:
          - Ascension of Isaiah 9
          - Ascension of Isaiah 11
        body:
          - The strangest expression in the book, and the easiest for a modern reader to misunderstand.
          - It does not mean that the Holy Spirit is a created angel. Fr Stephen De Young explicitly rejects that reading, taking the angelic figure as a visible representation of the Spirit within a vision — the Spirit not being bodily visible — comparable to the way visionary literature elsewhere renders invisible divine realities in visible form.
          - Any record built from this figure has to carry the warning with it. The phrase is a feature of the vision, not a teaching that the Spirit is an angel.
        lists:
          - label: Orthodox status
            items:
              - The Holy Spirit is God, worshipped and glorified together with the Father and the Son
              - The phrase "Angel of the Holy Spirit" belongs to this book's visionary language
              - It must never be cited as evidence that the Spirit is a created being
      - name: Isaiah's guide
        refs:
          - Ascension of Isaiah 6–7
          - Exodus 23.20–21
          - Judges 13
        hostId: HH-0019
        relatedLabel: The Angel of the Lord →
        body:
          - An angelic figure of a different order from the angels Isaiah already knows as a prophet, who comes to carry him up and who at first withholds his name.
          - Fr Stephen De Young reads him as an Angel of the Lord figure and interprets the narrative christologically, holding that the Christian identification of the Angel of the Lord with Christ is already present in this very early source.
          - The identification is interpretation. This page links to the Angel of the Lord as a related record and does not assert it, precisely because the guide, the Beloved, the Angel of the Holy Spirit and the Great Glory stand so close together in the text that any merging of them needs to be argued rather than assumed.
  - key: adversaries
    title: Beliar, Sammael and the Hostile Powers
    navLabel: The Adversaries
    tone: fallen
    display: list
    intro:
      - The adversary of this book goes by more than one name — and that is the point.
      - Beliar, Sammael, Satan and the Malkira-type titles overlap substantially in this literature. They are not a catalogue of four separate supreme demons, and must not be recorded as one.
    entries:
      - name: Beliar
        meaning: a form of Belial
        refs:
          - Ascension of Isaiah 1–5
          - Ascension of Isaiah 4.1–13
          - 2 Corinthians 6.15
        hostId: HH-0050
        relatedLabel: Satan / the Devil →
        body:
          - The principal adversarial title in much of the book, and effectively a Satan figure — tied to lawlessness, idolatry, persecution, false prophecy, corrupt rulers, and the hostile powers of the heavens.
          - "The name belongs to a wide Second Temple tradition, in the Dead Sea Scroll literature and the Testaments of the Twelve Patriarchs among others, and it is in the New Testament: Paul asks what accord Christ has with Belial."
          - Behind Manasseh's persecution of Isaiah stands Beliar, working through a hostile false prophet. Human evil and demonic evil operate together, and the human persecutors remain fully responsible — the pattern of Pharaoh and the gods of Egypt, of Judas and Satan, of the beasts and the dragon.
          - In the Christian section of chapters 3–4 he manifests through an earthly ruler who claims divine status, works deceptive signs, demands worship and persecutes the faithful, until Christ destroys him. The ruler is drawn with details pointing unmistakably at Nero.
        lists:
          - label: Orthodox status
            items:
              - Belial is a name Scripture itself uses of the adversary, at 2 Corinthians 6.15
              - The developed narrative of Beliar's work through Manasseh and through a Nero-like ruler belongs to this book
              - An early Christian Antichrist tradition — not a claim that Nero literally returns from the dead
      - name: Sammael
        meaning: Samael · Samail
        refs:
          - Ascension of Isaiah 1
          - Ascension of Isaiah 2
          - Ascension of Isaiah 7
        body:
          - Isaiah meets Sammael and his powers in the firmament, the lower spiritual realm below the heavens proper, where they are in conflict and envy — and the disorder of earth reflects the disorder among them.
          - Fr Stephen De Young identifies him as a fallen archangel and connects the titles associated with him to the powers working through Isaiah's persecutors.
          - How he relates to Beliar is the open question, and scholarly analysis finds the names overlapping rather than denoting separate beings. This page does not treat them as two demons.
        lists:
          - label: Orthodox status
            items:
              - Sammael is not a name Orthodox tradition uses, and no order of the Church's hierarchy contains him
              - Whether he is distinct from Beliar in this book is genuinely unclear; the names overlap
      - name: The powers who became the gods of the nations
        refs:
          - Ascension of Isaiah 7
          - Deuteronomy 32.8–9
          - Psalm 81 (82)
          - Daniel 10
          - 1 Corinthians 10.20
          - Ephesians 6.10–12
        hostId: HH-0051
        relatedLabel: The Watchers →
        body:
          - "The rebellion in this book is not the Watchers' rebellion. On Fr Stephen De Young's reading these powers sin by wanting worship: they take the honour due to God and become the gods of the nations."
          - That places the work with the divine-council material of Deuteronomy 32, Psalm 81 (82), Daniel 10 and 1 Corinthians 10 rather than with Genesis 6, and it gives this section a second ancient account of what heavenly rebellion consisted of, standing beside the Enochic one rather than blending into it.
          - They inhabit the firmament and the lower heavens — which is why this book is so useful for reading Paul's prince of the power of the air, and the rulers, authorities and cosmic powers of Ephesians 6. The cosmos is not earth plus one heaven; "the heavens" are layered, and some of the lower storeys are held by rebels.
          - The Watchers record is linked here for the contrast, not because this book tells their story.
        lists:
          - label: Orthodox status
            items:
              - That spiritual powers stand behind the idols of the nations is scriptural — Deuteronomy 32, Psalm 81 (82), 1 Corinthians 10
              - This book's particular account of their rebellion, and its right-and-left cosmic geography, is its own
              - The right and the left are symbolic; Orthodoxy does not teach that angels stand permanently on one side of God
    outro:
      - Catalogued for study, never venerated. Where the names overlap, this page says that they overlap rather than inventing distinct beings to tidy the record.
  - key: heavens
    title: The Seven Heavens of the Ascent
    navLabel: The Heavens
    tone: neutral
    display: table
    intro:
      - What stands at each level, from the disordered firmament to the throne.
      - "The organising principle is glory, not inventory: each realm is more glorious than the one below. These are not the heavens of 2 Enoch, and the disagreement between them is the useful fact — there was no standard ancient map."
    table:
      columns:
        - Level
        - What stands there
      rows:
        - - The firmament
          - Sammael and his powers, in conflict and envy; the disorder of earth reflects the disorder here
        - - First to fifth heavens
          - Angels, worship, a throne, and greater glory at each level; beings ranged on the right and on the left
        - - Sixth heaven
          - No left-hand company and no subordinate throne; the beings worship together in unity
        - - Seventh heaven
          - The righteous; thrones, crowns and garments prepared for them; the Beloved, the Angel of the Holy Spirit and the Great Glory
    entries: []
    outro:
      - The movement of the whole vision runs from conflict, through increasing order, to unified worship, and finally to divine glory. The descent of the Beloved runs the same ladder in reverse, unrecognised at every rung.
  - key: glorified
    title: The Glorified Saints
    navLabel: The Saints
    tone: faithful
    display: list
    intro:
      - Human beings already in the highest heaven, and what Isaiah sees laid out for them.
      - "This is the book's most distinctive anthropology: the saints occupy the places rebellious powers forfeited, and what they receive is not decoration but office."
    entries:
      - name: Enoch among the righteous
        refs:
          - Ascension of Isaiah 9.9
          - Genesis 5.24
        relatedHref: saint/OS-2532
        relatedLabel: Righteous Forefather Enoch →
        body:
          - "Isaiah sees the righteous in the highest heaven, and one of them is named: Enoch. Other saints are present with him, but he alone is identified in the scene."
          - He is not the protagonist here, as he is in 1 and 2 Enoch. He functions as the archetypal righteous man already associated with heavenly ascent — the recognisable face among the glorified.
      - name: The crowns, thrones and garments
        refs:
          - Ascension of Isaiah 8
          - Ascension of Isaiah 9
          - 1 Corinthians 15
          - 1 Corinthians 6.3
          - Revelation 3.21
        body:
          - Isaiah sees crowns, thrones and garments prepared for the righteous, and each carries a meaning. Crowns are victory and royal authority; thrones are participation in heavenly rule and judgment; garments are transformation out of a mortal and corruptible existence into a glorified one.
          - Fr Stephen De Young puts particular weight on the garments as an early Christian parallel to Paul's language of being clothed with immortality — the old garment mortality and corruption, the new one life and incorruption — and contrasts that with later readings which reduce clothing imagery to the imputation of righteousness.
          - 'The pattern of saints receiving what rebellious powers gave up is thoroughly biblical: the saints receive the kingdom in Daniel 7, the apostles sit on thrones in Matthew 19.28, "we shall judge angels" in 1 Corinthians 6.3, the victor sits with Christ in Revelation 3.21.'
        lists:
          - label: Orthodox status
            items:
              - The glorification and enthronement of the saints is scriptural and thoroughly Orthodox
              - The resonance with theosis and incorruption is real; the later vocabulary should not be imposed backwards on the text
              - That the saints replace some specified number of angels is not established by this or any book
      - name: Isaiah himself
        refs:
          - Ascension of Isaiah 6–11
          - Ascension of Isaiah 5
        relatedHref: saint/OS-1134
        relatedLabel: Prophet Isaiah →
        body:
          - As he ascends, Isaiah becomes progressively able to share in the worship of each heaven — the seer is changed by the seeing.
          - "The righteous are described as becoming like the angels, and Fr Stephen De Young stresses what that does not mean: not ceasing to be human, and not becoming disembodied spirits. Their existence is transformed, as in Paul's resurrection theology."
          - The book's anthropology follows from that. Salvation is not escape from punishment or from the body; it is restoration, glorification, enthronement, and incorporation into God's heavenly government.
  - key: figures
    title: The Figures of the Martyrdom
    navLabel: The Martyrdom
    tone: neutral
    display: cards
    intro:
      - The human cast of the first five chapters.
      - Only Isaiah is commemorated by the Church and carries a page here; the rest are figures of the narrative, and Belkira belongs to this book alone.
    entries:
      - name: Isaiah
        relatedHref: saint/OS-1134
        relatedLabel: Prophet Isaiah →
        blurb: Sawn in two under Manasseh, in the tradition this book preserves. Hebrews 11.37 says some of the faithful were sawn in two, without naming him.
      - name: Hezekiah
        blurb: Isaiah's king in the opening chapters, and the name attached to the Christian apocalypse embedded at 3.13–4.22 — the so-called Testament of Hezekiah.
      - name: Manasseh
        blurb: The king under whom idolatry is restored and Isaiah is killed. The book has Beliar working behind him, without excusing him.
      - name: Belkira
        blurb: The hostile false prophet through whom Beliar brings about Isaiah's death. Known from this book; his name appears in several forms, and in Malkira-type titles that overlap with the adversary's own.
