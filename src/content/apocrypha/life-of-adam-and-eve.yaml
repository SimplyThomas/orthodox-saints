  - heading: Eve's Account of the Fall
    body:
      - The heart of the Greek witness is a long passage in which Eve, as Adam lies dying, gathers her children and tells them what happened — Genesis 3 retold in the first person by the woman who was there.
      - "The retelling adds a great deal. Paradise is divided, Adam keeping one part and Eve another, with angels set to guard them; the angels withdraw at the hour of worship, and it is then that the adversary comes. Satan does not simply use the serpent as a mouthpiece: he approaches the serpent first, persuades it, and speaks through it as a vessel. Eve is made to swear an oath before she is given the fruit, and she then gives it to Adam with the same words used on her."
      - The account is also emotionally particular in a way Genesis is not. Eve accuses herself, describes the moment she understood she was naked of the righteousness she had been clothed with, and cries out that she has sinned before God and before the angels.
      - None of this is Genesis, and the page does not present it as an expansion authorised by Genesis. It is an ancient Jewish and Christian meditation on Genesis 3, and it is the most sustained early one that survives.
  - heading: The Penance in the Rivers
    body:
      - This episode belongs to the Latin, Armenian and Georgian witnesses, and is not in the Greek.
      - "Driven out and starving, Adam and Eve find nothing to eat like the food of Paradise, and Adam proposes penance: he will stand in the Jordan for forty days and Eve in the Tigris for thirty-seven, silent, the water up to their necks, entreating God."
      - Satan interrupts it. He comes to Eve disguised as an angel of light — the disguise is the point — and tells her that God has heard and sent him to bring her out of the water. She believes him and leaves the river, and when Adam sees what has happened he cries out to her that she has been deceived a second time. Satan is then made to explain himself, which is where the next section begins.
      - "Two things follow for a reader. First, the episode is a study in the discernment of spirits long before that phrase was current: the deception works precisely because it comes as consolation and as light. Second, it is narrative, and this page does not present the penance as a historical fact about Adam and Eve."
  - heading: Satan's Refusal to Honour Adam
    body:
      - Asked why he pursues them, Satan gives an account of his own fall — and it is one of the most consequential passages in all extra-biblical literature.
      - In the Latin Vita he says that when Adam was made in the image of God, Michael brought him and set him before the face of God, and God commanded the angels to worship the image of God. Michael worshipped first and called the others to do the same. Satan refused, saying that he would not worship one lower and later than himself, that he was prior in creation, and that Adam ought rather to worship him. Angels under him followed his refusal. For this he and they were cast down out of heaven onto the earth, and his hostility to humanity dates from it — he pursues Adam and Eve because through them he lost his glory.
      - The episode appears in the Latin, Armenian, Georgian and Slavonic witnesses. It is not in the Greek Apocalypse of Moses, which has no such scene. That distribution is the fact most often got wrong, and it matters, because the same claim is routinely presented as what "the Life of Adam and Eve" says.
      - It is also, emphatically, not in Genesis. Genesis narrates no command to the angels concerning Adam, no refusal, and no fall of Satan. Anyone citing this story should say which witness they are citing and should not attribute it to Scripture.
