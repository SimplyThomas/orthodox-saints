          - Apocalypse of Moses
          - Eve's first-person account of the fall; Adam's death and Eve's vision of the chariots; the angelic burial with Abel. No refusal-to-bow episode and no penance in the rivers
        - - Latin
          - Vita Adae et Evae
          - The penance in the rivers; Satan's deception of Eve as an angel of light; Satan's account of his own fall and refusal to honour Adam
        - - Armenian
          - The Penitence of Adam
          - Close to the Latin in shape; carries the refusal episode; preserves material the Greek lacks
        - - Georgian
          - The Book of Adam
          - Carries the refusal episode; an important independent witness to the non-Greek branch
        - - Slavonic
          - Life of Adam and Eve
          - Carries the refusal episode; transmitted in Slavic Christian manuscript culture
    entries: []
    outro:
      - The row that matters most is the first. The story everyone quotes from this literature is not in the witness everyone names.
  - key: refusal
    title: Satan's Refusal to Honour Adam
    navLabel: The Refusal
    tone: fallen
    display: list
    intro:
      - One of the most influential stories in the history of Christian demonology — and not in Genesis, and not in the Greek.
      - Latin, Armenian, Georgian and Slavonic. Anyone citing it should name the witness.
    entries:
      - name: Satan
        meaning: who names his own fall, and dates his hatred from it
        refs:
          - Vita Adae et Evae 12–16 (Latin)
          - Wisdom of Solomon 2.24
          - Luke 10.18
          - Revelation 12.9
        hostId: HH-0050
        relatedLabel: Satan / the Devil →
        body:
          - Asked by Adam why he pursues them, Satan explains himself. When Adam was made in the image of God, Michael brought him and set him before the face of God, and God commanded the angels to worship the image of God. Michael worshipped first and called the rest to do the same.
          - Satan refused. He would not worship one lower and later than himself; he was prior in creation, and Adam ought rather to worship him. Angels under his authority refused with him. For this he was cast out of heaven onto the earth, and his hostility to humanity dates from that moment — he pursues Adam and Eve because it was through them that he lost his glory.
          - "The motive here is not simply pride but envy, and that is the version with the strongest canonical relative: Wisdom of Solomon 2.24 says that through the envy of the devil death entered the world. Scripture gives a fall, an expulsion with his angels, an identification with the ancient serpent, and envy. It does not give this scene."
          - Genesis narrates no command to the angels concerning Adam, no refusal and no fall of Satan. Nor is the episode in the Greek Apocalypse of Moses. It belongs to the Latin, Armenian, Georgian and Slavonic branch.
        lists:
          - label: Source register
            items:
              - Holy Scripture — that Satan fell and was cast down with his angels, and that death entered by his envy
              - This literature — the command, the refusal, the speech, and the dating of his hatred from it
              - Not in Genesis, and not in the Greek witness
              - Not the source of later Christian demonology on its own; that is a braid of several strands
      - name: Michael, who worshipped first
        refs:
          - Vita Adae et Evae 14 (Latin)
          - Genesis 1.26–27
          - Psalm 8
          - Hebrews 2.5–9
        hostId: HH-0010
        relatedLabel: Archangel Michael →
        body:
          - Michael's part is easily missed and is the hinge of the scene. He brings Adam before God, worships first, and calls the other angels to follow — and when Satan refuses, it is Michael who warns him of God's anger.
          - He is the model of the obedience Satan withholds, which is the same characterisation Jude 9 gives him when he will not presume to judge the devil on his own authority. In this literature as in Scripture, Michael's greatness is his subordination.
          - The honour he renders is to the image of God in Adam — Genesis 1.26–27, humanity crowned with glory and honour in Psalm 8, and Hebrews 2 arguing that the world to come was subjected not to angels but to man. Those are the coordinates the story works within.
      - name: Worship, or homage?
        refs:
          - adorare (Latin)
          - proskynein (Greek)
        body:
          - The verb decides what the scene means. Latin adorare and Greek proskynein both cover a wide range — falling down before, doing obeisance, paying homage, reverencing — and both are used for honour given to a king or superior as well as for the worship due to God alone. English "worship" once had the same range and no longer does, which is why the modern rendering misleads.
          - "The angels are not asked to give Adam what belongs to God. They are asked to do homage before the image of God in him, and the text says exactly that: the command is to worship the image of God."
          - This distinction matters for the whole page. "Angels were commanded to worship Adam as God" is a mistranslation, and it is the form in which the story is most often repeated.
        lists:
          - label: Orthodox status
            items:
              - That humanity is made in the image of God is Scripture and Orthodox teaching
              - The distinction between veneration and the worship due to God alone is settled Orthodox doctrine, and it applies here
              - The scene itself remains extra-biblical narrative
    outro:
      - Catalogued for study. Where the versions differ, this page names the version rather than choosing one and calling it the tradition.
  - key: angels
    title: The Angels of the Adam Story
    navLabel: The Angels
    tone: faithful
    display: cards
    intro:
      - Who actually appears, and in which witness.
      - Fewer than popular accounts suggest. An angel named in this literature does not thereby become an archangel of the Church.
    entries:
      - name: Michael
        hostId: HH-0010
        relatedLabel: Archangel Michael →
        blurb: "Throughout the family: he presents Adam before God and worships first (Latin); he refuses Seth the oil of mercy at the gate of Paradise; he intercedes at Adam's death, receives his soul, buries the body, and instructs Seth about the sign of the resurrection."
      - name: Uriel
        hostId: HH-0013
        relatedLabel: Archangel Uriel →
        blurb: Named in the Greek with Michael as the archangel who carries and buries the bodies of Adam and Abel. His standing in Orthodox tradition rests on that tradition, not on this appearance.
      - name: The angels of Paradise
        blurb: Set to guard the divided portions of the garden in Eve's account, and withdrawn at the hour of worship — which is when the adversary comes. Unnamed.
      - name: The angels at the burial
        blurb: "Bring linen cloths of fine byssus at God's command, and conduct the burial as a service: incense, prostration, prayer and procession. The earliest full picture in this literature of a funeral attended by the heavenly host."
      - name: The sun and the moon
        blurb: In Eve's vision they make supplication for Adam and cannot shine in the presence of the light of all things — the created order interceding for the head of the race.
      - name: The seraphim
        hostId: HH-0001
        relatedLabel: The Seraphim →
        blurb: Appear among the heavenly attendants in the death and burial scenes of some witnesses. The linked record is the Church's own; the scene here is this literature's.
  - key: death
    title: Adam's Death and Burial
    navLabel: The Death
    tone: neutral
    display: list
    intro:
      - Genesis gives Adam's death one line. This literature spends its last third on it.
      - The first illness, the refused request, the opened heavens, and the first burial — attended by angels, with the first murdered man laid in the earth beside his father.
    entries:
      - name: The oil of mercy
        refs:
          - Apocalypse of Moses 9, 13 (Greek)
          - Vita Adae et Evae 40–42 (Latin)
          - Genesis 5.5
        body:
          - Adam falls ill and sends Eve and Seth back toward Paradise to beg oil from the tree of mercy, that he might be anointed and have relief. On the way, in several witnesses, a beast attacks Seth and Eve rebukes it — an episode about the dominion over the animals that humanity has lost.
          - "Michael meets them at the gate and refuses. The oil cannot be given now. The promise attached is future: at the end of the times, when the appointed years are fulfilled, the mercy will come and the righteous will be anointed."
          - The Christian resonance is obvious and some witnesses sharpen it. Whether the promise as it stands is Jewish expectation or Christian shaping is exactly what the composition problem makes hard to settle, and connecting the oil to baptism or chrismation is a reading no witness on its own supports.
          - Seth returns with nothing. It is a remarkable thing for the literature to have done — the request that drives the last act is refused, and Adam accepts the refusal.
        lists:
          - label: Source register
            items:
              - Holy Scripture — Genesis 5.5, that Adam lived nine hundred and thirty years and died
              - This literature — the illness, the journey, the tree of mercy, the refusal and the promise
              - Not established — any sacramental identification of the oil
      - name: Eve's vision
        refs:
          - Apocalypse of Moses 33–37 (Greek)
        body:
          - As Adam dies Eve looks up and sees the heavens opened — a chariot of light borne by four bright eagles, angels going before it, and the sun and moon making supplication for her husband. The chariot comes and stands over the body, and there is the smoke of incense between.
          - The angels fall down and cry to God to forgive him, for he is God's image and the work of God's hands. God does not answer at once; Michael and the angels intercede; and at length the soul is received.
          - In the Greek the soul is given into Michael's keeping until the day of dispensation, in the third heaven and in Paradise — held against a future restoration rather than simply arriving somewhere. This is the one genuinely visionary passage in the Greek text, and the nearest thing it has to the apocalypse its title promises.
          - Adam's death is the first human death and is treated as unique — the head of the race dying, and the whole creation reacting. Reading it as a description of what happens to every soul goes past what the narrative claims.
      - name: The burial, and the sign of the resurrection
        refs:
          - Apocalypse of Moses 38–43 (Greek)
          - Genesis 4.8
        relatedHref: saint/OS-2526
        relatedLabel: Righteous Abel →
        body:
          - God commands linen cloths of fine byssus, and the body is wrapped and prepared. Michael and Uriel carry it and bury it in the region of Paradise — and with Adam they bury Abel, whose body had lain unburied since Cain killed him. The first man and the first murdered man go into the earth together.
          - "The whole scene is conducted as a service: incense, prostration, angelic prayer, procession, with God present."
          - Eve dies six days later, having prayed to be laid beside her husband. Michael instructs Seth that the dead are not to be mourned beyond six days, because the seventh day is the sign of the resurrection and the rest of the age to come. That is the last word of the story — a promise, not a lament.
          - The resemblance to the Church's burial of the dead is immediate and should be held as resemblance. Nothing here has been shown to have shaped the Orthodox funeral service. What the passage shows is that the picture of angels attending a burial, and of the seventh day as the sign of resurrection, is very old.
  - key: family
    title: Adam's Family
    navLabel: The Family
    tone: neutral
    display: cards
    intro:
      - The four who carry the story, all commemorated by the Church and all with their own pages here.
      - What Genesis says of each and what this literature adds are different things.
    entries:
      - name: Adam
        relatedHref: saint/OS-2524
        relatedLabel: Righteous Forefather Adam →
        blurb: The image of God the angels are commanded to honour, the first to fall ill, the first to die, and the first to be buried — held, in the Greek, against the day of dispensation.
      - name: Eve
        relatedHref: saint/OS-2525
        relatedLabel: Righteous Foremother Eve →
        blurb: Who tells the fall in her own words in the Greek witness, is deceived a second time in the Latin, and sees the heavens opened as her husband dies.
      - name: Seth
        relatedHref: saint/OS-2527
        relatedLabel: Righteous Forefather Seth →
        blurb: Sent to the gate of Paradise for the oil of mercy and refused; taught by Michael about the days of mourning and the sign of the resurrection. His journey is retold in the Gospel of Nicodemus, where he delivers the answer in Hades.
      - name: Abel
        relatedHref: saint/OS-2526
        relatedLabel: Righteous Abel →
        blurb: Whose body had lain unburied since Cain killed him, and who is laid in the earth beside his father when the angels bury Adam.
