  - heading: Worship, or Homage?
    body:
      - A translation question sits underneath the whole episode, and getting it wrong makes the story say something it does not.
      - The Latin verb is adorare, and the Greek equivalent in comparable texts is proskynein. Both cover a wide range — falling down before, doing obeisance, paying homage, reverencing — and both are used in Scripture and in ordinary ancient usage for honour rendered to a king or a superior as well as for the worship due to God alone. English "worship" once carried that same range and no longer does.
      - "So the scene is not asking the angels to render Adam the worship owed to God. It is asking them to do homage before the image of God in him, and the text says as much: the command is to worship the image of God. Adam is honoured for what he bears, not treated as divine."
      - That reading also connects it to genuine biblical material — humanity made in God's image and likeness in Genesis 1.26–27, crowned with glory and honour and set over the works of God's hands in Psalm 8, and the argument of Hebrews 2 that the world to come was not subjected to angels but to man. Those are the scriptural coordinates the story is working within. The story itself is still not in Scripture.
  - heading: What Scripture Says About Satan's Fall
    body:
      - Since this book is so often cited as the origin of Christian demonology, it is worth setting out what the canonical texts actually give.
      - Genesis 1–3 has a serpent, subtle above the beasts of the field, and does not identify it as Satan or narrate any angelic rebellion. Isaiah 14 and Ezekiel 28 are addressed in their immediate contexts to the king of Babylon and the prince of Tyre; Christian tradition has long read them as also disclosing the fall of the adversary, and that reading is interpretation rather than the plain sense, which is why this page does not present them as straightforward descriptions of Satan. Wisdom of Solomon 2.24 says that through the envy of the devil death entered the world — the closest canonical relative of the Adamic material, and the reason envy rather than pride is the motive most easily defended from Scripture. Luke 10.18 has Christ seeing Satan fall as lightning; John 8.44 calls him a murderer from the beginning and the father of lies; Revelation 12.9 identifies the great dragon with the ancient serpent, the devil and Satan, cast down to the earth with his angels.
      - "So Scripture gives a fall, an expulsion with his angels, an identification with the serpent, and envy as a motive. What it does not give is the scene: no command to the angels concerning Adam, no refusal, no speech of self-justification."
      - The Life of Adam and Eve supplies the scene. Whether later Christian demonology took it from there, or both draw on older shared tradition, is not something a catalogue should assert — and no single source should be named as the origin of the whole later tradition of Lucifer's fall, which is a braid of Isaiah, Ezekiel, Wisdom, Luke, Revelation, patristic exegesis and this literature together.
  - heading: Adam's Illness, Seth's Journey, and the Oil of Mercy
    body:
      - "Adam falls ill — the first illness — and gathers his children. Genesis gives his death one line: he lived nine hundred and thirty years, and he died. This literature spends its final third on it."
      - He sends Eve and Seth back toward Paradise to beg the oil of mercy from the tree of mercy, that he might be anointed and have relief. On the way, in several witnesses, a beast attacks Seth, and Eve rebukes it; the episode turns on the loss of the dominion humanity had over the animals.
      - "At the gate the archangel Michael meets them, and refuses. The oil cannot be given now. In the Greek he tells Seth not to labour to obtain it, since it cannot be his at present — and the promise attached is future: at the end of the times, when the appointed years are fulfilled, the mercy will come and the righteous will be anointed."
      - The Christian resonance of that promise is obvious, and some witnesses make it more explicit than others. This page notes it and stops there. Whether the promise as it now stands is Jewish expectation or Christian shaping is exactly the kind of question the composition problem makes hard, and connecting the oil to baptism or to chrismation is a reading no witness on its own supports.
      - "Seth returns empty-handed, and Adam receives the answer without complaint. It is a striking thing for the literature to have done: the request that drives the last act of the story is refused."
  - heading: Adam's Death, and Eve's Vision
    body:
      - As Adam dies, Eve looks up and sees the heavens opened, and this is the visionary passage that gives the Greek text whatever claim it has to be called an apocalypse.
      - She sees a chariot of light borne by four bright eagles, and angels going before it, and the sun and the moon making supplication for Adam — and the chariot comes and stands over her husband's body, and there is the smoke of incense between. The angels fall down and cry out to God to forgive him, for he is Your image and the work of Your hands.
      - God does not answer immediately. Michael and the angels intercede, and at length the body is given over and the soul received. In the Greek the soul is taken up and given into the care of Michael, who is told to keep it until the day of dispensation, in the third heaven and in Paradise — held, that is, against a future restoration rather than simply arriving at a destination.
      - Adam's is the first human death in these texts, and it is treated as unique — the head of the race dying and the whole creation reacting. Reading it as a general description of what happens to every soul goes beyond what the narrative claims for itself.
  - heading: The Angelic Burial, and the Sign of the Resurrection
    body:
      - God commands the angels to bring linen cloths of fine byssus, and Adam's body is wrapped and prepared. Michael and Uriel are named in the Greek as the archangels who carry it and bury it — and with Adam they bury the body of Abel, which had lain unburied since Cain killed him, so that the first man and the first murdered man go into the earth together.
      - "The burial is in the region of Paradise, and the whole scene is conducted as a service: incense, prostration, angelic prayer and procession, with God Himself present. It is the earliest full description in this literature of a funeral attended by the heavenly host."
      - Eve dies six days later, having prayed to be laid beside her husband, and is buried with him. Michael instructs Seth that the dead are not to be mourned beyond six days, because on the seventh day is the sign of the resurrection and the rest of the age to come — the story's last word, and a promise rather than a lament.
      - For an Orthodox reader the resemblance to the Church's own burial of the dead is immediate, and it should be held as resemblance. Nothing here has been shown to have shaped the Orthodox funeral service, whose sources are its own; what the passage shows is that the picture of angels attending a burial and of the seventh day as the sign of resurrection is very old.
  - heading: Not the Cave of Treasures, and Not the Qur'an
    body:
      - Two neighbouring bodies of material are routinely merged with this one, and both mergers produce errors.
      - The Cave of Treasures is a later Syriac Christian work with its own concerns — a continuous sacred history from Adam to Christ, in which Adam's body is preserved in a cave, carried through the ark, and finally buried at Golgotha so that Christ's blood falls upon his skull. That Golgotha tradition is genuinely important in Eastern Christianity and it belongs to the Cave of Treasures, not to the Life of Adam and Eve, which buries Adam in the region of Paradise. Importing it here is the commonest contamination in popular accounts.
      - "The Qur'anic account of Iblis refusing to prostrate before Adam is the other. The comparison is legitimate historically and the chronology should be stated plainly: the Jewish and Christian Adamic witnesses containing the refusal are earlier than the rise of Islam, so the direction of any influence cannot run from Islam into this literature. Whether it ran the other way, or whether both draw on shared late-antique Near Eastern tradition, is a scholarly question this page leaves open. It is raised here only for historical comparison."
  - heading: Canonicity, the Fathers, and Orthodox Reception
    body:
      - No version of this literature is canonical Scripture in any Orthodox tradition, and no Orthodox council received it. Its transmission across Greek, Slavonic, Armenian and Georgian Christian manuscript cultures is nevertheless extensive, and the Armenian and Georgian traditions in particular preserved forms of the material that the Greek does not have.
      - "Patristic use is hard to establish, and this page claims none. The Fathers certainly discuss Satan's envy of humanity — Wisdom 2.24 gave them the motif directly, and it appears in Irenaeus and elsewhere without requiring any knowledge of this literature. St Ephrem's Paradise material, the garments of glory, Adam's lost radiance and the restoration of Adam belong to a rich Syriac tradition with its own roots. Similarity of theme is not evidence of dependence, and the graded categories used elsewhere in this section apply: direct citation, probable dependence, shared tradition, thematic parallel, no evidence — with most of these cases falling in the last two."
      - The same caution governs the liturgical and iconographic questions. Adam lamenting outside Paradise on Cheesefare Sunday, Christ raising Adam in the Anastasis, Paradise reopened at Pascha — these are central Orthodox themes with abundant scriptural and patristic grounding, and no motif among them has been shown to derive from this literature. No surviving Orthodox image is known to illustrate these texts specifically.
      - A sourcing note, in the spirit of the rest of this section. This page was written from a research brief rather than a completed source dossier. The narrative substance, the version distribution — especially the absence of the refusal episode from the Greek — and the scriptural coordinates are reliable. Bibliographic particulars, chapter references and the precise attribution of some scholarly positions have not been checked against the primary editions, and should be verified before this profile is promoted.
  - heading: What It Can and Cannot Establish
    body:
      - It can illuminate ancient interpretation of Genesis 2–3; the growth of Satan traditions and of the motive of envy; the developing portrait of Michael; Adam as the image of God and the honour due to that image; Paradise and the oil of mercy; repentance and the deception of the penitent; the first death and the first burial; angelic attendance at a funeral; the hope of resurrection; and the way Eastern Christian manuscript cultures preserved Adamic material.
      - It cannot establish historical events before or after the Fall; an Orthodox account of Satan's rebellion; a canonical command that angels bow to Adam; Orthodox teaching about death or the soul; an angelic hierarchy; the standing of any angel named only here; influence on Orthodox liturgy or iconography without separate evidence; or doctrine drawn from an isolated manuscript variant.
    table:
      columns:
        - Commonly said
        - Status
        - What can be said
      rows:
        - - The Life of Adam and Eve says Satan refused to bow to Adam
          - Names the wrong thing
          - The episode is in the Latin, Armenian, Georgian and Slavonic witnesses; it is not in the Greek Apocalypse of Moses
        - - Genesis describes Satan's refusal to bow
          - "False"
          - Genesis narrates no command to the angels concerning Adam, no refusal, and no fall of Satan
        - - The Greek and Latin texts are the same work in two languages
          - "False"
          - They are related witnesses of a family, differing in which episodes they contain
        - - The Apocalypse of Moses is about Moses
          - "No"
          - Moses does not appear; the title is a manuscript and editorial convention
        - - Angels were commanded to worship Adam as God
          - Mistranslation
          - The command is homage before the image of God in him; adorare and proskynein cover reverence as well as divine worship
        - - Adam was buried at Golgotha
          - Different work
          - That is the Cave of Treasures, a later Syriac work; here Adam is buried in the region of Paradise
        - - This is where the story of Lucifer's fall comes from
          - Too simple
          - Later tradition braids Isaiah 14, Ezekiel 28, Wisdom 2.24, Luke 10.18, Revelation 12, patristic exegesis and this literature
        - - Islam took the story from this text
          - Not established
          - The Jewish and Christian witnesses are earlier than Islam, but direct borrowing has not been shown and should not be assumed
        - - The text describes what happens to every soul after death
          - Overreaches
          - Adam's death is treated as unique — the head of the race, with the creation reacting
        - - The Orthodox funeral service comes from this book
          - No evidence
          - The resemblance is real; the service has its own sources and no dependence has been demonstrated
        - - Uriel is an archangel of the Church because he buries Adam here
          - Does not follow
          - Uriel's standing rests on Orthodox tradition, not on an appearance in this literature
