overview:
  - The Life of Adam and Eve is not a book. It is a family of related books — Greek, Latin, Armenian, Georgian and Slavonic — telling overlapping but genuinely different versions of what happened to Adam and Eve after they were driven out of Paradise. Treating them as translations of one lost original is the commonest mistake made with this material, and it produces claims no surviving text actually supports.
  - "The Greek witness is confusingly called the Apocalypse of Moses. The title comes from its manuscripts and from the edition that made it famous, not from its contents: there is no Moses in it, and it is not an apocalypse in the sense that 1 Enoch or the Apocalypse of Abraham are. It is a deathbed narrative about Adam, in which Eve retells the fall in her own words."
  - Across the family the story runs roughly like this. Expelled from Paradise, Adam and Eve are hungry and wretched, and undertake a penance standing in the rivers — during which Satan appears to Eve disguised as an angel of light and deceives her a second time. Adam falls ill, and sends Eve and Seth back toward Paradise to beg the oil of mercy from the tree; the archangel Michael refuses it and tells them the time has not come. Adam dies; Eve sees the heavens opened and the chariots of light; the angels bury him with his son Abel; and Eve dies and is buried beside him, with Michael instructing Seth about the days of mourning and the sign of the resurrection.
  - One episode in this family became one of the most influential stories in the history of Christian demonology — Satan explaining that he was cast down because he refused to bow before Adam. It is not in Genesis, and it is not in the Greek. It belongs to the Latin, Armenian, Georgian and Slavonic witnesses, and this page keeps that distinction visible throughout, because almost everything written about it online does not. None of this material is canonical Scripture in any Orthodox tradition. It is catalogued here for study.
sections:
  - heading: Not One Book — the Textual Family
    body:
      - The single most important thing to understand about this material is that "the Life of Adam and Eve says…" is usually an unsafe sentence. The versions differ in what they contain, not merely in wording.
      - Scholars use Life of Adam and Eve as an umbrella term for the whole family, and Apocalypse of Moses for the Greek witness in particular. The Latin is the Vita Adae et Evae; the Armenian is often called the Penitence of Adam; the Georgian the Book of Adam; there is also a Slavonic tradition. They are related — they share episodes, sequences and phrasing — and they are not copies of one another.
      - "Gary Anderson and Michael Stone's Synopsis of the Books of Adam and Eve exists precisely because of this: it sets the versions in parallel columns so a reader can see at a glance which episode stands in which witness. Any serious use of this material starts there."
      - "The practical rule for this page, and for anything drawn from it: name the witness. Where an episode is common to the family, it is described as such. Where it belongs to one branch, the branch is named."
  - heading: The Misleading Title
    body:
      - The Greek text is conventionally called the Apocalypse of Moses, and both halves of that title are misleading.
      - Moses does not appear in it. The name comes from the manuscript tradition and was fixed by the edition that first made the text widely known in the nineteenth century; it seems to reflect a scribal notion that the revelation of Adam's story was given to Moses, who wrote Genesis. Nothing in the narrative depends on him.
      - Nor is it an apocalypse in the sense the other works in this section are. There is no guided ascent through heavens, no angelic interpreter walking a seer through cosmic geography, no vision of the end of the age. It is a deathbed narrative with one visionary passage in it — Eve's sight of the heavens opened while Adam is dying.
      - The title is too entrenched to abandon and too misleading to leave unexplained, which is why this page carries both names.
  - heading: Date, Origin and Authorship
    body:
      - Almost every question here has a range rather than an answer, and the honest presentation is a table of positions rather than a date.
      - The traditional view is of a Jewish work of roughly the first century AD, later transmitted and modified by Christians. That view has been substantially complicated. Johannes Tromp's critical work on the Greek text, and the broader turn associated with Marinus de Jonge, made it much harder to separate a clean Jewish original from Christian editing, and some scholars now place the Greek text as we have it considerably later than the first century. The Latin and the other versions have their own histories, and the relationship between them is itself disputed.
      - The original language is not settled either. Greek is the language of the earliest substantial witness and may represent an early compositional stage; a Semitic original has been hypothesised and has not been demonstrated. Geographic origin is likewise proposed rather than established.
