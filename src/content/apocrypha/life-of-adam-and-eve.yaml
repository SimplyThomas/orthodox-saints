era: Jewish traditions, probably 1st century AD; the versions later
canonicalStatus: Apocryphal · Adamic literature
blurb: Not one book but a family of them — where Eve retells the fall in her own words, Seth is sent to Paradise for the oil of mercy, angels bury Adam, and Satan explains that he fell because he would not bow to a creature made of clay.
order: 11
