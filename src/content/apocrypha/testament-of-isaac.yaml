  - K. H. Kuhn, editions and translations of the Sahidic and Bohairic Coptic texts (Journal of Theological Studies)
  - Dale C. Allison Jr., Testament of Abraham (Commentaries on Early Jewish Literature; de Gruyter, 2003), for the relationship between the three testaments
  - Michael E. Stone and specialists in Coptic pseudepigrapha, on the Arabic and Ethiopic transmission
  - Genesis 21–28 and 35.28–29; Matthew 8.11; Luke 16.19–31; Luke 23.43; Daniel 12.1–3; John 5.28–29; 1 Corinthians 15; Revelation 2.7 and 22.1–5 (Holy Scripture)
  - Catalogued for study; requires clergy/source review before any devotional use. This page was written from a research brief rather than a completed source dossier — see the sourcing note in Canonicity & Reception
