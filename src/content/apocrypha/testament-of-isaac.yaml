  - key: angels
    title: The Angels of the Testament
    navLabel: The Angels
    tone: faithful
    display: list
    intro:
      - Fewer than readers expect, and none of the named judges of the Testament of Abraham.
      - Michael is the messenger; the rest are unnamed groups with offices. Importing names from the neighbouring book is the commonest error made with this text.
    entries:
      - name: The Archangel Michael
        refs:
          - Testament of Isaac 1–2
          - Daniel 10.13, 21
          - Daniel 12.1
          - Jude 9
          - Revelation 12.7
        hostId: HH-0010
        relatedLabel: Archangel Michael →
        body:
          - Sent by God to tell Isaac that his life is ending — the same office he holds in the Testament of Abraham, and part of the evidence that this book works from that one.
          - The scene plays differently, though. In the earlier book Michael cannot bring himself to deliver the message and returns to heaven for help; here the announcement is made and received, and the grief belongs to Jacob rather than to the archangel. Isaac does not resist.
          - "His canonical portrait stands behind this: the prince who contends with hostile powers in Daniel 10, who stands for God's people in Daniel 12, who disputes with the devil in Jude 9, who fights the dragon in Revelation 12. Announcing a patriarch's death and guiding him is this literature's development of that role, not Scripture's."
        lists:
          - label: Source register
            items:
              - Holy Scripture — Michael as prince and defender of God's people
              - This cycle — the messenger of death, the guide, the escort of the soul
              - Not to be assumed — that the same named angels appear across all three testaments
      - name: The angels of punishment
        refs:
          - Testament of Isaac (the vision of torments)
          - Matthew 13.41–42
          - Revelation 14.10–11
        body:
          - Tormenting beings administer the punishments Isaac is shown, each torment fitted to the sin that earned it. They act under divine command rather than on their own account.
          - This belongs to the world of early Christian afterlife literature — the Apocalypse of Peter and the Apocalypse of Paul above all — where the correspondence of sin to torment is the organising device. It is not the courtroom of the Testament of Abraham, with its balance and its fire.
          - None of these figures is named, and none should be given a name from elsewhere. The detailed catalogue of torments has not been verified here against the Coptic and is not printed.
        lists:
          - label: Orthodox status
            items:
              - That there is judgment, and that the impenitent are lost, is Orthodox faith grounded in Scripture
              - The sin-by-sin correspondence of torments is a literary device of this genre, not a cosmology
              - No angel of punishment is named here, and none from the Testament of Abraham belongs in this text
      - name: The angels who receive the soul
        refs:
          - Testament of Isaac (the death of Isaac)
          - Luke 16.22
          - Matthew 8.11
        body:
          - At the end the angels come for Isaac's soul and carry it up, and Abraham comes with them to meet his son — the reunion of father and son beyond death.
          - "The scriptural relatives are real: the beggar carried by the angels to Abraham's bosom in Luke 16, and the patriarchs at table in the kingdom in Matthew 8.11. Angelic escort of the departing is a broad Christian picture with its own roots."
          - What is absent is as important as what is present. There is no aerial passage through stations, no demonic accuser examining the soul, no angelic advocate answering charges. This is not toll-house literature, and describing it as such collapses a distinction worth keeping.
  - key: instruction
    title: What Isaac Teaches, and What He Is Shown
    navLabel: Teaching & Vision
    tone: neutral
    display: list
    intro:
      - "The two halves of the book: a long body of practical instruction, and a guided tour of what lies beyond."
      - The instruction is ordinary early Christian catechesis given extraordinary authority by its setting. The vision is a moral catechism in pictures.
    entries:
      - name: The instruction to Jacob
        refs:
          - Testament of Isaac (the discourse)
          - Genesis 35.28–29
        relatedHref: saint/OS-2349
        relatedLabel: Righteous Patriarch Jacob →
        body:
          - The largest single block of the work, and the least visionary. Isaac teaches Jacob and those around him about purity of body and heart, prayer at the appointed hours, fasting, almsgiving and the care of the poor, hospitality to strangers, guarding the tongue against slander, and the remembrance of judgment that keeps the rest honest.
          - "Almost none of it is distinctive as doctrine — it is the ordinary moral catechesis of early Christianity, and most of it traces directly to Scripture. What is distinctive is the setting: a dying patriarch delivering it, so that familiar teaching acquires the weight of a deathbed and a founding ancestor."
          - Scripture records none of this. Genesis gives Isaac's death in two verses and no final discourse. And the exhortation should not be converted into formal sacramental theology; the text speaks of repentance and turning from sin without providing a doctrine of the sacraments.
      - name: The punishments
        refs:
          - Testament of Isaac (the vision of torments)
        body:
          - Isaac is taken up and shown the places where sinners are punished, each torment fitted to its sin and administered by tormenting beings under divine command.
          - The genre matters. Literature of this kind uses the correspondence between sin and punishment to make moral instruction vivid and memorable, and the nearest relatives are the Apocalypse of Peter and the Apocalypse of Paul rather than the Testament of Abraham. Reading the scenes as a survey of the geography of hell asks them to do something they were not built to do.
          - This page describes the section and does not print a catalogue of torments, which has not been checked against the Coptic editions.
      - name: Paradise, and the intercession
        refs:
          - Testament of Isaac (the vision of Paradise)
          - Matthew 8.11
          - Luke 16.19–31
          - Luke 23.43
        relatedHref: saint/OS-1984
        relatedLabel: Righteous Forefather Abraham →
        body:
          - Then Isaac is shown Paradise, and Abraham is there. The reunion of father and son is the emotional centre of the vision.
          - "Having seen the punishments, Isaac prays for those enduring them. The theme is inherited from the Testament of Abraham — where Abraham condemns sinners, is rebuked by God, and learns to intercede — but the arc is gone: Isaac does not need correcting, and his compassion is the natural response of a righteous man to what he has been shown."
          - The scriptural images behind Paradise here are genuine ones — the patriarchs at table in the kingdom, the beggar carried to Abraham's bosom, the promise to the thief. The tour that reaches them belongs to this book.
          - That the Church prays for the departed is Orthodox practice with its own liturgical and patristic grounding. This book is not among its sources, and the passage should not be used as a proof text.
  - key: figures
    title: The Patriarchs
    navLabel: The Patriarchs
    tone: neutral
    display: cards
    intro:
      - Three generations, all commemorated by the Church among the Holy Forefathers.
      - What Scripture says of each and what this book adds are different things, and the links go to the saints the Church honours.
    entries:
      - name: Isaac
        relatedHref: saint/OS-2348
        relatedLabel: Righteous Patriarch Isaac →
        blurb: Who accepts the announcement of his death without resisting it, teaches his son, is shown the punishments and Paradise, prays for sinners, and is carried away by the angels to be buried beside his father.
      - name: Abraham
        relatedHref: saint/OS-1984
        relatedLabel: Righteous Forefather Abraham →
        blurb: Waiting in Paradise, and coming with the angels to meet his son's soul. His own Testament is the book this one is built from.
      - name: Jacob
        relatedHref: saint/OS-2349
        relatedLabel: Righteous Patriarch Jacob →
        blurb: Who clings to his father and will not be comforted, and who receives the instruction — and who gets a testament of his own, the third of the cycle.
      - name: Rebecca
        relatedHref: saint/OS-2355
        relatedLabel: Righteous Rebecca →
        blurb: Isaac's wife and Jacob's mother, commemorated with the Foremothers. Genesis gives her far more than this literature does.
