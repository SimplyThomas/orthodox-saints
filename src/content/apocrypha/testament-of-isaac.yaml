slug: testament-of-isaac
title: The Testament of Isaac
aka:
  - Testamentum Isaaci
era: Christian; Coptic transmission, the surviving form probably 2nd–3rd century onward
canonicalStatus: Apocryphal · Coptic Christian
blurb: "The middle book of the Abraham–Isaac–Jacob cycle: an angel announces Isaac's death, Isaac instructs Jacob, and is then shown the punishments of sinners and Paradise before the angels carry his soul away. Preserved above all in Egypt."
order: 13
status: draft
humanReviewed: false
sources:
