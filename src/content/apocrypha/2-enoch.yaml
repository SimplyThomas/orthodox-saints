overview:
  - 2 Enoch, traditionally called Slavonic Enoch or the Book of the Secrets of Enoch, is an ancient pseudepigraphal apocalypse attributed to the patriarch Enoch. It takes the single verse in which Genesis says that Enoch "walked with God; and he was not, for God took him" (Genesis 5.24) and expands it into a full narrative — Enoch's ascent through the heavens, his meeting with the angelic orders and with rebellious powers, his transformation before the divine throne, the revelations of creation and judgment given to him there, his return to instruct his sons, and his final departure from the world.
  - The number in the title is modern scholarly shorthand and not a claim that the book continues 1 Enoch. Scholars use 1, 2 and 3 Enoch to distinguish separate works gathered around the same patriarch — 1 Enoch surviving chiefly in Ethiopic, 2 Enoch chiefly in Church Slavonic, and 3 Enoch a later Hebrew mystical text. 2 Enoch belongs to the same broad Enochic tradition and shares its interest in the Watchers, the heavenly court and the judgment, but it is a distinct composition, organised far more tightly around a single ascent and a single transformation.
  - For this catalogue its interest is angelological. Enoch meets angels who administer the visible order of the cosmos, apostate angels imprisoned and awaiting judgment, the Grigori standing in silence and grief, the heavenly armies, and the cherubim, seraphim and many-eyed ones nearest the throne. The book also carries a developed account of the rebel Satanail, traditions concerning Adam and Paradise, and, in its closing chapters, the extraordinary birth and rescue of Melchizedek.
  - Its place in Orthodox history is unusual and easily misread. The complete text survived because Eastern Christian — and specifically Slavic — scribes went on copying it for centuries; more than twenty Slavonic witnesses are known, in several independent lines. That is real evidence of sustained reading and preservation. It is not evidence of canonicity. 2 Enoch is not part of the Scriptures of the Orthodox Church, no council received it, and the doctrines and angel names peculiar to it carry no doctrinal authority. It is catalogued here as an ancient witness to the religious world from which the Church emerged, and to what Orthodox manuscript culture chose to keep — for study, never for veneration.
sections:
  - heading: Authorship & Date
    body:
      - The patriarch Enoch did not write this book. The attribution is pseudepigraphy — the ordinary ancient practice of writing in the name and person of an authoritative figure of the past — and nothing in the work's value depends on pretending otherwise.
      - Dating it is exceptionally hard, because the complete text survives only in manuscripts many centuries younger than any plausible composition. Older scholarship ranged across nearly a thousand years. J. T. Milik proposed a ninth- or tenth-century Byzantine origin; Andrei Orlov and others have argued strongly against so late a date, and a substantial body of scholarship now places important portions of the work in the late Second Temple or early Roman period, potentially the first century AD. Other reconstructions still propose later composition or heavy later redaction.
      - The honest summary is that the question is genuinely open. Late surviving manuscripts, multiple recensions, centuries of Christian transmission and probable interpolation together make certainty impossible, and this page does not display a composition year.
  - heading: Language and Transmission
    body:
      - Most scholars have taken the Slavonic text to derive from a Greek intermediary. Several passages make far better sense against a Greek background — the best-known being the derivation of the name Adam from four Greek words for the cardinal directions (2 Enoch 30.13), which works in Greek and not in Slavonic.
      - Behind the Greek there may lie Semitic composition or Semitic source material. Semitic terms and a marked interest in priestly and temple matters have led some researchers to propose Hebrew or Aramaic antecedents; Fr Stephen De Young argues for an Aramaic original on the basis of transliterated vocabulary. That is his position rather than a settled conclusion.
      - The defensible summary is a chain rather than a single origin — possible Semitic composition or sources, then Greek, then Slavonic, with an independently surviving Coptic witness. The exact linguistic history is not settled.
  - heading: The Manuscript Tradition
    body:
      - Orlov catalogues more than twenty Slavonic manuscripts and fragments, principally from the fourteenth to the eighteenth centuries. Some carry most of the work; others preserve portions embedded in larger compilations. The oldest known Slavonic witness stands in the fourteenth-century Merilo Pravednoe, The Just Balance — but that is rearranged and edited material, not a pristine copy of the whole.
      - The traditional title Slavonic Enoch reflects the long-standing position that the text was known in that language alone. That changed when Joost Hagen identified four Coptic manuscript fragments from Qasr Ibrim in Nubia as portions of chapters 36–42. They appear to correspond closely to the short recension and are dated broadly to the eighth to tenth centuries. The identification has been questioned, and defended — most recently in a 2022 reassessment by Liudmila Navtanovich, which argues that Hagen's identification is sound.
      - Whatever the outcome of that particular debate, the evidence establishes at minimum that the literary history of 2 Enoch cannot be reduced to a late medieval Slavonic composition. The traditional title remains standard; it is no longer literally accurate.
  - heading: Long and Short — the Recension Problem
    body:
      - Scholarship normally distinguishes a long and a short recension, and some researchers subdivide further into very long, long, short and very short forms. Earlier work tended to ask which recension preserved the original, with short-recension priority the influential answer, associated particularly with Vaillant.
      - Modern work is more cautious, and the caution matters for anyone citing the book. Material in the long recension may well include later expansion — but shorter manuscripts may equally represent abbreviation, so shorter does not automatically mean older. Grant Macaskill has emphasised that individual readings must be weighed one at a time rather than a recension adopted wholesale.
      - This is not a technicality. Several of the passages most often quoted from 2 Enoch — the fall of Satanail, his part in the deception of Eve, and the heavens beyond the seventh — belong to long-recension material. A citation of this book that does not say which recension it is drawing on has left out the most important part of the reference.
  - heading: Structure of the Book
    body:
      - The work opens with the aged Enoch receiving a supernatural summons. Two beings of extraordinary appearance, their faces like the shining sun, announce that God has commanded his ascent. Enoch entrusts instructions to his children and is carried upward.
      - Orlov divides the work roughly into three movements — the ascent and the revelations given at the throne (chapters 1–38); Enoch's return to earth, his testament to his sons and his second and final ascent (39–67); and the priestly succession culminating in the birth of Melchizedek (68–73).
      - "The middle movement changes register completely. Having seen the heavens, Enoch teaches: moral instruction, the treatment of the poor, the conduct of sacrifice, the duty of righteous speech. This is why Orlov describes the book as combining the characteristics of an apocalypse and a testament — it is a vision that ends in ethics."
  - heading: The Ascent through the Heavens
    body:
      - The ascent is the book's organising structure, and the single feature most often misreported. The principal narrative moves through seven heavens, each disclosing a different aspect of cosmic order, angelic service, punishment, Paradise or celestial worship. In the short recension the seventh is the climax and the throne stands there.
      - The long recension does not stop at the seventh. It carries Enoch on to an eighth heaven called Muzaloth, a ninth called Kuchavim, and a tenth called Aravoth, where he beholds the face of the Lord and is transformed. Descriptions of "the seven heavens of 2 Enoch" are therefore describing one recension. The table below sets out both.
      - "Two features deserve particular notice. The third heaven contains Paradise and, in another region of the same heaven, a terrible place of punishment — an arrangement that does not map onto later popular language about heaven and hell. And the fifth heaven is silent: the Grigori stand in it without liturgy, and Enoch urges them to resume the praise that sounds everywhere else in the ascent."
