    entries: []
  - key: grigori
    title: The Grigori and the Imprisoned Angels
    navLabel: The Grigori
    tone: fallen
    display: list
    intro:
      - The rebellious powers Enoch meets on the way up — silent in one heaven, imprisoned in another.
      - 2 Enoch inherits the Watcher tradition from the older Enochic literature and reworks it. Two distinct groups appear at two different stages of the ascent, and the book does not fully harmonise them.
    entries:
      - name: The Grigori
        meaning: Slavonic Grigori, from Greek egrēgoroi — the wakeful ones, the watchers
        refs:
          - 2 Enoch 18
          - Genesis 6.1–4
          - Jude 6
          - 2 Peter 2.4
        hostId: HH-0051
        relatedLabel: The Watchers →
        body:
          - In the fifth heaven Enoch sees a vast company of beings of enormous stature, humanlike in form, their faces dejected and their mouths silent. This heaven has no liturgy — the one stage of the ascent where the praise that sounds everywhere else has stopped. Enoch speaks to them and urges them to resume the service of God.
          - "The narrative ties their rebellion to the older Watcher tradition: in the long recension they are connected with the heavenly rebels who descended upon Mount Hermon, took human wives and corrupted the earth, and with Satanail their prince."
          - Orlov argues that 2 Enoch creatively fuses two streams that were originally somewhat distinct — the Watchers who descended and sinned with women, and an Adamic tradition of a heavenly rebel who opposes God's purpose for humanity. That fusion is why Satanail comes to be associated with the Watcher rebellion here in a way he is not in 1 Enoch.
          - Genesis 6.1–4 speaks of the sons of God and the Nephilim without supplying the full narrative; Jude 6 speaks of angels who abandoned their proper habitation and are kept in bonds for judgment; 2 Peter 2.4 of angels who sinned and were cast into confinement. These passages resonate strongly with the tradition. They do not canonise the details of this book's version of it.
        lists:
          - label: Orthodox status
            items:
              - The Watcher tradition itself has genuine scriptural footholds in Genesis 6, Jude and 2 Peter
              - The detailed narrative of their descent and teaching is extra-biblical
              - The Grigori are not an order of the Church's angelic hierarchy and must not be listed as one
        fate: Left standing in the fifth heaven in grief and silence, their companions imprisoned below, awaiting the judgment.
      - name: The apostate angels of the second heaven
        refs:
          - 2 Enoch 7
          - Jude 6
          - 2 Peter 2.4
        body:
          - Far lower in the ascent, in a darkness that Enoch describes as greater than any earthly darkness, he sees angels held under guard — prisoners hanging and awaiting the measureless judgment. They ask Enoch to pray for them, and he answers that he is a mortal man and cannot.
          - The scene is brief and stands apart from the Grigori of the fifth heaven, though both belong to the same broad tradition of angelic rebellion. It is the closest thing in 2 Enoch to the imagery that Jude and 2 Peter use of angels kept in bonds for judgment.
        lists:
          - label: Orthodox status
            items:
              - The motif of imprisoned angels awaiting judgment is scripturally attested
              - This particular scene, and Enoch's exchange with them, is extra-biblical narrative
    outro:
      - Neither group is venerated, and neither is catalogued here for any purpose but study. Where this book's account goes beyond what Scripture says, the page says so rather than smoothing the difference away.
  - key: satanail
    title: Satanail and the Rebellion
    navLabel: Satanail
    tone: fallen
    display: list
    intro:
      - The rebel prince of the long recension — and why his name should be handled with care.
      - Satanail is among the most quoted features of 2 Enoch and among the most easily misrepresented. Everything below belongs to long-recension material, and the name is a literary form of particular textual traditions rather than Orthodox nomenclature.
    entries:
      - name: Satanail
        meaning: The ending -el marks his angelic standing before the fall; after it, the text calls him Satan
        refs:
          - 2 Enoch 29.4–5 (long recension)
          - 2 Enoch 31.3–6 (long recension)
          - Isaiah 14.12–15
          - Luke 10.18
        hostId: HH-0050
        relatedLabel: Satan / the Devil →
        body:
          - In the long recension Satanail is one of the archangelic order who conceives the impossible thought of setting his throne higher than the clouds, that he might be equal in rank to God. He is cast out of the height together with the angels under him, and thereafter flies about in the air over the abyss.
          - In chapter 31 the same figure enters Paradise and deceives Eve, so that the fall of the angels and the fall of humanity are drawn into a single continuous story. This is the point at which 2 Enoch differs most from 1 Enoch, where the Watcher rebellion is not tied to Eden in this way.
          - "Fr Stephen De Young has emphasised that ancient Jewish literature often collapses several biblical adversarial figures into one principal adversary rather than treating each name as a separate devil, and that 2 Enoch participates in that broader habit. That is what is happening here: Satan, the adversary of Eden, the Watcher traditions and related demonic figures are being synthesised into a single career."
          - The theophoric -el ending is a literary device marking what he was before the fall. It is not evidence of an Orthodox name for the devil, and Satanail should not be catalogued as a distinct being whose existence the Church attests.
        lists:
          - label: Orthodox status
            items:
              - The fall of the devil is Orthodox teaching, grounded in Scripture and the Fathers
              - The name Satanail is a literary form of particular extra-biblical textual traditions, not Orthodox nomenclature
              - This book's continuous narrative — rebellion, expulsion, then the deception of Eve — is its own synthesis and is not established doctrine
              - Nothing here is a biography of Satan, and the Church has never received one
        fate: Cast out of the height with the angels under him; in the long recension, thereafter the deceiver in Eden.
    outro:
      - Recorded, never venerated. Where the recensions differ, this page follows the long recension and says so; where the Fathers have not spoken, it asserts nothing.
  - key: human-figures
    title: The Human Figures of the Narrative
    navLabel: Human Figures
    tone: neutral
    display: cards
    intro:
      - The patriarchs through whom the book traces its priestly line.
      - Several are commemorated by the Church among the Holy Forefathers and have their own pages here; two appear in this book alone. In every case what Scripture says and what 2 Enoch adds are different things, and the link goes to the saint the Church actually honours.
    entries:
      - name: Enoch
        relatedHref: saint/OS-2532
        relatedLabel: Righteous Forefather Enoch →
        blurb: The seventh from Adam, who walked with God and was taken (Genesis 5.21–24). This book gives him the ascent, the transformation and the testament.
      - name: Methuselah
        relatedHref: saint/OS-2533
        relatedLabel: Righteous Forefather Methuselah →
        blurb: Enoch's son, who receives the priesthood after him in this book's succession.
      - name: Lamech
        relatedHref: saint/OS-2534
        relatedLabel: Righteous Forefather Lamech →
        blurb: Father of Noah in Scripture; in 2 Enoch also father of Nir, a figure Genesis does not name.
      - name: Nir
        blurb: Brother of Noah and priest after Methuselah — a figure of this book alone, with no scriptural or liturgical existence.
      - name: Sothonim
        meaning: Sopanim in some witnesses
        blurb: Nir's elderly wife, from whose body the infant Melchizedek is born after her death. Known only from 2 Enoch.
      - name: Melchizedek
        relatedHref: saint/OS-1225
        relatedLabel: Righteous Melchizedek, King of Salem →
        blurb: King of Salem and priest of God Most High (Genesis 14). The extraordinary birth narrative here is this book's own and is not the Church's account of him.
      - name: Noah
        relatedHref: saint/OS-2354
        relatedLabel: Righteous Noah →
        blurb: Nir's brother in this book's genealogy; the Flood is the destruction from which Melchizedek is carried away.
      - name: Adam
        relatedHref: saint/OS-2524
        relatedLabel: Righteous Forefather Adam →
        blurb: His creation and exalted place are bound up with the rebellion of Satanail in the long recension, as in the Adamic literature generally.
