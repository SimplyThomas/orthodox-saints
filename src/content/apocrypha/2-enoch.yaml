      - Where each stage of the journey leads, and what stands there.
      - Seven heavens in the principal narrative, with the throne in the seventh in the short recension. The long recension carries Enoch on through three further heavens — Muzaloth, Kuchavim and Aravoth — and places the vision of God's face in the tenth. A reference to "the seven heavens of 2 Enoch" is describing one recension and should say so.
