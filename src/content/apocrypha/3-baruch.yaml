  - key: guides
    title: Phamael and Michael
    navLabel: The Guides
    tone: faithful
    display: list
    intro:
      - The angel who takes Baruch up, and the archangel who meets him at the last gate.
      - One belongs to this book alone; the other is the commander of the host — with an office here that goes well beyond Scripture.
    entries:
      - name: Phamael
        meaning: named in the Greek; the Slavonic families do not all give this name
        refs:
          - 3 Baruch 1–2 (Greek)
        body:
          - Baruch is weeping over the ruins of Jerusalem when the angel is sent to stop him — God has other things to show him — and the guide names himself Phamael, the angel of the powers.
          - "He conducts the whole ascent, explains what Baruch sees, and answers his questions, in the ordinary office of the interpreting angel found in Daniel, Zechariah, the Enoch literature and Revelation. At the fifth heaven he stops: the gate opens only for Michael."
          - The name is not in Scripture, does not appear in Orthodox liturgical books or Byzantine angel lists, and is not consistent across the Slavonic families. It belongs to this text.
          - He should not be catalogued as an archangel of the Church on the strength of guiding Baruch — the same rule this section applies to Dokiel and Puriel in the Testament of Abraham and to Yahoel in the Apocalypse of Abraham.
        lists:
          - label: Orthodox status
            items:
              - Not in Scripture; not in Orthodox liturgical tradition; not in Byzantine angel lists
              - Named in the Greek text of this book only, and not uniformly across the Slavonic
              - Never to be listed as an Orthodox archangel
      - name: Michael, with the keys and the bowl
        refs:
          - 3 Baruch 11–16 (Greek)
          - Daniel 10.13, 21
          - Daniel 12.1
          - Jude 9
          - Revelation 12.7
          - Tobit 12.15
          - Revelation 5.8
          - Revelation 8.3–4
        hostId: HH-0010
        relatedLabel: Archangel Michael →
        body:
          - At the fifth heaven the gate is shut, and it opens only for Michael, who holds the keys of the kingdom of heaven. The angels of the other heavens wait for him; he is commander of the host, and the guide can go no further without him.
          - He comes down carrying an enormous bowl. The angels arrive with baskets of flowers — the virtues of the righteous, the prayers and good works of the people in their charge — and pour them in. Michael carries the bowl through the gate and offers it before God, and returns with oil, which he gives to the angels whose baskets were full, for their people; those whose baskets came half empty or empty are sent away without it and rebuked.
          - "The motif has real scriptural relatives: Raphael in Tobit 12 presenting the prayers of the saints before the Holy One; the golden bowls of incense which are the prayers of the saints in Revelation 5; the angel at the altar offering incense with the prayers of all saints in Revelation 8. Angels bearing human prayer upward is not this book's invention."
          - "What is its own is Michael as heavenly high priest — entering the sanctuary with an offering and returning with oil. The parallel with Hebrews needs stating carefully rather than enjoyed: Hebrews argues that Christ is the great High Priest who entered once for all, and Orthodox doctrine knows one such priesthood. Michael's priestly role here is apocalyptic literature, and it must never be presented as Orthodox teaching about Michael."
        lists:
          - label: Source register
            items:
              - Holy Scripture — Michael as prince and commander; angels presenting prayers in Tobit and Revelation
              - This book — the keys, the bowl of virtues, the oil, and the priestly entry
              - Not doctrine — Michael as high priest is a literary conception; Christ's priesthood is the Church's teaching
  - key: paradise
    title: The Angels Who Planted Paradise
    navLabel: Planting Paradise
    tone: faithful
    display: cards
    intro:
      - A Slavonic tradition, and it should never be attributed to the book without that label.
      - God commands angels to plant the garden, each a different tree. The manuscript families name Michael, Gabriel, Raphael and Satanael — with either Uriel or Phanuel as the fifth, depending on the family. Lists giving all six merge traditions that do not agree.
