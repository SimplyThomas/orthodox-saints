    entries:
      - name: Michael
        hostId: HH-0010
        relatedLabel: Archangel Michael →
        blurb: First among the planters in the Slavonic account, and the archangel the Church names and honours. The particular tree assigned to him varies between witnesses and needs checking against the critical editions.
      - name: Gabriel
        hostId: HH-0011
        relatedLabel: Archangel Gabriel →
        blurb: Scriptural, named in Daniel and in Luke's account of the Annunciation — the second of the planters in this tradition.
      - name: Raphael
        hostId: HH-0012
        relatedLabel: Archangel Raphael →
        blurb: Known from Tobit, where he presents the prayers of the saints before the Holy One — the same office the angels perform at Michael's bowl later in this book.
      - name: Uriel
        hostId: HH-0013
        relatedLabel: Archangel Uriel →
        blurb: Named in one family of the Slavonic witnesses. His standing in Orthodox tradition rests on the Church's liturgical tradition, not on this book.
      - name: Phanuel
        hostId: HH-0049
        relatedLabel: Phanuel →
        blurb: Named in the other family, in place of Uriel. Known chiefly from 1 Enoch, apocryphal in register, and not an archangel the Church names.
      - name: Satanael
        hostId: HH-0050
        relatedLabel: Satan / the Devil →
        blurb: Plants the vine, which becomes the tree of the transgression. The -el ending marks what he was before the fall — a literary device of particular textual traditions, not an Orthodox name for the devil.
    outro:
      - "The five registers in the table are worth noticing: Scriptural, Deuterocanonical, Traditional, Apocryphal, Fallen. One Slavonic scene reaches across the whole range this catalogue uses — which is a good illustration of why the registers are kept apart rather than flattened into a single list of angels."
  - key: creatures
    title: The Cosmic Creatures
    navLabel: The Creatures
    tone: neutral
    display: list
    intro:
      - A dragon, a devouring Hades, and a bird that shields the world from the sun.
      - None of these is an angel, and the text does not call them angels. Forcing every supernatural being into that category is how a taxonomy goes wrong.
    entries:
      - name: The dragon, and Hades
        refs:
          - 3 Baruch 4–5 (Greek)
          - Revelation 12.9
        body:
          - In the third heaven Baruch is shown a serpent of enormous size which eats the bodies of those who pass through life wickedly, and Hades is bound up with it — in the Greek the dragon's belly is Hades itself.
          - Baruch is told that Hades drinks about a cubit of the sea each day and the sea does not diminish, because three hundred and sixty rivers feed it. The picture is of an appetite that cannot be satisfied and a sea that cannot be emptied.
          - Scholars classify this differently — mythic geography, personified death, a chaos power, underworld symbolism, or a demonological being — and the text supports more than one reading. This page does not choose between them.
          - Two cautions. The text does not identify this dragon with Satan, and it should not be equated with the dragon of Revelation 12. And Hades here is the realm of the dead in the older sense, nearer to Sheol than to the later Christian conception of hell.
        lists:
          - label: Classification
            items:
              - Not an angel and not called one
              - Not identified with Satan by the text
              - "Hades: realm of the dead in the older sense, not Gehenna"
      - name: The phoenix, guardian of the earth
        refs:
          - 3 Baruch 6–8 (Greek)
          - 1 Clement 25
          - Psalm 19.4–6
        body:
          - The sun goes out in a fiery chariot with a crown, attended and drawn by angels — and flying in front of it is a bird of immense size, which Baruch is told is the guardian of the inhabited world.
          - It spreads its wings and receives the sun's fiery rays, and if it did not, no living thing on earth would survive. It feeds on the manna of heaven and the dew of earth, and cries out at dawn to wake the cocks.
          - Here the phoenix is cosmological rather than a symbol of resurrection, and it is not called an angel — it should not be catalogued as one. The bird had a long prior life in Egyptian and Greco-Roman literature, and early Christians used it for resurrection, as 1 Clement does. Whether this book draws on any of that or shares a common inheritance is not something to assert.
        lists:
          - label: Classification
            items:
              - A cosmic creature, not an angel and not a demon
              - Cosmological in function here; the resurrection symbolism belongs to other Christian usage
              - Not evidence for the historical existence of the phoenix
      - name: Why the moon wanes
        refs:
          - 3 Baruch 9 (Greek)
          - Genesis 3
          - Job 38.7
        body:
          - "The moon travels in a chariot of its own, and Baruch asks why it waxes and wanes. The answer is Adamic: at the transgression, when the adversary took the serpent's form and deceived Adam, the moon gave light and did not hide itself as the sun did — and for that it was diminished. Lunar phases become a standing penance."
          - None of this is astronomy and none of it was written as astronomy. Psalm 19 has the sun as a bridegroom coming out of his chamber and rejoicing as a strong man to run a race; Job has the morning stars singing together at creation.
          - Ancient cosmology of this kind is theological picture-language about who governs the world. Reading it literally misses the genre entirely, and reading it as an Orthodox account of the heavens misreads its authority as well.
    outro:
      - Angels, demons, cosmic creatures, personified realms and symbolic figures were distinct categories in this literature. Keeping them distinct is what stops a catalogue turning a phoenix into an archangel.
  - key: souls
    title: The Souls of the Righteous
    navLabel: The Souls
    tone: faithful
    display: list
    intro:
      - A plain, a pool, and birds beyond counting that are not birds.
      - The one glimpse this book gives of the departed — conscious, in company, at worship.
    entries:
      - name: The birds of the fourth heaven
        refs:
          - 3 Baruch 10 (Greek)
          - Revelation 6.9–11
          - Revelation 7.9–12
        body:
          - Baruch is brought to a plain with a pool of water and birds without number, unlike any on earth, and he asks what they are. They are the souls of the righteous, who send up praise to the Lord perpetually.
          - The phrase that has drawn most attention is that they exist and worship in ordered ranks — choir by choir, in some renderings. The image of the departed righteous as birds singing over water is unusual and lovely, and it is one of the earliest such pictures to survive.
          - "The resonance with Orthodox liturgical language about the choirs of the saints and the ranks of the righteous is immediate. It is a resonance and nothing more: the Church's language has its own roots in Scripture and its own worship, and no dependence on this book has been shown."
          - What the passage does show is that the picture of the departed righteous as consciously worshipping, in company, awaiting the resurrection, was already current. That is its historical value and also its limit — it offers no complete afterlife system and should not be pressed into one.
        lists:
          - label: Orthodox status
            items:
              - That the departed righteous are conscious and at worship is Orthodox teaching, grounded in Scripture
              - The birds, the plain and the pool belong to this book's imagery
              - "Not toll-house literature: an ascent with a guide is not a soul passing tollgates, and there are no accusers, examinations or advocates here"
