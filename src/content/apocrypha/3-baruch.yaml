  - key: heavens
    title: The Heavens Baruch Visits
    navLabel: The Heavens
    tone: neutral
    display: table
    intro:
      - Five heavens, unevenly proportioned — the third holds most of the book.
      - Do not force the tour into a perfectly regular scheme; the manuscripts do not support one, and this is not the seven-heaven cosmology of 2 Enoch or the Ascension of Isaiah.
