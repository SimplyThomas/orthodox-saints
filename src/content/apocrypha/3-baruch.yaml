slug: 3-baruch
title: 3 Baruch (The Greek Apocalypse of Baruch)
aka:
  - Third Baruch
  - The Greek Apocalypse of Baruch
  - Apocalypsis Baruchi Graece
era: Probably 1st–3rd century AD; Jewish core with Christian redaction
canonicalStatus: Apocryphal · Greek and Slavonic
blurb: Baruch is taken up through the heavens and shown the builders of Babel, a dragon that devours the wicked, the phoenix that shields the earth from the sun, and Michael carrying a bowl to receive the virtues of humanity.
order: 16
status: reviewed
humanReviewed: false
sources:
  - J.-C. Picard, Apocalypsis Baruchi Graece (Pseudepigrapha Veteris Testamenti Graece 2; Brill, 1967) — the critical Greek edition
  - H. E. Gaylord Jr., "3 (Greek Apocalypse of) Baruch", in James H. Charlesworth, ed., The Old Testament Pseudepigrapha, vol. 1 (Doubleday, 1983) — translates both the Greek and the Slavonic; cited for scholarship, not reproduced
  - M. R. James, who published the Greek text in Apocrypha Anecdota II (Cambridge, 1897) — public domain
  - Andrei A. Orlov and other specialists in the Slavonic pseudepigrapha, on the Slavonic manuscript families
  - The Online Critical Pseudepigrapha, for the Greek text after Picard and the manuscript evidence
  - Genesis 3 and 11; Job 38; Psalm 19.4–6; Psalm 24.7–10; Isaiah 6; Daniel 10 and 12; Tobit 12.15; Revelation 5.8, 8.3–4 and 12.9 (Holy Scripture)
  - 1 Clement 25, for the early Christian use of the phoenix
  - Catalogued for study; requires clergy/source review before any devotional use. This page was written from a research brief rather than a completed source dossier — see the sourcing note in Reception
