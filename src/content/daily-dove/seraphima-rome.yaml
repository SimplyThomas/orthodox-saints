edition: "Rome Edition"
byline: "By Our Correspondent in Rome"
saint:
  name: "Seraphima"
  type: "Virgin-Martyr"
saintLabel: "Seraphima, Virgin-Martyr of Antioch"
kicker: "Breaking"
headline: "“They Fell Before They Touched Her”"
date: "During the Reign of Emperor Hadrian"
location: "Rome"
dek: "Reports spread across Rome after two men collapse while attempting to assault a Christian virgin."
summary: "Two men entered a room intending to dishonour a young Christian woman. Neither laid a hand upon her. Those present insist there was no struggle, no weapon, and no intervention by another person — and that the woman they had been sent to disgrace prayed for their recovery."
body:
  - "No one in the marketplace this morning seemed interested in grain prices, imperial taxes, or the latest spectacles in the arena. Every conversation eventually drifted toward the same astonishing report from a Roman household on the Aventine Hill."
  - "Two men entered a room intending to dishonor a young Christian woman. Neither laid a hand upon her."
  - "Before either could carry out the governor’s orders, both reportedly collapsed to the floor, overcome by a sudden and unexplained weakness. Those present insist there was no struggle, no weapon, and no intervention by another person. One moment the men advanced; the next, they were lying helpless at the feet of the very woman they had been sent to disgrace."
  - "The woman at the center of the incident is Seraphima, a young virgin from Antioch in Syria whose quiet devotion to Christ has now become the subject of public conversation throughout the city."
  - "Her story began far from Rome. Born in Antioch, she eventually entered the service of the noblewoman Sabina. Those who knew the household say Seraphima’s faith was not loud or confrontational. She simply lived it. Over time, that steadfast witness is said to have drawn Sabina herself toward Christianity, a development that eventually attracted the attention of Roman authorities during a period when followers of Christ were viewed with growing suspicion."
  - "Officials summoned Seraphima and ordered her to offer sacrifice to the gods of Rome. She refused. Witnesses describe no hesitation, no attempt to negotiate, and no sign of fear. Her answer remained the same through repeated questioning: she would worship Christ alone."
  - "When persuasion failed, the proceedings took a darker turn. Rather than carrying out an immediate sentence, officials reportedly ordered that the young woman first be publicly humiliated. Two young men were sent into the room where she was being held."
  - "Those present describe both men suddenly losing their strength before reaching her. Some fell to their knees. Others say they collapsed entirely. No account suggests that Seraphima resisted them physically. Instead, witnesses consistently report something unexpected. She prayed. Not for vengeance. Not for deliverance. For them."
  - "According to the ancient account preserved among the Christians, Seraphima asked God to restore the men who had been sent against her. They recovered immediately."
  - "The remarkable incident did nothing to change the governor’s resolve. Officials again demanded that she sacrifice to the Roman gods. Again she refused. Having failed to break either her faith or her resolve, the authorities carried out the sentence of execution. Seraphima was beheaded."
  - "For Rome, another execution may soon fade into memory. For the Christians gathering quietly in homes throughout the city, however, the death of the young woman from Antioch has already become something far greater than another name among the condemned. They speak of her not only because she endured suffering, but because compassion remained on her lips even toward those who sought to violate and kill her."
  - "Long after the executioner’s sword fell silent, that may be the part of her witness that people remember most."
