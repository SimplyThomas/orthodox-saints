dek: "The council reconciles Rome and Constantinople, and reaffirms the ancient Creed."
summary: "After years of division that strained relations between the Churches of East and West, bishops gathered in Constantinople have concluded a council that restores Patriarch Photius to his episcopal throne. The assembled fathers also declared that the Creed handed down by the Ecumenical Councils is to remain unchanged."
plate: "ICON · THE COUNCIL OF CONSTANTINOPLE, A.D. 879–880"
body:
  - "After years of division that strained relations between the Churches of East and West, bishops gathered in Constantinople have concluded a council that restores Patriarch Photius to his episcopal throne and signals a remarkable reconciliation between the two great sees."
  - "Representatives of Pope John VIII joined Eastern bishops in the imperial capital, where the council formally recognized Photius as the lawful Patriarch of Constantinople and sought to bring an end to the disputes that have troubled the Church for nearly a decade."
  - "The proceedings have drawn clergy from across the Christian world, many expressing hope that the long season of rival patriarchs, mutual accusations, and ecclesiastical uncertainty may finally be coming to a close."
  - "One of the council’s most significant acts was its solemn reaffirmation of the Nicene-Constantinopolitan Creed. The assembled fathers declared that the Creed handed down by the Ecumenical Councils is to remain unchanged, forbidding additions, omissions, or alterations to the Church’s common confession of faith."
  - "Many bishops emphasized that the Creed belongs to the whole Church, not to any individual bishop, province, or kingdom."
  - "As the council drew toward its conclusion, delegates exchanged the kiss of peace, and hopes for renewed communion between Rome and Constantinople appeared stronger than they had in years."
  - "Yet some observers caution that the reconciliation remains fragile. The disagreements that led to this council did not arise overnight, and many recognize that restoring trust between churches often takes longer than restoring communion on paper."
  - "For now, however, the atmosphere throughout Constantinople is one of cautious optimism. After years of uncertainty, the Church once again has a recognized patriarch, and bishops from East and West have departed the council speaking not of division, but of peace."
pullQuote:
  text: "“This council is not merely about one bishop. It is about restoring peace among the churches.”"
  attribution: "— A delegate, after the day’s session"
aroundTheEmpire:
