  notes:
    - city: "Cathedral Precincts"
      note: "Clergy report a steady increase in pilgrims seeking to pray at the tomb of Bishop Ignatius. Additional readers have been assigned to maintain continuous reading of the Psalms during the busiest days."
    - city: "Western Roads"
      note: "Local innkeepers note increased traffic from neighbouring towns as reports of answered prayers continue to spread through the region by word of mouth."
editorsNotebook:
  body:
    - "A city usually grows famous because of its markets. Or its fortifications. Or its princes. Smolensk has become known for a grave."
    - "Not because death is remarkable. Because hope refuses to stay buried there."
literaryFraming: "The pilgrims, conversations, and scenes described in this article are fictionalised to portray the atmosphere surrounding a growing pilgrimage site. They are intended to reflect the tradition of local veneration without attributing specific undocumented miracles to St Ignatius."
historiansNotes:
  entries:
    - level: "orthodox-tradition"
      claim: "St Ignatius of Smolensk was remembered as a faithful bishop and shepherd of his flock."
      note: "Orthodox tradition preserves that, following his repose, the faithful increasingly visited his tomb to seek his intercessions, and reports of healings and answered prayers contributed to the growth of his local veneration. As with many saints of the Orthodox Church, devotion at his tomb developed gradually through the testimony of pilgrims rather than through a single dramatic event."
