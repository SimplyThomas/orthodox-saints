historiansNotes:
  entries:
    - level: "contemporary-source"
      claim: "Empress Irene convened the Second Council of Nicaea in AD 787 after an earlier attempt in Constantinople was disrupted by iconoclast soldiers."
    - level: "contemporary-source"
      claim: "The council restored the veneration of holy icons and distinguished veneration (proskynesis) from the worship (latreia) due to God alone."
    - level: "contemporary-source"
      claim: "The bishops grounded their teaching in the Incarnation: because Christ truly became man, He may be depicted."
    - level: "contemporary-source"
      claim: "The council’s decree relied extensively on Scripture, earlier Fathers, and the Church’s continuous practice."
    - level: "contemporary-witness"
      claim: "The principal contemporary and near-contemporary witnesses."
      sources:
        - "Acts of the Second Council of Nicaea (787)"
        - "The council’s Definition of Faith"
        - "John of Damascus, On the Divine Images"
        - "Writings of Theodore the Studite, reflecting the continuing controversy"
    - level: "orthodox-tradition"
      claim: "Orthodox liturgical tradition celebrates the fathers of the Seventh Ecumenical Council as defenders of the Incarnation and of the proper veneration of holy icons."
      note: "The council restored the practice in AD 787, but many churches did not see icons permanently restored until the Triumph of Orthodoxy in AD 843, after a second period of Iconoclasm. That later restoration is commemorated separately on the First Sunday of Great Lent."
