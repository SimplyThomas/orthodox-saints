headline: "Council Restores the Veneration of Holy Icons"
date: "October, AD 787"
location: "Nicaea"
dek: "The Seventh Ecumenical Council rejects Iconoclasm and affirms that the honour shown to an icon passes to the person depicted."
summary: "Bells rang throughout Nicaea as bishops concluded the Seventh Ecumenical Council with a declaration many faithful have awaited for generations: the holy icons of Christ, His Mother, the angels, and the saints are once again to be honoured throughout the churches of the Empire."
plate: "ICON · THE SEVENTH ECUMENICAL COUNCIL, A.D. 787"
caption: "The Fathers of the Seventh Ecumenical Council with the holy icons. — Image to be supplied"
body:
  - "Bells rang throughout Nicaea today as bishops concluded the Seventh Ecumenical Council with a declaration that many faithful have awaited for generations: the holy icons of Christ, His Mother, the angels, and the saints are once again to be honored throughout the churches of the Empire."
  - "Meeting under the protection of Empress Irene and her young son, Emperor Constantine VI, the assembled bishops formally rejected the teachings of the Iconoclast movement, which for decades has opposed the use and veneration of sacred images."
  - "The council declared that the honor shown to an icon passes to the person depicted and affirmed that Christians may reverence holy images with bows and kisses — not as acts of worship owed to God alone, but as expressions of honor directed toward Christ and His saints."
  - "The decision follows years of division within the Empire. Beginning under Emperor Leo III and continuing under his successors, many churches saw their icons removed or destroyed. Numerous monasteries were closed, and many defenders of icons endured exile, imprisonment, or persecution."
  - "The council emphasized that its decision does not introduce a new teaching but preserves the apostolic faith handed down through the Church and confirmed by the writings of the holy Fathers."
  - "Central to the bishops’ reasoning was the mystery of the Incarnation. Because the eternal Son of God truly became man and was seen with human eyes, they declared, He may also be depicted in material form. To reject every image of Christ, they argued, risks calling into question the reality of His becoming flesh."
  - "As today’s session concluded, many clergy embraced one another in thanksgiving. Several participants expressed hope that churches throughout the Empire will soon restore icons to their rightful place, allowing the faithful once again to pray before the sacred images that have long adorned Christian worship."
  - "Yet even amid the celebration, many acknowledge that not everyone will welcome the council’s decision. Reports from several provinces indicate that supporters of Iconoclasm remain firmly opposed, suggesting that the debate over holy images may not be over."
pullQuote:
  text: "“The icon proclaims with paint what the Gospel proclaims with words.”"
  attribution: "— One bishop, during the proceedings"
aroundTheEmpire:
  - city: "Constantinople"
    note: "Churches throughout the capital are preparing for the gradual restoration of holy icons following news from the council."
  - city: "Mount Olympus, Bithynia"
    note: "Monastic communities that endured years of persecution have received word of the council with cautious optimism."
  - city: "Asia Minor"
    note: "Some military leaders known to favour Iconoclasm have reportedly expressed dissatisfaction with the council’s decision."
  - city: "Rome"
    note: "Representatives of the Bishop of Rome welcomed the council’s reaffirmation of the Church’s ancient practice regarding sacred images."
