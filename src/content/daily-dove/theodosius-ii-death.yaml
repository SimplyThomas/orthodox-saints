      claim: "Theodosius II became emperor in AD 408 at the age of seven."
    - level: "contemporary-source"
      claim: "He reigned for forty-two years, one of the longest reigns in Eastern Roman history."
    - level: "contemporary-source"
      claim: "He convened the Third Ecumenical Council at Ephesus in AD 431."
    - level: "contemporary-source"
      claim: "During his reign the Theodosian Code was compiled and promulgated."
    - level: "contemporary-source"
      claim: "The great land walls of Constantinople were constructed and expanded during his reign."
    - level: "contemporary-source"
      claim: "He died in AD 450 following injuries sustained in a riding accident."
    - level: "orthodox-tradition"
      claim: "The Orthodox Church commemorates Theodosius II as a right-believing emperor."
      note: "For his support of the Church and his role in convening the Council of Ephesus, which affirmed the title Theotokos for the Virgin Mary and condemned the teaching of Nestorius."
