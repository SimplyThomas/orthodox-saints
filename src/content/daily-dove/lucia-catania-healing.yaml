literaryFraming: "The overnight scene in the church, the quoted remarks of the pilgrims and clergy, the notes from around the island, and the presence of a reporter at the vigil are literary devices. The narrative beneath them — Eutychia’s four-year illness, the pilgrimage to Catania, Lucia’s vision of St Agatha and her mother’s healing — is drawn from the traditional Acts of St Lucia and is not preserved in any contemporary account. Eutychia is not commemorated in the Church’s calendar and has no record in this database, so her name carries no link."
historiansNotes:
  intro: "This dispatch opens a five-part file on St Lucia of Syracuse. Everything in the story itself rests on a single strand of tradition, and the notes below say so plainly."
  entries:
    - level: "orthodox-tradition"
      claim: "Eutychia, the mother of Lucia, had suffered a haemorrhagic illness for four years, and was healed during an overnight vigil at the tomb of St Agatha in Catania after Lucia saw the martyr in a vision."
      note: "This is the opening episode of the traditional Passion of St Lucia (BHG 995–996), a hagiographical account written well after the events it describes and preserved in both Greek and Latin recensions. It is the only source for the episode; no contemporary document records Eutychia, her illness, or the pilgrimage. The narrative deliberately echoes the woman with an issue of blood in the Gospels, which is a feature of the genre and does not by itself argue against the account."
      sources:
        - "Acts (Passion) of St Lucia (traditional account)"
        - "Bibliotheca Hagiographica Graeca 995–996"
    - level: "orthodox-tradition"
      claim: "Agatha was martyred at Catania and her tomb there had become a place of pilgrimage by Lucia’s lifetime."
      note: "Agatha’s veneration at Catania is attested early and independently of Lucia’s Passion — she is named in the Martyrologium Hieronymianum and appears among the virgin martyrs in the sixth-century mosaics of Sant’Apollinare Nuovo at Ravenna. The details of her own passion, however, come from a Passio of the same hagiographical character as Lucia’s. That her tomb drew pilgrims in the early fourth century is a reasonable inference from the strength of her cult rather than a documented fact."
      sources:
        - "Martyrologium Hieronymianum"
        - "Orthodox Church in America — Martyr Agatha of Palermo"
    - level: "orthodox-tradition"
      claim: "Lucia had already vowed perpetual virginity, and after the healing asked her mother’s leave to give her inheritance to the poor rather than marry."
      note: "The Passion presents this as the hinge of her whole story — the healing is what frees her mother to release the inheritance. It is the same source and carries the same weight as the episode above."
