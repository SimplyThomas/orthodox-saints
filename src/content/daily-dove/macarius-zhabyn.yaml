      note: "The brethren have begun repairing damaged buildings following the recent military campaign. Despite heavy losses, the daily cycle of prayer has resumed."
    - city: "Regional Roads"
      note: "Travellers report increasing numbers of wounded soldiers from both armies seeking food and shelter as the conflict moves farther from the district."
editorsNotebook:
  body:
    - "Wars have a way of teaching people to recognise uniforms before faces. Friend. Enemy. Ally. Invader."
    - "The Gospel asks a different question. Not, “Whose side is he on?” But, “Who is your neighbour?” On a battlefield littered with reasons for hatred, one elderly monk answered that question with a cup of water."
literaryFraming: "The descriptions of the battlefield, the monks’ reactions, and the dialogue are literary reconstructions. They are intended to dramatise the traditional account without altering its central historical themes."
historiansNotes:
  entries:
    - level: "orthodox-tradition"
      claim: "St Macarius of Zhabyn (1539–1623), founder and abbot of the Zhabyn Monastery, is remembered for his ascetic life, humility, and mercy."
      note: "During the warfare that devastated the region in the early seventeenth century, tradition recounts that he encountered a wounded Polish soldier left behind after battle. Rather than treating him as an enemy, Macarius gave him water, comforted him, and spoke to him about repentance and God’s mercy. The soldier is said to have repented before his death."
    - level: "orthodox-tradition"
      claim: "The incident became one of the defining episodes of Macarius’ life."
      note: "It illustrates Christ’s command to love one’s enemies even amid the violence of war."
