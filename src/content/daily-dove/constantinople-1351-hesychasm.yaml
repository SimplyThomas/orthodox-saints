headline: "Monks Defend Experience of the Uncreated Light"
date: "June, AD 1351"
location: "Constantinople"
dek: "Council affirms Hesychast teaching after years of intense debate."
summary: "After nearly a decade of theological controversy, bishops gathered in Constantinople have delivered a decisive judgment in favour of the Hesychast monks, affirming that the light experienced by the saints in prayer is not a created vision but the uncreated divine energy of God."
plate: "ICON · ST GREGORY PALAMAS AND THE HESYCHAST COUNCILS"
body:
  - "After nearly a decade of theological controversy, bishops gathered in Constantinople have delivered a decisive judgment in favor of the Hesychast monks, affirming that the light experienced by the saints in prayer is not a created vision but the uncreated divine energy of God."
  - "The decision marks the culmination of a dispute that has spread from the quiet monasteries of Mount Athos to the highest levels of the Byzantine Church and Empire."
  - "At the center of the controversy stands Gregory Palamas, Archbishop of Thessalonica, whose defense of the Hesychast monks has become one of the defining theological debates of the age."
  - "The monks, known for their life of silence, fasting, and the continual repetition of the Jesus Prayer, have long testified that through God’s grace they may behold the same uncreated light witnessed by the Apostles at Christ’s Transfiguration on Mount Tabor — not with bodily eyes alone, but through purification and participation in God’s divine life."
  - "Their opponents, led initially by the Calabrian scholar Barlaam, argued that such claims were impossible. If God is truly beyond all human comprehension, they contended, then no one could genuinely experience Him except through created effects or intellectual knowledge."
  - "Palamas responded that while God’s essence remains forever unknowable, God truly makes Himself known through His uncreated energies — His real presence and activity in the world. Thus, the saints do not behold God’s essence but genuinely participate in His divine life through grace."
  - "After years of councils, debates, and careful examination of Scripture and the writings of the holy Fathers, today’s synod has formally upheld Palamas’s teaching. The assembled bishops declared that the distinction between God’s essence and His energies preserves both God’s transcendence and the reality of mankind’s communion with Him."
  - "For the monks of Mount Athos, the decision is seen not as a new doctrine but as the confirmation of the Church’s ancient spiritual tradition."
  - "Throughout Constantinople, news of the council has spread rapidly. While many clergy have welcomed the decision with thanksgiving, others remain unconvinced, suggesting that discussion of Hesychasm may continue long after the council has adjourned."
pullQuote:
  text: "“If the saints truly share in God’s grace, perhaps holiness is closer than we often think.”"
  attribution: "— A young deacon"
