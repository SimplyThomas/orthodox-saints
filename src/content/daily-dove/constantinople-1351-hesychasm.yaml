      - text: "“I’ve always known the monks spent their lives in prayer. I never imagined their prayer would become the subject of an empire-wide council.”"
        attribution: "A merchant visiting the capital"
      - text: "“If the saints truly share in God’s grace, perhaps holiness is closer than we often think.”"
        attribution: "A young deacon"
  - kind: "whispers"
    title: "Critics Call Hesychasts “Navel-Gazers”"
    body:
      - "Among the more colorful accusations exchanged during the controversy was the charge that the Hesychast monks were merely “navel-gazers.”"
      - "The nickname arose because some monks practiced the Jesus Prayer while seated with bowed heads, a posture intended to cultivate stillness (hesychia) and attentiveness during prayer. Critics, particularly Barlaam of Calabria, mocked the practice and questioned the monks’ claims of experiencing the divine light."
      - "Supporters of Hesychasm responded that the posture itself was not the source of the experience. Rather, it served as a physical aid to concentration in the lifelong work of repentance and unceasing prayer."
    note: "The term “navel-gazers” (omphalopsychoi) appears in the contemporary polemical literature of the controversy. It reflects the language of opponents and should not be understood as an objective description of Hesychast practice."
