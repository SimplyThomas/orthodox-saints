      claim: "Michael was born in Edessa and distributed his inheritance to the poor before becoming a monk at the Lavra of Saint Sabbas."
    - level: "orthodox-tradition"
      claim: "He was brought before Queen Seida after selling baskets in Jerusalem."
    - level: "orthodox-tradition"
      claim: "He refused her advances and was falsely accused before King al-Ma’mun."
    - level: "orthodox-tradition"
      claim: "He rejected demands to renounce the Christian faith."
    - level: "orthodox-tradition"
      claim: "He drank a cup of poison after making the sign of the Cross and remained unharmed."
    - level: "orthodox-tradition"
      claim: "He was beheaded in Jerusalem."
    - level: "orthodox-tradition"
      claim: "His relics were taken to the Lavra of Saint Sabbas, where tradition records that a pillar of fire accompanied the procession and many miracles occurred at his tomb."
