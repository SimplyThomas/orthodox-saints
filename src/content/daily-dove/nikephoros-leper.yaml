      note: "Physicians continue reporting advances in the treatment of Hansen’s disease, offering renewed hope that many patients once considered permanently isolated may eventually return to their communities."
    - city: "Chios"
      note: "Pilgrims continue visiting Father Nikephoros, seeking prayer, counsel, and consolation despite the difficulties of reaching the colony."
editorsNotebook:
  body:
    - "There are places most people hope never to visit. Hospitals. Prisons. Leper colonies. History teaches us to associate them with loss."
    - "Yet every so often, God plants a garden in the places the world has abandoned. Perhaps that is why so many who entered these gates expecting tragedy departed speaking instead about joy."
literaryFraming: "This article follows an imagined reporter through a day at the leper hospital. The conversations with nurses, patients, and visitors are fictionalised to convey the atmosphere consistently described in eyewitness recollections. They are not preserved as verbatim historical quotations."
historiansNotes:
  entries:
    - level: "contemporary-witness"
      claim: "St Nikephoros the Leper (1890–1964) lived with Hansen’s disease for many decades after contracting it as a young man."
      note: "He spent years in leper hospitals, including the colony associated with Fr Anthimos Vagianos, and later at the hospital in Athens. Numerous contemporaries remembered him for his patience, humility, unceasing prayer, and the profound consolation he offered fellow patients — among them Eumenios Saridakis."
    - level: "orthodox-tradition"
      claim: "Reports of healings through his prayers, particularly after his repose, form part of the Orthodox tradition surrounding his canonisation."
