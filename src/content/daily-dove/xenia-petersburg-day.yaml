saintLabel: "Blessed Xenia of St Petersburg"
kicker: "Feature"
headline: "The Woman Everyone Knows — but No One Can Explain"
date: "Late 18th Century"
location: "St Petersburg"
dek: "Some call her mad. Others refuse to begin the day’s work until she has crossed their path."
summary: "She owns no house and carries no purse. To those seeing her for the first time she appears to be another beggar wandering the capital. Those who have lived here longer know better."
miracles:
  - "provision"
  - "protection"
  - "family"
  - "prayer"
body:
  - "Long before the first merchants raise their shutters and while the morning mist still hangs over the Neva, there is already someone walking the streets."
  - "She owns no house. She carries no purse. In the bitter winters that drive respectable citizens indoors, she can often be found wearing the same threadbare garments she wore the day before. Snow gathers on her shoulders without seeming to trouble her. Rain soaks through her clothes, yet she never asks for shelter."
  - "To those seeing her for the first time, she appears to be little more than another beggar wandering the capital. Those who have lived here longer know better. “That is Xenia,” a coachman told this reporter, removing his cap as she passed. “If she accepts something from you today, your day will go well.”"
  - "No decree of the Imperial Court has made her famous. No monastery claims her. She holds no office in the Church. Yet ask a baker near the market, a widow living along the Fontanka, or a labourer hauling stone across the frozen streets, and nearly all have a story."
  - "Some say she knew their thoughts before they spoke. Others insist she appeared exactly when help was needed, only to disappear before anyone could thank her. Still others smile quietly and decline to say anything at all. “People laugh until they need her prayers,” one elderly shopkeeper said."
  - "It has been years since the sudden death of her husband, Colonel Andrei Petrov. Those who remember the young widow say the tragedy altered her completely. She gave away nearly everything she owned. Her home was handed over to others. When asked her name, she often answered with her husband’s instead, insisting that it was Xenia who had died and that Andrei still lived."
  - "Many dismissed her as mad. Some children mocked her openly. Others threw stones. She never answered in anger."
  - "As the morning wore on, this correspondent followed at a respectful distance while she wandered from one neighbourhood to another. A merchant stepped from his doorway carrying a basket of warm bread. “Mother Xenia,” he called softly. She accepted only a single loaf. He seemed pleased by this. When asked why, he shrugged. “It is enough.”"
  - "Not far away, a young mother hurried after her carrying a restless infant. Xenia paused only briefly. She traced the sign of the Cross over the child. The woman wept. “I have prayed she would come,” she whispered after Xenia continued on without another word. No explanation followed. None seemed necessary."
  - "By midday the streets had grown busy. Carriages splashed through melting snow. Fishmongers argued over prices. Soldiers hurried toward the Admiralty. In the midst of the city’s endless motion, Xenia seemed almost untouched by its urgency."
  - "She stopped to speak with a labourer repairing a damaged roof. Those working beside him later said she urged him to finish before nightfall. Hours after she departed, part of the neighbouring structure reportedly collapsed. No one on the roof was injured."
  - "Stories like this circulate throughout the city with remarkable frequency. Some dismiss them as coincidence. Others have long since stopped trying to explain them."
  - "As evening approached, most citizens returned to warm homes and waiting families. Xenia walked beyond the edge of the city. Those familiar with her habits say she often spends the night alone in open fields, praying until dawn before returning to the streets the following morning."
  - "No one knows how many miles she walks in a day. No one seems able to explain how an elderly woman survives such winters with so little. Yet every morning, there she is again. Walking quietly through the capital. Accepting almost nothing. Giving away far more than she receives."
  - "It is an odd thing to become famous for possessing nothing. Yet perhaps that is why St Petersburg cannot stop talking about her. The city’s merchants measure wealth by ledgers. Its officials measure influence by rank. Its nobles measure success by estates and titles. The woman wandering its streets has none of these. And still, people wait for her to pass their door."
