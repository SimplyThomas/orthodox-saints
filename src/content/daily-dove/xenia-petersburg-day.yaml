aroundTheEmpire:
  heading: "Around the Capital"
  notes:
    - city: "Smolensk Cemetery"
      note: "Labourers continue construction on the church dedicated to the Smolensk Icon of the Mother of God. Several workers report finding piles of bricks already waiting for them before sunrise, though none claim to know who carried them there during the night."
    - city: "Nevsky Prospect"
      note: "Shopkeepers continue the curious custom of offering alms to the wandering woman known as Xenia, believing her acceptance of a small gift to be a blessing rather than a burden."
editorsNotebook:
  body:
    - "Cities usually celebrate their powerful. Generals ride through triumphal arches. Statesmen receive banquets. The wealthy commission portraits that hang for generations."
    - "Yet this city speaks most often about a homeless widow. Perhaps history is keeping a different sort of ledger than we are."
literaryFraming: "This article follows an imaginary reporter through a single day in St Petersburg. The conversations with merchants, labourers, and townspeople are fictionalised to recreate the atmosphere of the city. They are not preserved as historical quotations, though they reflect themes consistently found in the early accounts of Xenia’s life."
historiansNotes:
  entries:
    - level: "orthodox-tradition"
      claim: "St Xenia of St Petersburg (c. 1719–1803) became a Fool-for-Christ after the sudden death of her husband."
      note: "Orthodox tradition consistently records that she gave away her possessions, lived as a wanderer, accepted insults with humility, and became known throughout the city for her prophetic insight, hidden acts of charity, and remarkable intercessions. Her habit of referring to herself by her husband’s name is among the best-attested features of her life."
    - level: "orthodox-tradition"
      claim: "She is said to have carried bricks by night for the construction of the Smolensk Church, and to have given prophetic warnings."
      note: "These traditions are preserved in early accounts of her life and have remained central to her veneration, along with the widespread belief that her prayers brought blessing."
