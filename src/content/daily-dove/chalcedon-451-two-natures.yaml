dek: "Bishops receive the Tome of Leo as the council defines Christ’s two natures."
summary: "A thunderous acclamation filled the Basilica of Saint Euphemia as the assembled fathers concluded the public reading of the Tome of Pope Leo I. The council approved a definition proclaiming Jesus Christ one and the same Son, acknowledged in two natures — without confusion, without change, without division, and without separation."
plate: "ICON · THE FOURTH ECUMENICAL COUNCIL, A.D. 451"
body:
  - "A thunderous acclamation filled the Basilica of Saint Euphemia today as bishops assembled at the Fourth Ecumenical Council concluded the public reading of the Tome of Pope Leo I."
  - "The declaration marked one of the most memorable moments of the council as hundreds of bishops examined Leo’s Christological teaching alongside the writings of St. Cyril of Alexandria and the decrees of the earlier ecumenical councils."
  - "The council was convened by Emperor Marcian and Empress Pulcheria following years of unrest after the Second Council of Ephesus in AD 449 — a gathering later condemned by many bishops as deeply flawed because of procedural irregularities and violence against several participants."
  - "The central question before the council has been how best to confess the mystery of Christ’s Incarnation. Following weeks of testimony, document readings, and careful examination of earlier fathers, the council approved a doctrinal definition proclaiming that Jesus Christ is one and the same Son, acknowledged in two natures, divine and human, without confusion, without change, without division, and without separation."
  - "Council members repeatedly emphasized that they were not introducing a new doctrine but preserving the faith handed down from the Apostles and defended by earlier councils, particularly Nicaea and Ephesus."
  - "Several bishops noted that Leo’s Tome was accepted only after being carefully compared with the writings of St. Cyril of Alexandria to ensure that the two were in harmony. “It agrees with the Fathers,” one bishop declared after the comparison was completed."
  - "Although today’s acclamation has been widely celebrated within the council, not every participant has welcomed the outcome. Debate surrounding the leadership of Patriarch Dioscorus of Alexandria continues, and questions remain regarding how churches throughout Egypt and the East will receive the council’s definition."
  - "For now, however, the assembly has spoken with remarkable unity on one point: Jesus Christ is fully God and fully man, one Person in two natures."
pullQuote:
  text: "“Peter has spoken through Leo!”"
  attribution: "— The acclamation of the assembled bishops, after the reading of the Tome"
