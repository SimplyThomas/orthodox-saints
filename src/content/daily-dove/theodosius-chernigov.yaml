editorsNotebook:
  body:
    - "The opening of a tomb usually marks the end of an investigation. Today, it marked the beginning of one."
    - "The Church did not gather looking for marvels. She gathered to examine the life of one of her shepherds with sobriety, patience, and reverence."
    - "Whatever conclusions history ultimately draws, one fact cannot be disputed. By the close of this day, thousands who had never met Archbishop Theodosius had come to stand quietly before him."
literaryFraming: "The dialogue, the reporter’s observations, and the individual pilgrims described in this article are fictionalised. The sequence of events — the opening of the tomb, the careful examination by Church authorities, and the gathering of large crowds — is based on the historical record, while the personal reactions are imaginative reconstructions intended to convey the atmosphere of the day."
historiansNotes:
  entries:
    - level: "contemporary-source"
      claim: "St Theodosius of Chernigov (1630–1696) served as Archbishop of Chernigov and was renowned during his lifetime for his pastoral care, asceticism, and spiritual wisdom."
    - level: "contemporary-source"
      claim: "In 1896, as part of the process leading to his canonisation, his tomb was officially opened."
      note: "Contemporary ecclesiastical records describe the examination of his relics and the profound impression their condition made upon those present. The uncovering was followed by increased pilgrimage and reports of answered prayers through his intercession. The Orthodox Church formally glorified him later that same year."
