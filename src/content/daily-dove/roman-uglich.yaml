  notes:
    - city: "Church Construction"
      note: "Work continues on several churches sponsored by Prince Roman, whose patronage has supported both new construction and the repair of older sanctuaries throughout the principality."
    - city: "City Infirmary"
      note: "Staff report that the prince remains a frequent visitor, often arriving without advance notice to speak with the sick and distribute aid to families in need."
editorsNotebook:
  body:
    - "History often praises rulers for expanding borders. Prince Roman appears more interested in expanding mercy."
    - "One kind of kingdom is measured on maps. The other is measured by the people no one else notices."
literaryFraming: "The council meeting, conversations in the city, and the reporter’s observations are fictionalised. They are designed to illustrate the consistent historical portrait of Prince Roman as a ruler whose daily life was marked by quiet acts of charity rather than courtly display."
historiansNotes:
  entries:
    - level: "orthodox-tradition"
      claim: "St Roman Vladimirovich, Prince of Uglich (1235–1285) was remembered as a devout and charitable ruler."
      note: "After the death of his wife he devoted himself with increasing intensity to works of mercy, founding churches, caring for the poor, supporting widows and orphans, and regularly visiting the sick. His reputation for holiness grew not through military achievements but through his humility, generosity, and personal involvement in the lives of his people."
    - level: "orthodox-tradition"
      claim: "Orthodox tradition also remembers miracles associated with his relics after his repose, contributing to his veneration as a wonderworker."
