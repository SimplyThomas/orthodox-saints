editorsNotebook:
  body:
    - "Cities rise because people gather. Monasteries usually rise because someone leaves."
    - "Luke climbed a mountain hoping to be forgotten. Instead, he built a place the world still climbs to reach."
literaryFraming: "The reporter’s ascent, the conversations with pilgrims, and the individual encounters with Luke are fictionalised. They are intended to reflect the atmosphere surrounding his monastery during his lifetime rather than recount a single documented day."
historiansNotes:
  entries:
    - level: "orthodox-tradition"
      claim: "St Luke of Hellas (896–953) was born to a humble farming family and embraced the ascetic life from an early age."
      note: "After years of wandering and monastic formation he settled near Steiris in Phocis, where his holiness, prophetic insight, and gifts of healing drew increasing numbers of disciples and pilgrims. A monastic community formed around him during his lifetime, eventually becoming the monastery now known as Hosios Loukas."
    - level: "orthodox-tradition"
      claim: "His Life records numerous miracles, healings, and prophecies."
      note: "It consistently portrays these as flowing from a life of profound humility, prayer, and charity."
