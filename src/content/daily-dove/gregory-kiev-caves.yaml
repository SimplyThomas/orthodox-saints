    - city: "Monastery of the Caves"
      note: "Pilgrims arriving this week report growing interest in the life of the hermit Gregory, whose quiet wisdom has drawn visitors from throughout Rus’."
editorsNotebook:
  heading: "Editorial"
  body:
    - "A theft usually ends with someone losing something. This one ended with several men finding what they had not known they were looking for."
    - "The account preserved by the monks does not dwell on what might have been hidden in Gregory’s cell, because that was never the true treasure. The elder possessed almost nothing, yet he gave away the one thing his visitors had never expected to receive. Mercy."
literaryFraming: "The descriptions of the forest, the dialogue, the unnamed monk’s recollections, and the pacing of the events are literary reconstructions written in newspaper style. The underlying episode — the attempted robbery, Gregory’s merciful response, and the repentance of the thieves — is preserved in the monastic tradition."
historiansNotes:
  entries:
    - level: "orthodox-tradition"
      claim: "Gregory is remembered as a wonderworker whose gentleness toward thieves led them to repentance rather than punishment."
      note: "The account is preserved in the Kiev Caves Paterikon, which records the lives and traditions of the monks of the Kiev Caves Monastery."
