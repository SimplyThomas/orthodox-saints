  - Deuteronomy 13:13; Judges 19:22; 1 Samuel 2:12; 25:17, 25; Nahum 1:15 (the impersonal Hebrew noun)
  - 1QM (the War Scroll); 1QS (the Community Rule) III–IV (Dead Sea Scrolls)
