overview:
  - "Belial appears once in the received Scriptures as the name of a person, in a single line of the Apostle Paul: “what concord hath Christ with Belial? or what part hath he that believeth with an infidel?” It stands in a chain of contrasts — righteousness and lawlessness, light and darkness, the temple of God and idols — and it is the only place in the whole canon where the word is used this way."
  - Everywhere else in Scripture it is not a name at all. The Hebrew beliyya‘al is an ordinary noun meaning worthlessness, ruin, or good-for-nothing. “Sons of Belial” in the Old Testament means simply worthless men — the mob at Gibeah, the sons of Eli, Nabal in his churlishness — and no English reader would suspect a demon behind the phrase if the translators had rendered the word instead of transliterating it.
  - The personification happened in the literature between the Testaments, above all at Qumran, where Belial is the prince of darkness who commands the sons of the pit against the sons of light. Paul writes in a world where that usage was current, and uses it once, as a figure for everything that cannot be joined to Christ. The Church has not built a demonology on the name, and this record does not either.
historicalContext:
  - The Hebrew word occurs some twenty-seven times in the Old Testament, always as a common noun and usually in a construct phrase — “sons of Belial,” “men of Belial,” “a witness of Belial,” “a thing of Belial.” The Greek Septuagint generally translates rather than transliterates it, which is itself evidence that the translators heard a word and not a name.
  - "Between the Testaments that changes decisively. In the Dead Sea Scrolls, Belial is a personal figure: the War Scroll arrays the sons of light against the army of Belial, the Community Rule describes the two spirits and the dominion of Belial over the sons of injustice, and the community’s liturgy curses him by name. The Testaments of the Twelve Patriarchs and the Ascension of Isaiah use the form Beliar in the same personal way, and Jubilees speaks of the spirits of Belial."
  - "So the Apostle’s single use falls at a precise point in the history of a word — after it had become a name in the Jewish literature of his time, and in a letter written to Corinthians who would have understood it as one. That is why the record is catalogued as Scriptural: 2 Corinthians 6:15 genuinely uses it of a person. It is also why nothing further can be built on it."
orthodoxInterpretation:
  - St. John Chrysostom, commenting on the passage, takes Belial simply as a name for the adversary and spends his effort where Paul does — on the impossibility of the mixture. The point of the verse is not information about a demon but the exclusion of any partnership between Christ and what opposes Him, and every clause in the chain says the same thing in a different pair of terms.
  - "The Orthodox tradition has accordingly never developed a figure of Belial. He has no place in the hymnography, no role in any patristic account of the fall, and no distinct character in Orthodox thought. The demonology of the Church is spare: the demons are fallen angels, created good and fallen by the free misuse of will, held under judgment, and defeated at the Cross. It does not need, and has not produced, a roster of princes."
  - This restraint is worth naming as a positive commitment rather than a gap. The elaborate hierarchies of named demons belong to Second Temple sectarian literature on one side and to later Western demonology on the other; the Eastern Church stayed out of both, on the conviction that close attention to the enemy is spiritually harmful and that the names God has not revealed are not ours to catalogue as though they were.
liturgicalTradition:
  - None. Belial has no commemoration and appears in no Orthodox service. The Qumran community had a liturgy that cursed him by name; the Church does not, and the difference is instructive — the Orthodox services renounce the devil in the general terms Scripture uses, and name no individual spirit.
  - The passage in which he appears is read in church as part of the epistle to the Corinthians, where its subject is the incompatibility of the Christian life with idolatry, not the identity of a demon.
iconography:
  - There is no iconography of Belial, and there could not be. He is a name in a single verse with no narrative attached, and the fallen are in any case never written as icons.
historicalInfluence:
  - The word’s afterlife has been almost entirely in the direction Scripture does not go. Medieval and early modern Western demonology gave Belial a rank, a court and a legal career — the fifteenth-century Buch Belial staged him as an advocate pleading against Christ before the throne of God — and Milton set him among the fallen in Pandaemonium as the eloquent counsellor of ignoble ease. From there he passed into the general stock of the literary devil.
  - The Orthodox East produced none of this. What the Church retained from the passage is the sentence itself, which has become one of the standing scriptural expressions of the impossibility of divided loyalty.
  - "The Dead Sea Scrolls, rediscovered in the twentieth century, made the Second Temple usage visible again and clarified exactly what Paul was drawing on. That is the record’s chief scholarly value: it shows a word caught in the act of becoming a name, and it lets the reader see precisely how much of the popular devil comes from Scripture and how much from the literature around it."
essentialsHeading: A word, and what became of it
salvationHistory:
  - heading: An ordinary Hebrew noun
    body:
      - Beliyya‘al means worthlessness or ruin. In the Old Testament it is always a common noun, most often in the phrase “sons of Belial” — which means worthless men, and nothing more sinister than that.
  - heading: The mob at Gibeah
    body:
      - In Judges 19:22, “certain sons of Belial” beset the house — a phrase most modern translations render “worthless fellows” or “scoundrels,” because that is what it says. The older English versions transliterated it, and the capital letter did the rest.
  - heading: The sons of Eli, and Nabal
    body:
      - 1 Samuel 2:12 calls Eli’s sons “sons of Belial” who knew not the Lord; in 1 Samuel 25, Abigail’s servant and then Abigail herself use the same word of Nabal. In both cases it is a moral judgment on human beings, not a statement about their allegiance to a spirit.
  - heading: The name is born at Qumran
    body:
      - "In the Dead Sea Scrolls Belial has become a person: the prince who commands the sons of darkness in the War Scroll, the ruler of the sons of injustice in the Community Rule, cursed by name in the community’s liturgy. This is the usage Paul’s readers would have known."
  - heading: One line in the New Testament
    body:
      - “What concord hath Christ with Belial?” — 2 Corinthians 6:15, in a chain of five contrasts. It is the single personal use in the whole canon, and the Apostle draws no further conclusion from it.
  - heading: The Church declined the rest
    body:
      - The elaborate figure of Belial belongs to Qumran on one side and to Western demonology on the other. Orthodox tradition took neither, and has no doctrine, no hymn and no story about him at all.
scripture:
  - ref: 2 Corinthians 6:14–16
    note: The single place in the received Scriptures where Belial names a person, in a chain of contrasts with Christ, light, righteousness and the temple of God.
  - ref: Deuteronomy 13:13
    note: “Certain men, the children of Belial” — the impersonal noun; men who entice a city to idolatry.
  - ref: Judges 19:22
    note: The men of Gibeah; modern translations render the word “worthless fellows.”
  - ref: 1 Samuel 2:12
    note: The sons of Eli, “sons of Belial,” who knew not the Lord.
  - ref: 1 Samuel 25:17, 25
    note: Nabal, called a son of Belial and a man of Belial — a judgment on his character, not his allegiance.
  - ref: Nahum 1:15
    note: “The wicked shall no more pass through thee” — beliyya‘al again as a noun, of a human enemy.
  - ref: 1QM, the War Scroll (extra-biblical)
    note: The sons of light against the army of Belial. The clearest evidence of the word’s personification before the New Testament.
  - ref: 1QS, the Community Rule III–IV (extra-biblical)
    note: The two spirits, and the dominion of Belial over the sons of injustice.
  - ref: Ascension of Isaiah 1–5; Testaments of the Twelve Patriarchs (extra-biblical)
    note: The form Beliar, used personally. Second Temple and early Christian pseudepigrapha; no authority.
sections:
  - heading: Why the Old Testament references are not about a demon
    body:
      - This is the reason the record exists, and it is worth stating flatly. When the older English Bibles print “sons of Belial,” they are transliterating a Hebrew common noun that means worthlessness. The phrase is Hebrew idiom for “worthless men,” exactly as “son of peace” means a peaceable man. Most modern translations render it accordingly, and the demon disappears from the verse — because he was never in it.
      - The same pattern is documented elsewhere in this section. Abaddon in the Old Testament is an impersonal word for the realm of destruction and the grave; only Revelation 9:11 makes it the title of a personal spirit. In both cases an ordinary Hebrew word was personified later, and in both cases reading the later sense back into the earlier verses would put a demon into passages that have none. The two records are the clearest paired illustration in this database of why the source registers are kept apart.
  - heading: What Paul is actually saying
    body:
      - "The verse sits inside a run of five parallel questions: righteousness with lawlessness, light with darkness, Christ with Belial, the believer with the unbeliever, the temple of God with idols. Each pair names two things that cannot be mixed, and the accumulation is the argument."
      - Chrysostom reads it as an appeal about company and worship rather than a disclosure about the spirit world, and this record follows him. The name is doing rhetorical work — it supplies the sharpest available antonym to Christ in the vocabulary Paul’s readers had — and the Apostle says nothing further about the being it names, then or anywhere else.
  - heading: The Church’s reticence about naming demons
    body:
      - Qumran cursed Belial by name in its liturgy. Later Western demonology gave him a rank and a courtroom. The Orthodox Church did neither, and the omission is deliberate rather than accidental.
      - "The Eastern tradition names very few individual spirits, addresses none, and consistently warns that studying the enemy closely is a way of attending to him. Its demonology is correspondingly spare: the demons are fallen angels, they act only as God permits, they cannot compel, and they have been defeated. Everything else it has been content not to know."
faq:
  - question: Is Belial in the Bible?
    answer:
      - "The word is, many times — but almost always as an ordinary Hebrew noun meaning worthlessness, in the idiom “sons of Belial,” which means worthless men. As the name of a person it appears exactly once, in 2 Corinthians 6:15: “what concord hath Christ with Belial?”"
  - question: What does “sons of Belial” mean?
    answer:
      - Worthless men, scoundrels, good-for-nothings. It is Hebrew idiom, and most modern translations render it that way rather than transliterating it. The older English Bibles kept the Hebrew word and capitalised it, which is why generations of readers have assumed a demon stands behind the phrase. In those passages, none does.
  - question: Is Belial another name for Satan?
    answer:
      - In the Dead Sea Scrolls and in some Second Temple writings, Belial is the prince of darkness and functions much as Satan does. The New Testament uses the name once and does not equate the two, and the Orthodox Church has not made the identification. Where Scripture does not say, this record does not either.
  - question: Why does the Orthodox Church say so little about Belial?
    answer:
      - Because Scripture says so little. There is one verse, with no narrative and no description, and the Church has never gone beyond its sources to fill the gap. The elaborate Belial of Western demonology and literature — the advocate pleading against Christ, the counsellor in Milton’s Pandaemonium — has no standing in Orthodox teaching at all.
  - question: Does Belial have a feast day?
    answer:
      - No. No demon has a commemoration, a hymn, an icon or a prayer of any kind. This record is catalogued for study only.
