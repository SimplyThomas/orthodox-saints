overview:
  - "Phanuel is an angel named in the Book of Enoch, which stands outside the biblical canon of the Orthodox Church. He is the fourth of the four angels of the Presence — those who stand before the Lord of Spirits — with Michael, Rufael and Gabriel."
  - "The book gives him a single, striking charge. Where Michael is merciful and long-suffering, Rufael set over diseases and wounds, and Gabriel over all the powers, the fourth “who is set over the repentance and hope of those who inherit eternal life, is named Fanuel” (1 Enoch 40:9). A little earlier the same chapter has him keeping the accusers from coming before the Lord of Spirits to accuse men."
  - "His name means “the face of God,” the same construction as Peniel, the place where Jacob said he had seen God face to face (Genesis 32:30)."
  - He is not one of the eight archangels the Orthodox Church venerates by name, and in later tradition his place is frequently taken by Uriel — a substitution the editor of the standard English text notes directly. He has no feast, hymn, or icon, and is catalogued here for study rather than devotion.
historicalContext:
  - "The chapters that name Phanuel belong to the Book of Parables, a section of 1 Enoch generally dated to the turn of the era. Its four angels of the Presence are one of the clearest early expressions of the idea that particular angels stand immediately before God — an idea Scripture itself touches when Raphael says he is one of the seven holy angels who enter before the glory of the Holy One (Tobit 12:15)."
  - "The name did not survive in that form. As R. H. Charles observes in his note to this chapter, in later Judaism Uriel appears where the Book of Enoch had Fanuel. The fourth place in the group remained; the name attached to it changed."
orthodoxInterpretation:
  - The Orthodox Church venerates eight archangels by name — Michael, Gabriel, Raphael, Uriel, Selaphiel, Jegudiel, Barachiel, and Jeremiel. Phanuel is not among them.
  - "The theme assigned to him — that repentance has an angelic advocate, and that the accusers are held back from the throne — is not itself foreign to Orthodox thought. Christ says there is joy in the presence of the angels of God over one sinner who repents (Luke 15:10), and the Church prays to its own guardian angels for exactly this help. What has no standing is the name, and the elaborate court it belongs to."
  - "The identification with Uriel is a fact about the transmission of these texts, not a warrant for reading Orthodox teaching about Uriel back into Phanuel. The Church received Uriel; it did not receive this name."
essentialsHeading: What the Book of Enoch says of him
salvationHistory:
  - heading: The fourth angel of the Presence
    body:
      - "Four angels stand before the Lord of Spirits in the Book of Parables. The first is Michael, merciful and long-suffering; the second Rufael, set over the diseases and wounds of the children of men; the third Gabriel, set over all the powers; and the fourth, set over the repentance and hope of those who inherit eternal life, is Fanuel (1 Enoch 40:9–10)."
  - heading: Set over repentance
    body:
      - His charge is repentance and the hope of eternal life. Of the four, it is the only one turned wholly toward the possibility of a person's change — the others govern mercy, affliction, and power.
  - heading: Holding back the accusers
    body:
      - The same chapter has him preventing the accusers from appearing before the Lord of Spirits to accuse those who dwell on the earth. It is the book's picture of repentance defended from above while it is still being made.
  - heading: At the end
    body:
      - He appears again among the angels who attend the vision of the end (1 Enoch 54:6; 71:8–9), in the company of Michael, Rufael and Gabriel.
scripture:
  - ref: 1 Enoch 40:9–10 (extra-biblical)
    note: Named as the fourth of the four angels of the Presence, set over the repentance and hope of those who inherit eternal life.
  - ref: 1 Enoch 54:6; 71:8–9 (extra-biblical)
    note: Named again among the four in the visions of judgement and of the end.
  - ref: Genesis 32:30
    note: Peniel — "the face of God" — the construction behind the name.
  - ref: Tobit 12:15 (Deuterocanonical)
    note: Raphael names himself one of the seven holy angels who enter before the glory of the Holy One — the canonical form of the idea the Book of Enoch elaborates.
  - ref: Luke 15:10
    note: "There is joy in the presence of the angels of God over one sinner who repents — the scriptural warrant for the theme, without the name."
sections:
  - heading: Phanuel and Uriel
    body:
      - "The standard English editor of the Book of Enoch notes plainly that in later Judaism Uriel is found in place of Fanuel. Modern reference works often repeat the identification, and it is the reason the name turns up in lists of archangels that Orthodoxy does not recognise."
      - "The safe reading is the modest one: the fourth place among the angels of the Presence was durable, and the name filling it was not. Nothing about Uriel's standing in the Church transfers to Phanuel on that account."
  - heading: What survives, and what does not
    body:
      - "The Church did not keep this name. It did keep the conviction underneath it — that repentance is not a solitary act, that the angels attend it, and that they rejoice over it. That conviction rests on the Gospel and on the Church's prayers, not on this book."
faq:
  - question: Is Phanuel in the Bible?
    answer:
      - "No. He is named only in the Book of Enoch, which the Orthodox Church does not receive as Scripture. The name Peniel appears in Genesis 32:30, but that is a place, not an angel."
  - question: Is Phanuel the same as Uriel?
    answer:
      - Later Jewish tradition put Uriel in the place the Book of Enoch gives to Phanuel, and the standard English editor notes it. The Orthodox Church venerates Uriel under his own name; it has not received Phanuel, and the two should not be treated as one.
  - question: Is he the angel of repentance?
    answer:
      - The Book of Enoch sets him over repentance and the hope of eternal life. He should not be confused with the angel of repentance in the Shepherd of Hermas, which is a different figure in a different book. Neither is a doctrine of the Church.
  - question: Does Phanuel have a feast day?
    answer:
      - No. He has no feast, commemoration, hymn, or icon in Orthodox tradition.
