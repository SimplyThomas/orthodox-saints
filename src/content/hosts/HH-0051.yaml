overview:
  - The Watchers — Aramaic ‘irin, “the wakeful ones,” Greek Grigori — are the angels of the Book of Enoch who abandoned the station given them. Two hundred of them descend upon Mount Hermon, bind themselves by a mutual oath so that none can draw back, take human wives, teach humankind arts they had no leave to teach, and father the giants whose violence fills the earth until the Flood.
  - The Book of Enoch is not Scripture in the Orthodox Church. It is a Second Temple Jewish work, known in the world of the New Testament and quoted once in the Epistle of Jude, but never received among the canonical books; only the Ethiopian and Eritrean Orthodox Tewahedo Churches, which are not in communion with the Eastern Orthodox Church, include it in their canon.
  - What the received Scriptures say is briefer and firmer. Genesis records, in four verses, that the sons of God took the daughters of men and that there were giants in the earth in those days. The Second Epistle of Peter and the Epistle of Jude say that angels sinned, did not keep their first estate, and are held in chains of darkness until the judgment of the great day. Everything beyond that — the number, the mountain, the oath, the names, the arts taught — comes from outside the canon.
  - They are catalogued here because the Enochic account shaped the vocabulary of the New Testament world and the imagination of the centuries since, and a reader who meets the name deserves to be told plainly where it comes from and what standing it has. The twenty named chiefs, Semjaza, Azazel and the rest are set out in full on the Book of Enoch page, with the same caution.
historicalContext:
  - The Book of the Watchers (1 Enoch 1–36) is the oldest part of the Enochic collection, commonly dated to the third or early second century BC. Aramaic fragments of it were found among the Dead Sea Scrolls at Qumran, so the traditions were current well before Christianity. The Book of Giants, a related work surviving in fragments from the same library, develops the story of the giant offspring.
  - "The account answers a question Genesis raises and does not answer. Genesis 6:1–4 is famously terse: the sons of God saw the daughters of men, took wives, and there were giants in the earth. It gives no explanation, no names, and no judgment scene for the angels. The Enochic literature supplies all three at length, and it is that expansion — not the biblical verses — that has furnished nearly everything popularly said about “the Watchers.”"
  - The word itself is not Enochic in origin. It appears in the Book of Daniel, where “a watcher and an holy one came down from heaven” to announce Nebuchadnezzar’s humbling. There the watchers are holy, sent, and obedient — the term simply names a class of vigilant heavenly beings. The Enochic use of the same word for a group who rebelled has caused persistent confusion between the two, and they should be kept firmly apart.
orthodoxInterpretation:
  - The Fathers do not agree about Genesis 6:1–4, and this record does not pretend otherwise.
  - "The earlier and widely-held reading is the angelic one: the “sons of God” are angels, and the passage describes the transgression the Enochic literature elaborates. St. Justin Martyr, Athenagoras, Tertullian and Clement of Alexandria all read it this way, in a period when the Enochic traditions were familiar and often respected."
  - "The reading that prevailed later, and that dominates the Byzantine tradition, is the Sethite one: the “sons of God” are the righteous line of Seth and the “daughters of men” the line of Cain, so the passage describes not an angelic transgression but the corruption of the godly line by intermarriage. St. John Chrysostom argues this at length in his Homilies on Genesis, as do St. Ephrem the Syrian and, in the West, St. Augustine. Their objection is partly exegetical and partly theological — Christ says that in the resurrection the angels neither marry nor are given in marriage, and the Fathers of this school take bodiless beings to be incapable of such union in principle."
  - "The Orthodox Church has never dogmatised either reading. What it does hold, on the authority of the received Scriptures rather than of Enoch, is the plain statement of 2 Peter and Jude: angels sinned, and are reserved in darkness unto judgment. St. John of Damascus’s account of the fall of the angels — created good, fallen by the free misuse of will — is the doctrinal frame, and it needs no Enochic detail to stand."
liturgicalTradition:
  - There is none. The Watchers have no commemoration, no hymn, no place in any service, and no icon. The Church’s services name the bodiless powers constantly and these are not among them.
  - The Book of Enoch itself has no liturgical use in the Eastern Orthodox tradition. It is not read in church, not appointed for any day, and not cited in the hymnography. Where the fallen angels appear in the services at all, it is in the general terms the Scriptures use — the enemy, the adversary, the demons — and always in the context of Christ’s victory over them.
iconography:
  - The Watchers are not depicted in Orthodox iconography. There is no traditional composition for the descent on Hermon, the oath, or the giants, because the scenes belong to a book the Church did not receive and the beings are not honoured.
  - "Where fallen angels appear in Orthodox icons — beneath the feet of the Archangel Michael, bound under the shattered gates in the Harrowing of Hades, pulling at the monks in the Ladder of Divine Ascent, in the river of fire in the Last Judgment — they are shown dark, small, haloless and defeated, and they are generic: no Orthodox icon names an individual demon or a group of them."
historicalInfluence:
  - The Enochic account of the Watchers is one of the most historically consequential texts never to have entered a canon. It supplied the ancient world with an explanation for the origin of evil spirits — in the later Enochic strand, the disembodied spirits of the dead giants become the demons that trouble the world — and that explanation circulated widely in the centuries around the New Testament.
  - "Early Christian writers engaged it directly: Tertullian defended the book, Origen knew it without treating it as universally received, and the great mass of later opinion set it outside the canon. The Epistle of Jude quotes a prophecy attributed to Enoch, which tells us the tradition was known to the apostolic Church; it does not make the book Scripture, any more than Paul’s quotation of a Greek poet canonises the poet."
  - In modern times the Watchers have had an energetic second life in popular literature, film, and a good deal of speculative religious writing that treats 1 Enoch as suppressed Scripture. It was not suppressed; it was read, weighed, and not received. Presenting it as hidden truth misrepresents both the book and the Church that declined it.
essentialsHeading: The account, and what stands behind it
salvationHistory:
  - heading: The descent
    body:
      - In 1 Enoch 6, two hundred Watchers see the daughters of men and desire them. Their chief, Semjaza, fears that he alone will bear the penalty, and binds them all by a mutual oath on the summit of Mount Hermon so that none can withdraw. The oath, not the desire, is what the text presents as the decisive act.
  - heading: What they taught
    body:
      - "The corruption in the Enochic account is as much intellectual as carnal: metalworking and weapons, cosmetics and ornament, astrology and the reading of the stars, enchantments and the cutting of roots, and (in the later chapters) writing itself. The book does not condemn the arts as such — it condemns heavenly knowledge given outside the order God appointed for it."
  - heading: The giants
    body:
      - Their offspring are the giants, who consume the earth’s produce, then its animals, then turn on humanity. Their violence is presented as a principal cause of the Flood. Genesis 6:4 mentions the Nephilim in a single verse and says nothing of their parentage.
  - heading: The archangels intervene
    body:
      - The cry of the earth reaches heaven, and Michael, Gabriel, Raphael and Uriel bring the matter before God. Raphael is sent to bind Azazel hand and foot and cast him into the desert chasm of Dudael; Gabriel is sent against the giants; Michael against Semjaza and his company. The faithful angels are the agents of the judgment.
  - heading: Bound until the judgment
    body:
      - "The Watchers are chained in darkness beneath the earth, to remain until the day of the great judgment. This is the single point where the Enochic account and the received Scriptures plainly converge: 2 Peter 2:4 and Jude 6 say the same thing in a sentence apiece."
  - heading: What the Church actually confesses
    body:
      - That angels were created good; that some fell by the free misuse of their will; that they are held under judgment; and that Christ has already overcome them. The narrative furniture — two hundred, Hermon, the oath, the names — belongs to the Book of Enoch, and the Church has not made it an article of faith.
scripture:
  - ref: Genesis 6:1–4
    note: The four verses everything else expands. The Fathers divide over whether the “sons of God” are angels or the line of Seth; the passage itself does not say.
  - ref: 2 Peter 2:4
    note: “God spared not the angels that sinned, but cast them down” — the protocanonical statement, without narrative detail.
  - ref: Jude 6
    note: The angels “which kept not their first estate,” reserved in everlasting chains under darkness unto the judgment of the great day.
  - ref: Jude 14–15
    note: Quotes a prophecy attributed to Enoch, closely paralleling 1 Enoch 1:9. It shows the tradition was known; it does not make the book canonical.
  - ref: Daniel 4:13, 17, 23
    note: "CRITICAL DISTINCTION: “a watcher and an holy one came down from heaven.” These watchers are HOLY, sent by God — the same word, an entirely different set of beings. They must never be confused with the fallen Watchers of 1 Enoch."
  - ref: Sirach 16:7 (deuterocanonical)
    note: “He was not pacified toward the old giants, who fell away in the strength of their foolishness.” Names the ancient giants, not the Watchers.
  - ref: Wisdom of Solomon 14:6 (deuterocanonical)
    note: “When the proud giants perished” — again the giants, in a book Orthodoxy reads as Scripture.
  - ref: Baruch 3:26–28 (deuterocanonical)
    note: “There were the giants famous from the beginning… they perished, because they had no wisdom.”
  - ref: 1 Enoch 6–16 (extra-biblical)
    note: "The Book of the Watchers: the descent, the oath on Hermon, the forbidden arts, the giants, the appeal of the archangels, and the binding. The sole developed account."
  - ref: 1 Enoch 69 (extra-biblical)
    note: A later list adding Gadreel, Penemue, Kasdeja and Jeqon, with the arts attributed to each.
  - ref: Jubilees 4:15; 5:1–11 (extra-biblical)
    note: "An independent Second Temple retelling: the Watchers descend (initially to teach righteousness), and the giants and the judgment follow."
sections:
  - heading: The holy watchers of Daniel are not these
    body:
      - This is the single most important distinction on the page. In Daniel 4 the word “watcher” names a class of vigilant heavenly beings who come down from heaven at God’s command and announce His decree — “this matter is by the decree of the watchers, and the demand by the word of the holy ones.” They are obedient, they are called holy in the same breath, and nothing whatever is wrong with them.
      - The Book of Enoch applies the same term to a group of angels who rebelled. The word is a category, not a verdict — as “angel” names a kind of being and not a moral state. Popular writing routinely fuses the two, so that “the Watchers” sounds like a synonym for fallen angels. In Scripture it is not.
  - heading: Why the Church did not receive the Book of Enoch
    body:
      - Not by conspiracy and not by accident. The book was known, read, argued over, and finally not included — chiefly because it was not in the Hebrew Scriptures received by the Church, and because its pseudonymous attribution to a patriarch who lived seven generations from Adam was not credible as authorship. Some Fathers valued portions of it; others warned against treating it as Scripture.
      - "This is the ordinary way a canon forms: by long use and long testing, not by suppression. A book that circulated freely for centuries, was quoted by an apostle, and survives complete in Ge‘ez is not a book anyone managed to hide."
  - heading: The twenty chiefs, and where to find them
    body:
      - 1 Enoch 6:7 names twenty leaders of the descent — Semjaza, Arakiel, Rameel, Kokabiel, Tamiel, Ramiel, Danel, Ezeqeel, Baraqiel, Asael, Armaros, Batarel, Ananel, Zaqiel, Samsapeel, Satarel, Turel, Yomiel and their fellows — most of whom are little more than names, several remembered for one forbidden art apiece. Azazel, the most prominent of them, is bound by Raphael in the chasm of Dudael.
      - "They are catalogued individually, with their references and the arts attributed to each, on the Book of Enoch page, together with the giants, the Elioud, and the figures of the Book of Giants. They are deliberately not given separate records here: a name in a list does not need its own page, and the Enochic material belongs with the book that supplies it."
faq:
  - question: Are the Watchers in the Bible?
    answer:
      - Not by that name, and not with that story. Genesis 6:1–4 mentions the “sons of God” and the giants in four verses; 2 Peter 2:4 and Jude 6 say that angels sinned and are held until the judgment. The Watchers as such — the two hundred, Mount Hermon, the oath, the names, the forbidden arts — are from the Book of Enoch, which the Orthodox Church does not receive as Scripture.
      - The word “watcher” does appear in Scripture, in Daniel 4, but there it names holy angels sent by God.
  - question: Does the Orthodox Church accept the Book of Enoch?
    answer:
      - No. In the Eastern Orthodox tradition 1 Enoch is ancient Jewish religious literature, not Scripture. It is not read in church and carries no doctrinal authority. It is canonical only in the Ethiopian and Eritrean Orthodox Tewahedo Churches, which are not in communion with the Eastern Orthodox Church.
  - question: Were the “sons of God” in Genesis 6 angels?
    answer:
      - The Fathers disagree, and the Church has not settled it. The earlier reading, held by St. Justin Martyr, Athenagoras, Tertullian and Clement of Alexandria, says yes. The reading that prevailed in the Byzantine tradition — St. John Chrysostom, St. Ephrem, St. Augustine — says they are the righteous line of Seth, and the passage describes the corruption of that line rather than an angelic transgression. Both are held by saints; neither is dogma.
  - question: Is Jude quoting the Book of Enoch proof that it is Scripture?
    answer:
      - No. Jude 14–15 quotes a prophecy attributed to Enoch, which shows the tradition was known and thought worth citing. The Apostle Paul likewise quotes Greek poets in Acts 17 and Titus 1 without making them Scripture. A quotation establishes familiarity, not canonicity.
  - question: Are the Watchers the same as demons?
    answer:
      - Not in the Enochic account itself, which distinguishes them carefully. The Watchers are bound and imprisoned until the judgment; it is the spirits of their destroyed giant offspring that, in 1 Enoch 15, remain on the earth as the evil spirits that afflict humanity. The Orthodox Church does not teach this account of the origin of demons — it holds simply that the demons are fallen angels.
  - question: Do the Watchers have a feast day?
    answer:
      - No. They have no commemoration, no hymn, no icon and no prayer of any kind. This record is catalogued for study only.
