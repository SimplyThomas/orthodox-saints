overview:
  - Satan is the chief of the fallen angels. The Hebrew word means “the adversary,” and the Greek that translates it, diabolos, means “the slanderer” — both of them descriptions of what he does rather than names given him at his creation. Scripture calls him the tempter, the accuser of the brethren, the father of lies, the ancient serpent, the great dragon, and the prince of this world.
  - "The Orthodox Church teaches that he was created good. There is no evil nature and no evil creator; God made angels, and one of them, with those who followed him, turned away by the free misuse of his own will. Evil has no substance of its own — it is a privation, a turning from the good, as blindness is not a thing but the absence of sight. This is why Orthodoxy has never been dualist: Satan is not God’s opposite number but a creature in rebellion, and a defeated one."
  - "What he can do is real and should not be made light of: he tempts, he accuses, he lies, and he sows despair. What he cannot do is equally real. He cannot compel anyone. He cannot act beyond what God permits — the Book of Job makes that limit the whole point of its opening. And he has already lost: Christ has bound the strong man, trampled death by death, and emptied the accusation. The renunciation every Orthodox Christian makes at baptism is that victory taking hold of one particular life."
  - He has no feast, no hymn, no icon written for veneration, and no prayer. This record exists so that what the Church actually teaches about him can be found and read plainly — and so that the reader is not left to popular imagination, which has said a great deal about him that the Church has not.
historicalContext:
  - The Old Testament speaks of him with striking restraint. In Job the satan appears in the heavenly court as a figure with a title — “the adversary” — who challenges Job’s integrity and can touch him only within limits God sets twice over. In Zechariah he stands at the right hand of the high priest to accuse, and is rebuked. In 1 Chronicles 21:1 the word appears without the article, closer to a proper name. Nowhere does the Hebrew Bible give a narrative of his origin.
  - "Two great passages have been read as such a narrative since the early Church: Isaiah’s taunt against the king of Babylon, “How art thou fallen from heaven, O Day Star, son of the morning,” and Ezekiel’s lament over the king of Tyre, who was “in Eden, the garden of God” and “perfect in thy ways from the day that thou wast created, till iniquity was found in thee.” Their plain sense is the two human kings, and honest reading says so. The Fathers nevertheless heard in them the pattern of a greater fall, and read them typologically — as descriptions that fit the human tyrant and, behind him, the first pride of all. The Latin translation of Isaiah’s “Day Star” is lucifer, which is how a Latin common noun became, in English, a proper name Scripture never gives him."
  - By the time of the New Testament the picture is fully personal. He tempts Christ in the wilderness; he is seen falling as lightning from heaven; he enters into Judas; he asks to sift the apostles as wheat; he is the god of this age who blinds minds, and the roaring lion who seeks whom he may devour. The Apocalypse gathers the titles together in one verse — “that old serpent, called the Devil, and Satan, which deceiveth the whole world.”
orthodoxInterpretation:
  - "St. John of Damascus states the Church’s teaching compactly: the angels were created good, and he who stood at the head of one order, having free will, turned from what is according to nature to what is against it, and became darkness by withdrawing himself from the light. He fell not because he was made so, but because he chose. And with him fell those who followed."
  - Two things follow that the Church has always guarded. The first is that evil is not a thing. St. Dionysius the Areopagite argues that evil has no being of its own, no nature, no cause — it is a defect, a falling short, parasitic on a good that must exist first for it to spoil. St. Basil the Great wrote a whole homily to say that God is not the author of evil. So Satan is not a dark power balancing a light one; he is a creature whose whole existence, even now, is held in being by the God he refuses.
  - "The second is that he has no compelling power. The demons, says St. John of Damascus, have no authority over anyone at all unless it is permitted them by God — and even then they can suggest, never force. The Life of Antony makes the same point in narrative: the demons are loud, and their loudness is the measure of their weakness; if they had power they would not need the noise. The Fathers are consistent that a person is never overwhelmed against their will, and that the remedy is not technique but the ordinary Christian life — prayer, fasting, confession, the sign of the Cross, and above all humility, which the tradition says the enemy cannot imitate and cannot bear."
  - There is also a caution about attention itself. St. Antony the Great and the desert tradition after him warn against curiosity about the demons — against studying them, arguing with them, or granting them the dignity of fascination. To look hard at the enemy is already to look away from Christ. That is the spirit in which this page is written, and the reason it is short on speculation.
liturgicalTradition:
  - "The Church prays about Satan constantly and to him never. The clearest place is the rite of Holy Baptism: before the candidate is joined to Christ, they are asked whether they renounce Satan and all his works, and all his angels, and all his service, and all his pride — and they answer, and turn to the west to renounce, and then turn east to confess Christ as King and God. The exorcisms of the catechumenate precede this, praying that every evil spirit depart. (These texts are described here rather than quoted: the words of the service are ancient, but the English renderings in ordinary use are not all in the public domain.)"
  - The same movement runs through the year. At the Great Blessing of the Waters at Theophany the Church prays that the powers under the waters be crushed. Every service is sealed with the Cross, which the hymns of the Exaltation call the weapon of peace and the invincible trophy. Forgiveness Sunday sets the whole of Lent under the memory of the expulsion from Paradise, where the deception began. And the Sunday of the Last Judgment looks to the end that has already been decided.
  - There is no commemoration of him, and there never will be. A demon is not remembered by the Church; it is renounced.
iconography:
  - No icon of Satan is written for veneration, and none ever could be — an icon is an image made for honour, and honour is precisely what is refused here. He appears in Orthodox iconography only within scenes of his defeat, and always by a set of deliberate conventions that mark him as less, not more.
  - "He is shown dark, small, and formless beside the figures of light: black or ashen where the saints are gold, in profile or turned away where they face the viewer, and without a halo. In the Harrowing of Hades he lies bound beneath the shattered gates under Christ’s feet. In icons of the Archangel Michael he is the serpent beneath the spear. In the Ladder of Divine Ascent the demons pull at monks climbing the rungs, and are visibly unable to touch those who keep their eyes upward. In the Last Judgment he sits in the river of fire, already sentenced. In the Temptation the whole composition belongs to Christ, and the tempter stands at the edge of it."
  - The convention is itself a teaching. The Church has never let him be painted grand.
historicalInfluence:
  - "A great deal of what people believe about Satan comes not from Scripture or the Fathers but from later Western literature — Dante, Milton, and the long line after them — which gave him a biography, a court, a tragic grandeur, and a rhetoric of noble defiance. None of that is Orthodox teaching, and much of it inverts it: the Fathers describe not a magnificent rebel but a creature made small by refusing the only thing that could make it great."
  - "The other durable distortion is dualism — the instinct, ancient in Manichaeism and persistent since, to treat good and evil as two powers of comparable weight, and history as their contest. The Church condemned this repeatedly, and the reason is pastoral as much as doctrinal: a Christian who believes the outcome is in doubt lives in fear, and fear is the very thing the enemy trades in."
  - Orthodox spiritual writers have therefore tended to say less about him rather than more, and to redirect attention. The counsel of the tradition, from the desert to the present, is to attend to one’s own heart and to Christ, and to leave the enemy the contempt of being ignored.
essentialsHeading: What the Church actually teaches about him
salvationHistory:
  - heading: Created good
    body:
      - He was made an angel, and angels are made good. Nothing in him was evil by nature or by God’s design. The Church has never taught a creator of evil, and to say that Satan was made wicked would be to say exactly that.
  - heading: The fall was a choice
    body:
      - He turned by his own will — pride, in the constant reading of the Fathers, the preference of himself to God. Because it was a choice and not a nature, the responsibility is entirely his; and because angels are not divided by time and second thoughts as we are, the tradition understands that choice as final.
  - heading: The accuser, under limits
    body:
      - "In the Old Testament he appears as a figure in a court, not a rival kingdom: he accuses, he tests, and he is rebuked. The Book of Job frames every action of his with a permission and a boundary, twice stated. That framing is the point of the book’s opening, and the Church has never let it go."
  - heading: Answered in the wilderness
    body:
      - "He tempts Christ with bread, with spectacle, and with the kingdoms of the world, and is answered three times from Scripture. The Fathers read the scene as the reversal of Eden: where the first Adam was overcome in a garden with everything, the second overcomes in a desert with nothing."
  - heading: Defeated at the Cross
    body:
      - St. Athanasius writes that the Cross did not look like victory and was victory. In the Harrowing of Hades the gates are broken and the captives are led out; the accusation is emptied because the debt is paid. Whatever the enemy does afterward, he does as one already judged.
  - heading: The end is not in doubt
    body:
      - The Apocalypse gives the outcome plainly, and the Church has never treated the conclusion as uncertain. What remains uncertain is only each person’s own response — which is why the tradition spends its energy on repentance rather than on speculation about the enemy.
scripture:
  - ref: Genesis 3:1–15
    note: The serpent in the garden. Genesis does not name him; the identification with Satan is made explicitly in Revelation 12:9 and 20:2, and is universal in the Fathers.
  - ref: Job 1:6–12; 2:1–7
    note: “The adversary” in the heavenly court — the clearest scriptural statement that he acts only within limits God sets.
  - ref: Zechariah 3:1–2
    note: Standing to accuse the high priest, and rebuked.
  - ref: Isaiah 14:12–15
    note: The taunt against the king of Babylon. Its plain sense is the human king; the Fathers read it typologically of the fall of the first pride. The Latin lucifer here is a translation of “day star,” not a name.
  - ref: Ezekiel 28:12–19
    note: The lament over the king of Tyre, read the same way — plainly of the king, typologically of a greater fall.
  - ref: Matthew 4:1–11
    note: The temptation in the wilderness, answered three times from Scripture.
  - ref: Luke 10:18
    note: “I beheld Satan as lightning fall from heaven.”
  - ref: John 8:44
    note: A murderer from the beginning, and the father of lies — the closest thing to a definition the Gospels give.
  - ref: 2 Corinthians 11:14
    note: "Transformed into an angel of light: the warning that deception is his ordinary method, not open horror."
  - ref: Ephesians 6:11–12
    note: The armour of God, and the naming of the struggle as spiritual rather than against flesh and blood.
  - ref: 1 Peter 5:8
    note: The roaring lion — set immediately after a call to humility and to casting one’s care upon God.
  - ref: Revelation 12:7–12; 20:1–10
    note: The war in heaven, the identification of the dragon with the serpent and with Satan, and the end already declared.
  - ref: Wisdom of Solomon 2:24 (deuterocanonical)
    note: “Through envy of the devil came death into the world” — the deuterocanonical anchor, read by Orthodoxy as Scripture.
  - ref: 2 Enoch 29:4–5 (extra-biblical)
    note: The Slavonic Enoch’s account of the fall of Satanail. Widely known in the Slavic tradition and genuinely influential, but carrying no doctrinal authority.
  - ref: Life of Adam and Eve 12–16 (extra-biblical)
    note: The tradition that he fell for refusing to honour the image of God in Adam. Second Temple literature, not Scripture.
sections:
  - heading: Is “Lucifer” his name?
    body:
      - No. Isaiah 14:12 addresses the king of Babylon as helel ben shachar, “day star, son of the morning.” The Latin Vulgate rendered that lucifer — an ordinary Latin word meaning “light-bearer,” which was also used of the morning star and, in other contexts, even of Christ (2 Peter 1:19 speaks of the day star arising in your hearts).
      - English translations kept the Latin word and capitalised it, and centuries of literature treated it as the devil’s name before his fall. It is not. Scripture gives him no personal name at all — only titles describing what he does. The Church is content with that, and this page follows it.
  - heading: Why Orthodoxy is not dualist
    body:
      - "A dualist reads the world as a contest between two comparable powers, one good and one evil, with the outcome open. The Church rejected this in the Manichaeans and has rejected it since, and the ground is simple: there is one Creator, everything He made is good, and evil is not a rival substance but a wound in something good."
      - This is not a technicality. If evil were a power in its own right, the Christian life would be a war of uncertain outcome and fear would be reasonable. Because it is a privation in a defeated creature, the Christian life is instead the ordinary work of repentance under a victory already won — and fear becomes, as the Fathers repeatedly say, itself one of the enemy’s instruments.
  - heading: A word on attention
    body:
      - The desert tradition is unusually firm that curiosity about demons is itself dangerous — not because the subject is forbidden, but because attention is the currency of the spiritual life and this is a poor place to spend it. St. Antony the Great is remembered for treating the demons’ threats with contempt rather than with study.
      - Anyone reading this page in distress, or with a sense of being troubled, should speak to a priest rather than reading further here. The Church’s help in such matters is pastoral and sacramental, given in person; it is not information.
faq:
  - question: Did God create the devil?
    answer:
      - God created an angel, and angels are created good. He became the devil by his own free choice, turning away from God. Nothing evil came from God’s hand — evil is not a thing God could make, but a turning away from the good that He made.
  - question: Is Satan the opposite of God?
    answer:
      - No, and the Church has been firm about this. God is uncreated; Satan is a creature, held in existence at this moment by the God he refuses. The opposite number of Satan, if one must be named, would be the Archangel Michael — another creature. Treating him as God’s equal is the error of dualism, which Orthodoxy rejects.
  - question: Is Lucifer the devil’s real name?
    answer:
      - "No. “Lucifer” is a Latin word meaning “light-bearer,” used in the Latin translation of Isaiah 14:12 to render “day star” in a taunt addressed to the king of Babylon. Scripture gives the devil no personal name — only titles: the adversary, the slanderer, the tempter, the accuser, the father of lies."
  - question: Can the devil make me sin?
    answer:
      - No. The Fathers are consistent that he can suggest, tempt, frighten and deceive, but never compel. St. John of Damascus writes that the demons have no power over anyone unless God permits it, and even then the will is not overridden. This is why the remedies the Church gives are the ordinary ones — prayer, fasting, confession, the Cross, and humility.
  - question: Should I be afraid of the devil?
    answer:
      - The Church says to take him seriously and not to fear him, which are different things. He is real and he is defeated. Fear itself is one of his instruments; the tradition answers it with the Cross, with the sacraments, and with attention turned toward Christ rather than toward him. If you are troubled, speak to your priest.
  - question: Does the Orthodox Church have a feast day for Satan?
    answer:
      - No — and it is worth saying plainly, since this database gives feasts for the holy angels. A demon is never commemorated, invoked, honoured or addressed. This record exists for study only. What the Church does have is the renunciation of him at every baptism.
