overview:
  - "Legion is the answer the unclean spirits gave when Christ asked their name in the country of the Gerasenes: “My name is Legion: for we are many.” It is not a personal name. A legion was a Roman formation of some six thousand men — the largest unit in the army of the occupying power — and the Gospel uses it to say that one man was held by a multitude."
  - The account is among the most detailed descriptions of possession in the Scriptures. The man lived among the tombs, could not be bound even with chains, cried out night and day, and cut himself with stones. He ran to Christ and worshipped Him. The spirits begged not to be commanded into the abyss, asked instead for the herd of swine, were permitted, and the herd ran down the steep place into the sea.
  - "What the Orthodox tradition draws from it is the measure of the two powers. Everything the demons do in this passage is asked and permitted: they beg, they request, they are suffered. Everything Christ does is done with a word. The man who could not be restrained by iron is found afterward sitting at Jesus’ feet, clothed, and in his right mind — and is sent home to tell what God has done for him."
historicalContext:
  - The healing is recorded in all three synoptic Gospels, and they differ. Mark and Luke place it in the country of the Gerasenes and describe one possessed man; Matthew places it in the country of the Gadarenes and describes two. The manuscript tradition varies further between Gerasenes, Gadarenes and Gergesenes — a difficulty already noticed by Origen, who knew the region and raised the geographical problem himself.
  - "The Church has never forced these into a single harmonised account, and this record does not either. Matthew frequently reports pairs where Mark reports one; Mark and Luke follow the man who became the messenger. The difference is reported here rather than smoothed away, on the same principle that governs the rest of this database: where the sources differ, say so."
  - The setting matters. This is the Decapolis, gentile territory east of the lake, where a herd of swine could be kept and where the word “legion” carried the weight of Roman occupation. The Gospel’s first missionary to that country is the man who had been possessed, sent back to his own people while Christ Himself departs.
orthodoxInterpretation:
  - The Fathers read the passage first for what it shows about the limits of demonic power. The spirits cannot enter even a herd of swine without asking. They cannot choose their own destination. They cannot resist a command. St. John Chrysostom presses the point that they were permitted the swine precisely so that the bystanders might learn how much harm the demons would have done to the man had they been unrestrained — the permission is a demonstration, not a concession.
  - "The second reading concerns the man. He is described in the language of death: he lives among the tombs, unclothed, self-wounding, unable to be bound. Blessed Theophylact and the tradition after him see in his restoration a small resurrection — the clothing, the sitting, the right mind — and read the whole scene as an image of what Christ does to a soul held by many things at once."
  - "The name itself is read soberly. “Legion” is a number, not an individual. The Church has not built a demonology on it, and the popular treatment of Legion as a single great demon is a misreading of a word that means the opposite: not one, but many. St. John of Damascus’s general teaching applies here without embellishment — the demons are fallen angels, they have no power over anyone unless it is permitted, and they can suggest but never compel."
  - One detail is often passed over. The demons beg not to be sent into the abyss. Even in rebellion they know where they are going and dread it, and they say so in the presence of the One who will send them. The Fathers note that the demons’ theology is quite accurate; what they lack is repentance.
liturgicalTradition:
  - "The Gadarene healing is appointed in the Orthodox lectionary and read in church — as a Gospel of Christ’s authority, never as an account of a demon. The Church reads about Legion the way it reads about the storm on the lake: the subject is the One who commands."
  - The prayers of exorcism in the Orthodox tradition, including those at the catechumenate before baptism and the prayers attributed to St. Basil the Great over the troubled, stand in the same line — they address Christ and command in His name. There is no rite in which a demon is negotiated with, named, or interrogated for its name; the Gospel scene is not a template for practice, and the Church’s discipline in these matters is emphatically pastoral and reserved to the priest.
  - Legion has, of course, no commemoration of any kind.
iconography:
  - "The scene appears in Orthodox iconography as one of Christ’s miracles, in the Gospel cycles that run around church walls and in illuminated Gospel books. The composition belongs to Christ: He stands at one side with the apostles, the man kneels before Him, and the swine run down the slope into the water at the edge of the frame."
  - "The demons themselves, where shown at all, are small dark shapes leaving the man — haloless, without features, given no dignity by the painter. This is the standing convention for the fallen in Orthodox art, and it is deliberate: the icon shows their expulsion, not them."
  - No icon is ever written of Legion as a subject. There is nothing to venerate and nothing to depict.
historicalInfluence:
  - The phrase “my name is Legion, for we are many” has passed into general English speech far from its setting, and popular culture has largely turned Legion into a single named demon of enormous power — precisely inverting what the word says. The Gospel gives a number to describe a multitude occupying one man; the popular version gives a personality.
  - The account has also been read politically, ancient and modern, with the Roman military term and the herd of unclean animals taken as commentary on occupation. That reading is not the Church’s doctrinal use of the passage, and the Fathers do not press it, but the word choice is the evangelist’s and the resonance is real.
  - "For Orthodox pastoral practice the passage’s durable influence lies elsewhere: it is a principal scriptural warrant for the Church’s conviction that affliction of this kind is met by Christ through the Church, and that the person afflicted is a person to be restored — sent home, clothed and in his right mind, to tell what God has done."
essentialsHeading: What happens in the account
salvationHistory:
  - heading: The man among the tombs
    body:
      - He lives in the burial caves, night and day crying out and cutting himself with stones. He has been bound with fetters and chains and has broken them; no one has strength to tame him. The Gospel spends its detail on his condition, not on the spirits.
  - heading: He runs to Christ
    body:
      - Seeing Jesus afar off, he runs and worships Him. It is the possessed man who comes, before anything is said or done — a detail the Fathers dwell on, since it shows that the person is still there beneath the affliction and still capable of turning toward help.
  - heading: “What is thy name?”
    body:
      - "The answer is “Legion: for we are many.” Christ does not need the information; the naming is for the bystanders and for the reader, to make plain the scale of what is being expelled from one human being with a word."
  - heading: They beg
    body:
      - The spirits beseech Him not to command them into the abyss, and ask instead to enter the swine. Every verb in their part of the account is a request. They have no power to act, to stay, or even to leave on their own terms.
  - heading: The herd and the sea
    body:
      - Permission is given; the herd runs violently down the steep place and is choked in the sea. The Fathers read the destruction as a demonstration of what the demons intended for the man, made visible so that no one could mistake his deliverance for a small thing.
  - heading: Clothed and in his right mind
    body:
      - The townspeople find him sitting at Jesus’ feet, dressed and sane, and are afraid. He asks to follow, and is instead sent home to tell his own people what the Lord has done — the first preacher of the Decapolis.
scripture:
  - ref: Mark 5:1–20
    note: "The fullest account: the tombs, the chains, the name, the swine, and the man sent home to the Decapolis."
  - ref: Luke 8:26–39
    note: Parallel to Mark, with the detail that the man had worn no clothes and lived in no house.
  - ref: Matthew 8:28–34
    note: Two possessed men, in the country of the Gadarenes. The difference from Mark and Luke is reported, not harmonised.
  - ref: Luke 8:31
    note: “They besought him that he would not command them to go out into the abyss” — the demons’ own testimony to the prison that awaits them.
  - ref: Revelation 20:1–3
    note: The same abyss, and the binding at the end. One of the few images shared between the Gospels and the Apocalypse.
sections:
  - heading: “Legion” is a number, not a name
    body:
      - "A Roman legion at full strength numbered around six thousand men. When the spirits answer “Legion, for we are many,” they are not offering an identity but a count — and the Gospel immediately glosses it, in case the reader misses the point: for we are many."
      - "This matters because popular usage has made Legion into a single great demon with a personality, which reverses the meaning. The record here follows the text: an unspecified multitude of unclean spirits, none of them named, occupying one man."
  - heading: Why the three Gospels differ
    body:
      - "Mark and Luke: one man, the country of the Gerasenes. Matthew: two men, the country of the Gadarenes. The manuscripts add Gergesenes to the geographical confusion, and Origen, who knew the region, discussed the difficulty in the third century."
      - The Church has never required a forced harmony. Matthew reports pairs elsewhere where Mark reports a single figure; Mark and Luke follow the one who became the messenger to the Decapolis. Gerasa and Gadara were both cities of the Decapolis, and the “country of” either could describe the lakeside district. The difference is noted here rather than resolved, because resolving it would mean asserting more than the sources say.
  - heading: This is not a manual
    body:
      - The scene is sometimes read as a method — ask the demon its name, then command it. It is not. Christ is not performing a technique; He is exercising authority that is His by nature, and the naming serves the witnesses.
      - In the Orthodox Church, prayers over those troubled by evil spirits belong to the priest, are made to Christ, and are pastoral before they are anything else. Anyone reading this page out of personal distress should go to their parish priest. This record is for study, and study is not help.
faq:
  - question: Is Legion the name of a demon?
    answer:
      - "No. It is a Roman military term for a formation of about six thousand soldiers, and the spirits give it as a count of how many they are — the Gospel glosses it in the same breath: “for we are many.” Popular culture has turned Legion into a single powerful demon, which reverses what the word means."
  - question: Why did Christ send the demons into the swine?
    answer:
      - "The Gospel says the spirits asked, and He suffered them. St. John Chrysostom reads the permission as a demonstration for the bystanders: what the demons did to two thousand swine in a moment is what they intended for the man, so that no one could think his deliverance a small matter. Nothing in the account suggests the demons had any power to act without permission."
  - question: Why do the accounts differ between the Gospels?
    answer:
      - Matthew has two men in the country of the Gadarenes; Mark and Luke have one in the country of the Gerasenes. Both were cities of the Decapolis near the lake. The Church has never forced a harmony, and this record reports the difference rather than smoothing it — the sources say what they say.
  - question: What is the abyss the demons feared?
    answer:
      - "The Greek abyssos, the bottomless deep — the same prison Revelation 9 and 20 describe for the demonic powers, and where the angel of the abyss reigns. It is one of the few images the Gospels and the Apocalypse share. That the demons dread it, and say so aloud in Christ’s presence, is a detail the Fathers note: their knowledge is accurate; what they lack is repentance."
  - question: Does this passage teach that mental illness is possession?
    answer:
      - No, and the Church has never taught that. The Gospels themselves distinguish between those who were possessed and those who were sick, healing both. Orthodox pastoral practice treats affliction of this kind with great caution, involves the priest, and does not set the sacramental life against medical care. This page is a catalogue record, not counsel — for anything personal, speak to your priest.
