  - Catalogued for study, never for veneration — requires clergy/source review
overview:
  - "Sariel is an angel named in Second Temple Jewish literature and unknown to the biblical canon of the Orthodox Church. The Book of Enoch gives his name in the form Saraqael, listing him among the holy angels who watch and setting him over the spirits that transgress."
  - "He appears again, and more strikingly, in the War Scroll of the Dead Sea community, where four names are to be inscribed on the shields of the sons of light — Michael, Gabriel, Sariel and Raphael. That list is worth noticing precisely because it differs from the one the Church came to keep: it shows that in the centuries around the Incarnation the naming of the great angels was still unsettled outside the Scriptures."
  - "His name is read as “command of God” or “prince of God.” In later tradition he is sometimes identified with Uriel, one of the eight archangels Orthodoxy does venerate — an identification worth knowing about, but not a reason to treat the two as the same figure."
  - He is not venerated by name in the Orthodox Church. He has no feast, no hymn, and no icon, and is catalogued here for study rather than devotion.
historicalContext:
  - "The two witnesses to Sariel come from the same world but not the same community. The Book of Enoch circulated widely in Second Temple Judaism and was known to early Christian writers; the War Scroll belonged to the sectarian library at Qumran and was unknown to anyone until its discovery in the twentieth century."
  - That a name should stand among the four chief angels in one text and among six or seven in another is the ordinary condition of this literature. The lists do not agree with each other, and none of them is the Church's.
orthodoxInterpretation:
  - The Orthodox Church venerates eight archangels by name — Michael, Gabriel, Raphael, Uriel, Selaphiel, Jegudiel, Barachiel, and Jeremiel. Sariel is not among them.
  - The identification of Sariel with Uriel is found in later tradition and is sometimes repeated in modern reference works. It should be handled carefully. Uriel is received by the Church under his own name; nothing follows for Sariel from the resemblance, and the two should not be silently merged.
  - "As with the other names drawn from this literature, the Church's practice is to invoke angels by the names God has revealed. Sariel is recorded here as a matter of history."
essentialsHeading: Where the name appears
salvationHistory:
  - heading: Among the angels who watch
    body:
      - "The twentieth chapter of the Book of Enoch names the holy angels who watch. Saraqael — the form the book uses — stands among them, in company with Uriel, Rufael, Raguel, Michael and Gabriel, and is set over the spirits that sin in the spirit."
  - heading: On the shields of the sons of light
    body:
      - "The War Scroll of the Dead Sea community directs that four names be written on the shields carried into the eschatological battle: Michael, Gabriel, Sariel and Raphael. It is the earliest evidence that his name was reckoned among the very greatest — in that community, at least."
  - heading: Identified with Uriel
    body:
      - "Later tradition sometimes treats Sariel and Uriel as one. The Church received Uriel; it did not receive Sariel. The identification is recorded here as a fact about the sources, not as a claim about the being."
scripture:
  - ref: 1 Enoch 20:6 (extra-biblical)
    note: Named as Saraqael among the holy angels who watch, set over the spirits that transgress.
