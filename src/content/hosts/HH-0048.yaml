sections:
  - heading: A note on the name
    body:
      - "The forms vary considerably across the sources — Sariel, Saraqael, Saraqel, Suriel, Sarakiel. The Book of Enoch's Ethiopic gives Saraqael; the War Scroll gives Sariel. This page uses Sariel as the common English form and notes the variants rather than choosing between them."
  - heading: Why the lists do not agree
    body:
      - Scripture names Michael and Gabriel, and the Book of Tobit names Raphael. Beyond that, the Second Temple writings name angels freely and inconsistently — four in the War Scroll, six or seven in the Book of Enoch, and other combinations elsewhere.
      - The eight archangels of Orthodox tradition are not one of these lists tidied up. They come from the Church's own liturgical memory, which is why they, and not these, are the names the services use.
faq:
  - question: Is Sariel in the Bible?
    answer:
      - "No. He is named in the Book of Enoch and in the Dead Sea Scrolls, neither of which is Scripture for the Orthodox Church."
  - question: Is Sariel the same as Uriel?
    answer:
      - Later tradition sometimes identifies them, and reference works often repeat it. The Orthodox Church venerates Uriel under his own name and has not received Sariel. Treating them as interchangeable goes further than the evidence allows.
  - question: Why is he on the shields in the War Scroll?
    answer:
      - The Qumran community reckoned four angels as chief — Michael, Gabriel, Sariel and Raphael — and directed their names to be inscribed on the shields carried into the final battle. It reflects that community's angelology, not the Church's.
  - question: Does Sariel have a feast day?
    answer:
      - No. He has no feast, commemoration, hymn, or icon in Orthodox tradition.
