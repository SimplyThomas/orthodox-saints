overview:
  - Raguel is an angel named in the Book of Enoch, a Second Temple Jewish work that stands outside the biblical canon of the Orthodox Church. He belongs to the group of holy angels who watch, listed in the twentieth chapter alongside Uriel, Rufael, Raguel, Michael, Saraqael and Gabriel.
  - "His name is commonly read as “friend of God.” The single scene in which he speaks comes later in the book: Enoch, shown a burning fire in the west, asks what it is, and Raguel — “one of the holy angels who was with me” — answers that it is the fire of all the luminaries of heaven. From this the tradition assigns him a concern with the heavenly lights and with the justice brought to bear upon them."
  - "He is not one of the eight archangels the Orthodox Church venerates by name. He has no feast, no liturgical commemoration, no hymn, and no place in the Church's iconography. He is recorded here because the Book of Enoch shaped the way the early Church spoke about the heavenly hosts, and because a reader who meets the name deserves to be told plainly where it comes from and what standing it has."
historicalContext:
  - The Book of Enoch was written in stages between roughly the third century BC and the first century AD. It was known to early Christian writers, and a phrase from it is quoted in the Epistle of St. Jude, but the Church did not receive it among the Scriptures. Only the Ethiopian Orthodox Tewahedo Church, which is not in communion with the Eastern Orthodox Church, includes it in its canon.
  - Raguel belongs to a stratum of the book much occupied with naming and ordering the angelic world. The chapter that lists him gives six names in the Ethiopic and seven in the Greek — an interest in enumeration that Scripture itself does not share, since the canonical books name only Michael, Gabriel, and (in Tobit) Raphael.
orthodoxInterpretation:
  - The Orthodox Church venerates eight archangels by name — Michael, Gabriel, Raphael, Uriel, Selaphiel, Jegudiel, Barachiel, and Jeremiel. Raguel is not among them, and the Church has never received him for veneration.
  - "There is a long and deliberate caution behind this. The Church has generally held that angels are to be invoked by the names God has revealed, and not by names drawn from speculative literature: a Roman synod of 745, under Pope St. Zachary, acted against the invocation of angels under unrevealed names, and the same instinct runs through the Christian East, which simply did not take these names up."
  - The right way to read Raguel, then, is as a witness to Second Temple angelology rather than as a member of the heavenly hierarchy the Church confesses. Nothing here is a basis for prayer.
essentialsHeading: What the Book of Enoch says of him
salvationHistory:
  - heading: Among the angels who watch
    body:
      - "The twentieth chapter of the Book of Enoch names the holy angels who watch and assigns each a charge. Raguel is named among them, in the company of Uriel, Rufael, Michael, Saraqael and Gabriel — the group later Christian writers would sometimes expand to seven."
  - heading: The fire of the luminaries
    body:
      - "In the book's account of Enoch's journeys, he is shown a burning fire in the west and asks what it is. Raguel, “one of the holy angels who was with me,” tells him that it is the fire of all the luminaries of heaven (1 Enoch 23:4). It is the only passage in which he speaks."
  - heading: Justice upon the world of the lights
    body:
      - From these two passages the tradition draws his association with the execution of God's justice upon the world of the heavenly lights. It is an inference from a very small base, and should be held loosely.
scripture:
  - ref: 1 Enoch 20:4 (extra-biblical)
    note: Named among the holy angels who watch.
  - ref: 1 Enoch 23:4 (extra-biblical)
    note: Identifies the fire in the west as the fire of all the luminaries of heaven — the only words the book gives him.
  - ref: Jude 1:14–15
    note: The one place a phrase from the Book of Enoch is quoted in Scripture. It does not make the book canonical, and it does not concern Raguel.
sections:
  - heading: Why the Church limits the names of angels
    body:
      - "Scripture names very few angels: Michael and Gabriel in the received canon, and Raphael in the Book of Tobit, which Orthodoxy reads as Scripture. Everything beyond that comes from tradition or from literature outside the canon."
      - The Orthodox eight are received because the Church's own liturgical tradition received them, not because a book supplied a longer list. That is the distinction this page keeps, and it is why Raguel appears here as a subject of study and not as a name to pray with.
faq:
  - question: Is Raguel in the Bible?
    answer:
      - "No. He is named only in the Book of Enoch, which the Orthodox Church does not receive as Scripture. The canonical books name Michael and Gabriel; the Book of Tobit, which Orthodoxy reads as Scripture, names Raphael."
  - question: Is Raguel an archangel?
    answer:
      - Not in Orthodox tradition. The Church venerates eight archangels by name, and Raguel is not among them. The Book of Enoch places him among a group of holy angels, but that book carries no doctrinal authority.
  - question: Does Raguel have a feast day?
    answer:
      - No. He has no feast, no commemoration, and no hymn. The angels the Church does venerate are honoured together at the Synaxis of the Bodiless Powers on November 8.
  - question: Can I pray to Raguel?
    answer:
      - The Church does not invoke angels by names it has not received, and has acted against the practice historically. This page records the name for study; it is not an invitation to devotion.
