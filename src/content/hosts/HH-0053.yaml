sections:
  - heading: Why he has no entry in the Scripture References column
    body:
      - "Every other scriptural record in this section carries protocanonical references. This one does not, and the blank is deliberate: no book of the narrower canon names Asmodeus. His whole account is in Tobit."
      - The Orthodox Church reads Tobit as Scripture — it stands in the Septuagint, was read by the Church from the beginning, and is part of the Orthodox canon. The Hebrew Bible does not contain it, and the Protestant canons place it among the Apocrypha. So whether Asmodeus is “in the Bible” depends entirely on whose Bible, and this database answers by keeping the two columns apart and filling the one that is true.
  - heading: The fish, and what it was not
    body:
      - "Tobias burns the fish’s heart and liver at the explicit instruction of an archangel, and the smoke drives the spirit out. The tradition has consistently read this the way it reads the clay and spittle with which Christ anointed the eyes of the man born blind: a material means, appointed by the one who heals, with no power of its own."
      - It is not a technique, and the Church has never treated it as one. Tobit records what an angel told one young man to do on one night; it does not prescribe. Orthodox practice in these matters is prayer to Christ, made by the priest, in the life of the Church.
  - heading: Asmodeus after Tobit
    body:
      - The name travelled a long way. The Testament of Solomon gives him speeches and a place among bound demons; rabbinic legend made Ashmedai a king of demons who contended with Solomon; and Western demonology from the later Middle Ages onward assigned him rank, title and a portfolio of particular sins, complete with the lists and hierarchies such books enjoy.
      - None of it is Orthodox teaching and none of it is in the account. It is mentioned here only to mark the boundary clearly — the Church’s Asmodeus begins at Tobit 3 and ends at Tobit 8, bound in Egypt, and is not heard from again.
faq:
  - question: Is Asmodeus in the Bible?
    answer:
      - In the Orthodox Bible, yes. He is named in the Book of Tobit, which the Orthodox Church reads as Scripture and which stands in the Septuagint. He is not named in any book of the Hebrew canon, and Protestant Bibles place Tobit among the Apocrypha — so in those Bibles he does not appear as Scripture at all.
  - question: How was Asmodeus defeated?
    answer:
      - By the Archangel Raphael, who was sent in answer to the prayers of Tobit and Sarah. At Raphael’s instruction Tobias burned the heart and liver of a fish on the coals; the spirit fled to the farthest parts of Egypt, and the angel bound him there. The power is the angel’s and the sending is God’s — the fish is a means, not a remedy.
  - question: Why did Asmodeus kill Sarah’s husbands?
    answer:
      - The book says that he loved her. It offers no more explanation than that, and this record adds none. What the account is interested in is not his motive but Sarah’s grief, her prayer, and the answer she was given.
  - question: Is Asmodeus a demon of lust?
    answer:
      - That is later Western demonology, not the Book of Tobit and not Orthodox teaching. The medieval and early modern lists that assign each demon a particular vice have no standing in the Church. Tobit calls him an evil spirit and says what he did; the Church has not gone further.
  - question: Can I use the fish remedy from Tobit?
    answer:
      - No — and the question mistakes the passage. It records an instruction given once by an angel to one young man on one night; it is not a prescription, and the Church has never treated it as one. Orthodox practice in matters of spiritual affliction is prayer to Christ, made by the priest, within the life of the Church. If something is troubling you, speak to your parish priest.
