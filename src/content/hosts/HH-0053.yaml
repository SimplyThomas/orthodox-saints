overview:
  - Asmodeus is the evil spirit of the Book of Tobit. He had loved Sarah, the daughter of Raguel of Ecbatana, and killed seven husbands in turn before any of them came to her — until on the same day, in two cities, the blinded Tobit and the despairing Sarah each prayed, and the Archangel Raphael was sent to both.
  - At Raphael’s instruction, Tobias took the heart and liver of a fish and made a smoke upon the coals in the bridal chamber. The spirit fled to the utmost parts of Egypt, and the angel followed and bound him there. The marriage held; Tobit’s sight was restored; and Raphael, revealing himself, told them that he had been sent because their prayers had come up before the glory of God.
  - Because the Orthodox Church reads Tobit as Scripture, Asmodeus is the one named demon whose entire account stands in a scriptural book. That is precisely what makes him worth cataloguing — and the account itself is not really about him. He appears in order to be driven out, by an angel who is sent, at the prayer of two people who did not know each other were praying.
historicalContext:
  - The Book of Tobit is a Jewish work of roughly the third or second century BC, set among the exiles of the northern tribes at Nineveh. It survives in Greek in more than one recension, and fragments in Aramaic and Hebrew were found at Qumran, so it circulated widely before the Christian era.
  - "The Orthodox Church receives Tobit as Scripture — it is part of the Septuagint, read by the Church from the beginning, and is included in the Orthodox canon. It is not in the Hebrew Bible, and the Protestant Reformers placed it among the Apocrypha. This makes Asmodeus a useful test case for how this database keeps its registers apart: he is named in Scripture as Orthodoxy counts Scripture, and in no book of the narrower canon at all."
  - The name is generally connected with the Avestan aēšma-daēva, the demon of wrath — a plausible borrowing from Persian religion into the Jewish literature of the exile, though the derivation is not certain and the book itself shows no interest in it.
orthodoxInterpretation:
  - The Fathers and the Orthodox tradition read Tobit chiefly as a book about providence, almsgiving, marriage and the angelic ministry, and Asmodeus accordingly appears as an obstacle rather than a subject. What he is permitted to do, he does; what he is commanded, he obeys. He flees at a smoke and is bound at a word, and nothing in the narrative suggests he had any power to resist.
  - The scene is often read against the marriage itself. Tobias and Sarah do not begin their marriage in fear but in prayer — the young man rises and calls Sarah to pray with him, that they may find mercy and grow old together. The Orthodox marriage service does not quote the passage, but the pattern it describes — a marriage entered as a shared petition and defended by God rather than by the couple’s own strength — is the pattern the service assumes.
  - "The fish’s heart and liver are the detail modern readers stumble over. The Fathers took them as they took the clay Christ made for the blind man’s eyes: a material means used at an angel’s direction, with the power in the sender and not in the substance. Tobit is not a book of remedies, and the Church has never treated the passage as a warrant for any practice of that kind. St. John of Damascus’s rule governs here as everywhere — the demons act only within what God permits, and they can suggest but not compel."
liturgicalTradition:
  - "Asmodeus has no commemoration of any kind, as no demon does. The people of his story do: Tobit, Tobias and Sarah are all commemorated among the Holy Forefathers, and the Archangel Raphael with the bodiless powers at the Synaxis on November 8."
  - Tobit is read as Scripture in the Orthodox Church, and its verses on almsgiving and on the angel who carries prayer before the glory of God have entered the tradition’s ordinary language about the angelic ministry. The exorcism prayers of the Church, and the prayers over a troubled person, address Christ; they take no pattern from the smoke in the bridal chamber, which was an instruction given once, by an angel, to one young man.
iconography:
  - There is a real Tobit cycle in Christian art — Tobias walking with the angel and the fish, the healing of Tobit’s eyes, and the marriage — and Raphael accompanied by the boy and the fish is one of the standard ways the archangel is recognised in Orthodox iconography.
  - Asmodeus is not a subject in it. Where the bridal-chamber scene is depicted at all, the demon appears, if he appears, as a small dark fleeing shape at the edge of the composition — haloless, featureless, and leaving. No icon is written of him, and none could be.
historicalInfluence:
  - Asmodeus had a long career after Tobit, most of it outside the Church’s reception. The Testament of Solomon, a pseudepigraphal work of roughly the first to third century AD, gives him a speaking part and a place in a hierarchy of bound demons; the later rabbinic tradition tells stories of Ashmedai and Solomon; and medieval and early modern Western demonology gave him a rank, a title and a portfolio of vices, none of which has anything to do with the Book of Tobit.
  - None of that is Orthodox teaching, and this record does not carry it. It is noted only so that a reader who has met the name in that literature can see where the Church’s account stops — which is at the end of Tobit chapter 8.
  - The book’s own influence has been of a quite different kind. Tobit shaped the Christian language of guardianship and of the angel who bears prayer upward, and gave the tradition one of its very few extended narratives of an angel sent, at a specific prayer, to specific people.
essentialsHeading: What the Book of Tobit says of him
salvationHistory:
  - heading: Seven husbands
    body:
      - Sarah, the daughter of Raguel, had been given to seven husbands, and the evil spirit Asmodeus had killed each of them before the marriage was consummated. Her father’s maidservants reproached her with it, and she was driven to such grief that she thought of hanging herself, and did not — for her father’s sake.
  - heading: Two prayers on one day
    body:
      - "In Nineveh the blinded Tobit prayed to be released from his affliction; in Ecbatana Sarah prayed with her hands stretched toward the window. The book makes the simultaneity explicit: both prayers were heard in the same hour before the glory of the great God."
  - heading: Raphael is sent
    body:
      - The angel is sent to heal them both — to scale away the whiteness from Tobit’s eyes, and to give Sarah to Tobias to wife, and to bind Asmodeus. The commission is stated before the journey begins, and everything after it is its working out.
  - heading: The instruction on the road
    body:
      - "Travelling with Tobias in the form of a kinsman, Raphael tells him to keep the heart, liver and gall of the fish taken from the Tigris, and explains their use: the smoke of the heart and liver against a spirit, the gall for the eyes."
  - heading: The bridal chamber
    body:
      - Tobias makes the smoke upon the ashes of the incense, and the spirit flees to the utmost parts of Egypt, and the angel binds him. Tobias and Sarah then rise and pray together before anything else — the book’s own emphasis, and the part of the scene the tradition has kept.
  - heading: The angel reveals himself
    body:
      - At the end Raphael tells them who he is, refuses the reward offered him, and instructs them to give thanks to God and to write the account in a book. The demon is not mentioned again. He was an obstacle in a story about providence, and the story moves on.
