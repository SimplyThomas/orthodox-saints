id: OS-3027
lifespan: 1697 – 1814
overview:
  - Saint Nazaria of Văratic was a Romanian schemanun of the eighteenth and early nineteenth centuries, remembered as the first abbess of Văratec Monastery in the Neamț region. She came from Brașov in Transylvania, married, and bore two children; she lost her husband and then both of her sons, and, left widowed and childless, turned to the monastic life.
  - Her monastic formation moved southward and then north through a succession of small settlements. She entered Scânteia Skete in Vrancea, where she received the rasophore tonsure with the name Natalia, and at Bonțești Skete, also in Vrancea, she was clothed in the great schema and given the name Nazaria. She afterwards spent fourteen years at the skete of Pârâul Carpenului, near Pipirig in the Neamț region, under the guidance of Father Joseph the Hesychast, in silence, fasting, prayer and obedience, and then moved to Durău Skete at the foot of Mount Ceahlău, where she was made abbess and was regarded as a spiritual mother to the community.
  - In 1788, after the founding of the new settlement at Văratec, Joseph the Hermit brought the schemanun Nazaria from Durău and set her over it as its first abbess. She led the community for twenty-six years, until her death in 1814. In that time the monastery's stone church dedicated to the Dormition of the Mother of God was built and the settlement grew into a flourishing community gathering more than a hundred nuns; Văratec would become one of the largest women's monasteries in Romania. The Holy Synod of the Romanian Orthodox Church numbered her among the saints on 1 July 2025, one of sixteen Romanian women of holy life canonized in the same act, appointing her feast to 17 August.
patronage:
  - Widows, and mothers bereaved of their children
  - Those entering monastic life after marriage and family life
  - Abbesses and founders of new communities
  - Văratec Monastery
sections:
  - heading: From Brașov to the Sketes of Vrancea
    body:
      - "Saint Nazaria's origins were Transylvanian: she came from Brașov, and entered on the ordinary life of a married woman, bearing two children. The accounts record that she lost her husband and then both of her sons, one after another, and that it was as a widow without surviving children that she sought to serve Christ in the monastic life. Her baptismal name is not preserved in the sources reviewed; the two names by which she is known are both monastic."
      - She was first received at Scânteia Skete in Vrancea, where she was tonsured a rasophore with the name Natalia. At Bonțești Skete, also in Vrancea, she was clothed in the great angelic schema and took the name Nazaria, by which she is commemorated.
      - "From Vrancea she moved north into the Neamț region and spent fourteen years at the skete of Pârâul Carpenului, near Pipirig, under the spiritual direction of Father Joseph the Hesychast. Her life there is described in the plainest ascetic terms: silence, fasting, prayer and obedience. She was afterwards at Durău Skete beneath Mount Ceahlău, where she became abbess and was held in regard as a true spiritual mother, so that by 1788 she was an experienced superior rather than an untried one."
  - heading: First Abbess of Văratec
    body:
      - The settlement at Văratec was newly founded when, in 1788, Joseph the Hermit brought the schemanun Nazaria from Durău and appointed her its first abbess. She governed it for twenty-six years, from 1788 until her death in 1814.
      - "Two things are recorded of her tenure. The first is building: the monastery's stone church dedicated to the Dormition of the Mother of God was raised in her time, giving the young community a permanent centre. The second is growth: what began as a new settlement became a flourishing monastery gathering more than one hundred nuns under her direction."
      - Her work at Văratec is not remembered in isolation. The monastery's early history joins her name to that of Schemanun Olimpiada (1757–1842), named in the synodal act as foundress of Văratec, and to Elisabeta (Safta) Brâncoveanu; all three were canonized together in 2025 and share the feast of 17 August.
  - heading: The Question of Her Dates
    body:
      - The dates given in the synodal act are 1697–1814, which would make Saint Nazaria some hundred and seventeen years old at her death and nearly ninety-one at her appointment as abbess of Văratec. These are the years published by the Romanian Patriarchate in the canonization of the sixteen women of holy life, and they are the dates carried here.
      - The sources reviewed give no day or month within either year, and none of them discusses the length of life the two dates imply. Beyond the twenty-six years of her abbacy (1788–1814) and the fourteen years at Pârâul Carpenului, the internal chronology of her monastic career — how long she remained at Scânteia, at Bonțești, or at Durău — is not recorded.
  - heading: Relics & Shrines
    body:
      - Saint Nazaria's veneration is attached to Văratec Monastery in Neamț County, where she spent the last twenty-six years of her life and where the local proclamation of her canonization was held.
      - The sources reviewed record no uncovering or translation of her relics, and name no shrine or reliquary distinct from the monastery itself. Nothing further should be asserted about a resting place on the present record.
  - heading: Miracles & Traditions
    body:
      - "Historically Documented: what the record establishes is a monastic career and its fruits — her Transylvanian origin at Brașov, her marriage and the loss of her husband and two sons, her tonsure as Natalia at Scânteia and her clothing in the great schema as Nazaria at Bonțești, the fourteen years at Pârâul Carpenului under Joseph, the abbacy at Durău, her appointment as first abbess of Văratec in 1788, the twenty-six-year tenure ending in 1814, the building of the stone Dormition church, the growth of the community past one hundred nuns, and the acts of the Holy Synod in 2025 and 2026."
      - "Traditional Accounts: the accounts of her that survive are accounts of governance and ascetic discipline rather than of wonders. She is remembered at Durău and at Văratec as a true spiritual mother, and her formation is described in the hesychast register of silence, fasting, prayer and obedience. No miracle is reported of her in the sources reviewed, and none is claimed here."
  - heading: Canonization and Legacy
    body:
      - On 1 July 2025 the Holy Synod of the Romanian Orthodox Church, in a working session presided over by Patriarch Daniel, approved the canonization of sixteen women of holy life — martyrs, nuns, wives of rulers, mothers of saints and confessors, spanning several centuries of the Church's history in the Romanian lands. Nazaria was numbered among them under the title Saint Venerable Nazaria of Văratic, with her feast appointed to 17 August, the day on which Schemanun Olimpiada of Văratec is also commemorated.
      - The general proclamation of the sixteen took place at the Patriarchal Cathedral in Bucharest on Friday, 6 February 2026. Patriarch Daniel presided at the Divine Liturgy and Patriarchal Auxiliary Bishop Varlaam of Ploiești read the official act of proclamation, the Synodal Tomos, which describes the sixteen as spiritual mothers of the Romanian people. The Tomos also established a new collective feast, the Synaxis of the Holy Romanian Women, kept on the third Sunday after Pascha. In his address the Patriarch spoke of the canonized women as important spiritual landmarks showing the path that leads to Christ.
      - "The local proclamation followed at Văratec itself, in a cycle of services from 14 to 17 August 2026 for Saints Olimpiada, Nazaria and Elisabeta together: evening services on the 14th, the Sacrament of Holy Unction and the Divine Liturgy on the 15th with a vigil that evening, and on the 16th an Akathist to the three saints followed by the Liturgy at which the local proclamation of their canonization was made, the days closing on 17 August with the feast of Saint George the Pilgrim."
      - Her glorification restores to view the first generation of a monastery that grew into a large women's community, and the pattern of a life that reached the monastic state late and by way of bereavement. Her name is also spelled Văratec, after the monastery; the canonical title issued by the Synod uses the form Văratic.
sources:
  - Romanian Patriarchate communique, canonization of 16 women of holy life (1 July 2025)
  - Basilica.ro
  - Doxologia.ro
