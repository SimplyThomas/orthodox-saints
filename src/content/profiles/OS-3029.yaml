sections:
  - heading: A Household of Ten at Fărcașa
    body:
      - "She married Ion Tănase in January 1903 and remained in Fărcașa, in her own family's house, for the rest of her life. Eight children were born to the couple and raised, as the Romanian accounts put it, in the Orthodox Christian tradition: the son Petru, later the monk Petroniu of the Prodromu Skete; a son Dumitru, recorded as having died in the war at the Bend of the Don; and the daughters Maria, Raveica, the twins Ioana and Marița, Glicheria and Parascheva."
      - "Glicheria did not marry, and stayed to care for her mother in her final years. Ion died in 1942, twenty-five years before his wife. The household was that of a Moldavian peasant family, and the detail most often repeated of Olimpia is simply the length of her working day: she was at her labour past midnight, and still gave away part of what little the house held."
  - heading: The Rule of an Unlettered Woman
    body:
      - She could not read. In place of books she carried the services in her memory — prayers, hymns and psalms learned by hearing and said over each day — and she kept the fasts, the feasts and the customs handed down in her village with a devotion the accounts single out. She was never absent from the services of the church.
      - "Two practices are named as habitual rather than occasional. The first is the commemoration of the departed, which she made a daily duty; the second is the lighting of candles before icons of the Mother of God. Among her principal virtues, in the Romanian sources, is charity: she is described as welcoming with love anyone who came to her needing help, and as giving out of poverty rather than out of surplus."
      - Preaching at the uncovering of her relics in 2026, Bishop Nichifor Botoșăneanul called her a strong woman, joining bodily diligence to devotion while raising eight children, and never losing a steadfast faith.
  - heading: Her Son, the Elder Petroniu of Prodromos
    body:
      - Petru Tănase, born 23 May 1914, became the protosynkellos monk Petroniu and abbot of the Prodromu Skete on Mount Athos, the Romanian skete dedicated to Saint John the Baptist. He died on 22 February 2011 and is regarded as one of the significant Orthodox spiritual fathers of the twentieth century.
      - In September 2022 the Synod of the Metropolitanate of Muntenia and Dobrogea, under Patriarch Daniel, resolved that the Romanian Patriarchate would petition the Ecumenical Patriarchate to number the Romanian Athonite fathers Petroniu Tănase and Dionisie Ignat of Colciu among the saints. The Holy Synod of the Ecumenical Patriarchate announced their canonization on 31 August 2025, Petroniu receiving the title Saint Elder Petroniu Prodromitul with a feast on 24 February. Mother and son were thus canonized within the same year, but by two different synods and in two distinct acts.
  - heading: Canonization and Proclamation
    body:
      - The Holy Synod of the Romanian Orthodox Church canonized her on 1 July 2025 under the title Saint Olimpiada of Fărcașa, as one of sixteen Romanian women of holy life numbered among the saints in a single act. Her feast was fixed on 4 July, the day of her repose.
      - "The general proclamation of the canonization was made on 6 February 2026 at the Patriarchal Cathedral in Bucharest. Her glorification is unusual in the calendar for what it honours: not a monastic rule, a martyrdom or a founding, but a married woman's ordinary life in a village — the services kept, the children raised, the night work, the alms and the daily remembrance of the dead."
  - heading: Relics & Shrines
    body:
      - She was buried in 1967 in the cemetery of the Saint Nicholas church at Fărcașa, the parish of her own village and the native village of her son Petroniu.
      - Her relics were uncovered on Monday, 18 May 2026, at Fărcașa, in the presence of Bishop Macarie of Northern Europe, Bishop Nichifor Botoșăneanul, vicar of the Archdiocese of Iași, Archimandrite Petroniu Marin, Exarch of the monasteries of Neamț, and members of her family. A Te Deum was served afterwards at the Saint Nicholas parish church.
  - heading: Miracles & Traditions
    body:
      - "Historically Documented: what is firmly established of her rests on close family and parish memory and on the acts of the Church. Her birth at Fărcașa on 8 September 1880 to Sultana and Grigore Asaftei; her marriage to Ion Tănase in January 1903; the eight children of the household, among them the future abbot of Prodromu; her death on 4 July 1967 and burial at the Saint Nicholas church; the canonization of 1 July 2025 and its proclamation on 6 February 2026; and the uncovering of her relics on 18 May 2026, at which the hierarchs present are named in the Patriarchate's report."
      - "Traditional Accounts: it is related in her village that she was born during the Divine Liturgy of the Nativity of the Theotokos, the feast falling on her birthday. Of her death the Romanian accounts say that she went peacefully, holding a lit candle, with a smile on her lips. These belong to the memory handed down in the family and the parish rather than to contemporary documentation, and are reported here as such. No miracles are recorded of her in the sources consulted."
