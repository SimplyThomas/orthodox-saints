id: OS-3029
lifespan: 1880–1967
overview:
  - Saint Olympias of Fărcașa — Olimpia, or Olimpiada, Tănase — was a Romanian village woman of Moldavia who lived her whole life in Fărcașa, in what is now Neamț County. She was born on 8 September 1880 to Sultana and Grigore Asaftei, a couple with five children; tradition in her village holds that her birth fell during the Divine Liturgy of the feast of the Nativity of the Theotokos, whose date she shared. In January 1903, at the age of twenty-three, she married Ion Tănase (1873–1942), of Stejaru, and the couple settled in her family home in Fărcașa, where they raised eight children.
  - "She was never taught to read. What she knew of the Church she held in memory: prayers, hymns and psalms learned by ear and recited daily, together with the fasts, the feasts and the inherited customs of her village, which the accounts say she kept with unusual exactness. She was never absent from the services. She worked past midnight at the labour of a peasant household of ten, gave alms out of very little, and made the commemoration of the departed and the lighting of candles before icons of the Mother of God a settled daily duty rather than an occasional devotion. Charity is named in the Romanian accounts as the first of her virtues: she is remembered as receiving with love anyone who came to her in need."
  - The best known of her children was her son Petru, who became the monk Petroniu Tănase (1914–2011), abbot of the Prodromu Skete on Mount Athos and one of the notable Orthodox spiritual fathers of the twentieth century. Olimpia died at Fărcașa on 4 July 1967, in her eighty-seventh year, and was buried in the cemetery of the Saint Nicholas church in the village. The Holy Synod of the Romanian Orthodox Church numbered her among the saints on 1 July 2025, one of sixteen Romanian women of holy life canonized in the same act, with her feast appointed to 4 July.
patronage:
  - Mothers and large households
  - Those who pray for the departed
  - The unlettered and those who pray from memory
  - Almsgiving out of poverty
