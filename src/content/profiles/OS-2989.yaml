    title: The union proclaimed
    body: The Orthodox of Transylvania are brought under union with Rome; those who refuse lose churches and legal standing.
  - when: "1744"
    title: Bessarion Sarai preaches
    body: The Serbian-born monk travels the Transylvanian villages calling the people back to Orthodoxy; arrested within weeks and imprisoned at Kufstein.
  - when: 1756–1761
    title: Sophronius of Cioara
    body: A monk of Cioara leads a wide popular movement that briefly restores Orthodox worship in Transylvania.
