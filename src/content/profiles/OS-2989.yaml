eyebrow: Synaxis · Confessors under the Union
feastNote: October 21 — commemorated together as the Confessors of Transylvania
overview:
  - In eighteenth-century Transylvania, under Habsburg rule, the Orthodox Romanians were pressed to accept union with Rome. Churches, monasteries and the right to a bishop of their own were tied to submission, and those who refused were treated as rebels. The five commemorated on October 21 are the best known of those who refused.
  - The monk Bessarion Sarai walked through the villages in 1744 preaching against the union and was arrested within weeks; he disappeared into the fortress of Kufstein in the Tyrol and was never heard of again. Sophronius of Cioara took up the same work a decade later and led a movement that won, for a time, the restoration of Orthodox worship. The priests Moses Macinic of Sibiel and John of Galesh were sent to the same Austrian prisons; the layman Oprea of Salistie, a peasant from the Marginime, twice carried the petitions of his people to Vienna and died in prison for it.
  - The Romanian Orthodox Church glorified them together in 1955, and they are commemorated on October 21. Their witness is a confession made not in the age of the Caesars but in the age of the Enlightenment, and made largely by parish priests and villagers rather than by hierarchs.
