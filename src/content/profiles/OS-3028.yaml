id: OS-3028
lifespan: 1757 – 1842
overview:
  - Saint Olympias of Văratic was a Romanian schemanun of the late eighteenth and early nineteenth centuries, remembered as the foundress of Văratec Monastery in the Neamț region. She was born in 1757 at Iași, the daughter of a priest of that city, and was given the name Bălașa. She married, was widowed young, and, having renounced worldly concerns, entered the community at Topolița in the Neamț region, where she was tonsured with the monastic name Olimpiada.
  - Her monastic life turned on a search for silence. At the word of the elder Paisius, she and the nun Nazaria set out to find a secluded place where a new community of nuns could be established, and in 1785 — with the counsel of Saint Joseph the Hermit — building began on a wooden church in the forests of Văratec. By 1787 nuns from Topolița had transferred to the new settlement. Olimpiada afterwards received the Great Schema there.
  - What she founded she also built. She raised the funds for a larger stone church, completed in 1808 and dedicated to the Dormition of the Mother of God, for a wooden cemetery chapel in 1817, and for the enclosure walls and cells of a community that grew past three hundred nuns. She was named abbess in 1822, having at first declined the office as beyond her, retired after six years, and was set over the monastery a second time from 1834 until her death in 1842 at the age of eighty-five. The Holy Synod of the Romanian Orthodox Church numbered her among the saints on 1 July 2025, one of sixteen Romanian women of holy life canonized in the same act, with her feast appointed to 17 August.
patronage:
  - Widows who take up the monastic life
  - Founders of monasteries and new monastic settlements
  - Abbesses and monastic superiors
  - Church builders and those raising funds for building
  - Văratec Monastery
