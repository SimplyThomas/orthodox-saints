sections:
  - heading: Bălașa of Iași
    body:
      - Saint Olympias was born in 1757 at Iași and given the name Bălașa. Her father was a priest of that city, so the Church was the setting of her childhood before it became the shape of her life; the sources reviewed record nothing further of her upbringing, and do not name her parents.
      - She married. Her husband died while she was still young, and the accounts agree that it was after his death that she renounced worldly concerns and turned to monasticism. Neither his name nor the length of the marriage is preserved, and no child of the marriage is mentioned.
      - She entered the community at Topolița in the Neamț region and received the monastic tonsure with the name Olimpiada, by which she is commemorated. Topolița was the house that formed her, and it was from Topolița that the first nuns of her own foundation would later come.
  - heading: The Search for Silence and the Founding of Văratec
    body:
      - "Her foundation began not as a project but as a search. Under the guidance of the elder Paisius — Abbot Paisie of Neamț — Olimpiada and the nun Nazaria went out to look for a secluded place where a new monastic community of women could be established. What the sources record is the order of it: a place of silence first, a monastery afterwards."
      - In 1785, with the counsel of Saint Joseph the Hermit, construction began on a wooden church in the forests of Văratec, and with it the skete for nuns that would become Văratec Monastery. By 1787 nuns from Topolița had transferred to the new settlement, so that within two years of the first church the community was populated rather than merely founded. It was at Văratec that Olimpiada later received the Great Schema.
      - The dating of the foundation is given slightly differently across the accounts. The synodal record and the monastery's own history place the first building in 1785; a Patriarchate account of the local proclamation describes her as having laid the foundations of Văratec Monastery, raising the first church and the first cells, between 1781 and 1788, which frames the same work as a span rather than a single year. The two are not in conflict on the substance — that the first church and the first cells at Văratec are hers.
  - heading: Building the Monastery
    body:
      - The wooden church of 1785 was a beginning, not a settlement's final form, and much of Saint Olympias's later work was the raising of funds for what a growing community needed. A larger stone church was completed in 1808 and dedicated to the Dormition of the Mother of God — the feast that remains Văratec's patronal celebration. A wooden cemetery chapel followed in 1817.
      - She also provided for the enclosure walls and for the cells of the community. The number of nuns recorded at Văratec in her lifetime is more than three hundred, which accounts for the continual building.
      - Her work is bound up with that of the other two women commemorated with her. Schemanun Nazaria (1697–1814), whom she had accompanied in the original search for a secluded place, became the monastery's first abbess; Elizabeth (Safta) Brâncoveanu (1776–1857) belongs to the same Văratec company. All three were canonized together in 2025 and share the feast of 17 August.
  - heading: Twice Abbess
    body:
      - Olimpiada was named abbess of Văratec beginning in 1822, some thirty-seven years after she had begun to build it. The accounts record that she had at first declined the office, considering herself unprepared for it — a refusal that is the one glimpse the sources give of her own estimate of herself.
      - She held the office for six years and then retired from it. In 1834 she was set over the monastery a second time, and this second tenure lasted until her death.
      - She died in 1842 at Văratec Monastery at the age of eighty-five, having lived at her own foundation for the better part of six decades.
  - heading: The Question of Her Birth Year
    body:
      - Her dates are ordinarily given as 1757–1842, the years published by the Romanian Patriarchate in the canonization of the sixteen women of holy life, and those are the years carried here.
      - One Patriarchate account of the local proclamation at Văratec gives her birth at Iași as 1758 instead. The difference is of a single year and touches nothing in the narrative; the age of eighty-five recorded at her death agrees with the 1757 reckoning.
  - heading: Relics & Shrines
    body:
      - Saint Olympias's veneration is attached to Văratec Monastery in Neamț County, which she founded, built and twice governed, and where she died in 1842.
      - The sources reviewed record no uncovering or translation of her relics, and name no shrine or reliquary distinct from the monastery and its churches. Nothing further should be asserted about a resting place on the present record.
  - heading: Miracles & Traditions
    body:
      - "Historically Documented: what the record establishes is a founder's career — her birth at Iași in 1757 as the daughter of a priest, her marriage and early widowhood, her tonsure as Olimpiada at Topolița, the search for a place of silence undertaken with the nun Nazaria at the word of the elder Paisius, the wooden church begun in the forests of Văratec in 1785, the transfer of nuns from Topolița by 1787, the stone Dormition church completed in 1808, the cemetery chapel of 1817, the enclosure walls and cells, a community grown past three hundred nuns, the abbacy assumed in 1822 after an initial refusal and resigned six years later, the second abbacy from 1834, her death in 1842 at eighty-five, and the acts of the Holy Synod in 2025 and the proclamations of 2026."
      - "Traditional Accounts: the memory preserved of her is of foundation and governance rather than of wonders. Her monastic direction is traced to two figures the Church itself honours — the elder Paisius of Neamț, under whose guidance she sought the place, and Saint Joseph the Hermit, by whose counsel the first church was begun. No miracle is reported of her in the sources reviewed, and none is claimed here."
  - heading: Canonization and Legacy
    body:
      - On 1 July 2025, in a working session held in the 'Patriarch Teoctist' Aula Magna of the Patriarchal Palace under the presidency of Patriarch Daniel, the Holy Synod of the Romanian Orthodox Church approved the canonization of sixteen women of holy life. Olimpiada was numbered among them under the title Saint Venerable Olimpiada of Văratec, with her feast appointed to 17 August — the same day as Saint Nazaria of Văratic and Saint Elizabeth (Safta) Brâncoveanu.
      - "The sixteen span the fifteenth to the twentieth centuries and include martyrs, nuns, wives of rulers, mothers of saints and confessors. The range of the company is worth naming: alongside an eighteenth-century monastic foundress stands the teacher Blandina Gobjilă (1906–1971), deported for fifteen years to Siberia for her faith under communist persecution. The general proclamation of the whole group took place at the Patriarchal Cathedral in Bucharest on 6 February 2026."
      - The local proclamation followed at Văratec itself, from 15 to 17 August 2026, timed to the monastery's patronal feast of the Dormition of the Mother of God — the same dedication as the stone church she had built. Great Vespers and the Matins of the Dormition were served on the evening of 14 August; the Sacrament of Holy Unction, the Divine Liturgy and an evening vigil on the 15th; an Akathist to the three saints on the 16th, followed by the Divine Liturgy at which the local proclamation of the canonization of Saints Nazaria, Olimpiada and Elisabeta was made; and on the 17th a Liturgy concluding with the feast of Saint George the Pilgrim, a figure locally venerated at Văratec.
      - "Her glorification sets in view a pattern the Romanian lands know well: a widow who entered monasticism from ordinary married life, went out to look for silence, and left behind a community of more than three hundred nuns. The place-name is spelled both Văratec and Văratic; the canonical title issued by the Synod uses the form Văratec, while the form Văratic is also current."
