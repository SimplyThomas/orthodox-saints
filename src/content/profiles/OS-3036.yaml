id: OS-3036
lifespan: 1791–1857
patronage: []
overview:
  - Saint Kiril (Cvjetković) was a Serbian hieromonk of the Bay of Kotor who spent more than two decades in Austrian confinement for refusing to accept a union of the Orthodox Serbs of Dalmatia with Rome. Born Konstantin Cvjetković in 1791 at Baošići in Boka Kotorska, he was tonsured at Savina Monastery in 1808, ordained priest in 1815, and raised to protosyncellus in 1817, serving as secretary to Venedikt (Kraljević), Bishop of Dalmatia.
  - When pressure for union came to a head, he stood with the Serbs of Šibenik against it, and the sources of his diocese remember him as the principal defender of Orthodoxy in that contest. Arrested after the Šibenik uprising of 1821, he was held in investigative detention for more than four years and then sentenced to twenty years of hard labour, served chiefly at the Gradiška fortress. In 1842 he was removed from prison to Bezdin Monastery in the Banat to serve out the remainder of his sentence; his formal release followed on 12 February 1846, coupled with a prohibition on returning to Dalmatia or Boka.
  - He remained at Bezdin as a monk for the rest of his life, and was noted there for exemplary conduct — in 1852 he was granted the right to wear the red belt in recognition of his service. He reposed at Bezdin in late September 1857 and was buried in the monastery courtyard without a marker. His relics were uncovered in July 2011 and enshrined in the monastery church, and the Holy Assembly of Bishops of the Serbian Orthodox Church numbered him among the saints in May 2025, appointing his commemoration on 29 September (12 October on the civil calendar).
sections:
  - heading: Origins and monastic formation
    body:
      - He was born in 1791 at Baošići in the Bay of Kotor into a priestly family — his father was Jovan, his mother Anđa — and the accounts of his life note clergy across several generations of the household, including his grandfather, the priest Simeon, and his uncles Marko and Nikola. His schooling began in 1798 under a local priest at Baošići, and he continued his studies with a cousin, Fr. Aleksa.
      - His father is said to have opposed a monastic vocation on account of the boy's frail health, but he was received into the brotherhood of Savina Monastery on 25 May 1805, at about fourteen years of age. He was tonsured a monk on 20 November 1808 and given the name Kiril, taken from Saint Constantine the Philosopher.
      - "Ordination followed in stages across the Dalmatian churches: deacon on 24 July 1812 at Vrlika, archdeacon on 14 June 1814 at Šibenik, and priest on 21 November 1815 in the cathedral at Šibenik. In July 1817 he was made protosyncellus."
  - heading: The contest over Union in Dalmatia
    body:
      - As protosyncellus he served as personal secretary to Venedikt (Kraljević), Bishop of Dalmatia, at Šibenik. The period was marked by pressure on the Orthodox Serbs of the province, then under Austrian rule, to accept union with Rome; the diocesan accounts of his life describe him as the chief defender of Orthodoxy against that effort, and he stood with the Serbs of Šibenik in refusing it.
      - The Šibenik uprising of 1821 brought the matter to a head. He was arrested in its aftermath and charged with organising the resistance.
  - heading: Prison and Gradiška
    body:
      - He was held four years and three months in investigative detention in the fortress at Šibenik, and was then sentenced to twenty years of hard labour, which he served principally at the fortress of Gradiška. Taken together with his detention, his confinement ran to more than fifteen years.
      - In 1842 he was removed from prison to Bezdin Monastery in the Banat, where the remainder of the sentence was to be served under the monastery's charge. His release came on 12 February 1846, but he was forbidden to return either to Dalmatia or to Boka Kotorska.
  - heading: Bezdin
    body:
      - Barred from his homeland, he remained at Bezdin as a monk for the rest of his life. The monastery's records remember him for exemplary conduct, and in 1852 he was awarded the right to wear the red belt in recognition of his service.
      - He reposed at Bezdin in 1857; the sources give the date as 28 September, with 29 September recorded in some accounts. He was buried in the monastery courtyard, on the north side, without a marker over the grave.
  - heading: Relics & Shrines
    body:
      - His unmarked grave in the Bezdin courtyard was opened in July 2011 — the exhumation is dated 25–27 July — and his remains were placed in a reliquary and enshrined in the monastery church, where they are venerated.
  - heading: Glorification
    body:
      - The Holy Assembly of Bishops of the Serbian Orthodox Church, meeting 13–17 May 2025 at the Church of Saint Sava in Belgrade, approved his canonization. The Assembly's communique names him a confessor of the faith and protosyncellus, and styles him confessor of Bezdin and of Dalmatia and Boka. His feast was appointed for 29 September on the Church calendar, corresponding to 12 October on the civil calendar.
      - He was one of nine persons and groups glorified at that session. The others were Nikodim (Milaš), Bishop of Dalmatia; the priest Mihailo Barbić, parish priest of Krtole; the priest Ilija Rodić; the venerable-martyr Jovan of Stjenik; Ana, mother of Saint Vasilije of Ostrog, named as holy and blessed; the martyrs of Reškovice, killed in 1688; the venerable-martyrs of Rmanj; and the martyrs of Garavice and Bihać-Petrovac. The same Assembly adjusted the feast date of the child martyrs of Jastrebarsko and Sisak.
