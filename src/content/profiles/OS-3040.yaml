    body: The regular Sabor of the Serbian Orthodox Church, meeting at the Church of Saint Sava in Voždovac, Belgrade, resolved to canonize a number of hierarchs, priests, monastics and believers. Ana of Mrkonjički was glorified among them, with her feast appointed on 30 April, kept on 13 May of the civil calendar.
