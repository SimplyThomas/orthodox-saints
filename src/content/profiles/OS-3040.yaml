  - when: Early 17th century
    title: The household at Mrkonjići
    body: She bore and raised her son at Mrkonjići and gave him young to the service of God. By the legends attached to Vasilije's childhood, the boy was diligent and obedient, spent his early years tending cattle on the Herzegovinian slopes, and took his graciousness from his parents.
