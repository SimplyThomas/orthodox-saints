eyebrow: Synaxis · The Founders of Georgian Monasticism
feastNote: May 7 — commemorated together · several of the Thirteen keep their own days besides
overview:
  - In the sixth century thirteen ascetics came from Syria into the kingdom of Kartli, sent, the tradition says, at the direction of the Theotokos and under the leadership of John of Zedazeni. They arrived to a land already Christian — Saint Nina had brought the faith two centuries before — but one with almost no monastic life of its own, and within a generation they had planted it across the country.
  - Their foundations are still the great houses of Georgian monasticism. John settled on Mount Zedazeni above Mtskheta; Shio withdrew to the caves of Mgvime; David went into the barren wilderness of Gareji that still bears his name; Joseph took the see of Alaverdi, Abibus that of Nekresi, Jesse that of Tsilkani. Some became bishops and missionaries to the mountain peoples, and Abibus was martyred for overturning a Zoroastrian fire-altar.
  - The Church of Georgia commemorates the Thirteen together on May 7, and several of them again on their own days. They are counted, with Saint Nina, among the founders of the Georgian Church — she gave it the faith, and they gave it the monastic life by which the faith was kept through the centuries that followed.
