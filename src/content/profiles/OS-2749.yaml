    note: "Warders at the Mamertine prison where tradition sets his own imprisonment with Peter, converted and martyred after."
    href: saint/OS-0978
  - name: "Hieromartyr Publius, Bishop of Athens"
    note: "By the tradition identifying him with Publius of Malta, the chief of that island who received him shipwrecked, whose father his prayer healed."
