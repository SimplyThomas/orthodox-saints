celebration:
  intro: Ways to honor the Apostle Paul.
  ideas:
    - idea: Have children write and decorate a short "epistle" — a letter of encouragement to a grandparent, godparent, or missionary — echoing Paul's letters.
    - idea: Trace Paul's missionary journeys across the Mediterranean on a printable map, marking the cities he wrote to (Corinth, Ephesus, Philippi, Rome).
    - idea: Tell the Damascus-road story of the persecutor turned apostle to the nations — a sign of hope for every convert and latecomer.
    - idea: Save coins through the Apostles' Fast and give to a mission, praying for missionary and persecuted Christians around the world.
    - idea: Keep a name-day for anyone named Paul or Pavlos.
  sources:
    - label: Orthodox Motherhood
      url: https://www.orthodoxmotherhood.com/5-simple-ways-observe-apostles-fast/
