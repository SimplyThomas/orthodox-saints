eyebrow: Synaxis · The Fathers of the Far Caves
feastNote: August 28 · the venerable fathers whose relics rest in the Far Caves
liturgicalTitle: The Synaxis of Our Venerable and God-bearing Fathers of the Far Caves of Kiev
overview:
  - The Far Caves of the Kiev Caves Lavra are also called the Theodosius Caves, after the second founder of the monastery. Saint Theodosius dug there when the brotherhood outgrew Anthony's first cave, and the tunnels that spread from it became the older of the two burial places of the Lavra's saints. The fathers whose relics rest in them are commemorated together on August 28.
  - "The names in this synaxis are mostly not famous ones, and that is the character of the place: recluses, fasters, canonarchs, schemamonks, a lover-of-labour, a silent one. Several — Arsenius the Lover-of-Labour, Silvanus, Pimen, Alexius — keep their own days as well as this one. They belong to the same eleventh-to-thirteenth-century monastery as the fathers of the Near Caves, and the two synaxes are counterparts."
  - Many of the caves' burials survive, and the two commemorations, on August 28 and September 28, are the Church's way of counting a monastery rather than a list of individuals.
