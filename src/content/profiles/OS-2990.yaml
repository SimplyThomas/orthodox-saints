timeline:
  - when: "1196"
    title: A grand prince becomes a monk
    body: Stefan Nemanja abdicates and takes the monastic name Symeon, joining his son Sava on Mount Athos.
  - when: "1198"
    title: Hilandar founded
    body: Symeon and Sava establish the Serbian monastery of Hilandar on the Holy Mountain.
  - when: "1219"
    title: An autocephalous Church
    body: Sava is consecrated first archbishop of the independent Serbian Church.
  - when: 1282–1321
    title: The kingdom at its height
    body: Under Dragutin and Milutin the kingdom expands and its churches multiply; Milutin is remembered for some forty foundations.
  - when: "1331"
    title: Dečani
    body: Stephen of Dečani raises the monastery that bears his name; he is murdered that same year at the hands of his son's party.
