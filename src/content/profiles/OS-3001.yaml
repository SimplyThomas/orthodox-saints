eyebrow: Commemorated together · August 3
feastNote: August 3 · Isaac, Dalmatus and Faustus of the Dalmatos monastery
liturgicalTitle: The Holy Fathers of the Dalmatos Monastery
overview:
  - Isaac was a hermit who came out of the desert to Constantinople in the reign of the Arian emperor Valens, met him as he marched out against the Goths, and told him that he would not return unless he restored the churches to the Orthodox. He was thrown into prison for it; Valens was killed at Adrianople, and Isaac was released and honoured. He remained in the city and gathered a monastery outside its walls.
  - The house took its name not from him but from his successor. Dalmatus was an officer of the imperial guard who gave up his commission, entered the monastery with his son Faustus, and in time became its abbot; he defended the Orthodox faith at the Council of Ephesus in 431. Faustus followed him as abbot in turn.
  - Three men, two of them father and son, holding one monastery through the Arian and Nestorian controversies — the Church commemorates them together on August 3.
