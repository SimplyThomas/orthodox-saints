id: OS-3039
lifespan: 15th century (traditionally died 1462)
overview:
  - Jovan of Stjenik was a Serbian monk and ascetic of the fifteenth century, remembered as a hesychast who withdrew to the rocky Stjenik district on Mount Jelica, near Čačak, and who was killed there by Ottoman Turkish forces. His relics rest in the monastery church at Stjenik, where they are venerated for healing.
  - His dates are not securely recorded. Tradition places him in the fifteenth century, and the accounts gathered around him report an early period in the wilderness of Lešje near Paraćin, a stay at the monastery of Agios Pavlos (St Paul's) on Mount Athos, and a later life as a cave-dwelling ascetic at Stjenik, where monks, hermits, and wandering ascetics gathered to him as their spiritual father.
  - In May 2025 the Holy Assembly of Bishops of the Serbian Orthodox Church received him into the ranks of the saints and entered his name in the Church's diptychs. The decree appoints his feast on July 28, kept on August 10 of the civil calendar.
sections:
  - heading: A hesychast of the Serbian despotate
    body:
      - The traditional accounts of Jovan's life belong to the last century of the medieval Serbian state and the Ottoman conquest that followed it. He is said to have dwelt first in the wilderness of Lešje, near Paraćin, and to have written a liturgical manuscript — a Panegyrikon — in 1412 at the request of Despot Stefan Lazarević. That commission would place him among the literate monastic scribes whose work the despot's court patronized.
      - He is also reported to have spent time at the monastery of Agios Pavlos on Mount Athos. He afterward settled in the cliffs of Stjenik on Mount Jelica, living as a cave-dwelling ascetic and serving as spiritual father to the monks, hermits, and wandering ascetics who gathered around him there.
  - heading: His death at the hands of the Turks
    body:
      - "The tradition places his death in 1462, at Pentecost, when Ottoman forces from Čačak raided Stjenik. The accounts of how he died do not agree: he is variously said to have been stabbed at a holy spring, burned alive in the church together with others who were there, or impaled on a stake. One further account, given at the monastery itself, has him beheaded by the Turks."
      - An inscription of 1474 confirms that he was killed and commemorates his connection with both the Stjenik and Lešje monasteries. He was buried in the monastery church at Stjenik. A date of 1802 attached to his death on one monastery page conflicts with the 1462 raid recorded elsewhere and appears to be an error, probably a confusion with the year the church was rebuilt.
  - heading: Stjenik Monastery
    body:
      - Stjenik Monastery, dedicated to the Nativity of St John the Baptist, stands below Stjenik hill on Mount Jelica in the village of Banjica near Čačak, and belongs to the Eparchy of Žiča. Tradition holds that it was founded by the brothers Vukašin and Uglješa Mrnjavčević shortly before they perished at the Battle of Maritsa in 1371.
      - The present church dates only to 1802; the original had burned, and the rebuilding followed a local petition to a vizier in Belgrade. The monastery is a protected cultural monument.
  - heading: Relics & Shrines
    body:
      - The relics of Jovan of Stjenik are preserved at the monastery church where he was buried, and are venerated there for their healing.
      - About 450 metres from the monastery, beneath the cliffs of Jelica, is a spring that local tradition credits with healing properties, including the restoration of eyesight. One account of Jovan's death places it at a holy spring.
  - heading: Miracles & Traditions
    body:
      - "Historically Documented: the inscription of 1474 records that Jovan was killed and links his memory to the monasteries of Stjenik and Lešje. The 2025 decree of the Holy Assembly of Bishops entering him in the diptychs is likewise a matter of record."
      - "Traditional Accounts: the healing attributed to his relics at Stjenik, and the curative properties — including restored eyesight — that local tradition ascribes to the spring beneath the Jelica cliffs, are carried by local devotion rather than by documentary record. The differing versions of his martyrdom belong to the same body of tradition, and no one of them can be preferred on the evidence available."
  - heading: Glorification
    body:
      - The Holy Assembly of Bishops of the Serbian Orthodox Church met at the Memorial Church of St Sava on Vračar from 13 to 17 May 2025. At that session new saints were added to the Church's diptychs, the assembly glorifying several hierarchs, priests, monks, and believers for confession and martyrdom. Jovan of Stjenik was received into the ranks of the saints, with his feast appointed for July 28.
      - The general Serbian press report of the session's decisions notes the glorifications without naming him or giving further detail on his case; the particulars come from the Church's own communique and from the monastery's tradition.
timeline:
  - when: "1371"
    title: Stjenik Monastery founded (by tradition)
    body: Tradition ascribes the founding of Stjenik, dedicated to the Nativity of St John the Baptist, to the brothers Vukašin and Uglješa Mrnjavčević, shortly before they perished at the Battle of Maritsa.
  - when: "1412"
    title: The Panegyrikon of Lešje
    body: While dwelling in the wilderness of Lešje near Paraćin, Jovan is said to have written a liturgical manuscript, a Panegyrikon, at the request of Despot Stefan Lazarević.
  - when: 15th century
    title: Mount Athos and Stjenik
    body: He is reported to have spent time at the monastery of Agios Pavlos on Mount Athos, and afterward to have settled as a cave-dwelling ascetic in the cliffs of Stjenik, guiding the monks and hermits who gathered around him.
  - when: "1462"
    title: The raid on Stjenik
    body: At Pentecost, Ottoman Turkish forces from Čačak raided Stjenik and put him to death. The accounts differ as to the manner — stabbed at a holy spring, burned alive in the church with others, or impaled. He was buried in the monastery church.
  - when: "1474"
    title: The inscription
    body: An inscription confirms that he was killed and commemorates his connection with both the Stjenik and Lešje monasteries.
  - when: "1802"
    title: The church rebuilt
    body: After the original church burned, the present structure was raised following a local petition to a vizier in Belgrade.
  - when: May 2025
    title: Glorification
    body: The Holy Assembly of Bishops of the Serbian Orthodox Church, meeting at the Memorial Church of St Sava on Vračar, entered him in the diptychs of the saints; his feast is appointed for July 28 (Aug 10 civil).
