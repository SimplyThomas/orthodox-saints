id: OS-3020
lifespan: 1902–1975
liturgicalTitle: The Righteous Demetrios Gagastathis, Protopresbyter of Platanos
overview:
  - Demetrios Gagastathis (1902–1975) was a married parish priest of Thessaly who spent his entire ministry in the village where he was born. Ordained in 1931, he served the church of the Holy Archangels at Platanos, in the district of Trikala, for more than forty years, resigning only when his health failed. He and his wife Elizabeth had nine daughters.
  - "He is remembered less for any office or writing than for the ordinary shape of his life: a village priest of small means who gave away what came to him, and whom his neighbours recalled for his silence, his prayer, and his humility. The synodal announcement of his glorification singled out the same qualities, naming his mercifulness, his philanthropy, and his trust in the will of God."
  - The Greek Civil War brought him under repeated suspicion; he was interrogated three times by Communist guerrillas and at one point sentenced to death, and survived. He reposed at home on 29 January 1975 after a long illness and was buried behind his parish church. Fifty years later, in 2025, he was inscribed among the saints — first proposed by the Church of Greece in March, accepted by the Holy and Sacred Synod of the Ecumenical Patriarchate on 9 July, and proclaimed by Patriarchal and Synodal Act at the Phanar on 30 August. His memory is kept on 29 January, the day of his repose.
timeline:
  - when: 1 August 1902
    title: Born at Vania (now Platanos)
    body: Born in the Thessalian village of Vania, later Platanos, in the district of Trikala, to Chrestos and Katherine Gagastathis, described in the accounts of his life as poor and pious. His formal schooling ended at the primary level for want of money; sources differ on how far he studied afterwards, some describing self-education through spiritual reading and others seminary study.
  - when: 1921–1924
    title: Military service
    body: Drafted into the Greek army on 10 April 1921, serving in Asia Minor and at several posts in Macedonia, and discharged on 18 June 1924.
  - when: February 1928
    title: Marriage, and ordination as reader
    body: Married Elizabeth Koutsimpiris, of his own village of Platanos. The couple had nine daughters. In the same year he was ordained a reader by Bishop Polycarp of Trikki.
  - when: May 1931
    title: Ordained deacon and priest
    body: Ordained deacon on 24 May 1931 and priest two days later, on 26 May, by Bishop Polycarp of Trikki, and appointed to the church of the Holy Archangels in Platanos.
  - when: From 1946
    title: Interrogated during the Civil War
    body: During the Greek Civil War, Communist guerrillas interrogated him three times and demanded his cooperation; on one occasion he was sentenced to be executed and was spared.
  - when: "1949"
    title: Accounts of a call to rebuild a church
    body: Tradition preserved in his life relates that the Theotokos appeared to him three times in this year, directing him to rebuild a nearby church.
  - when: 1 October 1973
    title: Resigns the parish
    body: After more than forty years — his life counts forty-two consecutive years in the parish — he resigned on account of failing health.
  - when: 29 January 1975
    title: Repose at Platanos
    body: Died peacefully at home, where his illness had confined him, and was buried behind the parish church he had served.
  - when: 11 March 2025
    title: Proposed by the Church of Greece
    body: The Permanent Holy Synod of the Church of Greece unanimously accepted the proposal to enter the late Protopresbyter Demetrios Gagastathis in the Hagiologion.
  - when: 9 July 2025
    title: Inscribed among the saints
    body: The Holy and Sacred Synod of the Ecumenical Patriarchate, under Patriarch Bartholomew, accepted the dossier and formally inscribed him in the Hagiologion of the Orthodox Church.
  - when: 10 July 2025
    title: First hierarchical vigil
    body: His memory was first celebrated with a hierarchical vigil at the Metropolitan Church of Saint Nicholas in Trikala, though his principal commemoration was fixed to 29 January, the day of his repose.
  - when: 30 August 2025
    title: Patriarchal and Synodal Act at the Phanar
    body: Patriarch Bartholomew and thirteen synodal hierarchs signed the Act of canonization at the Patriarchal Cathedral of Saint George in the Phanar, entering it in the official Codex of the Ecumenical Patriarchate.
sections:
  - heading: Priest of Platanos
    body:
      - His whole priestly life was spent in one place. Ordained in May 1931 and appointed to the church of the Holy Archangels in his native village, he remained its parish priest for more than forty years — forty-two consecutive years by the reckoning of his life — and resigned on 1 October 1973 only because his health would no longer carry the work. Some accounts describe the span more loosely as nearly fifty years of service.
      - He held the rank of protopresbyter and served within the Sacred Metropolis of Trikki, Gardiki and Pyli. He was a married priest and the father of nine daughters; six of them lived to adulthood, of whom five married and one became a nun.
      - "He left behind extensive written teachings on prayer, fasting, humility, love, and the monastic life. What the elderly of his village remembered, however, was not his writing: they recalled, in words gathered at his glorification, his silence, his prayer, his humility, and his love for everyone — a life given over to God and to the people around him."
  - heading: The Civil War Years
    body:
      - The Greek Civil War reached Thessaly from 1946 onward, and a village priest was an obvious object of suspicion. Communist guerrillas interrogated him three times, pressing him to cooperate with them; on one occasion he was sentenced to be executed. He was not put to death.
      - He himself related that during one such moment he heard a noise from the iconostasis and saw the icon of the Archangels — the patrons of his own church — shake, which he took as a sign that he should not be afraid. The account rests on his own telling.
  - heading: Miracles & Traditions — Historically Documented
    body:
      - The Patriarchal and Synodal Act of 30 August 2025 is the one formal document on the subject. In it Patriarch Bartholomew described him as a man of simplicity and humility and of ascetic virtue, and as a vigilant confessor of Orthodoxy, and stated that spiritual gifts — sanctifying, wonderworking, and healing — continued to be reported through him after his repose. The Patriarch added that long before his official inscription in the diptychs of the saints his name had already been written in golden letters on the hearts of the faithful.
      - The synodal announcement of his inscription earlier that year described him as distinguished for his mercifulness, his philanthropy, and his complete dedication and trust in the will of the Lord. Neither document itemises particular wonders.
  - heading: Miracles & Traditions — Traditional Accounts
    body:
      - The accounts of his life preserve several episodes that stand on tradition rather than on record. It is related that in 1949 the Theotokos appeared to him three times, commanding him to rebuild a church near his village. It is likewise related that during a liturgy he served at a monastery chapel in 1969 the place filled with an unexplained fragrance. The shaking of the icon of the Archangels during his interrogation belongs to the same class of account, resting on his own report of it.
      - These are presented in the sources as things told of him, and are best received as such.
  - heading: Relics & Shrines
    body:
      - He was buried behind the church of the Holy Archangels at Platanos, the parish he had served for his whole ministry. His memory was first kept liturgically with a hierarchical vigil at the Metropolitan Church of Saint Nicholas in Trikala on 10 July 2025, the day after his inscription in the Hagiologion.
  - heading: A note on the sources
    body:
      - "His glorification is very recent — 2025 — and no settled scholarly account of his life yet exists; the record rests on Orthodox press reports, diocesan publications, and the synodal documents themselves. The sources agree on the outline and differ on details: the length of his parish service is given both as forty-two consecutive years and as nearly fifty, and his education is described both as ending at primary school with later self-instruction and as including seminary study."
      - "At least one circulating account should be treated with caution: it gives his birth year as 1909 and his canonization as 2023, and describes a military career unlike anything in the other sources. Those figures are contradicted by the Patriarchal act and by every other account, and are not followed here. It is cited below only for completeness."
