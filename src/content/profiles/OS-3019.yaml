id: OS-3019
lifespan: 1908–1991
overview:
  - "Saint Vissarion the Agathonite was a Greek hieromonk of the twentieth century, born Andreas Korkoliakos in 1908 at Petalidi in Messinia, in the southern Peloponnese. He turned to the monastic life while still young: at about eighteen he went to Kalamata, where contact with several spiritual figures settled his resolve to enter the clergy, and he was tonsured a monk with the name Vissarion."
  - In 1935 he moved north to Karditsa at the invitation of Metropolitan Ezekiel and gave himself there to philanthropic work. In 1955 he came to the Monastery of the Dormition of the Theotokos at Agathonos, at the foot of Mount Oiti in Phthiotis, and took up the spiritual revival of the house. He remained a brother of that monastery for the rest of his life, joining ascetic labour to a sustained ministry of care for the poor and the sick of the district. Sources describe him as an especially good-hearted cleric of humanitarian spirit, and he was known in the region as the Venerable Elder.
  - He fell asleep in the Lord on 22 January 1991 at the Sotiria hospital in Athens. Fifteen years later, in March 2006, his grave was opened and his body was found whole and incorrupt; the discovery drew wide attention in Greece. The Holy Synod of the Ecumenical Patriarchate voted his canonization on 14 June 2022, and the synodal act was signed at the Phanar on 31 August 2022. His relics rest at Agathonos Monastery, and his feast is kept on 22 January.
sections:
  - heading: The Merciful Confessor
    body:
      - The ministry for which Elder Vissarion was best known in Phthiotis was pastoral rather than administrative. Every Monday and Tuesday he went down from the monastery to the hospitals of Lamia to visit and console the sick and to hear their confessions, and the name by which the district remembered him — 'the merciful confessor' — was earned in those wards.
      - He served as a spiritual father to believers throughout the region of Phthiotis and was known for his acts of mercy. Accounts of his rounds describe him walking with an icon of the Panagia, confessing the faithful, and staying overnight in their homes as he travelled.
  - heading: Relics & Shrines
    body:
      - On 3 March 2006, during works at the monastery, monks opened the elder's tomb fifteen years after his burial and found the body intact. Coroners were called in; the retired Athens coroner Panayiotis Yamarelos examined the relics and remarked that the face was 'ready to talk to you.' The find was reported widely in the Greek press and prompted public debate — including scientific argument over whether the preservation was a case of natural mummification or something beyond natural explanation.
      - The incorrupt body was moved for its protection to the monastery's chapel of the Holy Trinity, where it remains and where the faithful come in large numbers to venerate it. Agathonos Monastery in Phthiotis, in central Greece, is accordingly the saint's principal shrine.
  - heading: Miracles & Traditions — Historically Documented
    body:
      - "The uncovering of the relics on 3 March 2006 is the one event in the saint's dossier attested by contemporary record rather than pious report: it was examined by coroners, covered by the Greek media, and followed by public discussion of the finding. The Holy Synod of the Church of Greece characterized the discovery as a sign from heaven."
      - The formal acts of the Ecumenical Patriarchate are likewise a matter of record — the synodal vote of 14 June 2022 and the signing of the act of canonization by Patriarch Bartholomew at the Patriarchal Church of Saint George on 31 August 2022.
  - heading: Miracles & Traditions — Traditional Accounts
    body:
      - A number of accounts attached to the elder's memory are reported as local tradition rather than documented fact and are best received as such. It is related that at his funeral in January 1991 a thick layer of snow lay over the monastery and that an unusual fragrance was noticed, and that tears were seen to flow from an icon of the Panagia near his grave.
      - Before the canonization of 2022 he was, in these accounts, a saint in the people's reckoning — venerated locally in Phthiotis on the strength of his life of mercy and of the state of his relics, well in advance of any synodal act.
  - heading: Glorification
    body:
      - The path from local veneration to formal glorification took sixteen years from the uncovering of the relics. On 14 June 2022 the Holy Synod of the Ecumenical Patriarchate of Constantinople voted the canonization of the elder as Saint Vissarion the Agathonite. On Wednesday 31 August 2022, at a ceremony in the Patriarchal Church of Saint George at the Phanar, Ecumenical Patriarch Bartholomew signed the synodal act.
      - His commemoration was fixed on 22 January, the day of his repose.
