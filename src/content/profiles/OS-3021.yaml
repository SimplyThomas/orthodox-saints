id: OS-3021
lifespan: c. 1661 – 1729
overview:
  - Saint Maria Brâncoveanu — known in Romanian sources as Doamna Marica — was princess consort of Wallachia as the wife of Prince Constantine Brâncoveanu, and the mother of eleven children. Born about 1661 in Ploiești, she was the daughter of Neagu, a grandson of the Wallachian prince Antonie of Popești (who reigned 1669–72), and of Necșuța. She married Constantin Brâncoveanu in 1674, and stood beside him through the whole of his reign, from his accession in 1688 to his deposition by the Ottomans in 1714.
  - She is remembered above all as a patron of books. She supported her husband's cultural programme directly, having works printed in Romanian, Greek, Slavonic, Arabic, Turkish and Georgian, and founding libraries stocked with Western volumes; the convent of St Sava received her particular support. That the presses of Wallachia in this period served churches far beyond its borders is the practical measure of the patronage she shared in.
  - In 1714 the family was taken as prisoners to Constantinople, where her husband and four of her sons were put to death before her. Exiled afterwards to Kutai, near the eastern shore of the Black Sea, she was permitted to return to Bucharest in 1716, and in 1720 arranged for the remains of her husband and sons to be brought back to Wallachia for burial. She spent her later years largely at Surpatele Monastery, where she reposed in 1729. The Holy Synod of the Romanian Orthodox Church approved her canonization on 1 July 2025 among sixteen women of holy life, appointing her feast for 16 August — the day of her husband and martyred sons.
patronage:
  - Printing and the printed book
  - Libraries and their founding
sections:
  - heading: Princess Consort of Wallachia
    body:
      - "Maria's own family stood within the Wallachian ruling class: her father Neagu was a grandson of Prince Antonie of Popești, who had reigned from 1669 to 1672, and her mother was named Necșuța. She was born at Ploiești about 1661 and married Constantin Brâncoveanu in 1674."
      - When her husband came to the throne in 1688, she became princess consort, a position she held for the twenty-six years of his reign. Eleven children were born to the couple. Four of the sons would die with their father in 1714.
  - heading: Patronage of Printing and Libraries
    body:
      - The reign of Constantine Brâncoveanu is associated with an unusual programme of printing, and Maria took an active part in it. Books were produced under her support in Romanian, Greek, Slavonic, Arabic, Turkish and Georgian — a range that reached readers well outside Wallachia, into the Orthodox communities of the Ottoman East and the Caucasus.
      - "Alongside the presses she founded libraries, stocking them with Western books as well as Orthodox texts. The convent of St Sava was a particular object of her giving. Romanian accounts of her life single out this patronage as continuing in a different form after 1714: even in reduced circumstances she is described as showing generosity toward holy places, building churches and supporting the spiritual life of what had been her husband's domain."
  - heading: The Fall of the Brâncoveanu House
    body:
      - In 1714 Constantine Brâncoveanu was deposed and arrested by the Ottomans, and the whole family was carried off as prisoners to Constantinople. There her husband and four of her sons were put to death — beheaded, according to the account preserved in the Romanian Church, in her presence.
      - Maria herself was not killed. She was sent into exile at Kutai, near the eastern shore of the Black Sea, and remained there until 1716, when she was allowed to return to Bucharest.
  - heading: Exile, Return, and Later Years
    body:
      - Four years after her return, in 1720, she arranged for the bodies of her husband and sons to be brought back from Constantinople to Wallachia and buried — the act by which the memory of the Brâncoveanu martyrs was preserved at home rather than lost abroad.
      - Her later years were spent largely at Surpatele Monastery, and she is remembered for travelling frequently between monasteries along a route that came to be called 'The Lady's Path'. Romanian accounts describe her as marked by patience — 'patience until the last day of her life' — together with wisdom, kindness and humility, and compare her life to that of the righteous Job, who knew both glory and affliction. She reposed at Surpatele in 1729.
  - heading: Glorification
    body:
      - The Holy Synod of the Romanian Orthodox Church, meeting on 1 July 2025 under the chairmanship of Patriarch Daniel, approved the canonization of sixteen women of holy life — martyrs, nuns, wives of rulers, mothers of saints and confessors. Maria Brâncoveanu (1661–1729) was numbered among them as the Holy Princess Maria Brâncoveanu, with her feast appointed for 16 August, the same day as her husband and martyred sons.
      - The synodal communique lists the names, dates, monastic affiliations and feast days of all sixteen, and gives no further account of the deliberation behind the decision. The general proclamation of her canonization took place on 6 February 2026 at the Patriarchal Cathedral in Bucharest, with a local proclamation set for 16 August 2026 at the Church of St George the New.
  - heading: Relics & Shrines
    body:
      - The Church of St George the New in Bucharest holds the relics of the Brâncoveanu family. Maria's relics were exhumed there on 4 March 2026, together with those of her sons, the Prince-Martyrs Stephen and Matthew Brâncoveanu; a memorial service, with hymns dedicated to the Brâncoveanu family saints, was served during the exhumation.
      - The same church is the site appointed for the local proclamation of her canonization on her feast day, 16 August 2026.
