sections:
  - heading: Origins and early suffering
    body:
      - She was born on 24 November 1908 to Evangelitsa and Panagiotis, an Aromanian (Vlach) couple, at Nevesca — today Nimfeo — in northern Greece, and was baptised Ecaterina. The loss of her mother in childhood left her in the care of a stepmother, and her life records ill-treatment during those years, including a fracture of the spine that is said to have confined her to bed for nine years.
      - At about the age of ten she was brought to Bucharest to live with her uncle, Ioan Ciciu, and his wife; Romania was her home from then on. In 1927 a severe attack of peritonitis brought her near death, and by her own account the Mother of God appeared to her together with the Holy Great Martyr Catherine, after which she recovered. The pattern of her early years — bodily affliction followed by recovery she attributed to the intercession of the saints — shaped the missionary work she undertook afterwards.
  - heading: Missionary work in the villages
    body:
      - Her life relates a further vision in which Christ called for someone to warn the world of a coming war. Answering that call, she joined the Orthodox Missionary Association "Patriarch Miron," and travelled among the villages preaching repentance. Her work there is described as visiting the sick, protecting orphans, and contending against vice and against the superstitions that circulated alongside popular piety.
      - "This lay apostolate preceded her monastic vocation and continued to mark it: the distribution of spiritual writings that later brought her to the attention of the communist authorities was a continuation of the same work, carried on when it had become dangerous."
  - heading: Monastic life at Samurcășești
    body:
      - She entered the monastery of Samurcășești–Ciorogârla, near Bucharest, in September 1939, and was tonsured on 21 November 1942 with the name Eulogia. Her sources describe a rigorous personal asceticism from that point onward.
      - The earthquake of 1940 damaged the monastery's buildings, and she organised the collections that paid for their restoration — practical labour of the same kind as her village work, undertaken in the years when the community's resources were thinnest.
  - heading: Persecution and death
    body:
      - The communist regime installed in Romania after the war moved quickly against monasteries and against religious publishing. Saint Eulogia went on distributing spiritual materials, and the accounts of her last years record repeated beatings endured for it.
      - In December 1949 agents of the regime seized her in the village of Ulmeni, in Călărași County, and beat her brutally. She was taken to the Brâncovenesc Hospital in Bucharest. Her life relates that on 19 December she received an intimation that her death was near; she died that evening at Samurcășești, having received Holy Communion. She was forty-one years old. It is on account of this death under persecution that the Romanian Church numbers her among the martyrs of the communist period.
  - heading: Glorification
    body:
      - On 1 July 2025 the Holy Synod of the Romanian Orthodox Church, in working session at the Patriarchal Palace under the presidency of Patriarch Daniel, approved the canonization of sixteen women of holy life — martyrs, nuns, wives of rulers, mothers of saints, and confessors. The nun-martyr Evloghia Țârlea (1908–1949) of Samurcășești–Ciorogârla was among them, canonized as the Holy Venerable Martyr Eulogia of Samurcășești and assigned the commemoration of 19 December in recognition of her martyrdom under communism. Her companions in that glorification range from princesses such as Maria Brâncoveanu (1661–1729) to teachers such as Blandina Gobjila (1906–1971), who was deported to Siberia for fifteen years.
      - The solemn proclamation of the sixteen was made on 6 February 2026 at the Patriarchal Cathedral in Bucharest, with further local proclamations at the dioceses and monasteries concerned; Saint Eulogia is named among the saints of the Archdiocese of Bucharest. By an earlier synodal decision of 27 March 2025 the Romanian Church also established a new observance, the Synaxis of Romanian Women Saints, kept on the third Sunday after Pascha, the Sunday of the Myrrh-bearing Women, and designated 2026 a Commemorative Year of Holy Women — myrrh-bearers, martyrs, monastics, wives and mothers — with an icon depicting the four categories of Romanian women saints.
  - heading: Relics & Shrines
    body:
      - Her relics were exhumed on 15 January 2026 at Samurcășești–Ciorogârla Monastery in Ilfov County, as part of the preparations for the proclamation of her glorification. The service was officiated by Bishop Timotei Prahoveanul, auxiliary bishop of the Archdiocese of Bucharest, assisted by Archimandrite Nectarie Șofelea, Exarch of Monasteries; Protosyngel Simeon Cuțui, Cultural Exarch; Fr. Ștefan Zară, diocesan counsellor; and the patriarchal counsellor Răzvan Mihai Clipici, in the presence of the nuns and spiritual fathers of the monastery.
      - The relics rest at Samurcășești Monastery, which is both the house of her tonsure and the place of her death.
  - heading: Miracles & Traditions
    body:
      - "Historically Documented: the events of her life that the Church has weighed in canonizing her are her ascetic labour at Samurcășești, her missionary work in the villages, and above all her death from the beating inflicted in December 1949 — the martyrdom cited in the synodal decision of 2025. The uncovering of her relics in January 2026 is likewise a documented act of the Church."
      - "Traditional Accounts: her life relates two visions — the appearance of the Mother of God with the Holy Great Martyr Catherine during her illness of 1927, followed by her recovery, and the earlier call to warn of a coming war — as well as the intimation of her approaching death on 19 December 1949. Since her repose she has been venerated as a swift helper and wonderworker, and healings are attributed to her intercession by those who invoke her. These accounts belong to the devotional record of the monastery and of those who venerate her rather than to independent contemporary documentation."
