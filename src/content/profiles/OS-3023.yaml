id: OS-3023
lifespan: 1908–1949
liturgicalTitle: The Holy Venerable Martyr Eulogia of Samurcășești
overview:
  - Saint Eulogia of Samurcășești (1908–1949) was a Romanian nun of Aromanian (Vlach) descent who was beaten by agents of the communist regime and died of her injuries at the age of forty-one. Born Ecaterina Țârlea to an Aromanian family from Macedonia — her birthplace is given as Nevesca, the modern Nimfeo in northern Greece — she was brought to Romania as a child after the death of her mother and an injury that fractured her spine. She was tonsured at the Samurcășești–Ciorogârla Monastery in 1942 and reposed on 19 December 1949, having received Holy Communion.
  - Her adult life falls into two halves. Before entering the monastery she worked as a lay missionary in the Romanian villages, preaching repentance, visiting the sick, and caring for orphans; after her tonsure she lived a strict ascetic discipline at Samurcășești and organised the repair of the monastery's buildings. The persecution of the Church under the new communist government overtook her in the last years of the decade, and she continued distributing spiritual writings while enduring beatings for doing so.
  - The Holy Synod of the Romanian Orthodox Church approved her canonization on 1 July 2025 among sixteen women of holy life, and the glorification was solemnly proclaimed at the Patriarchal Cathedral in Bucharest on 6 February 2026. She is commemorated on 19 December, the day of her repose, and her relics rest at Samurcășești Monastery in Ilfov County.
patronage:
  - Those suffering illness and bodily injury
  - Orphans and those who care for them
  - Christians persecuted for the faith
  - Monastics
