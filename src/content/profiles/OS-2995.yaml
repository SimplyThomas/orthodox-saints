eyebrow: Synaxis · The Serbian Hierarchs
feastNote: August 30 · the archbishops and patriarchs of the Serbian Church
liturgicalTitle: The Synaxis of the Holy Serbian Hierarchs
overview:
  - "On August 30 the Serbian Church commemorates its own hierarchs together — the archbishops of Žiča and Peć and the patriarchs who succeeded them, from Saint Sava, who obtained autocephaly for the Serbian Church in 1219, down through the Ottoman centuries. It is a succession rather than a generation: a line of men holding one office across six hundred years and three political worlds."
  - Some of them founded the institution. Sava organised the Church into bishoprics and gave it its law; Arsenije, his disciple and successor, moved the seat to Peć, where the patriarchate would remain. Ioannicius II was raised from archbishop to patriarch when the Serbian empire was proclaimed in 1346. Others held it together when there was little else left — Ephraim, twice called from his silence to the throne in the years of Kosovo; Macarius, who restored the patriarchate in 1557; Paisius, who spent his tenure copying manuscripts and repairing churches; Gabriel I, hanged at Constantinople.
