id: OS-3031
lifespan: 1776 – 1857
overview:
  - Elisabeta Brâncoveanu, known throughout her life by the familiar Romanian form Safta, was born in 1776 at Iași into the Balș family, Moldavian boyars; her parents were Teodor Balș and Zoe Rosetti-Balș. In 1793 she married Grigore Brâncoveanu, lord of Craiova, and so entered one of the great Wallachian houses. The marriage joined a Moldavian boyar daughter to a Wallachian family whose name already carried weight in the Romanian Church, and it placed at her disposal a fortune that she would spend, over the decades that followed, on hospitals, churches and monasteries.
  - Her husband died in 1832, and the widowhood that followed defined the rest of her life in two ways. First, she became known as a benefactor on an unusual scale, above all through the Brâncovenesc hospital in Bucharest, a charity foundation built between 1835 and 1838 for the care of the poor. Second, she withdrew from the world altogether to Văratic Monastery in Moldavia, where she was tonsured a nun in 1840 and where she remained until her repose in 1857.
  - The Romanian Orthodox Church canonized her on 1 July 2025 among sixteen women of holy life, assigning her feast to 17 August, the day on which she is commemorated together with Saint Nazaria and Saint Olympias of Văratic. The canonization was solemnly proclaimed at the Patriarchal Cathedral in Bucharest on 6 February 2026.
sections:
  - heading: Family and marriage
    body:
      - She was born Elisabeta Balș in 1776, the daughter of Teodor Balș and Zoe Rosetti-Balș, and was called Safta in the usage that has followed her into the Church's calendar, where both names are given.
      - In 1793, at the age of about seventeen, she married Grigore Brâncoveanu, lord of Craiova. The sources consulted do not record children of the marriage. Her husband's death in 1832 left her a widow of great means and marked the turning point of her life; from that year she is remembered chiefly as a benefactress rather than as the wife of a boyar.
      - "The Brâncoveanu name carries a second entry in the Romanian calendar: Princess Maria Brâncoveanu (1661–1729), of the same family, was separately honoured with a feast on 16 August, the day before Safta's own."
  - heading: The Brâncovenesc hospital and her benefactions
    body:
      - "Widowhood turned her fortune outward. She became famed as a great benefactor of hospitals, monasteries and churches, and her name attached itself permanently to one foundation above the rest: the Spitalul Brâncovenesc in Bucharest, a charity hospital for the poor, built between 1835 and 1838."
      - The hospital was not an isolated gesture but the largest instance of a settled pattern. The sources describe her giving as directed at three objects together — the care of the sick, the building and upkeep of churches, and the support of monastic communities — so that the endowment of a hospital and the endowment of a monastery belonged, in her practice, to the same work.
  - heading: Monastic life at Văratic
    body:
      - After she was widowed she withdrew to Văratic Monastery in Moldavia, and in 1840 she was tonsured there. In the documents of her canonization she is named a schema-nun, and it is as a monastic of Văratic that the Church commemorates her.
      - "She reposed in 1857. Văratic in her generation was a community of remarkable women: Schema-nun Nazaria, its first abbess, and Schema-nun Olimpiada (1757–1842), its founder and benefactress, were canonized alongside her, and the three share the feast of 17 August. The canonization documents note that the newly canonized nuns of Văratic received a blessed reliquary for their remains."
  - heading: Canonization (2025–2026)
    body:
      - On 19 June 2025 the Local Synods of the Metropolis of Moldavia and Bukovina and of the Metropolis of Bessarabia proposed five holy women for canonization to the Holy Synod of the Romanian Orthodox Church. Among the four proposals from Moldavia and Bukovina was "Schema-nun Elisabeta (Safta) Brâncoveanu," described as a monastic of Văratic Monastery, alongside Schema-nun Mavra of Mount Ceahlău, a hesychast hermit of the seventeenth and eighteenth centuries, and the Văratic mothers Nazaria and Olimpiada.
      - The Holy Synod met on Tuesday, 1 July 2025 at the Patriarchal Palace in Bucharest under the presidency of Patriarch Daniel and approved the canonization of sixteen women — martyrs, nuns, wives of rulers, mothers of saints, and confessors; others among them had endured persecution under communism. "Nun Elisabeta (Safta) Brâncoveanu (1776-1857)" was recognized as a saint, with her feast set for 17 August.
      - The formal proclamation followed at the Patriarchal Cathedral of Saints Constantine and Helen in Bucharest. A last memorial service for the sixteen was served on Thursday, 5 February 2026 at the conclusion of Vespers, and the Divine Liturgy was celebrated the next day, Friday 6 February 2026, by Patriarch Daniel together with the Holy Synod; toward the end of that Liturgy the act of general proclamation was read by Patriarchal Auxiliary Bishop Varlaam of Ploiești, Chief Secretary of the Holy Synod. The document named the sixteen "spiritual mothers of the Romanian people."
  - heading: Legacy and commemoration
    body:
      - The Romanian Patriarchate designated 2026 the Commemorative Year of Orthodox Holy Women, and the canonization of the sixteen was the year's central act. With it the Church instituted a new feast, the Synaxis of the Holy Romanian Women, celebrated on the third Sunday after Pascha, so that Safta Brâncoveanu is commemorated both on her own day and in that common assembly.
      - Her individual feast falls on 17 August, kept together with Saint Nazaria and Saint Olympias of Văratic — the community that received her as a widow and in which she died a nun.
