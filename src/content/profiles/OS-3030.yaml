    title: The Soviet occupation of Bessarabia
    body: Bessarabia is annexed by the Soviet Union, and the family — clerical on both sides — falls under suspicion.
  - when: June 1941
    title: Arrest and deportation
    body: Her husband is arrested in May and she herself on 21 June, on a charge of intending to flee to Romania. She is held at Kazan in a converted church and interrogated before being sent to Siberia.
  - when: "1943"
    title: Death of her husband
    body: Gheorghe Gobjilă dies of starvation in captivity.
  - when: 1941–1956
    title: Fifteen years in Siberia
    body: She passes through the camps of Sfiaj, Orlovo Rozovo and Camashova, working as cleaner, kitchen hand, butter-factory worker and food-depot administrator; her weight falls from ninety-six kilograms to forty-five. It is related that she secretly baptized some thirty-five infants.
