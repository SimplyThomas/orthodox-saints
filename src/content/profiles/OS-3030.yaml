id: OS-3030
lifespan: 1906–1971
overview:
  - Saint Blandina of Iași was a Bessarabian priest's daughter and schoolteacher whose adult life was divided between a Soviet labour camp and the porch of a cathedral. She was born Blandina Popovici on 24 February 1906 at Grușevița in Hotin county, Bessarabia, into a clerical household — her father, Zaharia Popovici, was a priest and her mother, Serafima, a priest's wife — and accounts of her childhood relate that she was named after the second-century martyr Blandina and took part in the church services daily from about the age of six.
  - "She trained as a teacher and was certified by royal decree in February 1933, having sat her examinations the previous December while living in the commune of Căușenii-Noi; she taught the primary grades. In 1926 she married Gheorghe Gobjilă, and they had one son, Vladislav. After the Soviet occupation of Bessarabia in 1940 the family was broken up and deported: her husband died in captivity, and she herself endured roughly fifteen years of hunger, interrogation and forced labour in Siberia before being permitted to return."
  - She rejoined her son in Romania in 1957, but when his household pressed her to give up the open practice of her faith she left rather than comply, and lived thereafter by the charity of a Christian family in Iași. Her last fifteen years were spent in daily, unpaid service at the Metropolitan Cathedral of Iași, where the great pilgrimage to Saint Parascheva draws crowds each year — cleaning, tending the icons, copying out hymns and prayers, and helping those who came in need, until the city knew her simply as 'Mama Blandina'. She reposed on 24 May 1971. The Romanian Orthodox Church numbered her among the saints in 2025, and her feast is kept on 24 May.
sections:
  - heading: Bessarabia and the Soviet Deportations
    body:
      - Blandina's life was shaped by the fate of Bessarabia, the province between the Prut and the Dniester annexed by the Soviet Union in 1940. Her family — clerical on both sides, since her husband is described in some accounts as himself a priest's son — belonged precisely to the class the new administration treated as suspect, and the household's peace ended within a year of the occupation.
      - "Accounts of her arrest place her husband's detention in early May 1941 and her own on 21 June 1941, on a charge of having intended to flee across the border into Romania. She was held first at Kazan, in a church that had been converted into a prison, and subjected to harsh interrogation before being sent east. Her husband did not survive: he is recorded as having died of starvation in 1943."
      - The exact village of her birth is given differently across the sources — the Romanian Patriarchate's record names Grușevița in Hotin county, while other accounts place it in the Cernăuți region or give the name in another form. The variation reflects the repeated redrawing of these borders rather than any doubt about the family.
  - heading: The Camps in Siberia
    body:
      - "She was moved through several labour camps in Siberia, named in the sources as Sfiaj, Orlovo Rozovo and Camashova, and put to whatever work was assigned her: cleaning, kitchen duty, labour in a butter factory, and finally the administration of a food depot. Her weight is reported to have fallen over these years from ninety-six kilograms to forty-five."
      - What her biographers stress is not the endurance but the continuity of her faith under it. It is related that she secretly baptized some thirty-five infants in the camps, and that she took on the lowest and most degrading tasks without complaint. Preaching at her canonization, Patriarch Daniel drew attention to exactly this — that she performed the most humiliating work while imprisoned, alongside a cousin held with her, and so fulfilled in a labour camp the Gospel's saying that whoever wishes to be first must be the servant of all.
      - "She was released from the camp in 1949 but was not free to leave: she was held under compulsory residence in the Soviet Union until 1956. Only after that, and after her mother's death, did she learn that her son was living in Romania. She crossed to him in January 1957."
  - heading: The Choice at Iași
    body:
      - Her return did not end in the reunion she had waited fifteen years for. Her son's wife, according to the accounts, put the matter to her as a choice between God and the family; Blandina chose Christ and left the house rather than conceal her faith. She had no home of her own and no means, and was taken in by a Christian household in Iași — for many years that of the priest Mircea Stoleriu and his family.
      - This episode is the hinge of her memory in Iași. A woman who had kept the faith through interrogation, hunger and a decade and a half of exile was asked to surrender it for the sake of domestic peace, and refused on the same terms.
  - heading: Service at the Metropolitan Cathedral
    body:
      - From the later 1950s until her death she went to the Metropolitan Cathedral of Iași every morning at six o'clock, and worked there without pay. She swept and cleaned, cared for the icons, and copied out hymns and prayers by hand; she also translated Russian akathists into Romanian for use by the faithful.
      - The cathedral is the resting place of Saint Parascheva of Iași, and the object of one of the largest pilgrimages in the Orthodox world. Blandina's ministry was largely to the people it brought — the poor, the sick and the travelling — and she gave away what little came to her. Her discretion in this was such that the city took to calling her 'Mama Blandina', a name that was in ordinary use long before any thought of canonization.
  - heading: Miracles & Traditions — Historically Documented
    body:
      - "What can be documented from the record is the shape of her life and the public response to her death: the certificate of her teaching qualification in 1933, the arrest and deportation, the release and compulsory residence, the return in 1957, and the fifteen years of service at the cathedral witnessed daily by the clergy and people of Iași."
      - Her funeral in May 1971 is likewise a matter of record. Accounts report that a very large crowd attended and that nearly all the priests of Iași, together with monks and lay believers, came to bury a woman who had held no office and owned nothing.
      - The formal acts of the Church are the other documented element — the synodal decision of 1 July 2025 numbering her among the saints, and the proclamations that followed at Bucharest and at Iași.
  - heading: Miracles & Traditions — Traditional Accounts
    body:
      - Alongside the documented life, her biographies transmit reports that belong to pious tradition and are best received as such. It is related that during her imprisonment she was granted a vision of Christ crucified and crowned with thorns, and that healings were attributed to prayer offered through the intercession of Saints Parascheva and Demetrius.
      - It is also related that she had wished to die in the paschal season, between Pascha and the Ascension, and that her repose on 24 May 1971 fell within it. Her grave came to be visited by the faithful in the years after her death, and the tradition of that visiting is part of what carried her memory to the point of formal glorification.
  - heading: Relics & Shrines
    body:
      - She was buried at the Eternitatea Cemetery in Iași, in the family tomb of the Stoleriu household that had sheltered her. The grave became a place of pilgrimage, visited by those who had known her at the cathedral and by others who learned of her afterwards.
      - The Metropolitan Cathedral of Iași, where she served for the last fifteen years of her life, is the other place associated with her memory; the proclamation of her canonization in the city was made there.
  - heading: Glorification
    body:
      - On 1 July 2025 the Holy Synod of the Romanian Orthodox Church resolved to number Blandina among the saints, as one of sixteen women of holy life canonized together. Her feast was fixed on 24 May, the day of her repose, with her name to be entered in the synaxarion and the church calendar.
      - "The proclamations followed in stages: the Patriarchate's record places a proclamation at the Patriarchal Cathedral in Bucharest on 6 February 2026, and the local proclamation was made at the Metropolitan Cathedral of Iași on Sunday 17 May 2026. At Iași, Metropolitan Theopan of Moldavia and Bukovina presided at the Divine Liturgy with seven concelebrating hierarchs, and Bishop Nichifor Botoșăneanul read the synodal tomos."
      - The title given her varies slightly between the Romanian sources — she is styled Confessor in the Patriarchate's own usage and in the Romanian accounts of her life, and Martyr in the wording reported from the tomos read at Iași. The Church's own daily commemoration names her as Saint Blandina of Iași, and the record here follows the rank of Confessor.
  - heading: Not to Be Confused With
    body:
      - She is distinct from the second-century Martyr Blandina, the slave-girl martyred at Lyons in 177 and commemorated among the Martyrs of Lyons (OS-2682), for whom the Bessarabian saint was named.
patronage:
  - Prisoners and those held in labour camps
  - The deported and those exiled from their homeland
  - Teachers of young children
  - Those estranged from family for the faith
  - Those who serve in churches without office or pay
timeline:
  - when: 24 February 1906
    title: Born in Bessarabia
    body: Blandina Popovici is born at Grușevița in Hotin county, Bessarabia, the daughter of the priest Zaharia Popovici and his wife Serafima; accounts relate that she was named for the second-century martyr Blandina.
  - when: "1926"
