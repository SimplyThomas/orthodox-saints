id: OS-3033
lifespan: 1896–1989
overview:
  - Saint Philotimia of Râmeț (1896–1989) was a Romanian laywoman who spent forty-three years as a wife and mother in the village of Bălănești in Buzău County before entering monastic life in old age. Born Filofteia Manolache — called Filița — she and her husband Ion (Ioan) Manolache raised twelve children, according to the accounts of her life, in the fear of God, in obedience and respect for elders, and in a sense of responsibility, duty, and honest work.
  - Four of her children entered the service of the Church. Her son Stelian became the monk Dometie, venerated as Saint Dometius the Merciful of Râmeț; her daughter Eugenia became the nun Eudoxia; her son Mihai was ordained to the priesthood; and her son Gheorghe sang in the village church choir. Widowed in 1959, she withdrew to Râmeț Monastery in Alba County, where her two monastic children were already living, and there she was tonsured on 30 April 1974 — her birthday — by her own son, receiving the name Filotimia.
  - She reposed at Râmeț on 22 July 1989 and was buried at the monastery. The Holy Synod of the Romanian Orthodox Church numbered her among the saints on 1 July 2025, together with fifteen other Romanian women of holy life, under the title "Venerable Philotimia of Râmeț, Mother of Saint Dometius the Merciful," and appointed her feast on 6 July, the day she shares with her son.
liturgicalTitle: Our Venerable Mother Philotimia of Râmeț, Mother of Saint Dometius the Merciful
patronage:
  - Mothers and large families
  - Family life lived in the world
  - Widows
  - Those entering monastic life late in life
