sections:
  - heading: Family and Household in Buzău
    body:
      - Her parents were Simion and Elena Mirică, and she was baptized Filofteia; in the village she was known as Filița. She married Ioan Manolache, a man of her own village of Bălănești in Buzău County, and the two raised their household there.
      - "Twelve children were born of the marriage. The accounts preserved of her life differ on how many lived: one records that only five survived, another that eight of the twelve died before their mother. Four of the children gave themselves to the service of the Church — Stelian, who became the monk Dometie and is venerated as Saint Dometius the Merciful of Râmeț; Eugenia, who became the nun Eudoxia; Mihai, who was ordained priest; and Gheorghe, who sang in the choir of the village church."
      - "The sources of her life describe her formation of the children in plain terms: they were raised in the fear of God and in obedience and respect for their elders, and were given a sense of responsibility, duty, and honest work. Her marriage lasted forty-three years and ended with her husband's death in 1959."
  - heading: Monastic Life at Râmeț
    body:
      - Widowed, she left Buzău for Râmeț Monastery in Alba County, in Transylvania, where two of her children were already living the monastic life. There she shared in the prayer and ascetic labour of the community alongside her son Dometie and her daughter, the nun Eudoxia.
      - On 30 April 1974 — the anniversary of her birth — she received the monastic tonsure from her son, the future Saint Dometius the Merciful, and with it the name Filotimia. Accounts of her monastic years describe her as marked by prayer in the heart, and as showing humility and gentleness in the counsel she gave.
      - She reposed at Râmeț on 22 July 1989, at the age of ninety-three, having prepared for death by confession and communion, and was buried at the monastery where, in the words of one account of her life, she had lived in faith and humility during her final years.
  - heading: Glorification and Proclamation
    body:
      - On 1 July 2025 the Holy Synod of the Romanian Orthodox Church numbered her among the saints, together with fifteen other Romanian women of holy life, under the title "Venerable Philotimia of Râmeț, Mother of Saint Dometius the Merciful." Her feast was appointed for 6 July, the same day on which her son is commemorated.
      - The canonization was solemnly proclaimed at the Patriarchal Cathedral in Bucharest on 6 February 2026. A local proclamation followed on 29 June 2026 at Râmeț Monastery, attended by thousands of faithful together with national and local authorities. Metropolitan Laurențiu of Transylvania presided, joined by Archbishop Irineu of Alba Iulia, Archbishop Casian of the Lower Danube, and six other bishops; Patriarch Daniel was represented by Răzvan Mihai Clipici, Patriarchal Counsellor for Culture, Church Painting and Restoration.
      - Preaching at that ceremony, Metropolitan Laurențiu said that holiness can be lived within the family and not only in monasteries, and described her forty-three years as a married woman as an offering she brought to Christ. Clipici called her a remarkable mother who planted in her children's hearts the love of God.
  - heading: Relics & Shrines
    body:
      - Her relics were exhumed at Râmeț Monastery on 12 March 2026, following the guidelines of the Holy Synod and under the supervision of medical and anthropological specialists.
      - They were then carried in procession to the monastery's main church, where they were permanently placed for veneration beside the relics of her son, Saint Dometius the Merciful.
  - heading: Miracles & Traditions
    body:
      - Historically Documented — A letter written by her son Dometie in 1959, the year of her husband's death, praises her and compares her to a martyr.
      - Traditional Accounts — An account of her life relates that shortly before her death in 1989 Saint Dometius, who had reposed before her, appeared to her and told her that she would depart to the Lord, and that she prepared herself by confession and communion. It is further related that after her repose the abbess of the monastery consulted Saint Porphyrios in Athens, who is reported to have said of this nun that she had ascended to heaven like a seraph; that testimony was recalled publicly at the proclamation ceremony of 2026.
