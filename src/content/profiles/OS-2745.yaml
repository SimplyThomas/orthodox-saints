works:
  - title: Discourses (homilies)
    desc: Six surviving instructional discourses attributed to Theodosius.
  - title: Letters to Prince Izyaslav
    desc: Two letters of spiritual and pastoral counsel addressed to the Great Prince Izyaslav.
  - title: A prayer for Christians
    desc: A surviving prayer composed on behalf of the faithful.
