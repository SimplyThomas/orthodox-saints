id: OS-3035
lifespan: 1845–1915
overview:
  - Saint Nikodim (Milaš), Bishop of Dalmatia and Istria, was the foremost canonist the Serbian Church has produced and the hierarch who held its scattered Dalmatian flock together under Austro-Hungarian rule. He was born on 16 April 1845 at Šibenik in the Kingdom of Dalmatia, then part of the Austro-Hungarian Empire, and, according to OrthodoxWiki, baptized Nikola. His father, Trifun Milaš, was Serbian Orthodox, of a family that had come from Duvno in Bosnia; his mother, Maria Valmassoni, was Italian — described in one account as Catholic, and in another as having entered Orthodoxy before the marriage.
  - His education crossed every confessional and national boundary of the Adriatic coast. He was taught in a Franciscan primary school at Šibenik while receiving Orthodox instruction separately, passed through gymnasium in Zadar and a Jesuit gymnasium (placed at Dubrovnik in one account and at Zadar in another), and took his matura at Zadar in 1863. He then studied theology at the Serbian Orthodox seminary of Sremski Karlovci, spent a year on philosophy at Vienna, and completed his formation at the Kievan Theological Academy in Imperial Russia, graduating in 1871 with a master's degree in canon law and church history for a thesis on the Nomocanon of Patriarch Photius. A further year at the Theological School of Halki gave him Greek.
  - He taught canon law and practical theology at the Orthodox Theological Institute in Zadar, was tonsured a monk with the name Nikodim on 8 May 1873 at Dragović Monastery, and was raised archimandrite in 1880. After a brief and reformist rectorship of the Belgrade Seminary in 1886, he was elected Bishop of Dalmatia and Istria in 1890 in succession to Stefan Knežević, and governed the diocese until 1912 while continuing to teach canon law at Zadar until 1910. His six-volume Orthodox Church and Canon Law, first published in 1890 and soon translated into Russian, German, and Bulgarian, became the standard handbook of the subject and made him the founder of the discipline among the Serbs.
  - As bishop he met sustained pressure on his people to submit to Rome, opposed union, returned a number of Uniates to Orthodoxy, gave the diocese a governing assembly, and pressed for schooling in the people's own language, founding a gymnasium at Zadar in 1897. He was forced into retirement in early 1912 and reposed at Dubrovnik on 2 April 1915, on Great and Holy Friday. The Eparchy of Dalmatia glorified him locally in 2012, and the Holy Assembly of Bishops of the Serbian Orthodox Church numbered him among the saints in May 2025 with the rank of hieroconfessor; his feast is appointed for 21 September, kept on 4 October of the civil calendar.
sections:
  - heading: A Dalmatian formation between three churches
    body:
      - "Dalmatia in the mid-nineteenth century was Austro-Hungarian territory, and Milaš's own household reflected the mixture of the coast: an Orthodox Serb father whose family traced back to Duvno in Bosnia, and an Italian mother. The accounts differ on her confession — one records her as Catholic, another that she entered Orthodoxy before the marriage — and the difference is left standing here rather than resolved."
      - His schooling ran through the institutions the region actually offered, which were largely Latin ones. He learned his first letters from Franciscans at Šibenik and took Orthodox instruction alongside it, then attended gymnasium at Zadar and a Jesuit gymnasium, and matriculated at Zadar in 1863. Only afterwards did he enter specifically Orthodox formation, at the Serbian seminary of Sremski Karlovci, from which he graduated in 1866.
      - The decisive years were the Russian ones. At the Kievan Theological Academy he took a master's degree in 1871 in canon law and church history, writing on the Nomocanon of Patriarch Photius, and the Academy later granted him an honorary doctorate of divinity. A subsequent year at Halki, the Ecumenical Patriarchate's school on the Sea of Marmara, added Greek, so that he came to the canons through their own language and through the Slavic and Greek traditions of their interpretation alike.
  - heading: The canonist
    body:
      - Milaš is regarded as the founder of the study of canon law among the Serbs. His six-volume Pravoslavno crkveno pravo — Orthodox Church and Canon Law — appeared first in 1890 and was translated into Russian and German in 1897 and into Bulgarian in 1903. It became the standard handbook of the subject. Over some forty years he published more than 180 works.
      - "Alongside the canonical writing he assembled the documentary record of his own diocese, publishing the first volume of Documenta spectantia historiam orthodoxae dioeceseos Dalmatiae et Istriae in 1899. A separate historical work, Pravoslavna Dalmacija (Orthodox Dalmatia, 1901), belongs to a different order and has not worn as well: modern scholarship criticizes it for unverified claims about patterns of Serbian settlement, and its reprinting in 1989, amid rising Serbian nationalism, gave it a political afterlife its author did not choose."
      - His command of the canons was not confined to the page. He twice declined elevation — to Belgrade and to Sarajevo — on the judgment that the elections concerned had been conducted in violation of canon law. A canonist who refuses a metropolitan see on the ground of his own discipline is making an argument about the canons that no book could make.
  - heading: Bishop of Dalmatia and Istria
    body:
      - "He was elected to the see on 10 July 1890 and consecrated on 16 September, succeeding Stefan Knežević, and served until 1912; for the first twenty of those years he remained professor and dean of canon law at Zadar as well. The diocese was a minority Church, and the pressures on it were both ecclesiastical and civil: aggressive proselytism among his people, efforts toward union with Rome, and Austro-Hungarian authorities disposed against him."
      - His response was institutional rather than polemical. He founded a diocesan assembly to give the eparchy a governing body of its own, brought a number of Uniates back to Orthodoxy, and argued for schooling in the people's own tongue — founding a gymnasium at Zadar in 1897, the first school in that city to teach primarily in Serbo-Croatian. A minority Church without institutions of its own is absorbed within a generation, and he built the ones his flock lacked.
      - For a time he worked in the political arena as well, founding the Serb People's Party in Dalmatia and sitting in the Diet of Dalmatia from 1889 to 1901, before withdrawing from politics by 1903.
  - heading: Forced retirement and repose
    body:
      - He was forced into retirement in early 1912 — his resignation dated 21 December 1911 and accepted on 19 January 1912 — under political attack, and in part amid the fallout of a scandal over embezzlement by another bishop, Dositej Jović. He had governed the diocese for twenty-two years and left it under a cloud that was not of his making.
      - He lived out his remaining years at Dubrovnik and reposed there on 2 April 1915, on Great and Holy Friday, and was buried in the city. On 4 October 1930 his relics were translated to Šibenik, the town of his birth, and reburied the following day.
  - heading: Relics & Shrines
    body:
      - His relics rest at Šibenik, in a chapel prepared for them at the Church of the Holy Transfiguration — known locally as St. Salvation — where they were laid on 5 October 1930, the day after their translation from Dubrovnik. He had died at Dubrovnik in 1915 and was buried there for fifteen years before the translation returned him to the town of his birth.
  - heading: Miracles & Traditions
    body:
      - "Historically Documented: the record of his life is scholarly and administrative rather than thaumaturgic, and it is unusually well documented for a saint of the modern period — his degrees and appointments, his tonsure at Dragović in 1873, his election and consecration in 1890, his published works and their translations, his seat in the Diet of Dalmatia, his forced retirement in 1912, his repose at Dubrovnik in 1915, the translation of his relics in 1930, and the two acts of glorification in 2012 and 2025."
      - "Traditional Accounts: no miracle accounts are carried in the sources consulted here. What the Church has weighed in glorifying him is the confession itself — a bishop who held a minority flock against sustained pressure to submit to Rome, and who was forced from his see in 1912 — which is what the rank of hieroconfessor names. The sources attribute that removal to political attack, and in part to a scandal over embezzlement by another bishop, Dositej Jović, rather than to his resistance to union alone."
  - heading: Glorification
    body:
      - "The Eparchy of Dalmatia glorified him locally on 2 October 2012, close to the anniversary of the translation of his relics to Šibenik. Church-wide glorification followed thirteen years later: the Holy Assembly of Bishops of the Serbian Orthodox Church, meeting from 13 to 17 May 2025, numbered him among the saints with the rank of hieroconfessor. One secondary account places the formal entry into the diptychs on 17 May 2025 and dates the first keeping of his feast in Serbia to 4 October of that year."
      - He was one of nine individuals and groups glorified at that session, among them the Protosyncellus Kiril, the priest Mihailo Barbić, and the Martyrs of Reškovice of 1688. The Assembly's communique set the canonizations within the jubilee years then being observed — 1,700 years since the First Ecumenical Council of Nicaea and 850 years since the birth of Saint Sava.
      - His feast is appointed for 21 September, kept on 4 October of the civil calendar. One source gives the corresponding civil date as 12 October instead; the appointment followed here is the one carried in the decree, 21 September and 4 October.
  - heading: The dates in the record
    body:
      - The sources diverge on his birth. The date followed here is 16 April 1845, as carried on his own record; OrthodoxWiki gives 4 April 1845. Both agree on the year and on Šibenik as the place, and on the baptismal name Nikola.
      - They diverge also on where he attended the Jesuit gymnasium — Dubrovnik in one account, Zadar in the other — and on the civil date corresponding to his 21 September feast. These are noted rather than reconciled; the discrepancies belong to the sources.
timeline:
  - when: 16 April 1845
    title: Born at Šibenik
    body: Born in Šibenik in the Kingdom of Dalmatia, within the Austro-Hungarian Empire, and baptized Nikola. His father, Trifun Milaš, was Serbian Orthodox of a family from Duvno in Bosnia; his mother, Maria Valmassoni, was Italian. OrthodoxWiki gives the date as 4 April.
  - when: "1863"
    title: Matura at Zadar
    body: Completed his secondary schooling — Franciscan-taught primary school at Šibenik with separate Orthodox instruction, gymnasium at Zadar, and a Jesuit gymnasium — and took his matura at Zadar.
  - when: "1866"
    title: Graduated from the seminary at Sremski Karlovci
    body: Completed theological studies at the Serbian Orthodox seminary of Sremski Karlovci, then spent a year on philosophy at Vienna.
  - when: "1871"
    title: Master's degree at the Kievan Theological Academy
    body: Graduated from the Kievan Theological Academy in Imperial Russia with a master's degree in canon law and church history, for a thesis on the Nomocanon of Patriarch Photius. The Academy later granted him an honorary doctorate of divinity.
  - when: 1871–1872
    title: A year at Halki
    body: Studied Greek at the Theological School of Halki, then took up a professorship of canon law and practical theology at the Orthodox Theological Institute in Zadar, later becoming its rector and dean.
  - when: 8 May 1873
    title: Tonsured a monk
    body: Tonsured at Dragović Monastery with the monastic name Nikodim. He was ordained deacon, then presbyter two years afterwards, and advanced to archimandrite in 1880.
  - when: "1886"
    title: Rector of the Belgrade Seminary
    body: Appointed rector of the seminary at Belgrade, where he attempted a programme of modernizing reforms. He held the post into 1887.
  - when: 1889–1901
    title: Seat in the Diet of Dalmatia
    body: Founded the Serb People's Party in Dalmatia and sat in the Diet of Dalmatia, withdrawing from political activity by 1903.
  - when: "1890"
    title: Elected Bishop of Dalmatia and Istria
    body: Elected on 10 July and consecrated on 16 September, succeeding Stefan Knežević. He continued as professor and dean of canon law at Zadar until 1910. The first volume of his Orthodox Church and Canon Law appeared the same year.
  - when: "1897"
    title: Founded the gymnasium at Zadar
    body: Established a gymnasium at Zadar, the first school in the city teaching primarily in Serbo-Croatian. In the same year his canon-law handbook appeared in Russian and German translation; a Bulgarian translation followed in 1903.
  - when: "1899"
    title: Documenta spectantia, volume I
    body: Published the first volume of his documentary history of the Orthodox dioceses of Dalmatia and Istria. Pravoslavna Dalmacija followed in 1901.
  - when: January 1912
    title: Forced into retirement
    body: His resignation, dated 21 December 1911, was accepted on 19 January 1912. He was driven from the see under political attack, and in part amid a scandal over embezzlement by another bishop, Dositej Jović.
  - when: 2 April 1915
    title: Repose at Dubrovnik
    body: Reposed at Dubrovnik on Great and Holy Friday and was buried in the city.
  - when: 4–5 October 1930
    title: Translation of his relics to Šibenik
    body: His relics were translated from Dubrovnik to Šibenik on 4 October and reburied the following day in a chapel at the Church of the Holy Transfiguration, known as St. Salvation.
  - when: 2 October 2012
    title: Local glorification in Dalmatia
    body: Glorified as a saint by the Eparchy of Dalmatia of the Serbian Orthodox Church, thirteen years before the church-wide canonization.
  - when: May 2025
    title: Numbered among the saints by the Holy Assembly of Bishops
    body: The Holy Assembly of Bishops of the Serbian Orthodox Church, meeting from 13 to 17 May 2025, glorified him with the rank of hieroconfessor among nine individuals and groups, and appointed his feast on 21 September, kept on 4 October of the civil calendar.
