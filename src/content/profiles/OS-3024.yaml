id: OS-3024
lifespan: 1487 – 30 January 1554
overview:
  - Platonida of Argeș, known in the world as Despina Milița, was a Serbian noblewoman who became the consort of the Wallachian voivode Neagoe Basarab and, in widowhood, a nun. Born in 1487 into the house of Branković — her father was the Serbian despot Jovan Branković — she married Neagoe in 1505, seven years before his accession to the throne of Wallachia, and shared with him the founding of the monastery church of Curtea de Argeș, consecrated in 1517.
  - Her later life was marked by loss. Widowed in 1521 and bereaved of three of her six children, she withdrew from Wallachia to Transylvania, where she lived at Sibiu. In 1545 she was tonsured a nun under the name Platonida, and she reposed at Sibiu on 30 January 1554.
  - The Holy Synod of the Romanian Orthodox Church approved her canonization on 1 July 2025 among sixteen women of holy life, under the style "Sfânta Cuvioasă Platonida de la Argeș" — Our Venerable Mother Platonida of Argeș — with her commemoration set on 26 September, the day she shares with her husband, Saint Neagoe Basarab. The canonization was proclaimed at the Patriarchal Cathedral in Bucharest on 6 February 2026.
sections:
  - heading: Family and marriage
    body:
      - She was a daughter of the Serbian despot Jovan Branković and of Jelena Jakšić, and so was connected by blood to the Branković and Lazarević noble houses; her uncle, Metropolitan Maxim (Branković), is himself numbered among the saints. Some accounts place her birth around 1485, but 1487 is the year generally given.
      - Her marriage to Neagoe Basarab took place in 1505. Romanian accounts relate that the match was mediated by Saint Nifon (Nifon II), Metropolitan of Wallachia, who served the couple as spiritual father. Neagoe came to the throne in 1512 and reigned until his death in 1521.
      - "The couple had six children: Teodosie, who briefly succeeded his father as voivode; Stana, who married Stephen IV of Moldavia; Petru; Ioan; Ruxandra, who married first Radu of Afumați and then Radu Paisie; and Angelina. Three of the six — by one Romanian account two sons and a daughter — died young. A devotional tradition preserved at Doxologia relates that she lost all of her children one by one before losing her husband as well."
  - heading: Church building and patronage of culture
    body:
      - "With her husband she raised the monastery church of Curtea de Argeș, consecrated on 15 August 1517, the work with which the couple's memory is most closely bound. Her benefactions reached beyond Wallachia: she assisted materially the monastery of Krušedol in her native Serbia."
      - In 1520 she began the building of the hermitage of Ostrov (Schitul Ostrov), which was completed in 1522. Romanian sources remember her as a woman of learning and piety and as a protector of the arts and of culture in Wallachia.
  - heading: Widowhood, regency, and exile
    body:
      - Neagoe Basarab died in 1521, and their son Teodosie succeeded him as a minor; Despina acted as regent on his behalf in 1521–1522. The reign did not last, and with her daughters Stana and Ruxandra she withdrew to Transylvania, settling at Sibiu under the protection of the Hungarian crown.
      - Accounts of her monastic profession differ in detail. She took the name Platonida on entering the monastic state in 1545; one Romanian account associates her withdrawal into prayer and stillness with the hermitage of Ostrov, while the record of her last years and repose places her at Sibiu.
  - heading: Repose
    body:
      - She died at Sibiu on 30 January 1554; a Romanian account reports that the cause was plague. Her body was brought back to Wallachia and buried at the cathedral of Curtea de Argeș, the church she and her husband had built.
  - heading: Relics & Shrines
    body:
      - Her burial place is the monastery church of Curtea de Argeș, the foundation she raised with Neagoe Basarab and the site from which her monastic name is now styled — Platonida of Argeș.
  - heading: Glorification
    body:
      - On 1 July 2025 the Holy Synod of the Romanian Orthodox Church, meeting at the Patriarchal Palace in Bucharest under Patriarch Daniel, approved the canonization of sixteen women of holy life. Among them was "Nun Platonida (1487–1554), wife of Prince Neagoe Basarab," entered in the calendar as Saint Platonida of Argeș, formerly Despina Milica, with her feast on 26 September. Others glorified in the same act include Princess Maria Brâncoveanu, Schemanun Filofteia Antonescu, the nun-martyr Evloghia Țârlea, Schemanun Elisabeta Lazăr, and Măndălina Cătălinici.
      - The canonization was proclaimed at the Patriarchal Cathedral in Bucharest on 6 February 2026. Her feast on 26 September is the day on which her husband, Saint Neagoe Basarab, is also commemorated.
  - heading: A note on the name
    body:
      - Her monastic name has led to confusion with an earlier saint. She is distinct from Saint Platonis of Nisibis, the fourth-century Syrian ascetic also called Platonida, with whom she shares nothing but a name.
