    title: Tonsured a nun
    body: Tonsured at Sărăcinești and given the monastic name Matrona.
  - when: "1873"
    title: Transferred to Hurezi
    body: Moved to Hurezi Monastery when it was reorganized as a women's community, and remained there for the rest of her life in obedience within the community.
  - when: "1922"
    title: Elected abbess of Hurezi
    body: Elected to lead the monastery in her seventies. Some Romanian accounts place the election on 18 April 1923 instead. She worked to restore the common table and the settled order of monastic life, under Bishop Vartolomeu Stănescu of Râmnic.
  - when: "1926"
    title: A healing related by tradition
    body: Romanian accounts relate that she was healed after a vision of the Mother of God. The episode is transmitted as tradition, not as contemporary record.
