id: OS-3034
lifespan: 1852–1935
overview:
  - Saint Matrona of Hurezi (Matrona Ciupelea) was a Romanian nun of the nineteenth and twentieth centuries who spent nearly her whole life within the monasteries of Vâlcea county and was elected abbess of Hurezi Monastery late in old age. She was born on 2 August 1852 at Săliște in Transylvania, in what is now Sibiu county, the daughter of a shepherd; she was baptized Maria. The disposition toward monastic life ran in her household — her father, Nicolae, later withdrew to Mount Athos and was tonsured there under the name Nicodim.
  - By the account preserved of her childhood, she went at the age of five with her mother to Sărăcinești Monastery in Vâlcea and refused to leave it. She was raised in the monastery from that age and was tonsured in 1868, receiving the name Matrona. When Hurezi Monastery was reorganized as a women's community she moved there — sources place the transfer in 1873 — and remained for the rest of her life, some five decades of it passed in obedience within the community before she was given any office.
  - Elected abbess in 1922, she used the short tenure that followed to restore the common table and the settled order of the monastery's life, working under Bishop Vartolomeu Stănescu of Râmnic to re-establish the discipline of a genuinely common life. She reposed at Hurezi on 5 May 1935 and was buried in the monastery cemetery. The Holy Synod of the Romanian Orthodox Church approved her canonization on 1 July 2025 among sixteen women of holy life, under the title Saint Matrona of Hurezi, with her commemoration fixed on 5 May.
sections:
  - heading: A Transylvanian family drawn to monastic life
    body:
      - "Săliște, the village of her birth, lies in a shepherding district of Transylvania; her father belonged to that shepherding world before leaving it for Athos. Romanian accounts of her life treat the family as a single pattern rather than a set of separate vocations: her father Nicolae became the monk Nicodim on the Holy Mountain, and she herself entered monastic life as a small child and never returned to the world."
      - The kinship extends a further generation. Doxologia identifies her as the aunt of the hieroschemamonk Teodosie Domnariu, who became abbot of the Skete of Saint Hypatius on Mount Athos.
  - heading: Sărăcinești and Hurezi
    body:
      - Sărăcinești Monastery in Vâlcea county received her at five years old, and it was there that she was formed and, in 1868, tonsured. Her removal to Hurezi followed the monastery's reorganization into a women's convent; the accounts place her arrival in 1873.
      - "Hurezi was by then a large community, and what the sources record of her long years there is unremarkable in the best sense: asceticism and obedience, and a constant presence in church. Nothing suggests she sought or expected office. She was in her seventies before she held any."
  - heading: Abbess of Hurezi
    body:
      - "Her election as abbess came in 1922, when she was about seventy. The tenure was brief — roughly two years — and its work was concrete rather than expansive: the restoration of the common table and of the ordered discipline of cenobitic life at Hurezi, carried out with the support of Bishop Vartolomeu Stănescu of Râmnic, in the reform of common life across the monasteries of his diocese."
      - At the proclamation of her canonization, Metropolitan Irineu of Oltenia characterized her life as one passed through long silences and hardship, given to fasting and prayer from childhood, and marked by a poverty she kept lifelong and treated as a form of enrichment rather than a deprivation.
  - heading: Miracles & Traditions
    body:
      - "Historically Documented: the surviving record of her life is administrative and biographical rather than thaumaturgic. What is firmly attested is her tonsure, her long residence at Hurezi, her election and short abbacy, her repose, her burial in the monastery cemetery, and the synodal act of 2025 that placed her in the calendar."
      - "Traditional Accounts: Romanian accounts relate that in 1926 she was healed after a vision of the Mother of God, and that she received foreknowledge of her death three days before it came. Neither is documented outside the received tradition of the monastery and its later retellings, and both are transmitted as tradition rather than as contemporary record."
  - heading: Relics & Shrines
    body:
      - Her reliquary is kept at Hurezi Monastery in Vâlcea county, where she lived her monastic life, and the monastery has become a place of pilgrimage on her account. The local proclamation of her canonization was held there on 5 May 2026, her feast day; Archbishop Varsanufie of Râmnic noted on that occasion that it was the second such local proclamation at Hurezi within eleven years.
  - heading: Glorification
    body:
      - The Holy Synod of the Romanian Orthodox Church met on 1 July 2025 in the Teoctist Patriarhul hall of the Patriarchal Palace, under the presidency of Patriarch Daniel, and approved the entry into the calendar of sixteen women of holy life — martyrs, nuns, wives of voivodes, mothers of saints, and confessors drawn from several periods of Romanian history. The nun Matrona Ciupelea, abbess of Hurezi, was among them, glorified under the title Saint Matrona of Hurezi with her feast on 5 May.
      - The general proclamation of the canonization took place at the Patriarchal Cathedral in Bucharest on 6 February 2026. The local proclamation followed on 5 May 2026 at Hurezi, where the Divine Liturgy was served by Metropolitan Irineu of Oltenia together with sixteen other hierarchs, among them Archbishop Varsanufie of Râmnic and the Archbishops Teodosie and Atanasie.
  - heading: The dates in the record
    body:
      - The Romanian sources agree on her birth — 2 August 1852 at Săliște — and on her feast, but they diverge on the year of her repose and the date of her election as abbess. The Archdiocese of Râmnic's release on the synodal session gives her dates as 1852–1935, as does Doxologia, which reckons her life at eighty-three years; the Romanian Wikipedia article carries 1937 in its text and 1935 in its own infobox, and flags the inconsistency; a Basilica feature marking the anniversary of her birth gives 1939.
      - "The same divergence touches her abbacy. The date followed here is her election in 1922, though Basilica's report of the proclamation names 18 April 1923, at the age of seventy-one, and Wikipedia gives the tenure as 1923–1925. The discrepancies are noted rather than resolved: they belong to the sources, and the shorter, later chronology cannot be reconciled with the longer one without choosing between them."
