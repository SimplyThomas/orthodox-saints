id: OS-3038
lifespan: 1900–1942
liturgicalTitle: The Holy Hieromartyr Ilija of Trubar
overview:
  - Saint Ilija Rodić was the parish priest of Trubar, a Serbian village in the Bosnian
    Krajina near Drvar. He was born in 1900 and killed at Pascha in 1942, in the middle of
    the war that emptied that countryside; his body was thrown into one of the pits at
    Trubar. He was numbered among the saints by the Holy Assembly of Bishops of the Serbian
    Orthodox Church on 17 May 2025, and is commemorated on 26 April, kept on 9 May of the
    civil calendar.
  - Very little of his life is recorded, and this page does not pretend otherwise. What the
    accounts published at his glorification preserve is the shape of his death rather than
    the course of his years — that he understood his days were numbered, that he would not
    leave his parish, and that he was killed with the Paschal greeting still fresh in the
    village.
  - "The Bosnian Krajina in 1941 and 1942 was killed over from more than one quarter, and
    the accounts of his canonization are specific about his: they name Partisans, not the
    Ustaše. That distinction is kept here deliberately. A martyr's record is worth nothing
    if the enemy is filled in by assumption."
sections:
  - heading: What the record holds
    body:
      - The sources for Saint Ilija are the communique of the Holy Assembly of Bishops, the
        notices published by his diocese and by the Serbian Church, and press coverage of
        his first liturgical commemoration. Between them they give his years, his parish,
        the manner and season of his death, and the fact that he stayed. They do not give
        his ordination, his family beyond one living descendant, his schooling, or a single
        saying of his.
      - That thinness is itself part of the record. Village clergy in that region who died
        in 1941 and 1942 often left no papers behind them, and the parish registers that
        would have held them frequently burned with the churches. The Church has glorified
        a man remembered chiefly by the people among whom he stayed.
  - heading: The pits at Trubar
    body:
      - He was killed at Pascha 1942 — the feast fell on 5 April that year by the civil
        calendar — and one account places his death on the Wednesday of Bright Week. His
        body was thrown into one of the pits at Trubar, the karst shafts of that limestone
        country which were used across the Krajina in those years for the disposal of the
        killed.
      - "Because his repose fell inside the movable Paschal cycle, which has no fixed place
        in the calendar, the Assembly appointed his commemoration to a fixed date instead:
        26 April, kept on 9 May by the civil reckoning."
  - heading: Glorification
    body:
      - The Holy Assembly of Bishops of the Serbian Orthodox Church, meeting in Belgrade from
        13 to 17 May 2025, entered him in the register of saints as the Holy Hieromartyr
        Ilija of Trubar, together with five other individuals and three groups of martyrs.
      - The first liturgical celebration of his memory was kept on 9 May 2026 at Drvar, and
        at the church of the Nativity of the Theotokos in Trubar the day after. Among those
        who came for it was his grandson, Fr Nikola Radovanović, a priest of the church of
        St Nicholas in South Milwaukee, who said of it that grief had turned into joy.
timeline:
  - when: "1900"
    title: Birth
    body: Born in the Bosnian Krajina. The sources give the year and no more.
  - when: Before 1942
    title: Parish priest of Trubar
    body:
      Serving the parish of Trubar, near Drvar, in what is now the Diocese of Bihać and
      Petrovac.
  - when: Pascha 1942
    title: Killed at Trubar
    body:
      Killed at Pascha — 5 April by the civil calendar — and his body thrown into one of the
      pits at Trubar. The accounts of his glorification attribute his death to Partisans.
  - when: 17 May 2025
    title: Numbered among the saints
    body:
      The Holy Assembly of Bishops of the Serbian Orthodox Church entered him in the register
      of saints, appointing his feast on 26 April (9 May civil).
  - when: 9 May 2026
    title: First liturgical commemoration
    body:
      Kept at Drvar, and at the church of the Nativity of the Theotokos in Trubar the
      following day.
