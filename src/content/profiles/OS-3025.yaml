id: OS-3025
lifespan: 1895–1962
overview:
  - Saint Magdalena of Mălainița (1895–1962) was a Romanian-speaking laywoman of eastern Serbia who kept a monastic rule without ever being tonsured. Born in November 1895 to a Serbian father, Milenko Ilić, and a Romanian mother, Milca, of the Cătălinici family — a family of Transylvanian origin — she was baptized with the name Măndălina, the Romanian form of Magdalena. Fluent in both Romanian and Serbian, she spent her whole life in a village where the two communities lived side by side.
  - She was married on 2 February 1914 at Mălainița to a man named Miloš, and was widowed within a year when he fell in the First World War, leaving her with one young child. The Romanian synaxarion account describes her thereafter as living 'as a nun in the world' — keeping a constant fast, praying through the nights, and walking five kilometres on foot in every weather to be present at the church services.
  - When the priests of the district were taken during the wartime occupation, she took up the chanter's stand herself and kept the services going. She reposed on 15 October 1962, and her relics rest in the church of Mălainița Monastery, in the Romanian Orthodox Diocese of Dacia Felix, where they are venerated by Romanian and Serbian faithful alike. The Holy Synod of the Romanian Orthodox Church numbered her among the saints on 1 July 2025, appointing her commemoration for 15 October.
sections:
  - heading: The village and the two languages
    body:
      - "Magdalena's household stood on one of the linguistic seams of the eastern Serbian borderland: her father Milenko Ilić was Serbian, her mother Milca Romanian. She grew up speaking both languages, and the accounts of her life single this out as more than a biographical detail — she is described as a bridge between the Romanian and Serbian communities of the district."
      - The sources differ slightly on where she was born. The Romanian-language accounts place her birth in the village of Șciubic (Šćiubic), with her marriage and later life at Mălainița; the catalogue record of her canonization gives Mălainița itself. Her feast title, and the monastery that holds her relics, both name Mălainița.
      - The name under which she was canonized reflects the same double inheritance. She was baptized Măndălina — a Romanian form of Magdalena — on 3/16 December 1895, and the synodal act of 2025 lists her as Măndălina Cătălinici, taking up her mother's family name, while proclaiming her as Saint Magdalena of Malajnica (Mălainița).
  - heading: Widowhood and the war
    body:
      - She was married on 2 February 1914, at Mălainița, to a man named Miloš. Within a year of the wedding he had been killed in the First World War, and she was left a widow with one small child.
      - The war reached the village directly. During the Bulgarian occupation of 1915–1918 the priests of the area were arrested, and the parish was left without anyone to serve. Magdalena took the chanter's stand and kept the services and the church building itself in order through the occupation years — a layperson, and a young widow, holding a parish together in the absence of its clergy.
      - On account of what her biographers describe as her humility and her devotion, the bishops permitted her to enter the altar — an unusual concession for a woman at that time, and one the sources record as an explicit episcopal permission rather than a local irregularity.
  - heading: A monastic life in the world
    body:
      - "Magdalena was never tonsured, and never entered a monastery. What her life shows instead is a full monastic rule carried out in an ordinary village: constant fasting, nights spent at prayer, and the five-kilometre walk to church made daily and in harsh weather. The Romanian phrase used of her — trăind ca o călugăriță în lume, 'living as a nun in the world' — is the summary her own tradition settled on."
      - "Her work was that of a shepherd. While tending the flocks she would recite from the holy texts she knew, and the place where she kept this prayer was later remembered: the spot became the site of Mălainița Monastery."
      - She also taught. The accounts describe her guiding the people of the village toward the law of God and instructing them in the observances and the fasts of the Church — catechesis conducted, like everything else in her life, without office or title. 'God sees' is recorded as the phrase always on her lips.
  - heading: Repose
    body:
      - She died on 15 October 1962 — 2 October by the old reckoning. Her biographers record that she died holding a candle in her hand and making the Sign of the Cross until her last breath.
  - heading: Relics & Shrines
    body:
      - Her relics are kept in the church of Mălainița Monastery, which stands on the ground where she is said to have prayed while herding her sheep. The monastery belongs to the Romanian Orthodox Diocese of Dacia Felix, the Romanian Orthodox jurisdiction in eastern Serbia.
      - "The sources note that the veneration at her relics is shared: both Romanian and Serbian believers come to them, as the two communities of the district had shared her in life."
  - heading: Glorification
    body:
      - On 1 July 2025, in a session chaired by Patriarch Daniel at the Patriarchal Palace in Bucharest, the Holy Synod of the Romanian Orthodox Church approved the canonization of sixteen women of holy life. Măndălina Cătălinici (1895–1962) was among them, canonized as Saint Magdalena of Malajnica, with her feast fixed on 15 October.
      - The sixteen spanned the fifteenth through the twentieth centuries and included martyrs, monastics, the wives of rulers, mothers of saints, and confessors; several of them had suffered under communist rule in Romania. The group included Princess Maria Brâncoveanu, wife of the martyred prince, and Saint Blandina the Confessor, who was deported to Siberia for fifteen years. The synodal session continued into 2 July 2025 for further business.
      - The canonization was proclaimed publicly at the Patriarchal Cathedral in Bucharest on 6 February 2026.
